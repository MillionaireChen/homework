<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#52606d"/></marker></defs>
<rect width="1600" height="430" fill="#ffffff"/>
<text x="800" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#1f2933">Codex 摘要质量评估漏斗</text>
<g font-family="Arial,sans-serif" font-size="15" text-anchor="middle">
<rect x="30" y="155" width="190" height="88" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="125" y="190"><tspan x="125">文章 + 候选摘要</tspan><tspan x="125" dy="22">仅作为运行时输入</tspan></text>
<rect x="270" y="145" width="215" height="108" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="377" y="180"><tspan x="377">1. 物理硬门禁</tspan><tspan x="377" dy="22">复制 / 空输入 /</tspan><tspan x="377" dy="22">不可用截断</tspan></text>
<rect x="535" y="145" width="215" height="108" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="642" y="180"><tspan x="642">2. 指定文章 embedding</tspan><tspan x="642" dy="22">相关性提示</tspan><tspan x="642" dy="22">仅作辅助</tspan></text>
<rect x="800" y="145" width="235" height="108" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="917" y="180"><tspan x="917">3. Grounding Gate</tspan><tspan x="917" dy="22">+ 独立 Reviewer</tspan><tspan x="917" dy="22">无关 / 颠倒事实</tspan></text>
<rect x="1085" y="145" width="215" height="108" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="1192" y="180"><tspan x="1192">4. Scorer + Reviewer</tspan><tspan x="1192" dy="22">anchor、维度评分、</tspan><tspan x="1192" dy="22">一次修订</tspan></text>
<rect x="1350" y="155" width="215" height="88" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="1457" y="190"><tspan x="1457">五条候选摘要排序</tspan><tspan x="1457" dy="22">JSONL + 报告</tspan></text></g>
<g stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"><line x1="220" y1="199" x2="270" y2="199"/><line x1="485" y1="199" x2="535" y2="199"/><line x1="750" y1="199" x2="800" y2="199"/><line x1="1035" y1="199" x2="1085" y2="199"/><line x1="1300" y1="199" x2="1350" y2="199"/></g>
<text x="800" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#52606d">硬性违规提前终止；语义判断和软评分都需要独立复核。</text>
</svg>
