<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#52606d"/></marker></defs>
<rect width="1600" height="430" fill="#ffffff"/>
<text x="800" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#1f2933">Codex summary-quality funnel</text>
<g font-family="Arial,sans-serif" font-size="15" text-anchor="middle">
<rect x="30" y="155" width="190" height="88" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="125" y="190"><tspan x="125">Article + candidate</tspan><tspan x="125" dy="22">runtime input only</tspan></text>
<rect x="270" y="145" width="215" height="108" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="377" y="180"><tspan x="377">1. Physical hard gate</tspan><tspan x="377" dy="22">copy / empty /</tspan><tspan x="377" dy="22">unusable truncation</tspan></text>
<rect x="535" y="145" width="215" height="108" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="642" y="180"><tspan x="642">2. Assigned-article</tspan><tspan x="642" dy="22">embedding hint</tspan><tspan x="642" dy="22">advisory only</tspan></text>
<rect x="800" y="145" width="235" height="108" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="917" y="180"><tspan x="917">3. Grounding Gate</tspan><tspan x="917" dy="22">+ independent Reviewer</tspan><tspan x="917" dy="22">off-topic / reversal</tspan></text>
<rect x="1085" y="145" width="215" height="108" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="1192" y="180"><tspan x="1192">4. Scorer + Reviewer</tspan><tspan x="1192" dy="22">anchor, dimensions,</tspan><tspan x="1192" dy="22">one revision</tspan></text>
<rect x="1350" y="155" width="215" height="88" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="1457" y="190"><tspan x="1457">Rank five candidates</tspan><tspan x="1457" dy="22">JSONL + report</tspan></text></g>
<g stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"><line x1="220" y1="199" x2="270" y2="199"/><line x1="485" y1="199" x2="535" y2="199"/><line x1="750" y1="199" x2="800" y2="199"/><line x1="1035" y1="199" x2="1085" y2="199"/><line x1="1300" y1="199" x2="1350" y2="199"/></g>
<text x="800" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#52606d">Hard violations terminate early; semantic and soft decisions require independent review.</text>
</svg>
