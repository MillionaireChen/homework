显了“迄今为止没有特别成为话题的日常小事”。 发布的段子中有很多与家务事相关，比如把自来水烧开喝白开水的习惯，以及用手指测量煮饭水量的习惯等。 “家里所有的时钟都被调快5到10分钟，搞不清实际时间”这一帖子获得了数千人的赞同 被邀请去亚裔家里参加聚会时，会被拿出酒店拖鞋招待——拖鞋是亚裔家庭的标配 此外，还有很多笑话与作为在西方社会长大的亚裔的经历有关。据顾说：“有时也有关于如何在亚洲与西方两种文化之间取得平衡这一烦恼的内容。” 例如，在“不够亚洲”的段子里，会提到切换使用两种语言时的失败、为中文作业苦恼、对家庭规矩和传统的反抗等。 另一方面，也有关于日常生活中经历的细微种族歧视，以及让人觉得自己“不够白人”的事件等帖子。 面对“你来自哪里？”这一提问，究竟该回答自己居住的地方还是自己的出身，这种纠结是小组中经常被提起的话题 作为笑话素材的经典是“亚裔父母”。他们典型地被描绘成谨慎、严厉、高压的形象。 我是华裔澳大利亚人，下面介绍一个让我笑得前仰后合的帖子。这个帖子的标题是“某天，当我告诉母亲我没吃早饭时”。 之后，母亲发来的信息就是下面这张照片。 “听说你没吃早饭，上了两节课，一直到12点什么都没吃，我非常不安。因为这件事，我昨天没睡好。像你这样经常空腹12小时以上还剧烈活动，对健康不好。尤其是像最近这样拼命工作、承受压力的时候。我同事的丈夫以第一名的成绩毕业于普林斯顿大学，曾是华尔街的一流投资家。但因为糟糕的饮食习惯，他把胃搞坏了，得了糖尿病，不得不辞去心爱的工作。我不希望你变成那样。良好的饮食对你的健康、人生和事业不可或缺。希望你更加注意早饭。请参考这篇文章。” 这个帖子获得了3万多个“赞” 尤其是“因为这件事，我昨天没睡好”这样的句子，与我自己母亲发来的信息像得出奇。 顾说，这个小组注重“易于引发共鸣”的设计。据说其中还有成员向小组管理员发来感谢的信息。 “有个女孩说，在这个小组里，她第一次觉得自己是某个群体的一员。” 肖说，通过创建这个小组，她明白了自己的经历其实很常见。 “在外国长大，会担心别人无法理解自己，担心会不会被打上少数族裔的烙印，因为这样的想法而有些话说不出口。” 取得平衡 与互联网上其他提供文化认同见解的小组一样，“Subtle Asian Traits”也面临着种种难题。 创建之初，大部分帖子都与东亚有关，因此也曾被批评没有涵盖所有亚洲文化。 顾说，从那以后，小组运营者更加重视引入多样化的内容。而且作为小组规则，成员被鼓励“包容所有亚裔族群”。 顺便一提，小组的规则一共有5条。因为在中国文化中，4被视为不吉利的数字。 肖和朋友们把自己称为ABC，即“Australian-born Chinese（澳大利亚出生的中国人）”的缩写。 此外，也有批评认为，关于在中文里被形容为“虎”的严厉父母的话题，会强化负面的刻板印象。 在论坛网站Reddit上，一名用户指出，这类笑话是内化的种族歧视，与“自我厌恶”无异。 顾一方面承认有些笑话确实滥用了刻板印象，另一方面也辩护说，大多数发帖者“基本上都接纳了自己的文化认同”。 “大家都懂得分寸。” 此外，成员们表示，通过发帖“可以把童年时代的负面经历变成有趣、积极的东西（中略）成为一种借助幽默的疗愈”。 顾说，这个小组加深了她对自身文化的自豪感。据说这是她未曾预料到的体验。 “不必那么难为情地隐藏自己的文化。希望其他人也能通过这个小组获得那样的自信。” （英文报道 The 'Asian traits' humour that became a phenomenon）", "reference_summary": "この写真は、フェイスブックに作られた「 Subtle Asian Traits （ちょっとしたアジア人の特徴）」というグループに投稿されたものだ。", "ref_zh": "这张照片，是发布在脸书上创建的名为“Subtle Asian Traits（细微的亚裔特征）”的小组里的。", "summaries": [{"summary_id": "features-and-analysis-46643494_1d91c9fd", "summary": "メルボルンの中国系オーストラリア人高校生が立ち上げたフェイスブックの「Subtle Asian Traits」グループが、海外在住アジア人の経験を共有する場として急速に広がり、参加者が100万人近くに達している。", "zh": "由墨尔本的华裔澳大利亚高中生创建的脸书“Subtle Asian Traits”小组，作为海外在住亚裔分享经历的场所迅速扩大，成员已接近100万人。"}, {"summary_id": "features-and-analysis-46643494_49520575", "summary": "フランシス・マオ、BBCニュース、シドニー 「Subtle Asian Traits」では、アジア人の親に関するネタがよく取り上げられる 「ママ、出かけてくる」という子どもの言葉に、アメリカやフランス、スペイン、イギリスの母親は「いってらっしゃい！」と返事をする。しかしアジア人の母親の返事はこうだ。「出かける？ どこに？ 誰と？ どうして？ 誰と帰るの？ いつ帰るの？ 毎日出かけてて、ここは家なのホテルなの？ いくらお金を使っているの？ 全くもう、ぜんぜん親と一緒にいてくれない。", "zh": "弗朗西丝·毛，BBC新闻，悉尼 在“Subtle Asian Traits”上，关于亚裔父母的段子经常被拿来讨论 当孩子说“妈妈，我出去一下”时，美国、法国、西班牙、英国的母亲会回答“路上小心，去吧！”。但亚裔母亲的回答是这样的。“出去？去哪儿？和谁？为什么？和谁一起回来？什么时候回来？天天往外跑，这里是家还是旅馆？你花了多少钱？真是的，一点都不肯陪陪父母。"}, {"summary_id": "features-and-analysis-46643494_78994701", "summary": "バブルティーはアジア発の人気ドリンクで、このドリンクにまつわるジョークは「Subtle Asian Traits」グループでも頻繁に投稿されている。創設者たちは当初、こうしたアジア文化の「ちょっと変わったところ」に関するネタを共有したいだけだったと振り返っている。", "zh": "珍珠奶茶是源自亚洲的人气饮品，围绕这款饮品的笑话在“Subtle Asian Traits”小组里也被频繁发布。创始人们回顾说，最初只是想分享这类关于亚洲文化“有点奇特的地方”的段子而已。"}, {"summary_id": "features-and-analysis-46643494_94201a11", "summary": "この写真は、フェイスブックに作られた「 Subtle Asian Traits （ちょっとしたアジア人の特徴）」というグループに投稿されたものだ。", "zh": "这张照片，是发布在脸书上创建的名为“Subtle Asian Traits（细微的亚裔特征）”的小组里的。"}, {"summary_id": "features-and-analysis-46643494_c7b3a750", "summary": "この写真は、フェイスブックに作られた「 Subtle Asian Traits ", "zh": "这张照片，是发布在脸书上创建的名为“Subtle Asian Traits"}]}, {"article_id": "37868736", "url": "https://www.bbc.com/japanese/37868736", "title": "【英EU離脱】手続き開始には議会承認必要 英高等法院", "title_zh": "【英国脱欧】启动程序需议会批准 英国高等法院", "text": "EU離脱手続きについて司法判断を求めた原告ジーナ・ミラーさんが判決を説明（3日、高等法院前） EU離脱手続きについて司法判断を求めた投資ファンドマネージャーの原告ジーナ・ミラーさんが、高等法院の前で判決を発表し、「上訴しないという賢明な判断」が政府に求められていると強調した。 「今日のこの結果は、私たち全員に関わるものです。私や私のチームのものではありません。私たちの英国と私たち全員の未来のものです」 【英EU離脱】議会承認が必要と英高等法院判断 原告は歓迎 裁判で政府側の弁護団は、「民意」を形にするにあたって、政府の大権行使は正当な方法だと主張していた。しかしこれに対し、首席裁判官のトマス卿は判決で、「第50条にもとづき欧州連合離脱を通告するための、国王大権にもとづく権限は、政府にはない」との判断を示した。 訴えを審理した判事3人は、EU関連法に関する国王大権（閣僚が代行する権限）行使の憲法上の前例がないと指摘。第50条の発動は、英国民の権利を根本的に変更するもので、議会承認なしに政府が英国法に基づく国民の権利を変更したり撤廃することは認められないと裁定した。 裁判所の判断は「純粋な法律の問題」に対するもので、「欧州連合離脱の利点について法廷は関知せず、いかなる意見も表明しない。それは政治の問題だ」とトマス卿は念を押した。 メイ内閣は上訴する方針。最高裁での審理は来月にも予定されている。 英政府は、国民投票と閣僚に与えられた権限を根拠に、議会投票は不要だとしてきたが、それは違憲だという反論が離脱反対派の間に多かった。 首相報道官は、来年3月末までに第50条を発動する方針に変わりはないと、テリーザ・メイ首相は欧州委員会のジャンクロード・ユンケル委員長に説明するつもりだと明らかにした。 解散総選挙を早期に実施するのではという観測については、「2020年まで総選挙は行わないという首相の考えは変わらない」と報道官は述べた。 ブレグジット（英国のEU離脱）担当相のデイビッド・デイビス氏は、高等法院の判断は、貴族院と下院の両方の承認が必要という意味だろうと指摘した上で、政府は上訴すると表明。 デイビス担当相はBBCに、そもそも国民投票は、「下院が6対1で、国民の選択にゆだねようと決めた」から行われたものだと強調し、「議会が尊重するのは国民だ。1740万人が欧州連合離脱に投票した。史上最大の信任だ。英国の国家利益のために最善の形で、その信任に応えていく」と述べた。 一方で野党・労働党のジェレミー・コービン党首は、「速やかに交渉の条件を議会に提示する」よう政府に呼びかけ、「ブレグジットの条件について議会に対し透明性と説明責任が必要だ」と述べた。 しかし、イギリス独立党（UKIP）のナイジェル・ファラージ党首は、6月の国民投票で離脱を支持した有権者の51.9％に対する「裏切り」が心配だと延べ、「半分だけのブレグジット」になりかねないと懸念を示した。 BBCのノーマン・スミス政治副編集長は、高等法院の判断によって議会の様々な手続きを通過するのに「何カ月も」かかる可能性があるが、国民投票の結果を受けて大半の議員はたとえ残留派だったとしても、第50条の発動を支持するだろうと解説した。 6月23日の国民投票の結果は、52%が離脱賛成、48％が反対だった。 EUの他の加盟国は、開始から2年かかる離脱交渉は、英国が第50条を発動するまで開始できないと表明している。 （英語記事 Brexit court defeat for UK government）", "text_zh": "就脱欧程序寻求司法裁决的原告吉娜·米勒说明判决（3日，高等法院前） 就脱欧程序寻求司法裁决的投资基金经理、原告吉娜·米勒在高等法院前公布判决，并强调政府应作出“不上诉这一明智的判断”。 “今天的这一结果，关系到我们所有人。它不属于我或我的团队。它属于我们的英国和我们所有人的未来。” 【英国脱欧】英国高等法院裁定需议会批准 原告表示欢迎 在庭审中，政府方的律师团主张，在将“民意”付诸实施时，行使政府大权是正当的方式。但对此，首席法官托马斯勋爵在判决中作出裁定：“政府不拥有基于国王大权、依据第50条通告脱离欧洲联盟的权限。” 审理此案的3名法官指出，就欧盟相关法律行使国王大权（由内阁大臣代行的权限）没有宪法上的先例。他们裁定，启动第50条将从根本上改变英国国民的权利，未经议会批准，政府不得变更或废除基于英国法律的国民权利。 托马斯勋爵还强调，法院的裁定是针对“纯粹的法律问题”，“关于脱离欧洲联盟的利弊，法庭不予过问，也不发表任何意见。那是政治问题。” 梅内阁的方针是提起上诉。最高法院的审理最早预定于下月进行。 英国政府一直以全民公投和赋予内阁大臣的权限为依据，主张无需议会投票，但在反对脱欧派中，有很多人反驳称这是违宪的。 首相发言人表示，特里莎·梅首相打算向欧盟委员会主席让-克洛德·容克说明，在明年3月底前启动第50条的方针没有改变。 关于可能提前解散议会举行大选的猜测，发言人表示：“首相认为2020年之前不举行大选的想法没有改变。” 负责英国脱欧事务的大臣戴维·戴维斯指出，高等法院的裁定或许意味着需要上议院和下议院双方的批准，并表明政府将提起上诉。 戴维斯大臣对BBC强调，全民公投本来就是因为“下议院以6比1决定交由国民选择”才举行的，并表示：“议会尊重的是国民。1740万人投票支持脱离欧洲联盟。这是史上最大的信任。我们将以最有利于英国国家利益的方式，回应这份信任。” 另一方面，在野党工党党首杰里米·科尔宾呼吁政府“迅速向议会提交谈判条件”，并表示：“关于脱欧的条件，需要对议会保持透明并承担说明责任。” 不过，英国独立党（UKIP）党首奈杰尔·法拉奇表示，担心这会成为对6月全民公投中支持脱欧的51.9%选民的“背叛”，并对可能演变成“只有一半的脱欧”表示忧虑。 BBC政治副主编诺曼·史密斯解读说，由于高等法院的裁定，通过议会的各种程序可能需要“好几个月”，但鉴于全民公投的结果，大多数议员即使原本是留欧派，也会支持启动第50条。 6月23日全民公投的结果是，52%赞成脱欧，48%反对。 欧盟其他成员国已表明，从启动起需要两年的脱欧谈判，在英国启动第50条之前无法开始。 （英文报道 Brexit court defeat for UK government）", "reference_summary": "英国の欧州連合（EU）離脱について、英高等法院は3日、離脱手続きを開始するリスボン条約第50条を政府が発動するには、議会承認が必要だとの判断を示した。", "ref_zh": "关于英国脱离欧洲联盟（EU），英国高等法院3日作出裁定：政府要启动开启脱欧程序的《里斯本条约》第50条，需要获得议会批准。", "summaries": [{"summary_id": "37868736_49e7095a", "summary": "EU離脱手続きについて司法判断を求めた原告ジーナ・ミラーさんが判決を説明（3日、高等法院前） EU離脱手続きについて司法判断を求めた投資ファンドマネージャーの原告ジーナ・ミラーさんが、高等法院の前で判決を発表し、「上訴しないという賢明な判断」が政府に求められていると強調した。「今日のこの結果は、私たち全員に関わるものです。私や私のチームのものではありません。", "zh": "就脱欧程序寻求司法裁决的原告吉娜·米勒说明判决（3日，高等法院前） 就脱欧程序寻求司法裁决的投资基金经理、原告吉娜·米勒在高等法院前公布判决，并强调政府应作出“不上诉这一明智的判断”。“今天的这一结果，关系到我们所有人。它不属于我或我的团队。"}, {"summary_id": "37868736_939d5a23", "summary": "英国の欧州連合（EU）離脱について、英高等法院は3日、離脱手続きを開始するリスボン条約第50条を政府が発動するには、議会承認が必要だとの判断を示した。", "zh": "关于英国脱离欧洲联盟（EU），英国高等法院3日作出裁定：政府要启动开启脱欧程序的《里斯本条约》第50条，需要获得议会批准。"}, {"summary_id": "37868736_dbbb3ebf", "summary": "英メイ内閣はEU離脱に関する高等法院判断に上訴する方針で、最高裁での審理は来月にも予定されている。6月23日の国民投票では52％が離脱賛成、48％が反対だった。EU他加盟国は、離脱交渉は英国が第50条を発動するまで開始できないとの立場を示している。", "zh": "英国梅内阁的方针是就有关脱欧的高等法院裁定提起上诉，最高法院的审理最早预定于下月进行。在6月23日的全民公投中，52%赞成脱欧，48%反对。欧盟其他成员国表明立场称，脱欧谈判在英国启动第50条之前无法开始。"}, {"summary_id": "37868736_ec4ae30e", "summary": "英国の欧州連合（EU）離脱について、英高等法院は3日、離脱手続きを開始するリスボン条約第50条を政府が発動するには、議会承認が必要だとの判断を示した。", "zh": "关于英国脱离欧洲联盟（EU），英国高等法院3日作出裁定：政府要启动开启脱欧程序的《里斯本条约》第50条，需要获得议会批准。"}, {"summary_id": "37868736_f0795d77", "summary": "英高等法院は3日、欧州連合（EU）離脱手続きを開始するリスボン条約第50条を政府が発動するには議会承認が必要だとの判断を示した。判決は首相が国王大権に基づき単独で発動できるとの政府主張を退け、第50条発動は国民の権利を根本的に変更する行為だと指摘した。メイ内閣は上訴する方針で、来月にも最高裁での審理が予定されている。", "zh": "英国高等法院3日作出裁定：政府要启动开启欧洲联盟（EU）脱离程序的《里斯本条约》第50条，需要获得议会批准。判决驳回了政府关于首相可基于国王大权单独启动的主张，并指出启动第50条是从根本上改变国民权利的行为。梅内阁的方针是提起上诉，最高法院的审理最早预定于下月进行。"}]}, {"article_id": "features-and-analysis-42940954", "url": "https://www.bbc.com/japanese/features-and-analysis-42940954", "title": "大きくなったら何になる？ 国や男女で異なる上昇志向や性差意識", "title_zh": "长大后想做什么？因国家和男女而异的上进心与性别意识", "text": "ショーン・コクラン、BBC教育･家族問題担当編集委員 パキスタン、バングラデシュ、コロンビア、インドネシアの女子の多くは医師を志望している 英国の男の子がサッカー選手やYouTubeスターになりたがるのに対し、ウガンダやザンビアでは医師や教師になりたいという子が多い。 教育と雇用を推進する英慈善団体「Education and Employers」が2万人の子供を対象に調査を実施した。 研究チームは世界20カ国で7歳から11歳の小学生に、大きくなったらどんな仕事に就きたいかと質問し、答えを絵に描かせた。 男女の役割 同団体によると、子供がまだ小さい頃からいかに性別による役割のステレオタイプが固まってしまうかを示す結果となった。 英国では、技術者や科学者になりたいと答える女子の割合は、男子に比べてはるかに低かった 教師は多くの国で特に人気の職業だ 英国の女の子が憧れる職業の上位10種類には、看護師、ダンサー、美容師などが含まれた。 これに対して男子は、飛行機のパイロットや整備士などの希望が多かった。 女子に人気の仕事は、教師や獣医、医師など、学業での成功を重視する職種が多かった。 対照的に男子は、大衆文化の影響が大きい様子で、スポーツ選手のほか、ソーシャルメディアや警察の仕事などが人気だった。 社会的流動性 同団体によると、社会のだれもが階層を超えて高い地位を目指せるかどうかという「社会的流動性」については、幼少期から多様な職種に触れさせる必要があることが調査から分かった。 貧困地区の学校の女子は店員やエステティシャンになりたがる傾向が強く、比較的裕福な男子は経営者や弁護士を希望しがちだった。 男子は女子より、科学者や技師を目指す割合が多い 英国以外の国では、苦しい生活にもかかわらず高い志を表す絵が目立った。 ウガンダとフィリピンでは、女子が最も希望する仕事は教師だった。パキスタン、バングラデシュ、コロンビア、インドネシアでは、医師志望が一番多かった。 中国では、男子に最も人気の職業は科学者だった。 中国では調理師も子供に人気の仕事だ しかし、英国でも他の国々でも、雇用市場の現実と子供の期待の間には、大きなずれがみられた。 独自性の発揮を 現実と希望のずれは、子供が大きくなっても継続すると同団体は指摘する。社会で実際にどんな技術が求められるのか、適切な助言を受けられないからだ。 「職業カウンセリングを中高で始めるのは、あまりにも遅すぎる」と、経済協力開発機構（OECD)教育・スキル局のアンドレアス・シュライヒャー局長は言う。 「子供は就学の時点ですでに、日常での経験をもとに、強い思い込みを抱いている。それは、子供たちの絵からも明らかだ」 獣医は人気の職業で、特に女子の志望が多い 英デロイトのグローバル会長のデイビッド・クリュックシャンク氏は、「社会的流動性を高めたい私たち全員にとって、意味のある結果だ」と話す。同氏は、調査を実施した慈善団体「Education and Employers」の理事長でもある。 「子供がどういうキャリアを目指すか、最も影響を与えるのは、その子の身近な人だ」 英国初等学校長会（NAHT）会長のアン・ライオンズ氏は、家族の期待というお仕着せの「枠」の外に出るのが、若い人にとっていかに大変なことかが、調査結果から分かると指摘する。 「Education and Employers」責任者のニック・チェンバーズ氏は調査結果について、小学生が早い段階で将来の可能性を限定してしまわないよう、「自分たちに開かれている幅広い選択肢」について知る必要があることを示していると語った。 英国の女子に人気の職業ベスト10 英国の男子に人気の職業ベスト10 （英語記事 Children in poorer countries have higher career aspirations than UK）", "text_zh": "肖恩·库格伦，BBC教育与家庭问题编辑 巴基斯坦、孟加拉国、哥伦比亚、印度尼西亚的许多女孩志愿成为医生 英国的男孩想成为足球运动员或YouTube明星，而在乌干达和赞比亚，想成为医生或教师的孩子居多。 推动教育与就业的英国慈善团体“Education and Employers”以2万名儿童为对象实施了调查。 研究团队在全球20个国家向7岁至11岁的小学生提问：长大后想从事什么工作，并让他们把答案画成图画。 男女的角色 据该团体称，调查结果显示出，性别角色的刻板印象在孩子还很小的时候就已何等根深蒂固。 在英国，回答想成为工程师或科学家的女孩比例远低于男孩 教师在许多国家都是特别受欢迎的职业 英国女孩向往的职业前10位中，包括护士、舞蹈演员、美发师等。 与此相对，男孩中希望成为飞机驾驶员或维修技师等的居多。 受女孩欢迎的工作，多为教师、兽医、医生等重视学业成功的职业。 与之形成对照的是，男孩似乎受大众文化影响较大，除运动员外，社交媒体和警察等工作也很受欢迎。 社会流动性 据该团体称，关于社会上任何人能否跨越阶层追求更高地位这一“社会流动性”问题，调查表明，有必要让孩子从幼年起就接触多样的职业。 贫困地区学校的女孩更倾向于想成为店员或美容师，而较为富裕的男孩则往往希望成为经营者或律师。 男孩中立志成为科学家或工程师的比例高于女孩 在英国以外的国家，尽管生活艰苦，表达远大志向的图画却十分显眼。 在乌干达和菲律宾，女孩最希望从事的工作是教师。在巴基斯坦、孟加拉国、哥伦比亚、印度尼西亚，志愿成为医生的最多。 在中国，最受男孩欢迎的职业是科学家。 在中国，厨师也是受孩子欢迎的工作 但无论在英国还是其他国家，就业市场的现实与孩子的期待之间都存在很大的偏差。 发挥独特性 该团体指出，现实与愿望的偏差在孩子长大后仍会持续。因为他们无法获得关于社会实际需要何种技能的恰当建议。 经济合作与发展组织（OECD）教育与技能司司长安德烈亚斯·施莱歇尔说：“职业咨询到初高中才开始，实在是太晚了。” “孩子在入学时就已经基于日常经验抱有强烈的成见。这一点从孩子们的图画中也一目了然。” 兽医是受欢迎的职业，尤其以女孩志愿者居多 英国德勤全球主席戴维·克鲁克香克说：“对于希望提高社会流动性的我们所有人来说，这是有意义的结果。”他同时也是实施调查的慈善团体“Education and Employers”的理事长。 “对孩子立志追求何种职业影响最大的，是孩子身边的人。” 英国初等学校校长协会（NAHT）会长安·莱昂斯指出，调查结果显示出，走出家人期待这一强加的“框框”，对年轻人来说是何等艰难。 “Education and Employers”负责人尼克·钱伯斯谈及调查结果时表示，调查显示，为了不让小学生在早期阶段就限定自己未来的可能性，他们有必要了解“向自己敞开的广泛选择”。 英国女孩最喜爱的职业前10名 英国男孩最喜爱的职业前10名 （英文报道 Children in poorer countries have higher career aspirations than UK）", "reference_summary": "子供が目指す将来の職業について、途上国の子供は英国男子よりも、高等教育を経た専門職を希望していることが、最近の国際的な調査で分かった。", "ref_zh": "关于孩子立志将来从事的职业，最近的一项国际调查显示，发展中国家的孩子比英国男孩更希望从事需经过高等教育的专业职业。", "summaries": [{"summary_id": "features-and-analysis-42940954_31b57567", "summary": "ベトナムは中国と領有権を争う海域内で石油の掘削を開始した。石油業界関係者が明らかにした。", "zh": "越南已在与中国存在主权争议的海域内开始钻探石油。石油业界相关人士透露了这一消息。"}, {"summary_id": "features-and-analysis-42940954_519dda6a", "summary": "子供が目指す将来の職業について、途上国の子供は英国男子よりも、高等教育を経た専門職を希望していることが、最近の国際的な調査で分かった。", "zh": "关于孩子立志将来从事的职业，最近的一项国际调查显示，发展中国家的孩子比英国男孩更希望从事需经过高等教育的专业职业。"}, {"summary_id": "features-and-analysis-42940954_9e82620f", "summary": "調査を実施した英慈善団体「Education and Employers」の理事長でもある英デロイトのグローバル会長デイビッド・クリュックシャンク氏は、「社会的流動性を高めたい私たち全員にとって、意味のある結果だ」と述べた。OECD教育・スキル局のアンドレアス・シュライヒャー局長も、職業カウンセリングを中高で始めるのは遅すぎると指摘した。", "zh": "兼任实施调查的英国慈善团体“Education and Employers”理事长的英国德勤全球主席戴维·克鲁克香克表示：“对于希望提高社会流动性的我们所有人来说，这是有意义的结果。”OECD教育与技能司司长安德烈亚斯·施莱歇尔也指出，职业咨询到初高中才开始已为时过晚。"}, {"summary_id": "features-and-analysis-42940954_b9c4ae98", "summary": "世界20カ国の7〜11歳の子ども2万人を対象にした調査で、途上国の子どもは英国の子どもよりも医師や教師など高等教育を要する専門職を希望する傾向が強いことが分かった。英国では男子はサッカー選手やYouTubeスター、女子は看護師やダンサーなどが上位に挙がった。調査結果は、早い段階から性別によるステレオタイプが形成されていることも示し、幼少期のキャリア支援の重要性を浮き彫りにした。", "zh": "一项以全球20个国家2万名7至11岁儿童为对象的调查发现，发展中国家的孩子比英国的孩子更倾向于希望从事医生、教师等需要高等教育的专业职业。在英国，男孩中足球运动员、YouTube明星，女孩中护士、舞蹈演员等位居前列。调查结果还显示，性别刻板印象从很早的阶段就已形成，凸显了幼年期职业支持的重要性。"}, {"summary_id": "features-and-analysis-42940954_f55f6cd9", "summary": "ショーン・コクラン、BBC教育･家族問題担当編集委員 パキスタン、バングラデシュ、コロンビア、インドネシアの女子の多くは医師を志望している 英国の男の子がサッカー選手やYouTubeスターになりたがるのに対し、ウガンダやザンビアでは医師や教師になりたいという子が多い。教育と雇用を推進する英慈善団体「Education and Employers」が2万人の子供を対象に調査を実施した。研究チームは世界20カ国で7歳から11歳の小学生に、大きくなったらどんな仕事に就きたいかと質問し、答えを絵に描かせた。", "zh": "肖恩·库格伦，BBC教育与家庭问题编辑 巴基斯坦、孟加拉国、哥伦比亚、印度尼西亚的许多女孩志愿成为医生 英国的男孩想成为足球运动员或YouTube明星，而在乌干达和赞比亚，想成为医生或教师的孩子居多。推动教育与就业的英国慈善团体“Education and Employers”以2万名儿童为对象实施了调查。研究团队在全球20个国家向7岁至11岁的小学生提问：长大后想从事什么工作，并让他们把答案画成图画。"}]}, {"article_id": "44285473", "url": "https://www.bbc.com/japanese/44285473", "title": "マリ移民の「スパイダーマン」、仏市民権取得へ パリで4歳児救助", "title_zh": "马里移民“蜘蛛侠”将获法国公民权 在巴黎救助4岁幼童", "text": "マリ移民の「スパイダーマン」 4歳児救助の瞬間 マモウドゥ・ガッサマさんは、ベランダを4階までよじ登って4歳の男児を助けたことで大勢に称賛されている。 ソーシャルメディアに投稿された動画には、ガッサマさんが見守る人々の応援を受けながら、バルコニーからバルコニーへと次々とよじ登り、4階にたどり着く様子が映っている。 ガッサマさんは28日、仏大統領官邸のエリゼ宮に招かれ、エマニュエル・マクロン仏大統領と面会した。マクロン大統領は面会後、ガッサマさんに帰化市民権が与えられる見込みだと述べた。 マクロン氏は自ら直接、ガッサマさんに感謝を伝え、勇気を称える勲章を授与した。ガッサマさんには消防士の職も与えられる予定だ。 ガッサマさんは、ボートで地中海を越えてイタリアに渡るなどヨーロッパへの長く危険な旅を経て、昨年フランスにたどり着いたという。 ガッサマさんを一気に時の人にした救出劇は26日夕方、パリ北部の路上で起きた。 ガッサマさんが現場を通りかかると、建物の前に集まった群衆を見たという。 「考える時間がなかったので、走って道路を渡り、幼児を助けました」とガッサマさんはマクロン氏に語った。 「私はただ登っただけで、神に感謝します。神が私を助けてくれました。登れば登るほど、もっと高くまで登る勇気が湧いてきたんです。それだけです」とガッサマさんは付け加えた。 ガッサマさんによると、男児はガッサマさんに安全な場所へ引き上げられた時、涙を流していたという。また、足にけがもしていた。 消防士が到着したときには、男児は既に救助されていた。 「幸運にも、子供を救助できるだけの身体能力と勇気を持った人がそこにいた」と消防当局の報道官は述べた。 ガッサマさんは28日、マクロン大統領に面会した 大統領官邸の外で授与された表彰状を見せるガッサマさん 地元メディアはパリ当局の話として、4歳児の両親は当時家を不在にしていたと報じた。司法筋によると、父親は、保護責任者による遺棄の疑いで警察の聴取を受けた。母親は当時パリにいなかったとみられている。 パリのアンヌ・イダルゴ市長もガッサマさんの勇気を称賛し、ガッサマさんに電話をかけて感謝の言葉を伝えたと明らかにした。 イダルゴ市長はガッサマさんを救助現場から「18区のスパイダーマン」と言及し、「全ての市民の模範」と呼んだ。 市長はツイッターに「昨晩、子供の命を救った勇敢な行為の実行者、マモウドウ・ガッサマさんに大きなブラボーを。今日、直接電話して心からの感謝を伝えられたことを喜ばしく思う」と投稿した。 ＜解説＞マリ人の新英雄、フランスに出現――アレックス・デュバル・スミス BBCニュース西アフリカ特派員 ガッサマさんが建物を4階まで駆け上がった様子は、もう1人のマリ人の英雄を思い出させた。2015年1月、パリのユダヤ食品専門スーパーマーケットで起きたイスラム過激派による人質事件で全国的に有名になったマリ移民男性だ。 当時24歳だったマリ人従業員の若者、ラサナ・バシリーさんは、事件発生当時店内にいた赤ちゃんを含む6人の買い物客を安全な隠れ場所に誘導し、自身は1人で店を脱出して警官隊を案内し救助に向かわせた。この行動で、買い物客は命を助けられた。 事件まで6年にわたり正規の在住権を求めて仏当局相手に格闘していたバシリーさんは、事件後に勲章とフランスのパスポートを当時のフランソワ・オランド大統領から授与された。 バシリーさんは2016年、著書「私はヒーローではない」を出版し、慈善団体も立ち上げた。団体の最初の企画は、マリ西部にある故郷の村に灌漑（かんがい）設備を作るというものだった。 バシリーさんの人質を守る利他的なリーダーシップと同じように、ガッサマさんの男児を守る英雄的なビル登りは、昔ながらの公的精神の文化を持つ国としてのマリの印象を強固なものにしている。 ＜おすすめ記事＞ （英語記事 Mamoudou Gassama: Mali 'Spiderman' to be made French citizen）", "text_zh": "马里移民“蜘蛛侠” 救助4岁幼童的瞬间 马穆杜·加萨马因徒手攀爬阳台至4楼救下4岁男童，受到众人称赞。 发布在社交媒体上的视频显示，加萨马在围观人群的加油声中，从一个阳台爬向另一个阳台，接连攀登，最终抵达4楼。 加萨马28日应邀前往法国总统官邸爱丽舍宫，与法国总统埃马纽埃尔·马克龙会面。马克龙总统在会面后表示，加萨马有望被授予入籍公民权。 马克龙亲自向加萨马表达谢意，并授予其表彰勇气的奖章。加萨马还将获得消防员的职位。 据悉，加萨马经历了乘船横渡地中海抵达意大利等漫长而危险的欧洲之旅，于去年抵达法国。 让加萨马一举成为风云人物的救援事件，发生在26日傍晚巴黎北部的街头。 据称，加萨马路过现场时，看到了聚集在建筑物前的人群。 “没有时间思考，所以我跑着穿过马路，救了幼童。”加萨马对马克龙这样说。 “我只是爬了上去，感谢神。是神帮助了我。越往上爬，就越涌起爬得更高的勇气。仅此而已。”加萨马补充道。 据加萨马说，男童被他拉到安全地方时正流着眼泪，而且脚上还受了伤。 消防员抵达时，男童已经获救。 “幸运的是，当时那里有一位具备足以救助孩子的身体能力和勇气的人。”消防部门发言人这样表示。 加萨马28日与马克龙总统会面 在总统官邸外展示所获奖状的加萨马 当地媒体援引巴黎当局的话报道称，4岁幼童的父母当时不在家中。据司法人士透露，父亲因涉嫌监护人遗弃而接受了警方问询。母亲当时据信不在巴黎。 巴黎市长安娜·伊达尔戈也称赞了加萨马的勇气，并透露已致电加萨马转达感谢之意。 伊达尔戈市长按救援现场所在地称加萨马为“18区的蜘蛛侠”，并称他是“全体市民的模范”。 市长在推特上发文称：“向昨晚以勇敢行为拯救孩子生命的马穆杜·加萨马致以热烈的喝彩。很高兴今天能直接致电向他转达衷心的感谢。” 〈解说〉马里人新英雄现身法国——亚历克斯·杜瓦尔·史密斯 BBC新闻驻西非记者 加萨马攀上建筑物4楼的情景，让人想起另一位马里英雄。那是2015年1月在巴黎犹太食品专门超市发生的伊斯兰极端分子人质事件中闻名全国的马里移民男子。 当时24岁的马里籍年轻店员拉萨纳·巴蒂利，将事发时在店内的包括婴儿在内的6名顾客引导至安全的藏身之处，自己则独自逃出店铺，为警察队伍带路前往救援。这一行动挽救了顾客们的生命。 事件发生前，巴蒂利曾为寻求正式居留权与法国当局周旋了6年之久。事件之后，他从时任总统弗朗索瓦·奥朗德手中获授勋章和法国护照。 巴蒂利2016年出版了著作《我不是英雄》，还创立了慈善团体。团体的第一个计划，是在位于马里西部的家乡村庄修建灌溉设施。 与巴蒂利保护人质的利他领导力一样，加萨马为保护男童而英勇攀楼的举动，也强化了马里作为一个拥有传统公共精神文化的国家的印象。 〈推荐报道〉 （英文报道 Mamoudou Gassama: Mali 'Spiderman' to be made French citizen）", "reference_summary": "パリ北部の18区で26日、集合住宅の4階ベランダからぶら下がった幼児を22歳の移民男性が救助した。英雄だと称えられているマリ移民の男性には、フランス市民権が授与される見込みだ。", "ref_zh": "26日，在巴黎北部的18区，一名22岁的移民男子救下了悬挂在集合住宅4楼阳台外的幼童。这名被誉为英雄的马里移民男子，有望被授予法国公民权。", "summaries": [{"summary_id": "44285473_21f569f1", "summary": "マリ出身の22歳の移民男性マモウドゥ・ガッサマさんが、パリの建物ベランダから落ちそうになった4歳男児を4階までよじ登って救助し、マクロン仏大統領から勲章と帰化市民権の見通しを授与された。", "zh": "来自马里的22岁移民男子马穆杜·加萨马徒手攀爬至4楼，救下了险些从巴黎一栋建筑阳台坠落的4岁男童，并被法国总统马克龙授予勋章和入籍公民权的前景。"}, {"summary_id": "44285473_3dc6f328", "summary": "マリ移民の「スパイダーマン」 4歳児救助の瞬間 マモウドゥ・ガッサマさんは、ベランダを4階までよじ登って4歳の男児を助けたことで大勢に称賛されている。ソーシャルメディアに投稿された動画には、ガッサマさんが見守る人々の応援を受けながら、バルコニーからバルコニーへと次々とよじ登り、4階にたどり着く様子が映っている。ガッサマさんは28日、仏大統領官邸のエリゼ宮に招かれ、エマニュエル・マクロン仏大統領と面会した。", "zh": "马里移民“蜘蛛侠” 救助4岁幼童的瞬间 马穆杜·加萨马因徒手攀爬阳台至4楼救下4岁男童，受到众人称赞。发布在社交媒体上的视频显示，加萨马在围观人群的加油声中，从一个阳台爬向另一个阳台，接连攀登，最终抵达4楼。加萨马28日应邀前往法国总统官邸爱丽舍宫，与法国总统埃马纽埃尔·马克龙会面。"}, {"summary_id": "44285473_410bd04f", "summary": "2015年1月にパリのユダヤ食品専門スーパーマーケットで起きたイスラム過激派による人質事件では、マリ移民の24歳従業員ラサナ・バシリーさんが赤ちゃんを含む6人の買い物客を隠れ場所に誘導し、自ら脱出して警察を導いた。事件後、バシリーさんはオランド大統領からフランス市民権と勲章を授与された。", "zh": "在2015年1月巴黎犹太食品专门超市发生的伊斯兰极端分子人质事件中，24岁的马里移民店员拉萨纳·巴蒂利将包括婴儿在内的6名顾客引导至藏身之处，并自行脱身为警察带路。事件后，巴蒂利从奥朗德总统处获授法国公民权和勋章。"}, {"summary_id": "44285473_70fe2837", "summary": "パリ北部の18区で26日、集合住宅の4階ベランダからぶら下がった幼児を22歳の移民男性が救助した。英雄だと称えられているマリ移民の男性には、フランス市民権が授与される見込みだ。", "zh": "26日，在巴黎北部的18区，一名22岁的移民男子救下了悬挂在集合住宅4楼阳台外的幼童。这名被誉为英雄的马里移民男子，有望被授予法国公民权。"}, {"summary_id": "44285473_b6028e64", "summary": "パリ北部の18区で26日、集合住宅の4階ベランダからぶら下がった幼児を22歳の移民男性が救助し", "zh": "26日，在巴黎北部的18区，一名22岁的移民男子将悬挂在集合住宅4楼阳台外的幼童救起，"}]}, {"article_id": "52873099", "url": "https://www.bbc.com/japanese/52873099", "title": "トランプ米大統領、反ファシスト「アンティファ」をテロ組織に指定すると発言", "title_zh": "美国总统特朗普称将把反法西斯组织“安提法”列为恐怖组织", "text": "ドナルド・トランプ大統領は繰り返し、アンティファが暴動を扇動していると非難している ミネソタ州ミネアポリスでは25日、武器を持たない黒人男性ジョージ･フロイドさん（46）がデレック･チョーヴィン警官（44、29日に殺人罪で起訴）に膝で首を9分近く押さえつけられて亡くなった。この事件を受け、アメリカ各地でアフリカ系アメリカ人に対する警察の対応に怒りの声が上がっている。 抗議活動では暴力行為も多発し、各地の大都市で夜間外出禁止令が敷かれた。また、これまでに15州で、州兵が鎮圧に投入されている。アメリカ各州の州兵は、国内の緊急事態に対応するのが任務。 ミネアポリスではフロイドさんの死後、5日にわたって放火や盗難などが横行している。 ＜関連記事＞ なぜ抗議行動が暴動に発展したのか、米政府当局者は大幅に異なる見解をそれぞれ示している。外部のグループや個人の関与を示唆する意見もある。 ミネソタ州のティム・ウォルツ知事（民主党）は30日、外国勢力や白人至上主義者、違法薬物カルテルなどが暴力の背景にいると話したが、詳細は説明しなかった。 一方でトランプ大統領はツイッターで、「アンティファ主導の無政府主義者」や「左翼の無政府主義者」が騒ぎを起こしていると書いているものの、こちらも詳細は明かさなかった。 その上でトランプ氏は、「アメリカ合衆国はアンティファをテロ組織に指定することになる」とツイートした。 ただし、アンティファのテロ組織指定をいつ、どのように実施するのかについては説明はなかった。 米政権が特定の団体や個人を外国テロ組織に指定する方法は、法制化や大統領令などいくつかある。 しかし、法曹関係者からは、アンティファに「国内テロ組織」というレッテルを貼る権限が、トランプ氏にあるのかどうか、疑問視する声が出ている。 元司法省高官のメアリー・マコード氏は、「国内組織をテロ組織に指定できる法的権限は現在、存在しない」と説明した。 「そのような指定を追求すれば、合衆国憲法修正第1条に違反する懸念が出てくる」 修正第1条は、表現の自由や平和的集会の権利、信教の自由などを保障している。 一方で、連邦議会の上院では昨年、共和党の議員団が、アンティファを「国内テロリスト」に指定する拘束力のない決議案を提出した。 暴動は誰のせいだと 抗議活動は当初、フロイド氏の死や、アフリカ系アメリカ人に対する警察暴力に怒る市民らが、平和的に市街地を占拠するものだった。 その怒りが加速して暴動に発展したが、その原因ははっきりしていない。 しかしここ数日、連邦当局や各州の高官らは、証拠を示さずに断定的な主張を重ねている。 トランプ大統領は30日に、「アンティファと極左のしわざだ。それ以外の人を責めないように！」とツイートした。 ウィリアム・バー司法長官も大統領に調子を揃え、アンティファなどの「扇動者」らがアメリカ全土に広がる抗議活動をハイジャックしていると批判した。 「アンティファやその他の同じようなグループが扇動し、実行する暴力は国内テロであり、そのように対応する」とバー長官は5月31日に述べた。 混乱収束のために配備されたカリフォルニア州の州兵 一方マイク・ポンペオ国務長官は、それよりも慎重な姿勢をとっている。フォックス・ニュースに出演したポンペオ氏は、暴徒は「アンティファのような」グループだと述べながらも、平和的な抗議がどうやって暴力的なものに変質したのかは、「まだ分からない」と強調した。 ミネソタ州のキース・エリソン司法長官は、ミネアポリス在住ではない人々が、同州で暴力行為に加担している証拠があると述べた。しかし、特定の組織や政治思想と関連があるかどうかは説明しなかった。 首都ワシントンでも、抗議活動が激化した。写真はホワイトハウス正面の公園近くで抗議参加者を後退させようとする警官たち このほか、ミネアポリスのジェイコブ・フレイ市長も、市外の右派勢力が暴力に関わっていると指摘した。 「私たちはいま、この市や地域を破壊し、不安定化させている白人至上主義者、犯罪組織の構成員、州外からの扇動者、あるいはもしかすると外国勢力とも対立している」と語った。 しかし31日、ミネソタ州当局は前日の逮捕者について、州外から来た人は20％ほどだったと発表している。 アンティファとは？ アンティファは「Anti-Fascist Action（反ファシスト活動）」の略語で、ネオナチやファシズム、白人至上主義者、差別主義などに強く反対する抗議活動を指す。指導者などはなく、ゆるやかに連携する活動家たちの集まりだと考えられている。 メンバーの大半があらゆる人種差別、性差別に反対しており、トランプ氏の様々な政策を国粋主義、反移民、反ムスリム的だとして、強く反対している。 一方で反政府主義かつ反資本主義であるため、アンティファのメンバーは主流左派よりも、無政府主義に近いとみなされることが多い。 アメリカでは、2017年8月に米ヴァージニア州シャーロッツヴィルで開催された極右集会に抗議するいわゆる「カウンター」行動が注目され、その名前が知れわたった。 トランプ大統領はこの集会と、それに抗議する人たちの衝突について「双方に非がある」と述べたほか、当初は集会を主催した白人至上主義者を非難しなかったことで、大きな批判を浴びた経緯がある。 （英語記事 Trump says Antifa will be declared 'terror group'）", "text_zh": "唐纳德·特朗普总统一再指责安提法煽动暴乱 5月25日，在明尼苏达州明尼阿波利斯，手无寸铁的黑人男子乔治·弗洛伊德（46岁）被警察德雷克·肖万（44岁，29日以杀人罪被起诉）用膝盖压住颈部近9分钟后死亡。此事发生后，美国各地对警察针对非裔美国人的执法方式发出了愤怒的声音。 抗议活动中暴力行为频发，各地大城市实施了宵禁。此外，迄今已有15个州出动国民警卫队进行镇压。美国各州国民警卫队的任务是应对国内紧急事态。 在明尼阿波利斯，弗洛伊德死后，纵火、盗窃等行为已横行了5天。 ＜相关报道＞ 关于抗议行动为何演变为暴乱，美国政府官员各自给出了大相径庭的看法。也有意见暗示有外部团体或个人参与其中。 明尼苏达州州长蒂姆·沃尔兹（民主党）30日表示，外国势力、白人至上主义者、非法毒品卡特尔等是暴力的幕后推手，但没有说明详情。 另一方面，特朗普总统在推特上写道，是“安提法主导的无政府主义者”和“左翼无政府主义者”在制造骚乱，但同样没有透露详情。 在此基础上，特朗普发推称：“美利坚合众国将把安提法列为恐怖组织。” 不过，对于何时、以何种方式实施对安提法的恐怖组织认定，他没有作出说明。 美国政府将特定团体或个人认定为外国恐怖组织的方式有立法、总统行政令等若干种。 但法律界人士质疑，特朗普是否拥有给安提法贴上“国内恐怖组织”标签的权限。 前司法部高官玛丽·麦科德解释说：“目前不存在能够将国内组织认定为恐怖组织的法律权限。” “如果追求这样的认定，就会产生违反合众国宪法第一修正案的担忧。” 第一修正案保障言论自由、和平集会的权利以及宗教信仰自由等。 另一方面，在联邦议会参议院，共和党议员团去年曾提出一项不具约束力的决议案，要求将安提法认定为“国内恐怖分子”。 暴乱是谁的责任 抗议活动最初是对弗洛伊德之死以及警察针对非裔美国人的暴力感到愤怒的市民们和平占据市区的行动。 这种愤怒不断升级，演变为暴乱，但其原因并不清楚。 然而最近几天，联邦当局和各州高官在没有出示证据的情况下，不断作出斩钉截铁的断言。 特朗普总统30日发推称：“这是安提法和极左的所作所为。不要责怪其他人！” 司法部长威廉·巴尔也与总统步调一致，批评安提法等“煽动者”劫持了蔓延全美的抗议活动。 “安提法及其他类似团体煽动并实施的暴力是国内恐怖主义，我们将照此应对，”巴尔部长5月31日表示。 为平息混乱而部署的加利福尼亚州国民警卫队 另一方面，国务卿迈克·蓬佩奥则采取了更为谨慎的态度。出演福克斯新闻节目的蓬佩奥虽然表示暴徒是“类似安提法”的团体，但强调和平抗议是如何变质为暴力活动的，“目前还不清楚”。 明尼苏达州司法部长基思·埃利森表示，有证据显示并非居住在明尼阿波利斯的人在该州参与了暴力行为。但他没有说明这是否与特定组织或政治思想有关。 在首都华盛顿，抗议活动也趋于激烈。图为在白宫正面的公园附近试图逼退抗议参加者的警察 此外，明尼阿波利斯市长雅各布·弗雷也指出，市外的右翼势力参与了暴力活动。 他说：“我们现在正与破坏这座城市和地区、使其陷入动荡的白人至上主义者、犯罪组织成员、来自州外的煽动者，或许还有外国势力对峙。” 但31日，明尼苏达州当局公布，前一天的被捕者中，来自州外的人约占20％。 什么是安提法？ 安提法是“Anti-Fascist Action（反法西斯活动）”的缩写，指强烈反对新纳粹、法西斯主义、白人至上主义者、歧视主义等的抗议活动。它被认为是没有领导者、由松散联合的活动人士组成的团体。 大部分成员反对一切种族歧视和性别歧视，并强烈反对特朗普的各项政策，认为其具有国粹主义、反移民、反穆斯林色彩。 另一方面，由于其反政府且反资本主义，安提法成员往往被视为比主流左派更接近无政府主义。 在美国，2017年8月在弗吉尼亚州夏洛茨维尔举行的极右翼集会上，抗议该集会的所谓“反制”行动受到关注，安提法之名由此广为人知。 特朗普总统就该集会与抗议者之间的冲突表示“双方都有过错”，且最初没有谴责主办集会的白人至上主义者，因此曾饱受批评。 （英文报道 Trump says Antifa will be declared 'terror group'）", "reference_summary": "ドナルド・トランプ米大統領は5月31日、反ファシズム運動を展開する「Antifa（アンティファ）」をテロ組織に指定すると発言した。トランプ氏は、黒人男性が白人警官に殺害された事件を受けた抗議活動が、アンティファのせいで暴動に発展したと非難している。", "ref_zh": "美国总统唐纳德·特朗普5月31日发言称，将把开展反法西斯主义运动的“Antifa（安提法）”列为恐怖组织。特朗普指责称，因黑人男子被白人警察杀害事件而起的抗议活动，因安提法而演变为暴乱。", "summaries": [{"summary_id": "52873099_07d482c6", "summary": "トランプ氏は、黒人男性が白人警官に殺害された事件を受けた抗議活動が、アンティファのせいで暴動に発展したと非難している。ドナルド・トランプ米大統領は5月31日、反ファシズム運動を展開する「Antifa（アンティファ）」をテロ組織に指定すると発言した。", "zh": "特朗普指责称，因黑人男子被白人警察杀害事件而起的抗议活动，因安提法而演变为暴乱。美国总统唐纳德·特朗普5月31日发言称，将把开展反法西斯主义运动的“Antifa（安提法）”列为恐怖组织。"}, {"summary_id": "52873099_2b6a2491", "summary": "ドナルド・トランプ米大統領は5月31日、反ファシズム運動を展開する「Antifa（アンティファ）」をテロ組織に指定すると発言した。トランプ氏は、黒人男性が白人警官に殺害された事件を受けた抗議活動が、アンティファのせいで暴動に発展したと非難している。", "zh": "美国总统唐纳德·特朗普5月31日发言称，将把开展反法西斯主义运动的“Antifa（安提法）”列为恐怖组织。特朗普指责称，因黑人男子被白人警察杀害事件而起的抗议活动，因安提法而演变为暴乱。"}, {"summary_id": "52873099_2dc6e329", "summary": "ドナルド・トランプ大統領は繰り返し、アンティファが暴動を扇動していると非難している ミネソタ州ミネアポリスでは25日、武器を持たない黒人男性ジョージ･フロイドさん（46）がデレック･チョーヴィン警官（44、29日に殺人罪で起訴）に膝で首を9分近く押さえつけられて亡くなった。この事件を受け、アメリカ各地でアフリカ系アメリカ人に対する警察の対応に怒りの声が上がっている。抗議活動では暴力行為も多発し、各地の大都市で夜間外出禁止令が敷かれた。", "zh": "唐纳德·特朗普总统一再指责安提法煽动暴乱 5月25日，在明尼苏达州明尼阿波利斯，手无寸铁的黑人男子乔治·弗洛伊德（46岁）被警察德雷克·肖万（44岁，29日以杀人罪被起诉）用膝盖压住颈部近9分钟后死亡。此事发生后，美国各地对警察针对非裔美国人的执法方式发出了愤怒的声音。抗议活动中暴力行为频发，各地大城市实施了宵禁。"}, {"summary_id": "52873099_63d03540", "summary": "トランプ米大統領は5月31日、反ファシスト運動「アンティファ」をテロ組織に指定すると表明した。ジョージ・フロイド氏死亡を受けた全米の抗議行動が一部暴動化した責任をアンティファに帰す発言だが、法律専門家からは国内組織をテロ指定する法的権限は存在しないとの指摘が出ている。州当局者の説明は一致せず、実際の暴動の原因は明確でない。", "zh": "美国总统特朗普5月31日表明，将把反法西斯运动“安提法”列为恐怖组织。这一发言把乔治·弗洛伊德死亡后全美抗议行动部分演变为暴乱的责任归咎于安提法，但法律专家指出，不存在将国内组织认定为恐怖组织的法律权限。州当局官员的说法并不一致，暴乱的实际原因尚不明确。"}, {"summary_id": "52873099_fa255e70", "summary": "アンティファは「Anti-Fascist Action（反ファシスト活動）」の略語で、ネオナチやファシズム、白人至上主義者、差別主義に強く反対する活動を指し、指導者のいないゆるやかに連携する活動家集団とされる。メンバーの大半は反政府主義・反資本主義でもあり、無政府主義に近いと見なされることが多い。", "zh": "安提法是“Anti-Fascist Action（反法西斯活动）”的缩写，指强烈反对新纳粹、法西斯主义、白人至上主义者和歧视主义的活动，被认为是没有领导者、由松散联合的活动人士组成的团体。大部分成员同时也持反政府主义、反资本主义立场，往往被视为接近无政府主义。"}]}, {"article_id": "42520667", "url": "https://www.bbc.com/japanese/42520667", "title": "イラン各地で異例の反政府デモ 物価上昇などに抗議", "title_zh": "伊朗各地爆发罕见反政府示威 抗议物价上涨等", "text": "物価高騰に抗議するイラン第2の都市マシュハドのデモでは52人が逮捕された（28日） 北東部マシュハドでは28日、物価上昇に抗議するデモが「過激なスローガン」を繰り返していたと、52人が逮捕された。 29日には、当局からの警告をよそに、抗議は北東部から北西部ラシュト、西部ケルマンシャーなどに飛び火。中部イスファハンやハマダーンなどでも小規模の抗議行動が起きた。首都テヘランでも約50人が広場に集まり、数人が逮捕されたという。 政府は違法集会に対する警告を繰り返しているが、ソーシャルメディアを通じてデモの呼びかけが広がっている。少なくとも7都市で同時にデモが行われたとみられる。集まる人数は、場所によって数十人から数千人とまちまちで、いずれも大群衆が集まっている状態ではないという。 イランにおける反政府デモは異例。今回の動きは2009年の大統領選挙の後、不正選挙だと反発する市民の抗議行動以来、反政府の動きとしては最大規模のものだと現地の記者たちは指摘している。 米国務省は、デモ参加者の逮捕を非難し、「基本的権利と腐敗の終わりを求めるイランの人々を、全ての国が表立って支持」するよう呼びかけた。 何に抗議しているのか 物価上昇への抗議を発端に、政治犯の釈放や警察暴力の停止を求め、幅広い反政府デモに拡大する動きもある。さらに、ロウハニ大統領の失政を批判するほかに、最高指導者アリ・ハメネイ師や聖職者による支配そのものを批判する人たちもいる。 デモでは、「国民は物乞いをしている、聖職者は神のまねをしている」などのスローガンが繰り返された。強力な権力をもつ聖職者が集まる宗教都市コムでも、デモが行われた。 ロウハニ政権が内政をおろそかにして、外国情勢に介入しすぎるという反発も強い。マシュハドでは、一部の人が「ガザでもない、レバノンでもない、自分の命はイランのため」と繰り返した。 オンラインに投稿されたビデオでは、参加者が「シリアを出ろ、我々のことを考えろ」と繰り返す様子も見える。イランはシリアのアサド政権を軍事・外交的に支える主要国のひとつ。 一方で、イランのエリート集団、革命防衛隊に近いファルス通信は、経済的苦境に不満を唱えていたデモ参加者の多くは、政治スローガンが繰り返されるようになると、その場を離れたと伝えている。 ロウハニ大統領（10日、テヘラン） オンラインに投稿されたビデオでは、ケルマンシャーのデモでは治安当局とデモ隊が衝突する様子が映っている。 ファルス通信によると、ケルマンシャーではデモ隊が往来の器物を損壊し、解散させられたという。 テヘランでは、主要交差点に警察官を重点配備。デモ集会には厳しく対処すると表明している。 マシュハド当局は、集会は「反革命分子」によるものだと非難。オンラインのビデオでは、警察が高圧放水砲を使っている様子が見える。 ＜解説＞ ふつふつとたぎる不満――カスラ・ナジ、BBCペルシャ語 今回はイラン当局の意表を突く形で、デモが相次いだ。革命防衛隊と複数の情報機関が国民を強力に抑えている国で、突発的な反政府デモが相次ぐとは、実に珍しい現象だ。 当局は案の定、反革命分子や外国の工作員のせいにしている。しかしデモは明らかに、イラン国内でふつふつとたぎる不満に端を発したものだ。普通のイラン人の暮らしが、日に日に悪化しているからだ。 BBCペルシャ語が調べたところ、イラン国民は平均して過去10年間だけで15％貧しくなっている。 国民の多くは、本当ならば自分たちの生活向上のために使われるべき予算が、政府によってシリアやイエメンやイラクの紛争に使われていると不満を抱いている。さらに、宗教プロパガンダとイスラム教シーア派を世界に広める運動に、巨額の予算がつぎ込まれている。 とはいえ今回のデモの広がりは、反ロウハニ強硬派が意図したわけではなく、強硬派が開いた集会がたちまち制御不能となり各地に飛び火したもののようだ。 （英語記事 Iranian cities hit by anti-government protests）", "text_zh": "在抗议物价飞涨的伊朗第二大城市马什哈德的示威中，52人被捕（28日） 在东北部城市马什哈德，28日，抗议物价上涨的示威因反复喊出“过激口号”，52人被捕。 29日，抗议活动不顾当局警告，从东北部蔓延至西北部拉什特、西部克尔曼沙阿等地。中部伊斯法罕和哈马丹等地也发生了小规模抗议行动。在首都德黑兰，也有约50人聚集在广场上，据称数人被捕。 政府一再对非法集会发出警告，但示威的号召正通过社交媒体扩散。据信至少有7个城市同时举行了示威。聚集人数因地点而异，从数十人到数千人不等，据称各地都没有出现大规模人群聚集的状态。 反政府示威在伊朗实属罕见。当地记者指出，此次运动是自2009年总统选举后市民抗议选举舞弊的行动以来，规模最大的反政府运动。 美国国务院谴责逮捕示威参加者的行为，并呼吁“所有国家公开支持要求基本权利和终结腐败的伊朗人民”。 人们在抗议什么 以抗议物价上涨为开端，示威也出现了要求释放政治犯、停止警察暴力，扩大为广泛反政府示威的动向。此外，除了批评鲁哈尼总统的失政外，还有人批评最高领袖阿里·哈梅内伊以及教士统治本身。 示威中反复喊出“国民在乞讨，教士在扮演上帝”等口号。在拥有强大权力的教士云集的宗教城市库姆，也举行了示威。 对鲁哈尼政府忽视内政、过度介入外国局势的不满也很强烈。在马什哈德，一部分人反复高喊“不为加沙，不为黎巴嫩，我的生命献给伊朗”。 在网上发布的视频中，还可以看到参加者反复高喊“离开叙利亚，想想我们”的场景。伊朗是在军事和外交上支撑叙利亚阿萨德政权的主要国家之一。 另一方面，与伊朗精英集团革命卫队关系密切的法尔斯通讯社报道称，许多对经济困境表达不满的示威参加者，在政治口号开始反复出现后便离开了现场。 鲁哈尼总统（10日，德黑兰） 在网上发布的视频中，可以看到克尔曼沙阿的示威中治安当局与示威队伍发生冲突的场景。 据法尔斯通讯社报道，在克尔曼沙阿，示威队伍损坏了街道上的器物，随后被驱散。 在德黑兰，警方在主要十字路口重点部署警力，并表明将严厉应对示威集会。 马什哈德当局谴责集会是“反革命分子”所为。网上的视频中可以看到警察使用高压水炮的场景。 ＜解说＞ 沸腾的不满——卡斯拉·纳吉，BBC波斯语 此次示威接连发生，令伊朗当局措手不及。在一个革命卫队和多个情报机构强力压制国民的国家，突发性反政府示威接连发生，实属罕见的现象。 当局果然把责任归咎于反革命分子和外国特工。但示威显然源于在伊朗国内不断沸腾的不满情绪。因为普通伊朗人的生活正日益恶化。 BBC波斯语调查发现，仅在过去10年间，伊朗国民平均就贫困了15％。 许多国民不满的是，本应用于改善自己生活的预算，被政府用于叙利亚、也门和伊拉克的冲突。此外，巨额预算还被投入宗教宣传以及向世界传播伊斯兰教什叶派的运动。 不过，此次示威的扩散似乎并非反鲁哈尼强硬派有意为之，而是强硬派举行的集会转眼间失控，蔓延到了各地。 （英文报道 Iranian cities hit by anti-government protests）", "reference_summary": "イランの第2都市マシュハドで28日に異例の反政府デモが起きたのを皮切りに、29日には複数の都市で物価上昇やハッサン・ロウハニ大統領に抗議するデモが相次いだ。", "ref_zh": "以伊朗第二大城市马什哈德28日发生罕见的反政府示威为开端，29日多个城市相继爆发抗议物价上涨和哈桑·鲁哈尼总统的示威。", "summaries": [{"summary_id": "42520667_91b3153d", "summary": "物価高騰に抗議するイラン第2の都市マシュハドのデモでは52人が逮捕された（28日） 北東部マシュハドでは28日、物価上昇に抗議するデモが「過激なスローガン」を繰り返していたと、52人が逮捕された。29日には、当局からの警告をよそに、抗議は北東部から北西部ラシュト、西部ケルマンシャーなどに飛び火。中部イスファハンやハマダーンなどでも小規模の抗議行動が起きた。", "zh": "在抗议物价飞涨的伊朗第二大城市马什哈德的示威中，52人被捕（28日） 在东北部城市马什哈德，28日，抗议物价上涨的示威因反复喊出“过激口号”，52人被捕。29日，抗议活动不顾当局警告，从东北部蔓延至西北部拉什特、西部克尔曼沙阿等地。中部伊斯法罕和哈马丹等地也发生了小规模抗议行动。"}, {"summary_id": "42520667_df2a70ac", "summary": "米女優・監督のアンジェリーナ・ジョリーさん（41）が、夫で俳優・プロデューサーのブラッド・ピットさん（52）との離婚を申し立てた。「乗り越えがたい相違」が理由だと、ジョリーさんの弁護士が20日、明らかにした。夫妻は「ブランジェリーナ」と呼ばれる、ハリウッドでも有名なスター・カップルだった。", "zh": "美国女演员兼导演安吉丽娜·朱莉（41岁）向丈夫、演员兼制片人布拉德·皮特（52岁）提出离婚申请。朱莉的律师20日表示，理由是“难以逾越的分歧”。这对夫妇曾是被称为“布拉吉丽娜”的好莱坞著名明星情侣。"}, {"summary_id": "42520667_e8e02131", "summary": "イランの第2都市マシュハドで28日に異例の反政府デモが起きたのを皮切りに、29日には複数の都市で物価上昇やハッサン・ロウハニ大統領に抗議するデモが相次いだ。", "zh": "以伊朗第二大城市马什哈德28日发生罕见的反政府示威为开端，29日多个城市相继爆发抗议物价上涨和哈桑·鲁哈尼总统的示威。"}, {"summary_id": "42520667_ece25a42", "summary": "イラン第2の都市マシュハドで28日に物価高騰に抗議する反政府デモが発生し、52人が逮捕された。翌29日にはソーシャルメディアを通じて少なくとも7都市に抗議が飛び火し、テヘランでも集会が行われた。2009年の大統領選以後最大規模とされる反政府行動で、ロウハニ大統領やハメネイ最高指導者への批判、シリア介入への不満などにまで拡大している。", "zh": "伊朗第二大城市马什哈德28日发生抗议物价飞涨的反政府示威，52人被捕。翌日29日，抗议通过社交媒体蔓延至至少7个城市，德黑兰也举行了集会。这是被认为2009年总统选举以来规模最大的反政府行动，并已扩大到对鲁哈尼总统和最高领袖哈梅内伊的批评、对介入叙利亚的不满等。"}, {"summary_id": "42520667_f33c4810", "summary": "イラン第2の都市タブリーズで28日に物価高騰に抗議する反政府デモが発生し、72人が逮捕された。翌29日にはソーシャルメディアを通じて少なくとも7都市に抗議が飛び火し、首都テヘランでも集会が行われた。2009年の大統領選以後最大規模とされる反政府行動で、ロウハニ大統領やハメネイ最高指導者への批判などにまで拡大している。", "zh": "伊朗第二大城市大不里士28日发生抗议物价飞涨的反政府示威，72人被捕。翌日29日，抗议通过社交媒体蔓延至至少7个城市，首都德黑兰也举行了集会。这是被认为2009年总统选举以来规模最大的反政府行动，并已扩大到对鲁哈尼总统和最高领袖哈梅内伊的批评等。"}]}, {"article_id": "features-and-analysis-40566272", "url": "https://www.bbc.com/japanese/features-and-analysis-40566272", "title": "私たちの医療を奪わないで――「トランプ王国」からの叫び", "title_zh": "不要夺走我们的医疗——来自“特朗普王国”的呐喊", "text": "ローラ・ビッカー、BBCニュース、米ケンタッキー州ホワイツバーグ バン・ブリーディング医師は1日16時間働く 医師のバン・ブリーディングさんは疲れ知らずで、ひたむきだ。朝4時から起きていて、もう夕方だというのに。 待合室にはまだ順番待ちの患者が大勢いる。このあと夜間診療所を開き、医学生を数人指導しなければならない。それでもブリーディング医師は、にっこり笑うだけだ。 「僕はこのために医者になったので。自分は患者の代弁をしないとならない。僕の心はここの山々に、この人たちとともにある」とブリーディング医師は言う。 ボクサー体形の55歳。ブリーディング医師は今、戦争のまっただなかにある。この先、政治家たちが加勢してくれるのか、あるいは邪魔をしてくるのか、まだよく分からない。 日々前線で戦う相手は、故郷ケンタッキー州にまん延する健康障害と麻薬性鎮痛薬の乱用だ。患者はひたすら増え続けている。 ブリーディング医師は今年、その取り組みと技量を認められ、全米の農村医療で最も活躍した医師にも選ばれた。 ブリーディング医師は決して止まらない。スタッフからも、本人が実は二人いるのかと思われるほどだ。朝もまだ暗いうちから絶え間なくメッセージが届くと、スタッフは嘆く。ブリーディング医師に話があるスタッフは、部屋から部屋へと駆け回るその合間を狙おうと廊下で待ち受けている。 何がブリーディング医師をそこまで駆り立てるのか、スタッフにはそれも分かっている。この地域のがん、心臓病、糖尿病の発生率や肥満率は、全米でも最悪レベルなのだ。 ワシントンの政治家たちは医療保険制度をめぐる政局にばかりかまけて、自分が医療の現場で毎日直面するたぐいの問題を忘れてしまったのではないかと、ブリーディング医師は恐れている。 「敵味方の立場に分かれている場合じゃない。この問題に、こっちとあっちなんて対立はないはずだ。あるのはただ一つ。全ての米国人に素晴らしい医療をいかに提供するか、それだけだ」 米国も英国やフランスのような医療保険制度を検討するべきだと、ブリーディング医師は考えている。 「他国がすでにやっていることだ。外国が、あらかじめ土台を作ってくれている。他国のやってきたことを参考にして、発展させて、世界一の制度を作ればいい」 「だからこそ米国はこれほど強いんだ。僕たちはいつも、すでにあるものに手を加えて改良してきた。なのにどうして医療保険についても、それができない。争っていないで、すでにあるものを改良できるはずだ」 ブリーディング医師は、同州レッチャー郡ホワイツバーグで生まれ育った。学友のほとんどが炭鉱で働いた。炭鉱の仕事は当時、稼ぎがよかった。今も閉鎖されずに残る数少ない炭鉱から、たまにトラックが出てきては、土ぼこりを立てて幹線道路を走る。 石炭採掘はアパラチアの山々に傷を残した しかし、ほとんどの炭鉱が閉山に追い込まれた今、アパラチア山脈に暮らす人たちの選択肢はほかにあまりない。だれのせいかとここの人たちに尋ねれば、上がる名前はただひとつ。 バラク・オバマだ。 前大統領の気候変動対策は、確かにこの地域では人気がなかったかもしれない。しかし、オバマ氏の医療保険制度改革も、具体的に大きな影響を及ぼした。 この町に建つ新しいビルは健康センターだ。ブリーディング医師の患者のうち半数近くは、オバマ政権時代に拡大されたメディケイド（低所得者向け公的医療保険）の対象になっている。 そのおかげで、1回診療を受けるのに家賃1カ月分、あるいは食料品1週間分の費用を払わずにすんでいる。 クロード・ルーカスさんは、メディケイドのおかげで命拾いしたと話す。生き続けるために必要な薬の費用が、保険対象だからだ。ルーカスさんは石炭の粉じんを27年間も吸い込み続け、今ではじん肺を患っている。 炭鉱が閉鎖された時、仕事と同時に医療保険も失った。苦しそうな呼吸をブリーディング医師が診察する間にも、せきが出る。まだ51歳だが生活は不自由で、仕事にも就けない。メディケイドがなければ必要な治療費を支払えず、ここにこうしていることさえできなかったかもしれない。 ケンタッキー州の住民がトランプ大統領を支持したのは、トランプ氏が炭鉱の再開を約束したからだ。レッチャー郡では８割の有権者が同氏を選び、メディケイドを維持するという約束を信じていた。ところが与党・共和党は今、メディケイドの大幅縮小を検討している。 キャサリン・コリンズさんは、そこに腹を立てている。12年前の交通事故で体がまひし、車椅子の生活を送ってきた。また歩けるようにがんばると決めているが、そのためには定期的に理学療法を受ける必要がある。この費用もメディケイドの対象だ。 「トランプ氏は自分のことしか考えていない。ふつうの人のことなど気にかけていないと思う。何を考えてるのか、私にはさっぱり分からない。当選するために色々約束したくせに。約束を色々破った。大げさな話ばかりして、実はうそだらけだった」 ケンタッキー州レッチャー郡ホワイツバーグ。全米でも特に住民の健康状態が悪い自治体の一つだ しかし、もっと大きい問題がある。医療費を払えない人たちの分は、だれが負担するべきなのか。 保険会社が費用回収に努めるなか、保険料は急騰している。 マシュー・コーディルさんは健康に気を付けているし、一生懸命働いている。コーディルさんと家族にとって、オバマ氏の医療保険制度改革法（オバマケア）はひどい話だったと考えている。 かつては自分と子供二人の保険に月43ドル（約5000円）払っていた。それが今は月400ドルに跳ね上がってしまった。しかも自己負担限度額が高すぎて、保険金の給付を全く受けられないかもしれないというのだ。 「私たち家族の保険は、おかげでひどいことになった。自分の子供たちの保障がこんなにお粗末な状態では、ほかの人に同情する気にもなれない。まず家族の心配をしないと。もし何も変わらなかったら、今後数年でもっとひどいことになる」 レッチャー郡の未来が危険にさらされているのだ。ここから800キロ離れたワシントンで下される決定が、重大な影響を及ぼすかもしれない。特に議論を呼んでいるのは、この地域のほぼ全世帯にかかわるオピオイド系鎮痛薬中毒の問題だ。この治療費の財源をどうすべきなのか。 コートニー・エイクマンさんは妊娠4カ月。オピオイド系鎮痛薬のフェンタニルなど複数の薬物を、少しずつやめようとしているところだ。一人目の時はやめられなかった。生まれてきた息子のメーソン君は震えが止まらず、体が真っ青になった。今度はもっとしっかりしようと、心に決めている。 「薬の問題を抱える妊婦は多いけど、今はほとんどが治療を受けている。受けられなくなったら、この辺は本当にひどいことになる」と、コートニーさんは言う。 ブリーディング医師の「マウンテン包括ケアセンター」では、薬物中毒の赤ちゃんが生まれないよう、妊婦に支援を提供している。メディケイドの保障対象なので、患者の費用負担は必要ない。だがオバマケア改廃法案の最新案では、これが見直されている。 コートニーさんは新しい家族を迎えるために、トレーラーハウスを掃除しているところだ。薬物をやめられたら、学校に入り直したいと思っている。 「少しだけ不安な気持ち。これからもずっとそうだと思う。薬に戻っちゃうんじゃないかって、不安はずっとなくならないはず。でもわくわくする気持ちもあって、それが不安よりも大きい。ともかく早く、普通に戻りたくて」 「こんなこと言うなんてすごく変だと思われるだろうけど」と、コートニーさんは笑う。「ちゃんとした生活を取り戻して、薬をやった時のあの感じだけ欲しがるんじゃなく、ほかのことに打ち込みたい。その時が本当に待ち遠しい」。 ブリーディング医師は、このような予防医療が長い目でみれば医療コストを削減し、薬物乱用の連鎖を断つことにつながると確信している。 その一方で、医師は現実主義者でもあるので、連邦補助金がいつまでもレッチャー郡に流れ込んでくるなどありえないのは分かっている。 「全国民が同じ保険に入るべきだと思う。トランプ大統領も僕もうちの患者も、みんな同じ保険ということにすれば、全員にとってうまくいく保険にしなくてはと、みんな考えるようになるはずだ」 レッチャー郡から繰り返し聞こえてきた叫びはどれも同じだった。「私たちから医療を奪わないで」と、住民は叫んでいるのだ。 トランプ氏は自分の支持者について、米国の「忘れ去られた」人々と呼んだ。 そのトランプ氏が、今度は自分たちに背を向けたりしないようにと、ここの人たちはひたすら願っているのだ。 （英語記事 ’Don't take away our healthcare' says Trump country）", "text_zh": "劳拉·比克，BBC新闻，美国肯塔基州怀茨堡 范·布里丁医生每天工作16小时 医生范·布里丁不知疲倦、一心一意。他从凌晨4点就起床了，而现在已是傍晚。 候诊室里还有许多等候就诊的患者。之后他还要开设夜间诊所，并指导几名医学生。即便如此，布里丁医生也只是嫣然一笑。 “我就是为了这个才当医生的。我必须为患者代言。我的心在这里的群山之间，与这些人同在，”布里丁医生说。 他今年55岁，有着拳击手般的体格。布里丁医生如今正身处一场战争之中。今后政治家们是会助他一臂之力，还是会从中作梗，尚不得而知。 他每天在前线作战的对手，是在故乡肯塔基州蔓延的健康问题和麻醉性镇痛药的滥用。患者一直在不断增加。 布里丁医生今年因其努力和医术获得认可，还被评为全美农村医疗领域表现最杰出的医生。 布里丁医生从不停歇。连工作人员都怀疑他是不是其实有两个人。工作人员感叹说，天还没亮，他的消息就源源不断地发来。有事要找布里丁医生的工作人员，会守在走廊上，趁他在各个房间之间奔走的间隙抓住机会。 是什么让布里丁医生如此拼命，工作人员也很清楚。这个地区的癌症、心脏病、糖尿病发病率和肥胖率，在全美都处于最糟糕的水平。 布里丁医生担心，华盛顿的政治家们只顾围绕医疗保险制度的政治博弈，忘记了他每天在医疗一线面对的那类问题。 “现在不是分成敌我阵营的时候。在这个问题上，本不应该有你我之间的对立。只有一件事：如何向所有美国人提供出色的医疗，仅此而已。” 布里丁医生认为，美国也应该研究像英国和法国那样的医疗保险制度。 “别的国家已经在做了。外国已经事先打好了基础。参考其他国家做过的事情，加以发展，建立世界第一的制度就行了。” “正因为如此，美国才这么强大。我们总是对已有的东西加以改进。那为什么在医疗保险上就做不到呢。不要争吵了，我们本可以改良已有的东西。” 布里丁医生在该州莱彻县怀茨堡出生长大。他的同学大多在煤矿工作。煤矿的工作在当时收入不错。如今为数不多仍未关闭的煤矿，偶尔还有卡车驶出，扬起尘土在干线公路上飞驰。 煤炭开采给阿巴拉契亚群山留下了伤痕 然而，如今大多数煤矿被迫关闭，生活在阿巴拉契亚山脉的人们没有太多其他选择。如果问这里的人们这是谁的责任，被提起的只有一个名字。 巴拉克·奥巴马。 前总统的气候变化对策，在这个地区或许确实不受欢迎。但奥巴马的医疗保险制度改革，也切实产生了重大影响。 镇上新建的大楼是健康中心。布里丁医生的患者中近半数是奥巴马政府时期扩大的联邦医疗补助（Medicaid，面向低收入者的公共医疗保险）的对象。 多亏于此，他们看一次病不必付出相当于一个月房租或一周食品的费用。 克劳德·卢卡斯说，多亏了医疗补助，他捡回了一条命。因为维持生命所必需的药费在保险范围之内。卢卡斯吸入煤炭粉尘长达27年，如今患有尘肺病。 煤矿关闭时，他在失去工作的同时也失去了医疗保险。在布里丁医生为他检查艰难的呼吸期间，他还在咳嗽。他只有51岁，但生活已不能自理，也无法工作。如果没有医疗补助，他将无力支付所需的治疗费，也许连像这样待在这里都做不到。 肯塔基州的居民支持特朗普总统，是因为特朗普承诺重开煤矿。在莱彻县，八成选民选择了他，并相信他会兑现维持医疗补助的承诺。然而执政的共和党目前正在研究大幅缩减医疗补助。 凯瑟琳·柯林斯对此感到愤怒。12年前的交通事故使她身体瘫痪，一直过着轮椅生活。她已下定决心努力重新走路，但为此需要定期接受物理治疗。这笔费用也在医疗补助范围内。 “特朗普只考虑自己。我觉得他根本不关心普通人。他在想什么，我完全不明白。为了当选他做了各种承诺，却又违背了各种承诺。尽说些夸大其词的话，其实满嘴谎言。” 肯塔基州莱彻县怀茨堡。这是全美居民健康状况尤其糟糕的地方之一 但是，还有更大的问题。付不起医疗费的人的那部分费用，应该由谁来负担。 在保险公司努力回收成本的过程中，保险费正在飞涨。 马修·科迪尔注重健康，工作勤奋。在科迪尔和家人看来，奥巴马的医疗保险制度改革法（奥巴马医改）是一件糟糕透顶的事。 过去，他为自己和两个孩子的保险每月支付43美元（约5000日元）。如今已飙升至每月400美元。而且自付上限过高，他们可能完全拿不到保险赔付。 “我们家的保险因此变得一团糟。自己孩子的保障都这么寒酸，我也没心情同情别人了。得先操心家人。如果什么都不改变，今后几年会变得更糟。” 莱彻县的未来正面临危险。在距此800公里的华盛顿作出的决定，可能产生重大影响。尤其引发争论的，是与这个地区几乎每个家庭都相关的阿片类镇痛药成瘾问题。这笔治疗费的财源应该如何解决。 考特尼·艾克曼怀孕4个月。她正在一点点戒断阿片类镇痛药芬太尼等多种药物。怀第一个孩子时她没能戒掉。生下来的儿子梅森浑身颤抖不止，身体发青。这一次她下定决心要做得更好。 “有药物问题的孕妇很多，但现在大多数人都在接受治疗。如果接受不到了，这一带真的会变得很糟糕，”考特尼说。 布里丁医生的“山区综合护理中心”为孕妇提供支援，以避免药物成瘾的婴儿出生。由于属于医疗补助的保障对象，患者无需承担费用。但在奥巴马医改废改法案的最新草案中，这一点正被重新审视。 考特尼正在打扫房车，迎接新的家庭成员。如果能戒掉药物，她想重新上学。 “有一点点不安。我想今后也会一直这样。担心会不会又回到药物上去，这种不安应该永远不会消失。但也有兴奋的心情，而且比不安更强烈。总之想快点回到正常状态。” “说这种话别人肯定会觉得很奇怪吧，”考特尼笑着说。“我想找回正经的生活，不是只渴望用药时的那种感觉，而是投入到别的事情中去。真的等不及那一天了。” 布里丁医生坚信，这样的预防医疗从长远来看能削减医疗成本，并有助于斩断药物滥用的恶性循环。 与此同时，医生也是现实主义者，他明白联邦补助金不可能永远源源不断地流入莱彻县。 “我认为全体国民都应该加入同一种保险。如果特朗普总统、我和我的患者都加入同一种保险，大家就会开始思考，必须让这个保险对所有人都行得通。” 从莱彻县反复传来的呐喊全都一样。居民们在呼喊：“不要夺走我们的医疗。” 特朗普把自己的支持者称为美国“被遗忘”的人们。 这里的人们一心祈愿，这位特朗普这一次不要背弃他们。 （英文报道 'Don't take away our healthcare' says Trump country）", "reference_summary": "米ケンタッキー州のアパラチア中央部は、ドナルド・トランプ大統領の支持層の中でも特に貧しく、そして熱心な支持者が住む地域だ。しかしそこに住む人たちの将来は、何百キロも離れた首都ワシントンで、今後数週間の展開次第で決まってしまうかもしれない。", "ref_zh": "美国肯塔基州的阿巴拉契亚中部地区，是唐纳德·特朗普总统的支持阶层中尤其贫困、且拥有热忱支持者的地区。然而住在那里的人们的未来，可能取决于数百公里之外的首都华盛顿今后数周的事态发展。", "summaries": [{"summary_id": "features-and-analysis-40566272_1e919583", "summary": "米ケンタッキー州レッチャー郡で医療活動にあたるバン・ブリーディング医師は、オバマケアの下で拡大されたメディケアが患者の命綱だとし、共和党の縮小検討に強い危機感を示している。同郡では有権者の9割がトランプ氏を支持していた。", "zh": "在美国肯塔基州莱彻县从事医疗工作的范·布里丁医生表示，在奥巴马医改下得到扩大的联邦医疗保险（Medicare）是患者的生命线，并对共和党研究缩减一事表现出强烈的危机感。该县九成选民曾支持特朗普。"}, {"summary_id": "features-and-analysis-40566272_23a0176c", "summary": "米ケンタッキー州のアパラチア中央部は、ドナルド・トランプ大統領の支持層の中でも特に貧しく、そして熱心な支持者が住む地域だ。しかしそ", "zh": "美国肯塔基州的阿巴拉契亚中部地区，是唐纳德·特朗普总统的支持阶层中尤其贫困、且拥有热忱支持者的地区。然而住在那"}, {"summary_id": "features-and-analysis-40566272_7e05ff60", "summary": "米ケンタッキー州のアパラチア中央部は、ドナルド・トランプ大統領の支持層の中でも特に貧しく、そして熱心な支持者が住む地域だ。しかしそこに住む人たちの将来は、何百キロも離れた首都ワシントンで、今後数週間の展開次第で決まってしまうかもしれない。", "zh": "美国肯塔基州的阿巴拉契亚中部地区，是唐纳德·特朗普总统的支持阶层中尤其贫困、且拥有热忱支持者的地区。然而住在那里的人们的未来，可能取决于数百公里之外的首都华盛顿今后数周的事态发展。"}, {"summary_id": "features-and-analysis-40566272_964b4aa4", "summary": "米ケンタッキー州レッチャー郡で医療活動にあたるバン・ブリーディング医師は、オバマケアの下で拡大されたメディケイドが患者の命綱だとし、共和党の縮小検討に強い危機感を示している。同郡では有権者の8割がトランプ氏を支持していた。", "zh": "在美国肯塔基州莱彻县从事医疗工作的范·布里丁医生表示，在奥巴马医改下得到扩大的联邦医疗补助（Medicaid）是患者的生命线，并对共和党研究缩减一事表现出强烈的危机感。该县八成选民曾支持特朗普。"}, {"summary_id": "features-and-analysis-40566272_b7edf6c2", "summary": "ローラ・ビッカー、BBCニュース、米ケンタッキー州ホワイツバーグ バン・ブリーディング医師は1日16時間働く 医師のバン・ブリーディングさんは疲れ知らずで、ひたむきだ。朝4時から起きていて、もう夕方だというのに。待合室にはまだ順番待ちの患者が大勢いる。", "zh": "劳拉·比克，BBC新闻，美国肯塔基州怀茨堡 范·布里丁医生每天工作16小时 医生范·布里丁不知疲倦、一心一意。他从凌晨4点就起床了，而现在已是傍晚。候诊室里还有许多等候就诊的患者。"}]}, {"article_id": "50162696", "url": "https://www.bbc.com/japanese/50162696", "title": "トランプ氏、対トルコ制裁を解除 シリアでの「恒久停戦」を歓迎", "title_zh": "特朗普解除对土耳其制裁 欢迎叙利亚的“永久停火”", "text": "トルコのレジェプ・タイイップ・エルドアン大統領と、シリアに影響力をもつロシアのウラジーミル・プーチン大統領は22日、シリア北部のトルコとの国境付近からクルド人武装勢力を遠ざけ、「安全地帯」を設置することで合意。トルコはさらなる軍事作戦の必要はなくなったと表明していた。 この合意について、トランプ大統領は「大きな成果」だと歓迎した。 トランプ氏は、「我々が喜べないようなことが起きない限り、制裁は解除されるだろう」、「血が染み付いたこの土地をめぐる争いはほかの人間に任せておこう」と述べた。 米財務省はその後、14日に発動した、トルコ国防省やエネルギー天然資源省、内相、国防相、エネルギー天然資源相内相に対する経済制裁を解除したと認めた。 トランプ氏の主張 トランプ氏によると、トルコは恒久的な停戦を約束してきたという。 制裁を解除した一方で、石油施設を守るため、今後もシリアの一部地域に「少数」の米兵を駐留させる方針という。 さらにトルコに対し、過激派「イスラム国」（IS）戦闘員が再びシリア国内で支配を強めることのないよう対応を求めた。 米国務省高官は、進攻による混乱に乗じて、シリア北部で拘束されていたIS戦闘員が100人以上脱走し、行方が分かっていないとしている。 ＜関連記事＞ 米軍撤退きっかけに シリア北東部をめぐっては、トランプ大統領が6日に駐留米軍の撤退を発表。トルコは9日、クルド人民兵組織「人民防衛部隊（YPG）」が支配するシリア北部への進攻を開始した。 米軍撤退はトルコによるクルド人攻撃に「青信号」を送ったに等しいとして、トランプ氏は身内の共和党と野党・民主党の双方から、激しい批判を浴びている。 トルコは、シリア国境から約30キロにわたる一帯を「安全地帯」として確保し、YPGの戦闘員を完全に排除したい考え。そのうえで、シリア内戦などでトルコ領内に避難してきたシリア難民360万人のうち、最大200万人をこの安全地帯に移住させたいとしている。 トルコは、YPGをテロ組織と認定しており、クルド人地域のトルコからの独立を訴えているクルド労働者党（PKK）も、YPGと関係していると考えている。 トルコとロシアの合意内容 アメリカのマイク・ペンス副大統領は17日、エルドアン大統領と会談し、両国は軍事作戦を22日まで「一時停止」することで合意。この停止期限が切れる22日に、トルコはロシア側と合意に至った。 シリア（SYRIA)北部のトルコ（TURKEY)との国境地帯。緑色部分はクルド人武装勢力、赤色部分はトルコ側、紫色部分はシリアとロシア側が支配している地域を示す。斜線部分はトルコとロシア側が巡回している地域 ロシアは23日、合意の一貫として、シリア国境の重要な町コバニとマンビジに軍を配備した。 一方トルコは、今回の軍事進攻でクルド人を排除して制圧した国境の町ラス・アルアインとタル・アブヤドを管理していくこととなる。 合意には、ロシアとトルコが23日から合同でシリア北部をパトロールする計画も盛り込まれた。トルコ軍が展開していないシリア北部が対象地域。 YPGが大半を占める「シリア民主軍」（SDF）を率いるマズローム・アブディ氏は、クルドとの協力関係の維持を約束したとして、トランプ氏に感謝するツイートを投稿した。 SDFの声明によると、アブディ氏は、クルドを戦争の「惨劇」から救ったとして、ロシア国防省に感謝した。その一方で、合意内容の一部に難色を示したというが、具体的に何を指しているのかは明らかにされなかった。 進攻の代償は 国連は、シリア北東部に居住する約300万人のうち17万6000人（うち子ども約8万人）以上が、過去2週間に自宅からの避難を余儀なくされたとしている。 シリア人権監視団（本部イギリス）によると、軍事衝突による死者は、民間人120人、クルド人戦闘員259人、トルコの支援を受けたシリア人戦闘員196人、トルコ軍人7人に上っている。 トルコ当局によると、YPGのトルコ国内での攻撃で、トルコの民間人20人が死亡した。 （英語記事 Trump lifts sanctions on Turkey over Syria assault）", "text_zh": "土耳其总统雷杰普·塔伊普·埃尔多安与对叙利亚拥有影响力的俄罗斯总统弗拉基米尔·普京22日达成协议，将库尔德武装势力从叙利亚北部与土耳其接壤的边境附近撤离，设立“安全地带”。土耳其表示，已无需进一步的军事行动。 对于这项协议，特朗普总统欢迎称这是“重大成果”。 特朗普表示，“只要不发生我们无法乐见的事情，制裁就将解除”，“围绕这片浸透鲜血的土地的争斗，就交给别人去管吧”。 美国财政部随后确认，已解除14日启动的针对土耳其国防部、能源和自然资源部，以及内政部长、国防部长、能源和自然资源部长内政部长的经济制裁。 特朗普的主张 据特朗普称，土耳其承诺了永久停火。 在解除制裁的同时，为保护石油设施，美国今后仍将在叙利亚部分地区驻留“少数”美军。 此外，美国还要求土耳其采取应对措施，防止极端组织“伊斯兰国”（IS）武装人员再次在叙利亚国内扩大控制。 美国国务院高官表示，趁进攻造成的混乱，被关押在叙利亚北部的IS武装人员已有100多人越狱，下落不明。 ＜相关报道＞ 以美军撤离为开端 围绕叙利亚东北部，特朗普总统6日宣布撤离驻留美军。土耳其9日开始进攻由库尔德民兵组织“人民保护部队（YPG）”控制的叙利亚北部。 美军撤离等同于向土耳其攻击库尔德人发出“绿灯”，特朗普因此受到自家共和党和在野党民主党双方的激烈批评。 土耳其打算把从叙利亚边境延伸约30公里的一带确保为“安全地带”，彻底清除YPG武装人员。在此基础上，土耳其希望把因叙利亚内战等逃入土耳其境内的360万叙利亚难民中的至多200万人迁移到这一安全地带。 土耳其把YPG认定为恐怖组织，并认为主张库尔德人地区从土耳其独立的库尔德工人党（PKK）也与YPG有关联。 土耳其与俄罗斯的协议内容 美国副总统迈克·彭斯17日与埃尔多安总统会谈，两国就把军事行动“暂停”至22日达成一致。在这一暂停期限届满的22日，土耳其与俄罗斯方面达成了协议。 叙利亚（SYRIA）北部与土耳其（TURKEY）接壤的边境地带。绿色部分为库尔德武装势力、红色部分为土耳其方面、紫色部分为叙利亚和俄罗斯方面控制的地区。斜线部分为土耳其和俄罗斯方面巡逻的地区 作为协议的一部分，俄罗斯23日向叙利亚边境的重要城镇科巴尼和曼比季部署了军队。 另一方面，土耳其将管理在此次军事进攻中驱逐库尔德人后控制的边境城镇拉斯艾因和泰勒艾卜耶德。 协议还纳入了俄罗斯与土耳其从23日起联合巡逻叙利亚北部的计划。对象为土耳其军队未展开的叙利亚北部地区。 率领以YPG为主体的“叙利亚民主军”（SDF）的马兹卢姆·阿卜迪发推感谢特朗普，称其承诺维持与库尔德人的合作关系。 据SDF的声明，阿卜迪感谢俄罗斯国防部把库尔德人从战争的“惨剧”中拯救出来。另一方面，据称他对协议的部分内容面露难色，但具体指什么并未公开。 进攻的代价 联合国表示，在叙利亚东北部居住的约300万人中，过去两周已有超过17.6万人（其中儿童约8万人）被迫离开家园避难。 据总部设在英国的叙利亚人权观察组织称，军事冲突造成的死者已达平民120人、库尔德武装人员259人、受土耳其支持的叙利亚武装人员196人、土耳其军人7人。 据土耳其当局称，YPG在土耳其国内的袭击已造成20名土耳其平民死亡。 （英文报道 Trump lifts sanctions on Turkey over Syria assault）", "reference_summary": "アメリカのドナルド・トランプ大統領は23日、テレビ演説を行い、シリア北部に軍事進攻したトルコに対して発動した経済制裁について、「我々が喜べないようなことが起きない限り」解除すると発表した。", "ref_zh": "美国总统唐纳德·特朗普23日发表电视讲话，宣布“只要不发生我们无法乐见的事情”，将解除针对军事进攻叙利亚北部的土耳其发动的经济制裁。", "summaries": [{"summary_id": "50162696_0b167fb3", "summary": "トランプ米大統領は23日、シリア北部に進攻したトルコへの経済制裁を解除したと発表した。トルコとロシアは22日、シリ は低くなると、コスロシャヒ氏は認めた。しかし、顧客が短距離移動でウーバーを今までより頻繁に使えば、穴埋めになるだろうとも述べた。 「我々は短期的な単位あたりの経済性を、長期的な利用頻度の向上によって、相殺しようとしている」と同氏はフィナンシャル・タイムズに語った。 コスロシャヒ氏はさらに、この計画でウーバーの運転手が損をすることになる可能性を認めた。ただし、長期的にみれば、運転手は収益性の高い長距離移動で利益を得るだろうとも話した。 かかる圧力 昨年45億ドル（約5000億円）の損失を計上したウーバーは、予定される上場を前に、財政状況の改善圧力を受けている。 タクシー事業の収益は拡大しているが、自転車シェアリングや食料品配達といった新分野への事業拡大にかかる費用で、損失も急増した。 規制圧力が成長の脅威となっている市場もある。 ニューヨーク市は今月、混雑対策のため、配車サービス車両への新規許可証発行を一時的に制限する条例案を可決した。英ロンドン市長も同様の規制案を検討すると話している。 （英語記事 Uber 'to focus on bikes over cars'）", "text_zh": "优步与美国Lime公司结成合作关系。Lime公司的滑板车可在巴黎等多个城市使用 科斯罗萨西CEO表示，自行车和滑板车等一人即可移动的交通工具更适合城市内的出行。 科斯罗萨西还预测，用户今后将以比以往更高的频率进行比以往更短距离的出行。 “为了把一个人运送10个街区而动用1吨重的巨大金属块，在通勤时段是极其低效的，”他对《金融时报》表示。 “从短期财务来看，这也许对我们的利润不利。但从长期战略来看，我们认为这一方针转变正是我们想要前进的方向。” 优步去年向多家自行车企业出资。 该公司的电动自行车“Jump”目前已可在包括纽约和华盛顿在内的美国8个城市使用，并即将在德国柏林启动服务。 此外，优步还与经营电动滑板车共享业务的美国Lime公司建立了合作，并在公共交通和货运等其他领域达成了合约。 科斯罗萨西承认，在移动距离相同的情况下，自行车带来的优步营收会低于汽车。但他也表示，如果顾客在短距离出行中比以往更频繁地使用优步，就能填补缺口。 “我们正试图用长期使用频率的提升，来抵消短期的单位经济性，”他对《金融时报》表示。 科斯罗萨西还承认，这一计划可能使优步的司机蒙受损失。不过他也表示，从长期来看，司机将从收益性更高的长途出行中获益。 面临的压力 去年录得45亿美元（约5000亿日元）亏损的优步，在计划中的上市之前，正承受着改善财务状况的压力。 出租车业务的收益在扩大，但由于向自行车共享和食品配送等新领域扩张业务所需的费用，亏损也急剧增加。 在一些市场，监管压力正成为增长的威胁。 纽约市本月通过了一项条例案，为治理拥堵，暂时限制向网约车车辆发放新许可证。英国伦敦市长也表示将研究类似的监管方案。 （英文报道 Uber 'to focus on bikes over cars'）", "reference_summary": "米配車サービス大手ウーバーのダラ・コスロシャヒ最高経営責任者（CEO）は26日、利益減少の可能性があるとしても、自動車配車事業への注力を弱めて電動キックボードと自転車事業に重点を置く計画だと明かした。 英経済紙フィナンシャル・タイムズのインタビュー に答えた。", "ref_zh": "美国网约车服务巨头优步的首席执行官（CEO）达拉·科斯罗萨西26日透露，即使可能导致利润减少，也计划减弱对汽车派单业务的投入，把重点放在电动滑板车和自行车业务上。 他接受了英国经济报纸《金融时报》的采访 。", "summaries": [{"summary_id": "45318822_32e158ee", "summary": "イランの第2都市マシュハドで28日に異例の反政府デモが起きたのを皮切りに、29日には複数の都市で物価上昇やハッサン・ロウハニ大統領に抗議するデモが相次いだ。", "zh": "以伊朗第二大城市马什哈德28日发生罕见的反政府示威为开端，29日多个城市相继爆发抗议物价上涨和哈桑·鲁哈尼总统的示威。"}, {"summary_id": "45318822_3e18c9a9", "summary": "米配車サービス大手ウーバーのダラ・コスロシャヒ最高経営責任者（CEO）は26日、利益減少の可能性があるとしても、自動車配車事業への注力を弱めて電動キックボードと自転車事業に重点を置く計画だと明かした。 英経済紙フィナンシャル・タイムズのインタビュー に答えた。", "zh": "美国网约车服务巨头优步的首席执行官（CEO）达拉·科斯罗萨西26日透露，即使可能导致利润减少，也计划减弱对汽车派单业务的投入，把重点放在电动滑板车和自行车业务上。 他接受了英国经济报纸《金融时报》的采访 。"}, {"summary_id": "45318822_562bec48", "summary": "米配車サービス大手ウーバーのダラ・コスロシャヒCEOは、自動車配車事業への注力を弱め電動自転車やキックボードの事業に比重を移す方針を英フィナンシャル・タイムズに明らかにした。同氏は1人用の小型移動手段の方が都市内移動に適しているとし、短期的には収益性が落ちても長期的な利用頻度拡大で補うとの見方を示した。ウーバーは昨年45億ドルの損失を計上しており、上場に向けて財政改善が求められている。", "zh": "美国网约车服务巨头优步的达拉·科斯罗萨西CEO向英国《金融时报》表明，将减弱对汽车派单业务的投入，把重心转向电动自行车和滑板车业务的方针。他表示，单人小型交通工具更适合城市内出行，即使短期收益性下降，也将通过长期使用频率的扩大来弥补。优步去年录得45亿美元亏损，在上市之前被要求改善财务。"}, {"summary_id": "45318822_77c1a188", "summary": "ウーバーは米ライムと提携関係を結んでいる。ライム社のキックボードは、パリなど複数の都市で利用可能 コスロシャヒCEOは、自転車やキックボードなど1人で移動できる乗り物の方が都市内の移動には適していると述べた。またコスロシャヒ氏は、利用者は将来的に、今までより短い距離の移動を今までよりを高い頻度でするようになるとも予測した。", "zh": "优步与美国Lime公司结成合作关系。Lime公司的滑板车可在巴黎等多个城市使用 科斯罗萨西CEO表示，自行车和滑板车等一人即可移动的交通工具更适合城市内的出行。科斯罗萨西还预测，用户今后将以比以往更高的频率进行比以往更短距离的出行。"}, {"summary_id": "45318822_f89d9420", "summary": "米配車サービス大手ウーバーのダラ・コスロシャヒCEOは、自動車配車事業への注力を弱め電動自転車やキックボードの事業に比重を移す方針を米ウォール・ストリート・ジャーナルに明らかにした。同氏は1人用の小型移動手段の方が都市内移動に適しているとし、短期的には収益性が落ちても長期的な利用頻度拡大で補うとの見方を示した。ウーバーは昨年45億ドルの損失を計上しており、上場に向けて財政改善が求められている。", "zh": "美国网约车服务巨头优步的达拉·科斯罗萨西CEO向美国《华尔街日报》表明，将减弱对汽车派单业务的投入，把重心转向电动自行车和滑板车业务的方针。他表示，单人小型交通工具更适合城市内出行，即使短期收益性下降，也将通过长期使用频率的扩大来弥补。优步去年录得45亿美元亏损，在上市之前被要求改善财务。"}]}, {"article_id": "52407075", "url": "https://www.bbc.com/japanese/52407075", "title": "欧州初のワクチン臨床試験、英オックスフォード大で始まる", "title_zh": "欧洲首个疫苗临床试验在英国牛津大学启动", "text": "ファーガス・ウォルシュ医療担当編集委員 最初の被験者の1人となったエリサ・グラナトさん 臨床試験は800人以上を対象に実施される。この日、最初の志願被験者2人に注射した。 全体の半数にCOVID-19（新型ウイルスの感染症）のワクチンを接種し、残りの半数には新型ウイルスではなく髄膜炎のワクチンを比較のため接種する。 被験者はどちらを接種されたのかわからないが、医師は把握する。 ＜関連記事＞ 最初の被験者の1人となったエリサ・グラナトさんは、「私は科学者なので、科学の進歩にはできる限り協力したいと思っていた」とBBCに話した。 接種されたのは、オックスフォード大学のチームが3カ月かけて開発したワクチン。臨床試験に至る研究を主導した、ジェナー研究所のサラ・ギルバート教授（ワクチン学）は、「私としてはこのワクチンにかなりの自信をもっている」と述べた。 「もちろん、人への試験をしてデータを得る必要がある。このワクチンを大勢の人に使う前に、これが実際に効いて、コロナウイルスの感染を防ぐことを示さなくてはならない」 ギルバート教授は以前、ワクチンについて「80％の自信がある」としていた。しかしこの日は数値では表現せず、単に「非常に楽観している」と述べた。 ワクチンはどう機能する？ ワクチンは、チンパンジーからとった一般的な風邪のウイルス（アデノウイルスと呼ばれる）を弱めたものからつくられ、人間の体内では成長しないように変えられている。 このワクチンを接種することで、免疫システムが働き、抗体とウイルスに感染した細胞を破壊するT細胞がつくられる。以降、同じウイルスが体内に侵入すると、抗体とT細胞が迎え撃つ。 オックスフォード大学のチームは同様の方法で、別のコロナウイルスの感染症、中東呼吸器症候群（MERS）のワクチンを開発した。その際も、臨床試験でよい結果を得ていた。 オックスフォード大学で開発中のワクチンを手にするウォルシュ編集委員 効果はどう判定する？ ワクチンが効くかを判定するには、接種した2グループの数カ月後の状態を比較するしかない。 今後もしイギリスで感染者が急減すると、十分なデータが得られなくなる。 臨床試験を主導しているオックスフォード・ワクチン・グループ代表のアンドリュー・ポラード教授は、「私たちは現在の流行の波の最後を追いかけている。それを捕まえられなければ、ワクチンが効くのかを今後数カ月以内に確かめることはできない。だがこのウイルスは消えないので、感染者はこの先も増えるとみている」と述べた。 約5000人の志願被験者を対象とした、年齢制限のない大規模な臨床試験も数カ月先に予定されている。 オックスフォード大学のチームは、伝染率が上昇しているケニアなどアフリカの国でのワクチン試験も検討している。 ワクチン実用化まで、あとどれくらい？ 新型ウイルス 試験時の感染者数が鍵を握るのであれば、被験者を意図的にウイルスに感染させればいいのではないだろうか？ そのとおりと言えるが、COVID-19の確実な治療法がない段階で実行するのは、倫理上の問題が生じる。 しかし将来、治療法が開発されれば可能になるかもしれないと、ポラード教授は言う。 ワクチン開発は1月にスタートした 臨床試験は安全？ 被験者の体調は今後数カ月、慎重に観察される。被験者はワクチン接種から数日は、腕の痛みや発熱があるかもしれないと説明を受けている。 被験者はまた、ウイルスが体内で激しい反応を引き起こす可能性が理論上はあると知らされている。ただ開発チームは、ワクチンによって病気になるリスクはデータ上、ごくわずかだとしている。 オックスフォード大学の研究者らは、9月までに100万件の接種ができるようにしたいと話している。ワクチンの効果が確認されれば、製造を急増させる考えだ。 誰が最初に接種を受けられる？ ワクチン接種の順番はまだ決まっていないと、ギルバート教授は言う。「私たちの役割はワクチンの開発と十分な量の製造で、その後のことは別の人が決める」。 ポラード教授は、「もっとも必要としている人に届けられるようにする必要がある。イギリスだけでなく開発途上国の人々にも」と話した。 そもそもワクチンとは 始まりは1000年前 インペリアル・コレッジ・ロンドンの開発チームも、6月にワクチンの臨床試験を開始したい考えだ。 同大学とオックスフォード大学は、政府から4000万ポンド（約53億円）以上の助成金を受けている。 マット・ハンコック保健相は両大学の取り組みを称賛。ワクチン開発に政府として「すべてを投じる」としている。 一方、英政府の医療責任者、イングランド主任医務官（CMO）のクリス・ウィッティー教授は、新型ウイルスのワクチンも治療薬も、年内には利用できるようにならないとの見通しを示している。 新型コロナウイルス特集 感染対策 在宅勤務・隔離生活 （英語記事 First patients injected in UK Covid vaccine trial）", "text_zh": "弗格斯·沃尔什医疗事务主编 成为首批受试者之一的埃莉萨·格拉纳托女士 临床试验将以800多人为对象实施。当天，向最初的两名志愿受试者进行了注射。 全体受试者中的半数接种COVID-19（新型病毒感染症）疫苗，其余半数则接种并非针对新型病毒、而是用于对照的脑膜炎疫苗。 受试者不知道自己接种的是哪一种，但医生掌握情况。 ＜相关报道＞ 成为首批受试者之一的埃莉萨·格拉纳托女士对BBC表示：“我是科学家，所以一直希望尽可能为科学的进步作出贡献。” 所接种的是牛津大学团队耗时3个月开发的疫苗。主导了通向临床试验的研究的詹纳研究所莎拉·吉尔伯特教授（疫苗学）表示：“就我个人而言，对这款疫苗抱有相当大的信心。” “当然，需要进行人体试验并获得数据。在把这款疫苗用于大量人群之前，必须证明它确实有效，能够防止冠状病毒感染。” 吉尔伯特教授此前曾表示对疫苗“有80%的信心”。但当天她没有用数字表述，只是表示“非常乐观”。 疫苗如何发挥作用？ 疫苗由取自黑猩猩的一种常见感冒病毒（称为腺病毒）减弱后制成，并经过改造，使其无法在人体内生长。 通过接种这款疫苗，免疫系统开始运作，产生抗体以及能够破坏被病毒感染细胞的T细胞。此后，一旦同样的病毒侵入体内，抗体和T细胞就会迎击。 牛津大学团队曾用同样的方法开发出针对另一种冠状病毒感染症——中东呼吸综合征（MERS）的疫苗。当时也在临床试验中取得了良好结果。 手持牛津大学开发中疫苗的沃尔什主编 效果如何判定？ 要判定疫苗是否有效，只能比较接种后的两组人数月后的状况。 今后如果英国的感染者急剧减少，将无法获得足够的数据。 主导临床试验的牛津疫苗组负责人安德鲁·波拉德教授表示：“我们正在追赶当前流行浪潮的尾声。如果抓不住它，就无法在今后数月内确认疫苗是否有效。但这种病毒不会消失，因此我们预计感染者今后还会增加。” 以约5000名志愿受试者为对象、不设年龄限制的大规模临床试验也计划在数月后进行。 牛津大学团队还在考虑在传染率正在上升的肯尼亚等非洲国家进行疫苗试验。 距离疫苗投入实用还有多久？ 新型病毒 如果试验时的感染者人数是关键，那么让受试者故意感染病毒不就行了吗？ 可以说确实如此，但在尚无COVID-19确切治疗方法的阶段付诸实行，会产生伦理上的问题。 不过波拉德教授表示，将来如果开发出治疗方法，或许就有可能实现。 疫苗开发于1月启动 临床试验安全吗？ 受试者的身体状况在今后数月将受到慎重观察。受试者已被告知，接种疫苗后的数天内可能出现手臂疼痛或发烧。 受试者还被告知，理论上病毒有可能在体内引发剧烈反应。不过开发团队表示，从数据上看，因疫苗而患病的风险微乎其微。 牛津大学的研究人员表示，希望到9月为止能够实现100万剂的接种。如果疫苗的效果得到确认，计划迅速扩大生产。 谁能最先接种？ 吉尔伯特教授表示，疫苗接种的顺序尚未确定。“我们的职责是开发疫苗和生产足够的数量，之后的事情由别人来决定。” 波拉德教授表示：“必须确保能够送到最需要的人手中。不仅是英国，也包括发展中国家的人们。” 疫苗究竟是什么 起源于1000年前 伦敦帝国理工学院的开发团队也希望在6月启动疫苗临床试验。 该校与牛津大学从政府获得了超过4000万英镑（约53亿日元）的资助。 卫生大臣马特·汉考克称赞了两所大学的努力，表示政府将为疫苗开发“倾尽一切”。 另一方面，英国政府的医疗负责人、英格兰首席医务官（CMO）克里斯·惠蒂教授则给出预测，认为新型病毒的疫苗和治疗药物都无法在年内投入使用。 新型冠状病毒特辑 防疫措施 居家办公·隔离生活 （英文报道 First patients injected in UK Covid vaccine trial）", "reference_summary": "新型コロナウイルスのワクチン開発で、欧州初の臨床試験が23日、英オックスフォード大学で始まった。", "ref_zh": "在新型冠状病毒疫苗开发方面，欧洲首个临床试验23日在英国牛津大学启动。", "summaries": [{"summary_id": "52407075_4c3606dd", "summary": "新型コロナウイルスのワクチン開発で、欧州初の臨床試験が23日、英オックスフォード大学で始まった。", "zh": "在新型冠状病毒疫苗开发方面，欧洲首个临床试验23日在英国牛津大学启动。"}, {"summary_id": "52407075_57a0965e", "summary": "英オックスフォード大学で23日、新型コロナウイルスワクチンの欧州初の臨床試験が開始された。800人以上の被験者を対象に、半数に新型ウイルス用ワクチン、残り半数に比較用の髄膜炎ワクチンを接種する二重盲検試験となっている。", "zh": "英国牛津大学23日启动了新型冠状病毒疫苗的欧洲首个临床试验。试验以800多名受试者为对象，半数接种针对新型病毒的疫苗，其余半数接种用于对照的脑膜炎疫苗，是一项双盲试验。"}, {"summary_id": "52407075_c77fb4c9", "summary": "英ケンブリッジ大学で23日、新型コロナウイルスワクチンの欧州初の臨床試験が開始された。800人以上の被験者を対象に、半数に新型ウイルス用ワクチン、残り半数に比較用のインフルエンザワクチンを接種する二重盲検試験となっている。", "zh": "英国剑桥大学23日启动了新型冠状病毒疫苗的欧洲首个临床试验。试验以800多名受试者为对象，半数接种针对新型病毒的疫苗，其余半数接种用于对照的流感疫苗，是一项双盲试验。"}, {"summary_id": "52407075_d055d6a0", "summary": "新型コロナウイルスのワクチン開発で、欧州初の臨床試験", "zh": "在新型冠状病毒疫苗开发方面，欧洲首个临床试验"}, {"summary_id": "52407075_fb6cc3fc", "summary": "ファーガス・ウォルシュ医療担当編集委員 最初の被験者の1人となったエリサ・グラナトさん 臨床試験は800人以上を対象に実施される。この日、最初の志願被験者2人に注射した。全体の半数にCOVID-19（新型ウイルスの感染症）のワクチンを接種し、残りの半数には新型ウイルスではなく髄膜炎のワクチンを比較のため接種する。", "zh": "弗格斯·沃尔什医疗事务主编 成为首批受试者之一的埃莉萨·格拉纳托女士 临床试验将以800多人为对象实施。当天，向最初的两名志愿受试者进行了注射。全体受试者中的半数接种COVID-19（新型病毒感染症）疫苗，其余半数则接种并非针对新型病毒、而是用于对照的脑膜炎疫苗。"}]}, {"article_id": "37426493", "url": "https://www.bbc.com/japanese/37426493", "title": "A.ジョリーさん、ブラッド・ピットさんとの離婚申し立て", "title_zh": "安吉丽娜·朱莉申请与布拉德·皮特离婚", "text": "ジョリーさんとピットさんは2014年、フランスで結婚した ロバート・オファー弁護士によると、ジョリーさんは19日に「結婚解消」の申し立てを提出し、「家族の健康のための判断だ」と説明したという。 オファー弁護士は「（ジョリーさんは）コメントしません。家族のプライバシーを尊重するようお願いしています」と声明を出した。 米芸能サイト「TMZ」によると、離婚申請の書類には、9月15日に別居開始と記載されている。 夫妻の6人の子供について、ジョリーさんは自ら親権を求め、ピットさんには面会権を認めるよう裁判所に要請しているという。 6人の子供のうち3人は養子で、3人は夫妻の間に生まれた。 子供たちは結婚式で、結婚指輪を運び、ジョリーさんの白いウェディングドレスに絵を描いた。 ジョリーさんがロサンゼルス郡地裁に提出した離婚の申し立て 映画「Mr.&Mrs. スミス」（2005年公開）で共演したジョリーさんとピットさんがカップルになったのは2004年だが、正式に結婚したのは2014年8月。 ジョリーさんの長年のマネージャー、ガイザー・コジンスキさんは芸能サイト「E! Online」に、「アンジェリーナは常に、家族の面倒を見るために最善のことをする」と話した。 ピットさんにとっては2度目の結婚。最初の妻は、女優ジェニファー・アニストンさんだった。ジョリーさんにとっては、米俳優ビリー・ボブ・ソーントンさんと英俳優ジョニー・リー・ミラーさんに続く、3回目の結婚だった。 「ブランジェリーナ」離婚へ 結婚についてBBCに語ったこと 「それなりに課題が」 ジョリーさんは、女優や映画監督としての仕事のほかに、難民問題に取り組む活動で知られる。2001年に国連難民高等弁務官事務所（UNHCR）の親善大使となり、2012年にはUNHCR特別大使となった。 遺伝的に乳がん発症の危険が高いと診断され、2013年には両方の乳房の摘出手術を受けたことを公表して話題となった。2年後には、さらにがん予防措置として、卵巣・卵管の摘出手術を受けた。 「これが自分にとっての現実だと知った以上、積極的に対応してできるだけリスクを小さくしようと思った」とジョリーさんは2013年の時点で、米紙ニューヨーク・タイムズに説明している。 ジョリーさんとピットさんは2014年、フランスのホテルで壊れた結婚を修復しようとする夫妻を描く、ジョリーさん作・監督・主演の映画「By The Sea」（邦題「白い帽子の女」）で共演。昨年秋の公開時には、ジョリーさんは英紙デイリー・テレグラフに、「ブラッドと私の間にはそれなりに課題もあります。ほかのカップルと同じで、ケンカもするし問題もある。お互いのことでものすごく頭に来て、離れていたくなることもある。でも映画に出てくるカップルの問題は、私たちの問題とは違います」と話していた。 離婚訴訟においてジョリーさんを担当する見通しのローラ・ワッサー弁護士は、これまでにジョニー・デップさんやキム・カーダシアンさん、スティービー・ワンダーさんやブリトニー・スピアーズさんなどを担当してきた。 （英語記事 Angelina Jolie to divorce Brad Pitt）", "text_zh": "朱莉与皮特2014年在法国结婚 据罗伯特·奥弗律师称，朱莉19日提交了“解除婚姻”的申请，并解释称“这是为了家人的健康作出的决定”。 奥弗律师发表声明称：“（朱莉）不作评论。恳请各方尊重家人的隐私。” 据美国娱乐网站“TMZ”报道，离婚申请文件中记载，两人于9月15日开始分居。 关于夫妇的6个孩子，据称朱莉请求法院将抚养权判给自己，并给予皮特探视权。 6个孩子中3人是领养的，3人是夫妇亲生的。 孩子们在婚礼上负责传递结婚戒指，并在朱莉的白色婚纱上画了画。 朱莉向洛杉矶县地方法院提交的离婚申请 因合演电影《史密斯夫妇》（2005年上映）而结缘的朱莉和皮特于2004年成为情侣，但正式结婚是在2014年8月。 朱莉的多年经纪人盖泽·科金斯基对娱乐网站“E! Online”表示：“安吉丽娜始终会为照顾家人做最好的事情。” 对皮特来说这是第二次婚姻。第一任妻子是女演员詹妮弗·安妮斯顿。对朱莉来说，这是继美国演员比利·鲍勃·松顿和英国演员约翰尼·李·米勒之后的第三次婚姻。 “布拉吉丽娜”走向离婚 曾就婚姻对BBC说过的话 “有相应的课题” 朱莉除了女演员和电影导演的工作之外，还以致力于难民问题的活动而闻名。她2001年成为联合国难民署（UNHCR）亲善大使，2012年成为UNHCR特使。 她被诊断出在遗传上罹患乳腺癌的风险较高，2013年公开自己接受了双侧乳房切除手术，成为话题。两年后，作为进一步的癌症预防措施，她又接受了卵巢和输卵管的切除手术。 “既然知道这就是自己面对的现实，我就想积极应对，尽可能降低风险，”朱莉在2013年当时对美国报纸《纽约时报》这样解释。 朱莉和皮特2014年合演了由朱莉编剧、执导并主演的电影《By The Sea》（日文片名《白帽子的女人》），影片描绘了一对在法国的酒店试图修复破裂婚姻的夫妇。去年秋天影片上映时，朱莉曾对英国报纸《每日电讯报》表示：“布拉德和我之间也有相应的课题。和其他夫妇一样，我们也会吵架，也有问题。有时会因为对方的事情非常生气，想要彼此分开。但电影中那对夫妇的问题，和我们的问题不一样。” 预计将在离婚诉讼中代理朱莉的劳拉·瓦瑟律师，此前曾代理过约翰尼·德普、金·卡戴珊、史蒂维·旺德、布兰妮·斯皮尔斯等人。 （英文报道 Angelina Jolie to divorce Brad Pitt）", "reference_summary": "米女優・監督のアンジェリーナ・ジョリーさん（41）が、夫で俳優・プロデューサーのブラッド・ピットさん（52）との離婚を申し立てた。「乗り越えがたい相違」が理由だと、ジョリーさんの弁護士が20日、明らかにした。夫妻は「ブランジェリーナ」と呼ばれる、ハリウッドでも有名なスター・カップルだった。", "ref_zh": "美国女演员兼导演安吉丽娜·朱莉（41岁）已申请与丈夫、演员兼制片人布拉德·皮特（52岁）离婚。朱莉的律师20日表示，理由是“不可调和的分歧”。这对夫妇是被称为“布拉吉丽娜”的、在好莱坞也颇为有名的明星情侣。", "summaries": [{"summary_id": "37426493_12ba3116", "summary": "米女優・監督のアンジェリーナ・ジョリーさん（41）が、夫で俳優・プロデューサーのブラッド・ピットさん（52）との離婚を申し立てた。「乗り越えがたい相違」が理由だと、ジョリーさんの弁護士が20日、明らかにした。夫妻は「ブランジェリーナ」と呼ばれる、ハリウッドでも有名なスター・カップルだった。", "zh": "美国女演员兼导演安吉丽娜·朱莉（41岁）已申请与丈夫、演员兼制片人布拉德·皮特（52岁）离婚。朱莉的律师20日表示，理由是“不可调和的分歧”。这对夫妇是被称为“布拉吉丽娜”的、在好莱坞也颇为有名的明星情侣。"}, {"summary_id": "37426493_6baeebc9", "summary": "米女優・監督のアンジェリーナ・ジョリーさん（41）が15日、夫で俳優のブラッド・ピットさん（52）との離婚をロサンゼルス郡地裁に申し立てた。弁護士は「家族の健康のための判断」だと説明し、書類によると9月1日に別居が始まったとされる。ジョリーさんは4人の子どもの親権を求め、ピットさんには面会権を認めるよう要請している。", "zh": "美国女演员兼导演安吉丽娜·朱莉（41岁）15日向洛杉矶县地方法院申请与丈夫、演员布拉德·皮特（52岁）离婚。律师解释称这是“为了家人的健康作出的决定”，据文件记载，两人于9月1日开始分居。朱莉请求获得4个孩子的抚养权，并要求给予皮特探视权。"}, {"summary_id": "37426493_9d69dc21", "summary": "米女優・監督のアンジェリーナ・ジョリーさん（41）が19日、夫で俳優のブラッド・ピットさん（52）との離婚をロサンゼルス郡地裁に申し立てた。弁護士は「家族の健康のための判断」だと説明し、書類によると9月15日に別居が始まったとされる。ジョリーさんは6人の子どもの親権を求め、ピットさんには面会権を認めるよう要請している。", "zh": "美国女演员兼导演安吉丽娜·朱莉（41岁）19日向洛杉矶县地方法院申请与丈夫、演员布拉德·皮特（52岁）离婚。律师解释称这是“为了家人的健康作出的决定”，据文件记载，两人于9月15日开始分居。朱莉请求获得6个孩子的抚养权，并要求给予皮特探视权。"}, {"summary_id": "37426493_e6062236", "summary": "ジョリーさんとピットさんは2014年、フランスで結婚した ロバート・オファー弁護士によると、ジョリーさんは19日に「結婚解消」の申し立てを提出し、「家族の健康のための判断だ」と説明したという。オファー弁護士は「（ジョリーさんは）コメントしません。家族のプライバシーを尊重するようお願いしています」と声明を出した。", "zh": "朱莉与皮特2014年在法国结婚 据罗伯特·奥弗律师称，朱莉19日提交了“解除婚姻”的申请，并解释称“这是为了家人的健康作出的决定”。奥弗律师发表声明称：“（朱莉）不作评论。恳请各方尊重家人的隐私。”"}, {"summary_id": "37426493_f0038832", "summary": "夫妻は「ブランジェリーナ」と呼ばれる、ハリウッドでも有名なスター・カップルだった。「乗り越えがたい相違」が理由だと、ジョリーさんの弁護士が20日、明らかにした。米女優・監督のアンジェリーナ・ジョリーさん（41）が、夫で俳優・プロデューサーのブラッド・ピットさん（52）との離婚を申し立てた。", "zh": "这对夫妇是被称为“布拉吉丽娜”的、在好莱坞也颇为有名的明星情侣。朱莉的律师20日表示，理由是“不可调和的分歧”。美国女演员兼导演安吉丽娜·朱莉（41岁）已申请与丈夫、演员兼制片人布拉德·皮特（52岁）离婚。"}]}, {"article_id": "40490051", "url": "https://www.bbc.com/japanese/40490051", "title": "イラク・モスルで激しい戦闘 ISは自爆攻撃などで抵抗", "title_zh": "伊拉克摩苏尔发生激烈战斗 IS以自杀式袭击等方式抵抗", "text": "モスルの旧市街を進むイラク対テロ部隊（3日） ISが立てこもるモスルの旧市街には、空爆や迫撃砲の一斉発射による攻撃が行われており、イラクの司令官たちはモスル制圧は近いと語った。 しかし、ISは一部女性による自爆攻撃を増やして抵抗している。 モスル奪還作戦は昨年10月に始まった。 数千人規模のイラク軍に加えて、クルド人部隊ペシュメルガ、イスラム教スンニ派のアラブ人部族、シーア派民兵は、米主導の有志連合の軍機や軍事顧問らの支援を受けて作戦に参加している。 イラク政府は今年1月にモスル東部を完全に「解放」したと発表したが、市西部での戦闘は、狭く曲がりくねった道に阻まれ、より困難な展開になっている。 イラク精鋭の対テロ部隊の司令官、アブドゥルガニ・アサディ中将はAFP通信に対し、「旧市街の性質上、戦闘は日ごとに困難になってきている」と語った。同中将はまた、IS戦闘員を助けている旧市街の状態は、イラク軍の兵士たちが狙撃手からの攻撃をかわすことにも役立っていると指摘した。 戦闘が続くなか旧市街から民間人が避難し続けている（3日） 対テロ部隊のもう一人の司令官、サミ・アルディ中将はAFP通信に、「敵は過去3日間、一部の地区で特に女性による自爆攻撃を行っている。これまでは狙撃手や爆弾の方が多かった」と述べた。 一部では10代の女性が自爆攻撃を行っているという。 AP通信によると、3日には女性による自爆攻撃が2回起きた。このほか7人の女性が自爆装置を身に着けて兵士らに近づこうとしたものの、阻止されている。 イラク軍の司令官たちは自爆攻撃をさせないために、旧市街から避難してきた女性たちに、兵士らに近づく前にベールを外すよう、また男性たちにはシャツを脱ぐよう要求している。 国連はISが10万人以上のモスル住民を「人間の盾」としている可能性があると指摘した。 イラク軍はモスル市内に残っているIS戦闘員は300人を超えないと考えている。10月の作戦開始時には6000人近くいたとみられている。 ヤハヤ・ラスール准将はイラク国営テレビに対し、「勝利にかなり近づいた」と述べた。また別の司令官は「戦闘は5日から1週間で終わる」との見通しを示した。 モスルは2014年6月、ISが占領した。 （英語記事 Battle for Mosul: Fierce clashes as IS uses suicide bombers）", "text_zh": "在摩苏尔旧城区推进的伊拉克反恐部队（3日） 针对IS据守的摩苏尔旧城区，正在实施空袭和迫击炮齐射的攻击，伊拉克的指挥官们表示，攻克摩苏尔已为期不远。 然而，IS正在增加部分由女性实施的自杀式袭击进行抵抗。 摩苏尔夺还行动于去年10月开始。 除数千人规模的伊拉克军队外，库尔德人部队“佩什梅格”、伊斯兰教逊尼派阿拉伯人部族、什叶派民兵也在美国主导的多国联军的军机和军事顾问等的支援下参与行动。 伊拉克政府今年1月宣布已完全“解放”摩苏尔东部，但市西部的战斗因狭窄曲折的街道受阻，局势发展更加艰难。 伊拉克精锐反恐部队的指挥官阿卜杜勒加尼·阿萨迪中将对法新社表示：“由于旧城区的特性，战斗正一天比一天艰难。”该中将还指出，帮助IS战斗人员的旧城区环境，同样也有助于伊拉克军队的士兵躲避狙击手的攻击。 战斗持续之中，平民不断从旧城区撤离（3日） 反恐部队的另一名指挥官萨米·阿尔迪中将对法新社表示：“敌人在过去3天里，在部分地区实施了尤其由女性执行的自杀式袭击。此前更多的是狙击手和炸弹。” 据称，部分自杀式袭击由十几岁的女性实施。 据美联社报道，3日发生了两起由女性实施的自杀式袭击。此外还有7名女性身佩自爆装置试图接近士兵，但被阻止。 为了防止自杀式袭击，伊拉克军队的指挥官们要求从旧城区撤离出来的女性在接近士兵之前摘下面纱，并要求男性脱下衬衫。 联合国指出，IS有可能正把10万以上的摩苏尔居民当作“人盾”。 伊拉克军队认为，留在摩苏尔市内的IS战斗人员不超过300人。据估计，10月行动开始时有近6000人。 亚哈亚·拉苏尔准将对伊拉克国营电视台表示：“已相当接近胜利。”另一名指挥官则给出了“战斗将在5天至1周内结束”的预测。 摩苏尔于2014年6月被IS占领。 （英文报道 Battle for Mosul: Fierce clashes as IS uses suicide bombers）", "reference_summary": "イラク北部モスルで、過激派組織のいわゆる「イスラム国」（IS）からの奪還を目指す米国主導の有志連合が攻勢をかけるなか、ISは自爆攻撃をより頻繁に実行するなどして抵抗している。", "ref_zh": "在伊拉克北部摩苏尔，在以从极端组织所谓“伊斯兰国”（IS）手中夺回该市为目标的美国主导的多国联军发起攻势之际，IS正以更频繁地实施自杀式袭击等方式进行抵抗。", "summaries": [{"summary_id": "40490051_08737554", "summary": "イラク北部モスルの旧市街では、過激派組織IS掃討作戦でイラク対テロ部隊と米主導の有志連合による空爆や迫撃砲攻撃が激化している。IS側は女性による自爆攻撃を増やして抵抗しており、10代の少女による攻撃も報告された。作戦開始当初6000人近くいたとされるIS戦闘員は現在300人程度と推定され、司令官は「勝利に近づいた」と述べた。", "zh": "在伊拉克北部摩苏尔的旧城区，在清剿极端组织IS的行动中，伊拉克反恐部队与美国主导的多国联军的空袭和迫击炮攻击正在加剧。IS方面正增加由女性实施的自杀式袭击进行抵抗，还报告了由十几岁少女实施的袭击。据估计，行动开始之初有近6000人的IS战斗人员目前约为300人，指挥官表示“已接近胜利”。"}, {"summary_id": "40490051_17b1e454", "summary": "モスルの旧市街を進むイラク対テロ部隊（3日） ISが立てこもるモスルの旧市街には、空爆や迫撃砲の一斉発射による攻撃が行われており、イラクの司令官たちはモスル制圧は近いと語った。しかし、ISは一部女性による自爆攻撃を増やして抵抗している。モスル奪還作戦は昨年10月に始まった。", "zh": "在摩苏尔旧城区推进的伊拉克反恐部队（3日） 针对IS据守的摩苏尔旧城区，正在实施空袭和迫击炮齐射的攻击，伊拉克的指挥官们表示，攻克摩苏尔已为期不远。然而，IS正在增加部分由女性实施的自杀式袭击进行抵抗。摩苏尔夺还行动于去年10月开始。"}, {"summary_id": "40490051_5d9feeef", "summary": "シリア北部モスルの旧市街では、過激派組織IS掃討作戦でイラク対テロ部隊と米主導の有志連合による空爆や迫撃砲攻撃が激化している。IS側は男性による自爆攻撃を増やして抵抗しており、30代の男性による攻撃も報告された。作戦開始当初8000人近くいたとされるIS戦闘員は現在500人程度と推定され、司令官は「勝利に近づいた」と述べた。", "zh": "在叙利亚北部摩苏尔的旧城区，在清剿极端组织IS的行动中，伊拉克反恐部队与美国主导的多国联军的空袭和迫击炮攻击正在加剧。IS方面正增加由男性实施的自杀式袭击进行抵抗，还报告了由30多岁男性实施的袭击。据估计，行动开始之初有近8000人的IS战斗人员目前约为500人，指挥官表示“已接近胜利”。"}, {"summary_id": "40490051_e1edb2c8", "summary": "イラク北部モスルで、過激派組織のいわゆる「イスラム国」（IS）からの奪還を目指す米国主導の有志連合が攻勢をかけるなか、ISは自爆攻撃をより頻繁に実行するなどして抵抗している。", "zh": "在伊拉克北部摩苏尔，在以从极端组织所谓“伊斯兰国”（IS）手中夺回该市为目标的美国主导的多国联军发起攻势之际，IS正以更频繁地实施自杀式袭击等方式进行抵抗。"}, {"summary_id": "40490051_f31ff526", "summary": "英国の欧州連合（EU）離脱について、英高等法院は3日、離脱手続きを開始するリスボン条約第50条を政府が発動するには、議会承認が必要だとの判断を示した。", "zh": "关于英国脱离欧洲联盟（EU）一事，英国高等法院3日作出判断，认为政府要启动开启脱欧程序的《里斯本条约》第50条，需要获得议会批准。"}]}, {"article_id": "52451669", "url": "https://www.bbc.com/japanese/52451669", "title": "米ニューヨーク市の医師が自殺 新型ウイルスの最前線で勤務", "title_zh": "美国纽约市一名医生自杀 曾在新型病毒最前线工作", "text": "ローナ・ブリーン医師 亡くなったのは、同市マンハッタンにあるニューヨーク・プレズビティリアン・アレン病院の救急部門の責任者だった、ローナ・ブリーン医師（49）。警察によると、26日に自傷行為により死亡した。 ブリーンさんの父親のフィリップ・ブリーン医師は米紙ニューヨーク・タイムズに、「娘は職務を果たそうとして、それによって命を奪われた」と述べた。 アメリカの新型ウイルスの死者約5万6000人のうち、約1万7500人がニューヨーク州で確認されている。アメリカの人口は約3億3000万人。 フィリップさんによると、ブリーンさんは精神疾患にかかったことはなかった。ブリーンさんは、家族と過ごしていたヴァージニア州シャーロッツヴィルで死去した。 ブリーンさんはスキーやサルサが好きだった ブリーンさん自身、職務を通して新型ウイルスに感染。約10日間の回復期間を経て仕事に復帰していたと、フィリップさんは話した。 フィリップさんによると、勤務先の病院は家族がシャーロッツヴィルに連れ戻そうとする前に彼女を帰宅させたという。 フィリップさんが最後にブリーンさんと話をしたとき、彼女は「心ここにあらず」といった感じで、COVID-19（新型ウイルスの感染症）の患者が救急車から降ろされるのを待たずに死んでいく様子を語ったという。ブリーンさんが勤めていた病床200の病院では、新型ウイルス患者が何十人も亡くなっている。 「彼女は本当に最前線の塹壕にいた」と、フィリップさんはニューヨーク・タイムズに語った。 「彼女は英雄として称えられなくてはならない。今回亡くなった他のすべての死者と同様、彼女も犠牲者だ」 警察も「英雄」と発表 ニューヨーク・タイムズによると、ブリーンさんは敬けんなキリスト教徒で、家族と非常に仲が良かった。スキーが大好きで、ダンスのサルサも楽しんだ。毎週1回、老人ホームでボランティアをしていたという。 勤務先の病院は、「ブリーン医師は救急部門の厳しい最前線に、医学の崇高な理想をもたらした英雄だ」との声明を出した。 シャーロッツヴィル警察もブリーンさんの死去を伝える報道発表で、ブリーンさんを「英雄」と表現した。 警察によると、今月26日に救援を求める通報があった後、ブリーンさんは地元の病院に運ばれ治療を受けていた。「その後、自ら引き起こした負傷により死亡した」という。 ラシャル・ブラクニー署長は声明で、「最前線の医療従事者も（救急隊員などの）第一対応者も、現在のパンデミック（感染の世界的流行）による精神的、身体的影響を受けないわけではない」とした。 さらに、「普段からこうした専門職の人たちは、特にストレスの強い状況で働いている。そこに新型ウイルスによる新しいストレスが追加されている」と述べた。 アメリカで確認されている新型ウイルスの感染者は約100万人。その約3割が、ニューヨーク州で確認された人数だ。 同州のアンドリュー・クオモ知事は27日、無作為に選んだ州民を対象に抗体検査をしたところ、ニューヨーク市の住民の約4分の1（24.7％）が新型ウイルスに感染していたことを示す結果が出たと発表した。同市はアメリカ最大の都市で、約830万人が暮らしている。 （英語記事 Top NYC coronavirus doctor takes her own life）", "text_zh": "洛娜·布里恩医生 去世的是该市曼哈顿的纽约长老会艾伦医院急诊部门的负责人洛娜·布里恩医生（49岁）。据警方称，她于26日因自伤行为死亡。 布里恩的父亲菲利普·布里恩医生对美国报纸《纽约时报》表示：“女儿是想要履行职责，并因此被夺去了生命。” 在美国约5万6000名新型病毒死者中，约1万7500人是在纽约州确认的。美国人口约为3亿3000万人。 据菲利普称，布里恩此前从未患过精神疾病。布里恩在与家人共处的弗吉尼亚州夏洛茨维尔去世。 布里恩喜欢滑雪和萨尔萨舞 布里恩本人也通过工作感染了新型病毒。菲利普表示，她经过约10天的恢复期后已重返工作岗位。 据菲利普称，在家人打算把她接回夏洛茨维尔之前，她所在的医院已让她回家。 菲利普最后一次与布里恩交谈时，她给人一种“心不在焉”的感觉，讲述了COVID-19（新型病毒感染症）患者等不及被从救护车上抬下来就死去的情形。在布里恩工作的这家拥有200张病床的医院里，已有数十名新型病毒患者死亡。 “她真的置身于最前线的战壕之中，”菲利普对《纽约时报》说。 “她必须作为英雄受到赞颂。和这次去世的所有其他死者一样，她也是牺牲者。” 警方也发布称其为“英雄” 据《纽约时报》报道，布里恩是虔诚的基督徒，与家人关系非常亲密。她酷爱滑雪，也喜欢跳萨尔萨舞。据称她每周一次在养老院做志愿者。 她工作的医院发表声明称：“布里恩医生是一位把医学的崇高理想带到急诊部门严酷最前线的英雄。” 夏洛茨维尔警方在通报布里恩死讯的新闻发布中，也把布里恩形容为“英雄”。 据警方称，本月26日接到求救报警后，布里恩被送往当地医院接受治疗。“其后，因自己造成的伤势死亡。” 拉沙尔·布拉克尼警察局长在声明中表示：“无论是最前线的医疗工作者，还是（急救队员等）第一响应者，都不可能不受当前大流行（疫情的全球性流行）带来的精神和身体影响。” 该局长还表示：“这些专业人士平时就在压力特别大的环境中工作。如今又在其上叠加了新型病毒带来的新压力。” 美国确认的新型病毒感染者约为100万人。其中约3成是在纽约州确认的人数。 该州州长安德鲁·科莫27日宣布，对随机挑选的州民进行抗体检测的结果显示，纽约市居民中约四分之一（24.7%）曾感染新型病毒。该市是美国最大的城市，约有830万人居住。 （英文报道 Top NYC coronavirus doctor takes her own life）", "reference_summary": "米ニューヨーク市で新型コロナウイルスとの戦いの最前線にいた医師が、自ら命を絶った。", "ref_zh": "在美国纽约市身处抗击新型冠状病毒最前线的一名医生，结束了自己的生命。", "summaries": [{"summary_id": "52451669_8c0732af", "summary": "米ニューヨーク市で新型コロナウイルスとの戦いの最前線にいた医師が、自ら命を絶った。", "zh": "在美国纽约市身处抗击新型冠状病毒最前线的一名医生，结束了自己的生命。"}, {"summary_id": "52451669_b35f8012", "summary": "ローナ・ブリーン医師 亡くなったのは、同市マンハッタンにあるニューヨーク・プレズビティリアン・アレン病院の救急部門の責任者だった、ローナ・ブリーン医師（49）。警察によると、26日に自傷行為により死亡した。ブリーンさんの父親のフィリップ・ブリーン医師は米紙ニューヨーク・タイムズに、「娘は職務を果たそうとして、それによって命を奪われた」と述べた。", "zh": "洛娜·布里恩医生 去世的是该市曼哈顿的纽约长老会艾伦医院急诊部门的负责人洛娜·布里恩医生（49岁）。据警方称，她于26日因自伤行为死亡。布里恩的父亲菲利普·布里恩医生对美国报纸《纽约时报》表示：“女儿是想要履行职责，并因此被夺去了生命。”"}, {"summary_id": "52451669_cc85ecfb", "summary": "米ニューヨーク市マンハッタンのニューヨーク・プレズビティリアン・アレン病院救急部門責任者のローナ・ブリーン医師（49）が、新型コロナウイルス感染症対応の最前線で勤務中に自ら命を絶った。", "zh": "美国纽约市曼哈顿的纽约长老会艾伦医院急诊部门负责人洛娜·布里恩医生（49岁），在新型冠状病毒感染症应对的最前线工作期间，结束了自己的生命。"}, {"summary_id": "52451669_ce30cbb2", "summary": "米ニューヨーク市で新型コロナウイルスとの戦い", "zh": "在美国纽约市与新型冠状病毒的战斗"}, {"summary_id": "52451669_f83659c4", "summary": "米ボストン市マサチューセッツ総合病院救急部門責任者のローナ・ブリーン医師（49）が、新型コロナウイルス感染症対応の最前線で勤務中に自ら命を絶った。", "zh": "美国波士顿市麻省总医院急诊部门负责人洛娜·布里恩医生（49岁），在新型冠状病毒感染症应对的最前线工作期间，结束了自己的生命。"}]}, {"article_id": "45715110", "url": "https://www.bbc.com/japanese/45715110", "title": "画期的ながん治療にノーベル賞 日米の研究者が共同受賞", "title_zh": "划时代的癌症疗法获诺贝尔奖 日美研究者共同获奖", "text": "ミシェル・ロバーツ、BBCニュースオンライン健康担当編集長 米テキサス大学のジェイムズ・P・アリソン教授（70）と日本の京都大学の本庶佑特別教授（76）の研究は、進行した致死性の高い皮膚がんの治療に貢献した。 ノーベル賞を主催するスウェーデン・アカデミーは、免疫チェックポイント阻害療法はがん治療に革命をもたらしたと説明した。 複数の専門家が、この治療法は「際立って効果的」だと立証されたと評価している。 アリソン氏と本庶氏は、900万スウェーデンクローナ（約1億1500万円）の賞金を分け合う。 受賞に際して本庶氏は記者団に対し、「これまで以上に多くの患者を救うことになるように、もう少し研究を続けたい」と話した。 アリソン教授は「免疫チェックポイント阻害薬を使ってがんを克服した患者に会うことは、素晴らしく胸を揺さぶる栄誉だ。患者さんたちは、基礎科学の力、我々が物事を学び、その仕組みを理解したいという気持ちの生き証人なので」と喜んだ。 治療できないものを治療する 免疫系は人間の体を病気から守ってくれる一方、自分自身の組織は攻撃しないよう自己防衛機能を持っている。 本庶特別教授と京都大学のチーム 一部のがんはこの「ブレーキ」を悪用し、免疫システムの攻撃を逃れることができる。 アリソン教授と本庶教授は、このブレーキを動かすたんぱく質を阻害することで、免疫システムによるがん攻撃を可能にする方法を発見した。 この発見により、以前は治療できないとされていた進行性のがんに対する新薬が開発され、患者の希望となっている。 英国の国民保健制度（NHS）では、皮膚がんの中でも特に重い「悪性黒色腫（メラノーマ）」の患者に対して、免疫チェックポイント阻害療法が使われている。 この療法は誰にでも効果があるわけではないが、一部の患者には素晴らしく威力を発揮しているようだ。中にはがんが全身に転移し始めた後でも、がん細胞が完全に消失した例もある。 全身転移まで症状の進行した患者で、これほど症状が改善する治療法はかつてなかった。 ジェイムズ・アリソン教授 この療法は皮膚がんだけでなく、進行性の肺がん患者にも利用されている。 英国がん研究所のチャールズ・スワントン教授は、「この画期的な研究によって、免疫システムがもともとがんに対して持つ力が活用できるようになり、治療法に結びついた。そのおかげで、がん患者の命は、今も助かり続けている。免疫促進剤は、進行性のメラノーマや肺がん、腎臓がんについて、万策尽きた多くの患者の展望を一変させた」と受賞者2人を祝福した。 「（両教授の）発見を機に花開いた免疫療法の領域は、まだ生まれたばかりだ。将来この研究がどのように発展し、どのような新しい可能性が生まれてくるかを考えるのは楽しい」 医学生理学賞は、ノーベル賞の中で最初に発表される。 スウェーデン・アカデミーは5月、関係者の性的暴行疑惑を受け、今年の文学賞を見送ると発表している。 過去10年のノーベル医学生理学賞の受賞者 2017年：ジェフリー・ホール氏、マイケル・ロスバッシュ氏、マイケル・ヤング氏。体内時計（概日リズム）を制御する仕組みの発見 2016年：大隅良典氏。細胞が自身のタンパク質を分解する仕組みの解明 2015年： ウィリアム・C・キャンベル氏、大村智氏、屠呦呦（ト・ユウユウ）氏。寄生虫による感染症に対する治療薬の発見 2014年： ジョン・オキーフ氏、マイブリット・モーセル氏、エドバルド・モーセル氏。脳内の空間認知システムの発見 2013年：ジェームズ・ロスマン氏、ランディ・シェクマン氏、トーマス・スードフ氏。細胞が物質を運ぶ仕組みの解明 2012年：幹細胞研究の先駆者、ジョン・ガードン氏と山中伸弥氏。成熟した細胞を幹細胞に変化させた功績 2011年：ブルース・ボイトラー氏、ジュール・ホフマン氏、ラルフ・スタインマン氏。感染症に対する免疫システムの理解の革新 2010年：ロバート・エドワーズ氏。体外授精による不妊治療を確立し、1978年7月に初の「試験管ベイビー」を誕生させた功績 2009年：エリザベス・ブラックバーン氏、キャロル・グライダー氏、ジャック・ショスタク氏。染色体末端に位置するテロメアの発見 （英語記事 Nobel prize for landmark cancer therapy）", "text_zh": "米歇尔·罗伯茨，BBC新闻网健康事务主编 美国得克萨斯大学的詹姆斯·P·艾利森教授（70岁）与日本京都大学的本庶佑特别教授（76岁）的研究，为晚期高致死性皮肤癌的治疗作出了贡献。 主办诺贝尔奖的瑞典学院解释称，免疫检查点抑制疗法为癌症治疗带来了革命。 多名专家评价称，这一疗法已被证明“格外有效”。 艾利森与本庶将分享900万瑞典克朗（约1亿1500万日元）的奖金。 对于获奖，本庶对记者团表示：“为了能够拯救比以往更多的患者，我想再继续进行一段研究。” 艾利森教授则高兴地表示：“见到借助免疫检查点抑制药物战胜癌症的患者，是一种美妙而动人心弦的荣誉。因为患者们正是基础科学的力量、以及我们想要学习事物并理解其机制的心愿的活见证。” 治疗无法治疗之症 免疫系统在保护人体免受疾病侵害的同时，也拥有自我防卫功能，以避免攻击自身的组织。 本庶特别教授与京都大学团队 一部分癌症能够利用这种“刹车”，逃脱免疫系统的攻击。 艾利森教授与本庶教授发现了通过阻断驱动这一刹车的蛋白质、使免疫系统得以攻击癌症的方法。 基于这一发现，针对以往被认为无法治疗的晚期癌症的新药得以开发，成为患者的希望。 在英国的国民保健制度（NHS）中，免疫检查点抑制疗法被用于皮肤癌中病情特别严重的“恶性黑色素瘤”患者。 这种疗法并非对所有人都有效，但对一部分患者似乎发挥了惊人的威力。其中甚至有在癌症开始向全身转移之后，癌细胞完全消失的病例。 对于病情已发展到全身转移的患者，以前从未有过能使症状改善到如此程度的疗法。 詹姆斯·艾利森教授 这种疗法不仅用于皮肤癌，也被用于晚期肺癌患者。 英国癌症研究所的查尔斯·斯旺顿教授祝贺两位获奖者称：“凭借这项划时代的研究，免疫系统原本针对癌症所拥有的力量得以利用，并与治疗方法联系起来。多亏于此，癌症患者的生命至今仍在不断得到拯救。免疫促进剂使晚期黑色素瘤、肺癌、肾癌等许多束手无策的患者的前景为之一变。” “以（两位教授的）发现为契机而绽放的免疫疗法领域，还刚刚诞生。思考这项研究今后将如何发展、会产生怎样的新可能性，是一件乐事。” 医学生理学奖是诺贝尔奖中最先公布的奖项。 瑞典学院已于5月宣布，因相关人士的性侵嫌疑，今年的文学奖将暂停颁发。 过去10年的诺贝尔医学生理学奖得主 2017年：杰弗里·霍尔、迈克尔·罗斯巴什、迈克尔·扬。发现控制生物钟（昼夜节律）的机制 2016年：大隅良典。阐明细胞分解自身蛋白质的机制 2015年：威廉·C·坎贝尔、大村智、屠呦呦。发现针对寄生虫感染症的治疗药物 2014年：约翰·奥基夫、迈布里特·莫泽、爱德华·莫泽。发现大脑内的空间认知系统 2013年：詹姆斯·罗斯曼、兰迪·谢克曼、托马斯·聚德霍夫。阐明细胞运输物质的机制 2012年：干细胞研究的先驱约翰·格登与山中伸弥。将成熟细胞转变为干细胞的功绩 2011年：布鲁斯·博伊特勒、朱尔·霍夫曼、拉尔夫·斯坦曼。革新了对感染症免疫系统的理解 2010年：罗伯特·爱德华兹。确立体外受精不孕治疗、并于1978年7月使首个“试管婴儿”诞生的功绩 2009年：伊丽莎白·布莱克本、卡罗尔·格雷德、杰克·绍斯塔克。发现位于染色体末端的端粒 （英文报道 Nobel prize for landmark cancer therapy）", "reference_summary": "人体の免疫システムを使ってがんと戦う手法を発見した科学者2人が、今年のノーベル医学生理学賞を受賞した。", "ref_zh": "发现利用人体免疫系统对抗癌症方法的两名科学家，获得了今年的诺贝尔医学生理学奖。", "summaries": [{"summary_id": "45715110_3531d1d8", "summary": "人体の免疫システムを使ってがんと戦う手法を発見した科学者2人が、今年のノーベル医学生理学賞を受賞した。", "zh": "发现利用人体免疫系统对抗癌症方法的两名科学家，获得了今年的诺贝尔医学生理学奖。"}, {"summary_id": "45715110_61cc91cf", "summary": "米ハーバード大学のジェイムズ・P・アリソン教授と京都大学の本庶佑特別教授が、人体の免疫システムを活用するがん治療法「免疫チェックポイント阻害療法」の発見により、2018年ノーベル医学生理学賞を共同受賞した。賞金500万スウェーデンクローナを2人で分け合う。同療法は進行性の皮膚がんや肺がんなど従来は治療不可能とされた例でも顕著な効果を示しており、がん治療に革命をもたらしたと評価されている。", "zh": "美国哈佛大学的詹姆斯·P·艾利森教授与京都大学的   q=(q||"").toLowerCase();
  listEl.innerHTML="";
  DATA.forEach((a,i)=>{
    if(q && !(a.title.toLowerCase().includes(q)||(a.title_zh||"").toLowerCase().includes(q))) return;
    const div=document.createElement("div");
    div.className="item"+(current===i?" active":"");
    div.innerHTML=`<div class="t">${esc(a.title)}</div>
      <div class="tz">${esc(a.title_zh||"")}</div>
      <div class="m">article_id: ${esc(a.article_id)}</div>`;
    div.onclick=()=>{ current=i; renderList(document.getElementById("search").value); renderMain(a); };
    listEl.appendChild(div);
  });
}
function zhblk(t){ return t?`<div class="zhblk">${esc(t)}</div>`:""; }
function renderMain(a){
  mainEl.innerHTML=`
  <div class="card">
    <h2>${esc(a.title)}</h2>
    <div class="h2zh">${esc(a.title_zh||"")}</div>
    <div class="meta">article_id: ${esc(a.article_id)} · <a href="${esc(a.url)}" target="_blank">url ↗</a></div>
    <div class="field">reference_summary</div>
    <div class="ja">${esc(a.reference_summary)}</div>
    ${zhblk(a.ref_zh)}
    <div class="field">text</div>
    <div class="ja">${esc(a.text)}</div>
    ${zhblk(a.text_zh)}
  </div>
  <div class="card">
    <div class="field" style="margin-top:0">summaries.jsonl 中 article_id 匹配的记录(${a.summaries.length} 条)</div>
    ${a.summaries.map(s=>`
      <div class="sumcard">
        <div class="sumhead">summary_id: ${esc(s.summary_id)}</div>
        <div class="ja">${esc(s.summary)}</div>
        ${zhblk(s.zh)}
      </div>`).join("")}
  </div>`;
  mainEl.scrollTop=0;
}
document.getElementById("search").addEventListener("input",e=>renderList(e.target.value));
document.getElementById("zhcb").addEventListener("change",e=>{
  document.body.classList.toggle("zh",e.target.checked);
});
renderList("");
</script>
</body>
</html>
