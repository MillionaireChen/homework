4年に仏エールフランスとオランダのKLM航空が合併して誕生し、欧州の航空会社でも最大手の1社。フランス政府はの株式14.3％を保有している。 連日のストにもかかわらず、エールフランスは7日のフライトについて、長距離便は99％、中距離便は80％、短距離便は87％が通常運航できるだろうと話した。 労使交渉でジャナイヤック会長は、向こう4年で7％賃上げする案を提示したものの、労働組合はこれを拒否。これが同会長の辞任につながった。 エールフランスの本社前で抗議する従業員（4月11日、パリ） エールフランスKLMは、2018年第1四半期（1～3月）に2億6900万ユーロ（351億円）の最終赤字を計上した。 英同業ブリティッシュ・エアウェイズや独ルフトハンザ航空は近年、格安航空や中東の航空会社の台頭による競争激化で大幅なコスト削減を強いられている。アナリストによると、こうしたなかエールフランスはリストラ戦略で他社に後れをとっており、赤字が続いていた。 エールフランスKLMはすでに、今年の業績見通しを下方修正している。 フランスでは、エマニュエル・マクロン仏大統領が公共部門の労働改革を進めている。4月にはフランス国鉄（SNCF）の抜本的改革に反対するストライキが始まったほか、メーデーにはデモ隊が暴徒化するなど、混乱が続いている。 エールフランスに対する政府の対応は、労働改革の試金石となりそうだ。 （英語記事 Air France survival in doubt, says minister）", "text_zh": "因劳资谈判破裂而被迫辞职的让-马克·雅纳亚克董事长兼CEO 到7日,罢工已进入第14天。 出演法国新闻节目BFM的勒梅尔表示:“我要求提出不合理加薪要求的全体客舱乘务员、地勤人员和飞行员采取负责任的行动。” 在此基础上,他一方面表示“法国航空能否存续是五五开”,另一方面称法国政府不会充当该公司债务的后盾。 法航荷航集团由法国航空与荷兰皇家航空(KLM)于2004年合并而成,是欧洲最大的航空公司之一。法国政府持有其14.3%的股份。 尽管罢工连日持续,法国航空表示,7日的航班中,长途航班的99%、中程航班的80%、短途航班的87%预计能够正常运营。 在劳资谈判中,雅纳亚克董事长提出了今后4年加薪7%的方案,但遭到工会拒绝。这导致了该董事长的辞职。 在法国航空总部前抗议的员工(4月11日,巴黎) 法航荷航集团在2018年第一季度(1至3月)录得2.69亿欧元(351亿日元)的最终亏损。 英国同业英国航空和德国汉莎航空近年来因廉价航空及中东航空公司的崛起导致竞争加剧,被迫大幅削减成本。据分析师称,在这种情况下,法国航空在重组战略上落后于其他公司,亏损持续。 法航荷航集团已经下调了今年的业绩预期。 在法国,总统埃马纽埃尔·马克龙正在推进公共部门的劳动改革。4月,反对对法国国营铁路公司(SNCF)进行彻底改革的罢工开始,五一劳动节当天示威队伍演变为暴徒,混乱持续。 政府对法国航空的应对,很可能成为劳动改革的试金石。 (英语报道 Air France survival in doubt, says minister)", "reference_summary": "フランスのブルーノ・ル・メール経済・財政相は6日、賃上げをめぐってストが続いているエールフランス航空が「消滅する」可能性があると懸念を示した。同社の労働組合は5.1％の賃上げを求めているが、交渉は難航。10日には、親会社エールフランスKLMのジャンマルク・ジャナイヤック会長兼最高経営責任者（CEO）が辞任する事態となっている。", "ref_zh": "法国经济与财政部长布鲁诺·勒梅尔6日表示,围绕加薪问题罢工持续的法国航空有“消失”的可能,对此表示担忧。该公司工会要求加薪5.1%,但谈判陷入僵局。10日,母公司法航荷航集团的让-马克·雅纳亚克董事长兼首席执行官(CEO)辞职,事态发展至此。", "summaries": [{"summary_id": "44026917_0884546b", "summary": "賃上げ交渉がまとまらずストライキが続くエールフランス航空について、仏ル・メール経済相は「経営危機は解消された」として存続に強い自信を示した。", "zh": "关于加薪谈判未能谈拢、罢工持续的法国航空,法国经济部长勒梅尔表示“经营危机已经解除”,对其存续显示出强烈信心。"}, {"summary_id": "44026917_27f86779", "summary": "フランスのブルーノ・ル・メール経済・財政相は6日、賃上げをめぐってストが続いているエールフランス航空が「消滅する」可能性があると懸念を示した。同社の労働組合は5.1％の賃上げを求め", "zh": "法国经济与财政部长布鲁诺·勒梅尔6日表示,围绕加薪问题罢工持续的法国航空有“消失”的可能,对此表示担忧。该公司工会要求加薪5.1%"}, {"summary_id": "44026917_68047f05", "summary": "フランスのブルーノ・ル・メール経済・財政相は6日、賃上げをめぐってストが続いているエールフランス航空が「消滅する」可能性があると懸念を示した。同社の労働組合は5.1％の賃上げを求めているが、交渉は難航。10日には、親会社エールフランスKLMのジャンマルク・ジャナイヤック会長兼最高経営責任者（CEO）が辞任する事態となっている。", "zh": "法国经济与财政部长布鲁诺·勒梅尔6日表示,围绕加薪问题罢工持续的法国航空有“消失”的可能,对此表示担忧。该公司工会要求加薪5.1%,但谈判陷入僵局。10日,母公司法航荷航集团的让-马克·雅纳亚克董事长兼首席执行官(CEO)辞职,事态发展至此。"}, {"summary_id": "44026917_d7618f85", "summary": "賃上げ交渉の難航でストが続くエールフランス航空について、仏ル・メール経済相は「存続できるかは五分五分だ」と警告した。", "zh": "关于因加薪谈判难以推进而罢工持续的法国航空,法国经济部长勒梅尔警告称“能否存续是五五开”。"}, {"summary_id": "44026917_e93097e2", "summary": "労使交渉決裂で辞任に追い込まれたジャンマルク・ジャナイヤック会長兼CEO ストは7日で14日目に突入している。フランスのニュース番組BFMに出演したル・メール氏は、「私は不当な賃上げを要求している客室乗務員や地上勤務社員、パイロット全員に責任ある行動を求める」と発言した。その上で、「エールフランスが存続できるかは五分五分だ」と述べた一方、フランス政府は同社の負債のバックネット役にはならないとしている。", "zh": "因劳资谈判破裂而被迫辞职的让-马克·雅纳亚克董事长兼CEO 到7日,罢工已进入第14天。出演法国新闻节目BFM的勒梅尔表示:“我要求提出不合理加薪要求的全体客舱乘务员、地勤人员和飞行员采取负责任的行动。”在此基础上,他一方面表示“法国航空能否存续是五五开”,另一方面称法国政府不会充当该公司债务的后盾。"}]}, {"article_id": "41875333", "url": "https://www.bbc.com/japanese/41875333", "title": "トランプ米大統領、訪日 米国の決意強調", "title_zh": "美国总统特朗普访日 强调美国的决心", "text": "埼玉県川越市のゴルフ場「霞ヶ関カンツリー倶楽部」を訪れた、ドナルド・トランプ米大統領と安倍晋三首相（5日） 5日午前10時半すぎに東京の米軍横田基地に到着したトランプ大統領は、米軍が平和と自由を守るために必要な予算・人員・装備などのリソースを必ず確保すると約束した。 在日米軍と自衛隊の歓迎に出迎えられたトランプ氏は、「それが誰だろうと、どの独裁者もどの独裁政権も、米国の決意のほどを軽視してはならない」と演説した。 大統領専用機エアフォース・ワンで到着したトランプ氏は着陸前、同行記者団に対して、アジア歴訪中にロシアのウラジーミル・プーチン大統領と会談する予定だと話した。 「プーチンと会う予定だと思う」、「北朝鮮についてプーチンの手助けが欲しい」と大統領は話した。 トランプ氏は日本を皮切りに、14日までの間に韓国、中国、ベトナム、フィリピンのアジア5か国を訪れる。米大統領のアジア訪問としては過去25年間で、日数的に最長のものとなる。日本は5日から7日まで、2泊3日の予定。 トランプ氏は、埼玉県川越市のゴルフ場「霞ヶ関カンツリー倶楽部」を訪れ、安倍晋三首相と昼食を共にした後、プロゴルファーの松山英樹選手を交えてゴルフをした。 在日米軍横田基地で兵士たちに挨拶するトランプ氏（5日、東京・福生） トランプ大統領は日本の前にはハワイに立ち寄り、1941年の旧日本軍による真珠湾攻撃で沈没した戦艦アリゾナの乗組員を追悼するアリゾナ記念館を訪問した。日本の真珠湾攻撃は、米軍の第2次世界大戦参戦のきっかけとなった。大統領は、太平洋軍司令部も訪れた。 北朝鮮の核・ミサイル開発をめぐり地域の緊張感が高まるなかでの、米大統領訪問となる。 トランプ氏はこれまでに、北朝鮮の核実験や大陸間弾道ミサイル発射について、北朝鮮が現在のような主張を続けるならば体制は「長く続かない」とツイートするなど、激しく北朝鮮を非難。北朝鮮外相はこれについて米国の「宣戦布告」だと受け止めると発言するなど、非難の応酬が続いていた。 ただし大統領の側近たちによると、トランプ氏は今回の訪韓では韓国と北朝鮮の間の軍事境界線は訪れない。首都ソウル南にある米軍ハンフリーズ基地を訪れる予定という。文在寅大統領と会談し、国会で演説する。 トランプ氏、アジアへ 日本など5カ国の思惑は 8日には中国を訪れ、習近平国家主席と会談する。 ベトナムでは、ダナンで10、11日に開かれるアジア太平洋経済協力会議（APEC）首脳会議に出席するほか、首都ハノイを公式訪問し、チャン・ダイ・クアン国家主席などベトナム政府幹部と会談する。 最後に訪れるフィリピンでは、マニラで13日に開かれる東南アジア諸国連合（ASEAN）首脳会議と、14日の東アジアサミットに出席する予定。ロドリゴ・デュテルテ大統領との会談も予定されている。 米大統領はこれほど長期にわたりアジア各国を訪れるのは、1991年末から1992年初めにかけてのジョージ・H・W・ブッシュ大統領による歴訪以来。 （英語記事 Trump pledges US resolve on Japan leg of Asia tour）", "text_zh": "到访埼玉县川越市高尔夫球场“霞关乡村俱乐部”的美国总统唐纳德·特朗普与日本首相安倍晋三(5日) 5日上午10时半过后抵达东京美军横田基地的特朗普总统承诺,一定会确保美军为守护和平与自由所需的预算、人员、装备等资源。 受到驻日美军和自卫队欢迎的特朗普发表演说称:“无论是谁,任何独裁者、任何独裁政权,都不得轻视美国的决心。” 乘坐总统专机“空军一号”抵达的特朗普在降落前对随行记者团表示,他计划在亚洲之行期间与俄罗斯总统弗拉基米尔·普京会谈。 总统表示:“我想我会和普京见面”,“在朝鲜问题上,我希望得到普京的帮助”。 特朗普以日本为起点,将在14日之前访问韩国、中国、越南、菲律宾等亚洲5国。就天数而言,这是过去25年间美国总统时间最长的一次亚洲访问。日本站为5日至7日,预定停留2晚3天。 特朗普到访埼玉县川越市的高尔夫球场“霞关乡村俱乐部”,与安倍晋三首相共进午餐后,与职业高尔夫球手松山英树一同打了高尔夫。 在驻日美军横田基地向士兵们致意的特朗普(5日,东京·福生) 特朗普总统在访日之前先经停夏威夷,参观了悼念1941年旧日本军偷袭珍珠港中沉没的战列舰“亚利桑那”号舰员的亚利桑那纪念馆。日本偷袭珍珠港成为美军参加第二次世界大战的契机。总统还访问了太平洋司令部。 此次美国总统访问,正值围绕朝鲜核、导弹开发,地区紧张感升温之际。 特朗普此前曾就朝鲜的核试验和洲际弹道导弹发射发推称,如果朝鲜继续目前这样的主张,其体制将“不会长久”,对朝鲜进行了猛烈抨击。朝鲜外相则表示将把这视为美国的“宣战布告”,双方的指责交锋持续不断。 不过据总统的亲信们透露,特朗普此次访韩时不会前往韩国与朝鲜之间的军事分界线,而是计划访问位于首都首尔以南的美军汉弗莱斯基地。他将与文在寅总统会谈,并在国会发表演讲。 特朗普出访亚洲 日本等5国各有盘算 8日,他将访问中国,与国家主席习近平会谈。 在越南,他除了出席10日、11日在岘港举行的亚太经济合作组织(APEC)领导人会议外,还将正式访问首都河内,与国家主席陈大光等越南政府高层会谈。 在最后到访的菲律宾,他预定出席13日在马尼拉举行的东南亚国家联盟(ASEAN)领导人会议以及14日的东亚峰会。还预定与总统罗德里戈·杜特尔特举行会谈。 美国总统上一次进行如此长时间的亚洲各国访问,还要追溯到1991年底至1992年初乔治·H·W·布什总统的历访。 (英语报道 Trump pledges US resolve on Japan leg of Asia tour)", "reference_summary": "ドナルド・トランプ米大統領は5日、アジア5カ国歴訪の皮切りとして日本に到着し、どの国も米国の決意を軽く見てはならないと強調した。", "ref_zh": "美国总统唐纳德·特朗普5日抵达日本,开启亚洲五国之行的首站,并强调任何国家都不得轻视美国的决心。", "summaries": [{"summary_id": "41875333_06c27e30", "summary": "ドナルド・トランプ米大統領は5日、アジア5カ国歴訪の皮切りとして日本に到着し、在日米軍に対し「どの独裁者も米国の決意を軽視してはならない」と演説した。北朝鮮の核・ミサイル開発で地域の緊張が高まる中での訪問となる。日本では安倍首相と昼食とゴルフを共にし、2泊3日の日程を予定している。", "zh": "美国总统唐纳德·特朗普5日抵达日本,开启亚洲五国之行的首站,并向驻日美军发表演说称“任何独裁者都不得轻视美国的决心”。此次访问正值朝鲜核、导弹开发导致地区紧张升温之际。在日本,他与安倍首相共进午餐并一同打高尔夫,预定停留2晚3天。"}, {"summary_id": "41875333_398f4a38", "summary": "ドナルド・トランプ米大統領は5日、アジア5カ国歴訪の皮切りとして日本に到着し、どの国も米国の決意を軽く見てはならないと強調した。", "zh": "美国总统唐纳德·特朗普5日抵达日本,开启亚洲五国之行的首站,并强调任何国家都不得轻视美国的决心。"}, {"summary_id": "41875333_aa36a21a", "summary": "ドナルド・トランプ米大統領は5日、アジア5カ国歴訪の皮切りとして日本に到着し、在日米軍に対し「米国はもはや世界の警察ではない」と演説した。北朝鮮の核・ミサイル開発で地域の緊張が高まる中での訪問となる。日本では安倍首相と昼食とゴルフを共にし、2泊3日の日程を予定している。", "zh": "美国总统唐纳德·特朗普5日抵达日本,开启亚洲五国之行的首站,并向驻日美军发表演说称“美国已不再是世界警察”。此次访问正值朝鲜核、导弹开发导致地区紧张升温之际。在日本,他与安倍首相共进午餐并一同打高尔夫,预定停留2晚3天。"}, {"summary_id": "41875333_beaac925", "summary": "ドナルド・トランプ米大統領は5日、アジア5カ国歴訪の皮切りとして日本に到着し、どの国も米国の決意を軽く見てはならないと強調した。", "zh": "美国总统唐纳德·特朗普5日抵达日本,开启亚洲五国之行的首站,并强调任何国家都不得轻视美国的决心。"}, {"summary_id": "41875333_d558c42b", "summary": "埼玉県川越市のゴルフ場「霞ヶ関カンツリー倶楽部」を訪れた、ドナルド・トランプ米大統領と安倍晋三首相（5日） 5日午前10時半すぎに東京の米軍横田基地に到着したトランプ大統領は、米軍が平和と自由を守るために必要な予算・人員・装備などのリソースを必ず確保すると約束した。在日米軍と自衛隊の歓迎に出迎えられたトランプ氏は、「それが誰だろうと、どの独裁者もどの独裁政権も、米国の決意のほどを軽視してはならない」と演説した。大統領専用機エアフォース・ワンで到着したトランプ氏は着陸前、同行記者団に対して、アジア歴訪中にロシアのウラジーミル・プーチン大統領と会談する予定だと話した。", "zh": "到访埼玉县川越市高尔夫球场“霞关乡村俱乐部”的美国总统唐纳德·特朗普与日本首相安倍晋三(5日) 5日上午10时半过后抵达东京美军横田基地的特朗普总统承诺,一定会确保美军为守护和平与自由所需的预算、人员、装备等资源。受到驻日美军和自卫队欢迎的特朗普发表演说称:“无论是谁,任何独裁者、任何独裁政权,都不得轻视美国的决心。”乘坐总统专机“空军一号”抵达的特朗普在降落前对随行记者团表示,他计划在亚洲之行期间与俄罗斯总统弗拉基米尔·普京会谈。"}]}, {"article_id": "44708203", "url": "https://www.bbc.com/japanese/44708203", "title": "タイ洞窟で行方不明の少年ら 公開動画で元気な姿", "title_zh": "泰国洞穴中失踪的少年们 公开视频显示健康身影", "text": "The boys can be seen introducing themselves next to a diver in a wetsuit 少年たちは笑顔を見せ、時には笑い声を上げながら、1人ずつ自己紹介した。 少年と監督は、洞窟の深部にいたところ、水位の上昇で抜け出せなくなり、9日間にわたり行方不明となっていたが、2日に発見された。少年らはその後、食料の供給を受けたほか、治療も受けている。 しかし少年たちは、潜水のやり方を学ぶか水位が下がるのを待たねばならず、救出作業には数カ月かかる可能性もある。 雨季がまだ始まったばかりで、少年たちがいるタムルアン洞窟の水位が上昇し続けるのはほぼ間違いないことが懸念となっている。 タイSEALは4日朝、同部隊の公式フェイスブックページに動画を投稿した。動画では、体を温かく保つため、アルミホイル製の毛布のようなものに包まった少年たちが確認できる。 少年たちは皆、自分の名前を述べ、タイで伝統的なあいさつのポーズをした ダイバーの隣に座り、懐中電灯に照らされた少年たちは、1人ずつ名前を述べ、両手の手のひらを合わせる「ワイ」と呼ばれる伝統的なあいさつのポーズを示した。 その他2つの動画には、軽いかすり傷を負った少年たちが軍の医師に治療を受ける様子が映っている。少年たちは動画で、いつ追加の食料が届くかも繰り返し尋ねている。 洞窟の岩肌にサッカーチームと救助活動に参加する海軍部隊の名前が書かれているのが分かる。 「救出にはよい状況」 医師や看護師を含む何人かのダイバーが、3日から洞窟に入り少年たちに付き添っている。 救出隊は少年たち全員を安全に救い出す最良の方法を検討している。当局者は、危険は冒さないとしている。 当局者は4日朝に開かれた記者会見で、実際に救助へ赴く計画は同日にはないとしたものの、救助への予行演習には完璧な状況だと述べた。 水位を下げるため、洞窟地帯からのポンプによる注水は続いている。当局者は、少年たちがいる空洞は浸水しないように出来ると確信していると述べた。 救急隊は、少年たちが家族と話せるよう電話線を引くことも試みている。ただ、3日の挑戦は失敗に終わった。 洞窟の外では、少年たちが近く救出される場合に備えて、医療関係者による治療の予行演習が行われている。 BBCミャンマー特派員のニック・ビーク記者はツイッターに、立ち並ぶ軍人の動画とともに、「少年たちが閉じ込められている洞窟を軍隊が取り囲み、救助が行われた場合に医療関係者がどう動けばいいかの予行訓練ができるようにしている」と投稿した。 少年らが洞窟入りするまで 11歳から16歳の少年12と25歳のサッカーチーム監督は、6月23日から行方不明になっていた。一行がチェンライ県北部の洞窟に入った時には洞窟は乾燥していたが、突然の豪雨により入り口への道が閉ざされたと考えられている。 少年たちは洞窟の乾燥した箇所を動くことが出来たと思われるが、入ってきた水により狭い通路が泥や障害物でふさがれ、視界が悪くなり、通り抜けもできなくなったと考えられている。 発見の経緯 少年たちは2日の夜遅く、2人の英国人ダイバーによって発見された。少年たちが洞窟入りしてから9日目の発見だった。 少年たちは、洞窟の入り口から約4キロ進んだ岩棚に身を寄せ合っていた。 発見の瞬間、しかし救出は？ タイ洞窟で行方不明の少年ら 少年たちが最初に見つかった時の動画も、タイSEALによりフェイスブックで公開されている。 動画では、水位より上の岩棚に座り、懐中電灯に照らされた少年たちの姿が確認できる。少年たちはダイバーの問いかけに対し、13人全員がそこにおり、とてもお腹が空いていると答えた。 洞窟脱出の方法は タムルアン洞窟地帯は雨季の間、よく浸水する。雨季は9月か10月まで続く。 さらに豪雨があれば水位上昇の可能性があり、少年たちが避難している空気溜まりにも危険が及ぶかもしれない。 専門家は、泥で重くなり視界もない危険な水路を経験のないダイバーが進むことの危険性を警告している。また、取り残された少年たちの中は全員泳げないという。 他の救出部隊は、洞窟に入ることができ、出口にもなる他の経路の発見を目指して、山肌を捜索している。 （英語記事 Thailand cave: New video shows boys in good health）", "text_zh": "可以看到少年们在一名身穿潜水服的潜水员旁做自我介绍 少年们面带笑容，时而发出笑声，逐一进行了自我介绍。 少年们和教练当时身处洞穴深处，因水位上升而无法脱身，失踪长达9天后，于2日被发现。少年们此后获得了食物供应，并接受了治疗。 但少年们要么必须学习潜水方法，要么必须等待水位下降，救援工作可能需要数月时间。 令人担忧的是，雨季才刚刚开始，少年们所在的坦銮洞穴的水位几乎肯定会持续上升。 泰国海豹部队（SEAL）4日上午在该部队的官方脸书页面上发布了视频。视频中可以确认，为保持身体温暖，少年们裹着类似铝箔制毯子的东西。 少年们都报出了自己的名字，并做出了泰国传统的问候姿势 少年们坐在潜水员旁边，在手电筒的照射下，逐一报出名字，并做出双手合十、被称为“威”（wai）的传统问候姿势。 另外两段视频中，拍到了受了轻微擦伤的少年们接受军医治疗的情形。少年们在视频中还反复询问追加的食物何时送到。 可以看到，洞穴的岩壁上写着足球队以及参与救援行动的海军部队的名字。 “对救援而言是良好状况” 包括医生和护士在内的数名潜水员自3日起进入洞穴，陪伴在少年们身边。 救援队正在研究将全部少年安全救出的最佳方法。当局者表示，不会冒险。 当局者在4日上午举行的记者会上表示，虽然当天没有实际前往救援的计划，但目前是进行救援预演的完美状况。 为降低水位，从洞穴地带用泵抽水的作业仍在继续。当局者表示，确信可以做到让少年们所在的洞穴空腔不被水淹没。 救援队还在尝试铺设电话线，以便少年们能与家人通话。不过，3日的尝试以失败告终。 在洞穴外，医疗人员正在进行治疗预演，以备少年们近期获救。 BBC驻缅甸特派记者尼克·比克在推特上发布了一段军人列队的视频，并写道：“军队正包围着少年们被困的洞穴，以便医疗人员能够预先演练一旦展开救援时应如何行动。” 少年们进入洞穴的经过 11岁至16岁的12名少年和25岁的足球队教练自6月23日起下落不明。据信，一行人进入清莱府北部的洞穴时，洞穴还是干燥的，但突降的暴雨封住了通往入口的道路。 少年们被认为曾能在洞穴的干燥地带活动，但灌入的水使狭窄的通道被泥浆和障碍物堵塞，视野变差，也无法通行。 发现的经过 少年们于2日深夜被两名英国潜水员发现。这是少年们进入洞穴后第9天的发现。 少年们当时挤在距洞穴入口约4公里处的岩架上。 发现的瞬间，然而救援呢？ 泰国洞穴中失踪的少年们 少年们最初被发现时的视频，也已由泰国海豹部队（SEAL）在脸书上公开。 视频中可以确认，少年们坐在高于水位的岩架上，被手电筒照亮。面对潜水员的询问，少年们回答说13人全都在这里，而且非常饿。 逃出洞穴的方法 坦銮洞穴地带在雨季期间经常被水淹没。雨季将持续到9月或10月。 如果再有暴雨，水位可能上升，少年们避难的空气穴也可能面临危险。 专家警告，让没有经验的潜水者穿越因泥浆而变得沉重、毫无视野的危险水路十分危险。此外，据称被困少年当中所有人都不会游泳。 其他救援部队正在山体表面搜索，力求发现其他能够进入洞穴、也可作为出口的路径。 （英文报道 Thailand cave: New video shows boys in good health）", "reference_summary": "タイ北部の洞窟で行方不明になっていた少年12人とサッカー監督について、タイ王国海軍特殊部隊（SEAL）は4日、新たな動画を公開した。動画では少年らが、自分たちの健康状態は良好だと語っている。", "ref_zh": "关于在泰国北部洞穴中失踪的12名少年和足球教练，泰国皇家海军特种部队（SEAL）4日公开了新的视频。视频中少年们表示，自己的健康状况良好。", "summaries": [{"summary_id": "44708203_437c2afb", "summary": "タイ北部の洞窟で9日間行方不明になっていた少年12人とサッカーチーム監督の深刻な健康状態が、タイ海軍特殊部隊（SEAL）の公開動画で明らかになった。少年たちは衰弱が著しく、まともに受け答えできない様子が映し出された。雨季で水位上昇が続く中、救出には数カ月を要する可能性もある。", "zh": "在泰国北部洞穴中失踪9天的12名少年和足球队教练的严重健康状况，通过泰国海军特种部队（SEAL）公开的视频曝光。视频中显示，少年们衰弱明显，无法正常应答。在雨季水位持续上升之中，救援可能需要数月时间。"}, {"summary_id": "44708203_47560d9c", "summary": "タイ北部の洞窟で9日間行方不明になっていた少年12人とサッカーチーム監督の元気な姿が、タイ海軍特殊部隊（SEAL）の公開動画で確認された。少年たちは懐中電灯に照らされながら自己紹介し、タイの伝統的な挨拶「ワイ」のポーズをとった。雨季で水位上昇が続く中、潜水訓練か水位低下を待つ選択があり、救出には数カ月を要する可能性もある。", "zh": "在泰国北部洞穴中失踪9天的12名少年和足球队教练的健康身影，通过泰国海军特种部队（SEAL）公开的视频得到确认。少年们在手电筒的照射下作了自我介绍，并做出泰国传统问候“威”的姿势。在雨季水位持续上升之中，可选择接受潜水训练或等待水位下降，救援可能需要数月时间。"}, {"summary_id": "44708203_584d8d23", "summary": "タイ北部の洞窟で行方不明になっていた少年12人とサッカー監督について、タイ王国海軍特殊部隊（SEAL）は4日、新たな動画を公開した。動画では少年らが、自分たちの健康状態は良好だと語っている。", "zh": "关于在泰国北部洞穴中失踪的12名少年和足球教练，泰国皇家海军特种部队（SEAL）4日公开了新的视频。视频中少年们表示，自己的健康状况良好。"}, {"summary_id": "44708203_6d931562", "summary": "赤ちゃんのころから誕生日を迎えるたび、18年物のスコッチウイスキーを父親からプレゼントされ続けてきたイギリス人男性（28）が、そのコレクションを売却しようとしている。高値での取引が見込まれており、男性は初の住宅購入の頭金に充てる予定だ。", "zh": "一名英国男子（28岁）从婴儿时期起，每逢生日都会收到父亲赠送的18年陈苏格兰威士忌，如今他打算出售这批收藏。这批威士忌有望以高价成交，男子准备将所得款项用作首次购房的首付。"}, {"summary_id": "44708203_daf3b32b", "summary": "The boys can be seen introducing themselves next to a diver in a wetsuit 少年たちは笑顔を見せ、時には笑い声を上げながら、1人ずつ自己紹介した。少年と監督は、洞窟の深部にいたところ、水位の上昇で抜け出せなくなり、9日間にわたり行方不明となっていたが、2日に発見された。少年らはその後、食料の供給を受けたほか、治療も受けている。", "zh": "可以看到少年们在一名身穿潜水服的潜水员旁做自我介绍 少年们面带笑容，时而发出笑声，逐一进行了自我介绍。少年们和教练当时身处洞穴深处，因水位上升而无法脱身，失踪长达9天后，于2日被发现。少年们此后获得了食物供应，并接受了治疗。"}]}, {"article_id": "34991666", "url": "https://www.bbc.com/japanese/34991666", "title": "米カリフォルニア福祉施設の乱射で14人死亡 武装男女も死亡", "title_zh": "美国加利福尼亚州福利设施枪击扫射事件致14人死亡 持枪男女也已死亡", "text": "乱射事件現場の警察特殊部隊 調べによると、銃撃犯たちは戦闘服のような服装で施設に乱入し、銃を乱射したのち黒いSUV（多目的スポーツ車）で逃走。事件発生から約4時間後、市内の住宅地で窓を撃ち抜かれた黒いSUVを警官隊が包囲した。このSUVと乱射事件の関連について警察は明らかにしていないが、現場で1人が射殺されたという。 米連邦捜査局（FBI）はテロ攻撃かまだ不明としているが、地元警察は国内テロの可能性があるとみている。 BBCのジェイムズ・クック記者は現場から、「つまりパリ連続襲撃のあとだけに、これがイスラム過激主義のテロだと示す直接証拠はないという意味だと思う」と解説。「むしろ、もしこれがテロ攻撃なら、米国内の独自のテロ攻撃かもしれないということだ」。 現場のインランド地域センターは、自閉症などで精神医療を必要とする大人を支援する医療施設。建物から避難する人の中には、医師や警官に付き添われストレッチャーで搬送される人もいた。 現場にいた大勢は用意されたバスで避難。周辺の建物で働く人たちは建物内に残り鍵をかけて待機しているという。 マルコス・アギレラさんの妻は事件発生当時、建物内にいたという。アギレラさんはABCニュースに「みんな妻のオフィスに隠れドアに鍵をかけたが、撃たれた人が倒れているのを見たそうだ」と話した。アギレラさんの妻は無事に脱出したという。 福祉センターで働く娘が建物内に隠れているというテリー・ペティットさんは報道陣に、「何人か撃たれた。オフィスでおまわりさんを待ってる。祈って。オフィスにたてこもってる」と娘がメールしてきたと話した。 サンバーナディーノの市街地で警察が黒いSUVを取り囲み数回発砲した 乱射事件のあった福祉施設の所長によると、施設は複合的な会議場の一角にあり、敷地内ではサンバーナディーノ郡公共衛生局がイベントを開いていた。 ＜英語ビデオ＞ 現場の建物内で娘が避難して隠れているという男性 オバマ米大統領は乱射事件の報告を受け、「世界のほかではどこにもない無差別発砲事件のパターンが、この国にはある。それは確かだ。すべての事件を防ぐことはできないが、頻度が確実に減るようにするための取り組みは可能だ」と述べた。 米国では11月27日にコロラド州の「家族計画」クリニックでも乱射事件があり、3人が死亡し9人が負傷したばかり。 カリフォルニア州サンバーナディーノの銃撃現場 事件現場周辺の地図", "text_zh": "枪击事件现场的警察特种部队 据调查，枪手们身穿类似作战服的服装闯入设施，扫射后乘坐黑色SUV（多功能运动车）逃走。事件发生约4小时后，警察在市内住宅区包围了一辆车窗被打穿的黑色SUV。警方尚未说明这辆SUV与枪击事件的关联，但据称有1人在现场被击毙。 美国联邦调查局（FBI）表示尚不清楚是否为恐怖袭击，但当地警方认为有可能是国内恐怖主义。 BBC记者詹姆斯·库克在现场解说称：“也就是说，我认为这意味着，正因为是在巴黎连环袭击之后，目前没有直接证据表明这是伊斯兰极端主义的恐怖袭击。”“毋宁说，如果这是恐怖袭击，那可能是美国国内自身的恐怖袭击。” 事发的内陆地区中心是一家支援自闭症等需要精神医疗的成年人的医疗设施。从建筑物中撤离的人当中，有人在医生和警察的陪同下被担架运送。 现场的许多人乘坐安排好的巴士撤离。据称，在周边建筑物工作的人们留在楼内，锁门等待。 马科斯·阿吉莱拉的妻子在事件发生时正在建筑物内。阿吉莱拉对ABC新闻说：“大家躲进我妻子的办公室并锁上了门，但她说看到有中枪的人倒在地上。”据称阿吉莱拉的妻子已平安脱身。 特里·佩蒂特说，他在福利中心工作的女儿正躲在建筑物内。他对媒体表示，女儿发来短信称：“有几个人中枪了。我们在办公室里等警察。为我们祈祷。我们正躲在办公室里。” 在圣贝纳迪诺市区，警察包围黑色SUV并数次开枪 据发生枪击事件的福利设施负责人称，该设施位于一处综合会议场所的一角，园区内圣贝纳迪诺县公共卫生局当时正在举办活动。 ＜英语视频＞ 一名男子称其女儿正在现场建筑物内避难躲藏 美国总统奥巴马在接到枪击事件的报告后表示：“这个国家存在世界其他任何地方都没有的无差别枪击事件的模式。这是确定无疑的。我们无法防止所有事件，但可以努力确保发生频率切实下降。” 在美国，11月27日科罗拉多州的“计划生育”诊所也刚刚发生枪击扫射事件，造成3人死亡、9人受伤。 加利福尼亚州圣贝纳迪诺的枪击现场 事发现场周边地图", "reference_summary": "米カリフォルニア州サンバーナディーノの福祉施設で2日、銃の乱射事件があり、少なくとも14人が死亡、17人が負傷した。実行犯は現場から逃走したが、その後警察との銃撃戦で武装した男と女の2人が死亡した。現場のインランド地域センターは障害のある大人を支援する医療施設。", "ref_zh": "美国加利福尼亚州圣贝纳迪诺的一处福利设施2日发生枪击扫射事件，至少14人死亡、17人受伤。行凶者从现场逃走，但随后在与警方的枪战中，持枪的一男一女2人死亡。事发的内陆地区中心是一家支援残障成年人的医疗设施。", "summaries": [{"summary_id": "34991666_52f88088", "summary": "米カリフォルニア州サンバーナディーノの福祉施設で2日、銃の乱射事件が発生し少なくとも14人が死亡、17人が負傷した。犯人の男女2人は現場から逃走した後、警察との銃撃戦で死亡した。", "zh": "美国加利福尼亚州圣贝纳迪诺的一处福利设施2日发生枪击扫射事件，至少14人死亡、17人受伤。凶手一男一女2人从现场逃走后，在与警方的枪战中死亡。"}, {"summary_id": "34991666_7b3a10b0", "summary": "米カリフォルニア州サンバーナディーノの福祉施設で2日、銃の乱射事件があり、少なくとも14人が死亡、17人が負傷した。実行犯は現場から逃走したが、", "zh": "美国加利福尼亚州圣贝纳迪诺的一处福利设施2日发生枪击扫射事件，至少14人死亡、17人受伤。行凶者从现场逃走，但"}, {"summary_id": "34991666_c1f887ae", "summary": "乱射事件現場の警察特殊部隊 調べによると、銃撃犯たちは戦闘服のような服装で施設に乱入し、銃を乱射したのち黒いSUV（多目的スポーツ車）で逃走。事件発生から約4時間後、市内の住宅地で窓を撃ち抜かれた黒いSUVを警官隊が包囲した。このSUVと乱射事件の関連について警察は明らかにしていないが、現場で1人が射殺されたという。", "zh": "枪击事件现场的警察特种部队 据调查，枪手们身穿类似作战服的服装闯入设施，扫射后乘坐黑色SUV（多功能运动车）逃走。事件发生约4小时后，警察在市内住宅区包围了一辆车窗被打穿的黑色SUV。警方尚未说明这辆SUV与枪击事件的关联，但据称有1人在现场被击毙。"}, {"summary_id": "34991666_eb217fa8", "summary": "米カリフォルニア州サンバーナディーノの福祉施設で2日、銃の乱射事件があり、少なくとも14人が死亡、17人が負傷した。実行犯は現場から逃走したが、その後警察との銃撃戦で武装した男と女の2人が死亡した。現場のインランド地域センターは障害のある大人を支援する医療施設。", "zh": "美国加利福尼亚州圣贝纳迪诺的一处福利设施2日发生枪击扫射事件，至少14人死亡、17人受伤。行凶者从现场逃走，但随后在与警方的枪战中，持枪的一男一女2人死亡。事发的内陆地区中心是一家支援残障成年人的医疗设施。"}, {"summary_id": "34991666_f6f8e339", "summary": "米カリフォルニア州サンバーナディーノの福祉施設で2日、銃の乱射事件が発生し少なくとも14人が死亡、17人が負傷した。犯人の男女2人は現場から逃走後、他州へ逃亡し引き続き警察の捜索対象となっている。", "zh": "美国加利福尼亚州圣贝纳迪诺的一处福利设施2日发生枪击扫射事件，至少14人死亡、17人受伤。凶手一男一女2人从现场逃走后，逃往其他州，目前仍是警方的搜捕对象。"}]}, {"article_id": "51145805", "url": "https://www.bbc.com/japanese/51145805", "title": "香港の航空会社、日本人女性に妊娠検査 「出産旅行」対策と", "title_zh": "香港航空公司对日本女性实施妊娠检查 称系“生育旅行”对策", "text": "サイパン育ちで現在は東京在住の西田みどりさん（25）は、昨年11月、香港発サイパン行きの便に搭乗する際、事前に申告書の質問に答え、妊娠していないと伝えていた。 しかし、香港エクスプレスの職員から、妊娠検査を受けるよう求められた。西田さんは職員に付き添われてトイレに行ったという。 尿検査の結果が陰性だとわかると搭乗が認められた。西田さんは、20年以上サイパンに住む家族に会いに行くところだったという。 西田さんは、「非常に屈辱的で腹立たしい」体験だったとした上で、これまで苦情を訴えていたのに航空会社からは何の返答もなかったと述べた。 米市民権を目当てに 米自治領のサイパン島は、外国籍の女性が、生まれてくる子供に米市民権を取得させるための、出産旅行の目的地として人気がある。 北マリアナ諸島のデータによると、同諸島では2018年、地元の人よりも多くの観光客が子供を出産した。これは、出産のために訪れた外国籍の女性が大きな要因だと考えられる。その多くは中国人だという。 香港エクスプレスは、妊娠検査は「米移民法が損なわれないようにする」ための対応だったとしている。 航空会社の説明 香港エクスプレスは、米NBCニュースに宛てた声明で、「我々は、このような対応で影響を受けた人に、率直にお詫び申し上げたい。（中略）我々は2019年2月以降、米移民法が損なわれないようにするために、こうした対応を取っていた」と説明。 北マリアナ諸島当局の間で高まっている懸念に基づき、行動したものだったと述べた。 「我々は、この対応を即時中断し、見直しを行っている」 （英語記事 Airline sorry for making woman take pregnancy test）", "text_zh": "在塞班长大、现居东京的西田绿（25岁）去年11月搭乘香港飞往塞班的航班时，已事先回答申报表的提问，表明自己没有怀孕。 然而，香港快运航空的工作人员却要求她接受妊娠检查。据称，西田在工作人员的陪同下去了洗手间。 在尿检结果显示为阴性后，她才被允许登机。据称，西田当时正要去看望在塞班居住了20多年的家人。 西田表示，这是一次“极其屈辱、令人愤怒”的经历，并称此前她一直在投诉，但航空公司没有任何回复。 以美国公民权为目的 美国自治领地塞班岛，作为外国籍女性让即将出生的孩子取得美国公民权的生育旅行目的地，颇受欢迎。 根据北马里亚纳群岛的数据，2018年在该群岛，游客生下的孩子比当地人还多。据认为，为生产而到访的外国籍女性是重要因素。据称其中许多是中国人。 香港快运航空表示，妊娠检查是为“确保美国移民法不受损害”而采取的应对措施。 航空公司的解释 香港快运航空在致美国NBC新闻的声明中解释称：“我们想向因这种应对而受到影响的人坦率地致歉。（中略）自2019年2月以来，为确保美国移民法不受损害，我们一直采取这样的应对措施。” 该公司表示，此举是基于北马里亚纳群岛当局日益高涨的担忧而采取的行动。 “我们已立即中止这一做法，并正在进行重新评估。” （英文报道 Airline sorry for making woman take pregnancy test）", "reference_summary": "香港の格安航空会社（LCC）香港エクスプレスが、米自治領・北マリアナ諸島のサイパン島行きの便に搭乗しようとした日本人女性に対し、妊娠検査を受けさせていたことが明らかになった。同社は、米市民権目的の「出産旅行」対策だっだと釈明している。", "ref_zh": "香港廉价航空公司（LCC）香港快运航空被曝对试图搭乘飞往美国自治领地北马里亚纳群岛塞班岛航班的日本女性实施妊娠检查。该公司辩解称，此举是针对以获取美国公民权为目的的“生育旅行”的对策。", "summaries": [{"summary_id": "51145805_0a1b1dc6", "summary": "同社は、米市民権目的の「出産旅行」対策だっだと釈明している。香港の格安航空会社（LCC）香港エクスプレスが、米自治領・北マリアナ諸島のサイパン島行きの便に搭乗しようとした日本人女性に対し、妊娠検査を受けさせていたことが明らかになった。", "zh": "该公司辩解称，此举是针对以获取美国公民权为目的的“生育旅行”的对策。香港廉价航空公司（LCC）香港快运航空被曝对试图搭乘飞往美国自治领地北马里亚纳群岛塞班岛航班的日本女性实施妊娠检查。"}, {"summary_id": "51145805_1639e27b", "summary": "香港の格安航空会社、香港エクスプレスが、サイパン行き便に搭乗しようとした日本人女性に妊娠検査を求めていたことが明らかになった。同社は、米市民権取得を目的とする「出産旅行」対策だったと釈明し、対応の即時中断と謝罪を表明した。サイパン島は米自治領で、出産旅行の目的地として知られている。", "zh": "香港廉价航空公司香港快运航空被曝曾要求试图搭乘飞往塞班航班的日本女性接受妊娠检查。该公司辩解称，此举是针对以获取美国公民权为目的的“生育旅行”的对策，并表示立即中止这一做法且予以道歉。塞班岛是美国自治领地，作为生育旅行的目的地而闻名。"}, {"summary_id": "51145805_1b36aaa6", "summary": "香港の格安航空会社（LCC）香港エクスプレスが、米自治領・北マリアナ諸島のサイパン島行きの便に搭乗しようとした日本人女性に対し、妊娠検査を受けさせていたことが明らかになった。同社は、米市民権目的の「出産旅行」対策だっだと釈明している。", "zh": "香港廉价航空公司（LCC）香港快运航空被曝对试图搭乘飞往美国自治领地北马里亚纳群岛塞班岛航班的日本女性实施妊娠检查。该公司辩解称，此举是针对以获取美国公民权为目的的“生育旅行”的对策。"}, {"summary_id": "51145805_3f3f4b05", "summary": "香港の格安航空会社、香港エクスプレスが、サイパン行き便に搭乗しようとした日本人女性に妊娠検査を求めていたことが明らかになった。同社は、今後も米移民法を遵守するため妊娠検査を継続する方針を表明している。サイパン島は米自治領で、出産旅行の目的地として知られている。", "zh": "香港廉价航空公司香港快运航空被曝曾要求试图搭乘飞往塞班航班的日本女性接受妊娠检查。该公司表明，今后为遵守美国移民法，将继续实施妊娠检查的方针。塞班岛是美国自治领地，作为生育旅行的目的地而闻名。"}, {"summary_id": "51145805_b160c17f", "summary": "サイパン育ちで現在は東京在住の西田みどりさん（25）は、昨年11月、香港発サイパン行きの便に搭乗する際、事前に申告書の質問に答え、妊娠していないと伝えていた。しかし、香港エクスプレスの職員から、妊娠検査を受けるよう求められた。西田さんは職員に付き添われてトイレに行ったという。", "zh": "在塞班长大、现居东京的西田绿（25岁）去年11月搭乘香港飞往塞班的航班时，已事先回答申报表的提问，表明自己没有怀孕。然而，香港快运航空的工作人员却要求她接受妊娠检查。据称，西田在工作人员的陪同下去了洗手间。"}]}, {"article_id": "43985653", "url": "https://www.bbc.com/japanese/43985653", "title": "米スタバで逮捕の黒人男性2人 賠償金1ドルで和解", "title_zh": "在美国星巴克被捕的2名黑人男子 以1美元赔偿金达成和解", "text": "ネルソンさん（写真左）とロビンソンさん（同右）は市からそれぞれ1ドルを受け取る。市はさらに若者を支援する事業を始める フィラデルフィアのジム・ケニー市長の報道官が2日、BBCニュースの取材に和解成立を確認した。 市はさらに、市内の公立高校に通う起業を目指す生徒たちを支援する新たな事業に20万ドル（約2190万円）を寄付すると約束した。 スターバックスは、従業員たちに人種差別を防ぐ研修の受講を義務付けると表明している。 ラション・ネルソンさんとドンティ・ロビンソンさんの2人は先月12日、スタバ店内で注文をしないで友人を待っていたところを逮捕された。これを受け、米国各地のスタバ店舗で抗議デモが行われ、同社社員が人種によって対応を変えているとの利用客の主張がソーシャルメディアで広められる動きがあった。 携帯電話で逮捕時の様子を撮影した映像では、店舗のマネージャーから営業妨害と不法侵入の通報を受けた警察官らが男性たちに手錠をかけ、店から連行している。 共に23歳で幼なじみのネルソンさんとロビンソンさんは、不動産関連の取引について話し合うためスタバ店舗にいたという。 2人は数時間にわたって勾留された後、釈放された。フィラデルフィア市警のリチャード・ロス本部長は警察の対応について謝罪した。 ケニー市長は発表文で、「市が訴えられる可能性を生産的な形で解決できたのをうれしく思う」とし、「この出来事は、我々の市に多くの苦痛を生じさせた」と述べた。 「敵対的になる可能性のある手続きに時間やお金、資源をつぎ込むのではなく、ラション・ネルソン、ドンティ・ロビンソン両氏は、何か前向きなことを生み出すため、市に働きかけ、我々と協力する提案をした。今回の合意はその対話によって得られたもので、これからの何カ月か、何年かで成果が生み出されるのを楽しみにしている」 スターバックスのケビン・ジョンソン最高経営責任者（CEO）は、フィラデルフィアを訪問し2人に直接謝罪した。 スターバックスは2人との共同発表文で、市とは別に和解金の支払いで合意したと述べた。金額は非公開となっているが、発表文は和解について「双方が前進し、スターバックス店舗で同じようなことが再び起きないようにする方法を検討し、対話し続けることを可能にするもの」だとしている。 合意ではさらに、2人に大学進学の奨学金を提供。また、スターバックスが「ダイバーシティと平等への長期的な取り組みの一環として」同社アドバイザー役への就任を要請したエリック・ホールダー元司法長官に2人が会う機会を設ける。 スターバックスは今月29日に、従業員に対する人種差別防止の研修のため、米国内の8000以上の店舗を一斉閉店する。 （英語記事 Starbucks race row: Black men arrested in Philadelphia cafe settle for $1）", "text_zh": "纳尔逊（照片左）和罗宾逊（照片右）将分别从市政府获得1美元。市政府还将启动支援年轻人的项目 费城市长吉姆·肯尼的发言人2日向BBC新闻证实和解已经达成。 市政府还承诺，向一项支援市内公立高中有志创业学生的新项目捐赠20万美元（约2190万日元）。 星巴克已表明，将强制要求员工接受防止种族歧视的培训。 拉肖恩·纳尔逊和东特·罗宾逊两人上月12日在星巴克店内没有点单、等待朋友时被逮捕。此事发生后，美国各地的星巴克门店出现抗议示威，另有顾客在社交媒体上传播称，该公司员工因种族不同而区别对待。 用手机拍摄的逮捕时的影像显示，接到店铺经理妨碍营业和非法侵入报警的警察给两名男子戴上手铐，将他们带出店铺。 同为23岁、从小相识的纳尔逊和罗宾逊当时是为商谈房地产相关交易而在星巴克店内。 两人被拘留数小时后获释。费城警察局长理查德·罗斯就警方的应对表示道歉。 肯尼市长在声明中表示：“我很高兴能以富有建设性的方式解决市政府可能被起诉的问题。”并称：“这一事件给我们的城市带来了许多痛苦。” “拉肖恩·纳尔逊和东特·罗宾逊两位先生没有把时间、金钱和资源投入可能变得对立的程序，而是提议与市政府接洽、同我们合作，以创造出某种积极的东西。这次的协议正是通过这样的对话达成的，我期待在今后的数月、数年里产生成果。” 星巴克首席执行官（CEO）凯文·约翰逊访问费城，直接向两人道歉。 星巴克在与两人的联合声明中表示，已在市政府之外另行就支付和解金达成协议。金额未公开，但声明称，这次和解“使双方能够向前迈进，并继续探讨和对话，研究如何避免星巴克门店再次发生同样的事情”。 协议还包括向两人提供大学升学奖学金。此外，还将安排两人与前司法部长埃里克·霍尔德会面，星巴克已邀请霍尔德出任公司顾问，作为“对多元化与平等的长期承诺的一部分”。 星巴克将于本月29日为对员工进行防止种族歧视培训，让美国国内8000多家门店统一停业。 （英文报道 Starbucks race row: Black men arrested in Philadelphia cafe settle for $1）", "reference_summary": "米ペンシルベニア州フィラデルフィア市で先月、コーヒー・チェーン大手スターバックスの店舗で 友人を待っていた黒人男性2人が逮捕 され、人種差別との批判が出ていたことをめぐり、市から2人にそれぞれ1ドル（約107円）の賠償金が象徴的に支払われることで和解が成立した。", "ref_zh": "围绕上月在美国宾夕法尼亚州费城市大型连锁咖啡企业星巴克门店内等待朋友的2名黑人男子被逮捕、引发种族歧视批评一事，双方达成和解，市政府将象征性地向2人分别支付1美元（约107日元）的赔偿金。", "summaries": [{"summary_id": "43985653_48644c97", "summary": "米ペンシルベニア州フィラデルフィアのスターバックス店舗で、注文をせず友人を待っていた黒人男性2人が先月逮捕された事件をめぐり、市と2人は和解に達した。市は象徴的な1ドルを支払うとともに、市内の公立高校の起業志望生徒を支援する事業に20万ドルを寄付する。スターバックスも別途和解金を支払い、全米8000以上の店舗で人種差別防止研修のため一斉休業する措置をとる。", "zh": "围绕上月在美国宾夕法尼亚州费城星巴克门店内没有点单、等待朋友的2名黑人男子被逮捕的事件，市政府与2人达成和解。市政府将支付象征性的1美元，并向支援市内公立高中有志创业学生的项目捐赠20万美元。星巴克也将另行支付和解金，并采取让全美8000多家门店为进行防止种族歧视培训而统一停业的措施。"}, {"summary_id": "43985653_48c93690", "summary": "シリア全土で30日午前零時（日本時間午前7時）に発効した政府軍と反政府勢力の停戦合意は、散発的な衝突のほかは終日ほぼ継続したもようだ。国連安全保障理事会は近く、停戦合意を支持する決議案（ロシア提出）について採決する見通し。", "zh": "叙利亚全境于30日凌晨零时（日本时间上午7时）生效的政府军与反政府势力的停火协议，除零星冲突外，全天大体得到维持。联合国安全理事会预计近期将就支持停火协议的决议草案（俄罗斯提交）进行表决。"}, {"summary_id": "43985653_5686321e", "summary": "ネルソンさん（写真左）とロビンソンさん（同右）は市からそれぞれ1ドルを受け取る。市はさらに若者を支援する事業を始める フィラデルフィアのジム・ケニー市長の報道官が2日、BBCニュースの取材に和解成立を確認した。市はさらに、市内の公立高校に通う起業を目指す生徒たちを支援する新たな事業に20万ドル（約2190万円）を寄付すると約束した。", "zh": "纳尔逊（照片左）和罗宾逊（照片右）将分别从市政府获得1美元。市政府还将启动支援年轻人的项目 费城市长吉姆·肯尼的发言人2日向BBC新闻证实和解已经达成。市政府还承诺，向一项支援市内公立高中有志创业学生的新项目捐赠20万美元（约2190万日元）。"}, {"summary_id": "43985653_8617611f", "summary": "米ペンシルベニア州フィラデルフィア市で先月、コーヒー・チェーン大手スターバックスの店舗で 友人を待っていた黒人男性2人が逮捕 され、人種差別との批判が出ていたことをめぐり、市から2人にそれぞれ1ドル（約107円）の賠償金が象徴的に支払われることで和解が成立した。", "zh": "围绕上月在美国宾夕法尼亚州费城市大型连锁咖啡企业星巴克门店内等待朋友的2名黑人男子被逮捕、引发种族歧视批评一事，双方达成和解，市政府将象征性地向2人分别支付1美元（约107日元）的赔偿金。"}, {"summary_id": "43985653_cf337693", "summary": "米ペンシルベニア州フィラデルフィアのスターバックス店舗で注文せず友人を待っていた黒人男性2人が先月逮捕された事件をめぐり、市は和解要求を拒否し、裁判で争う姿勢を示した。スターバックスも人種差別研修の実施要求を退け、店舗運営を通常通り継続する方針だ。", "zh": "围绕上月在美国宾夕法尼亚州费城星巴克门店内没有点单、等待朋友的2名黑人男子被逮捕的事件，市政府拒绝了和解要求，表明将在法庭上抗争的姿态。星巴克也驳回了实施种族歧视培训的要求，方针是照常继续门店运营。"}]}, {"article_id": "53732134", "url": "https://www.bbc.com/japanese/53732134", "title": "レバノン内閣総辞職 爆発受け、3日連続で反政府デモ", "title_zh": "黎巴嫩内阁总辞 爆炸后反政府示威连续3天", "text": "ハサン・ディアブ首相 ミシェル・アウン大統領は、新たな内閣が組まれるまで職務にとどまるよう現閣僚に求めた。 爆発ではこれまでに死者220人が確認され、さらに110人が行方不明となっている。ベイルートのマルワン・アブド県知事が、アルマルサド・オンラインニュースに語った。 アブド氏はまた、行方不明者には多数の外国人労働者やトラック運転手が含まれていると、テレビ局アルジャディードに語った。 ＜関連記事＞ 爆発の被害は現場から半径数キロの範囲に及んだ。市民20万人以上が住宅を失うか、窓やドアがない家に住むなどしている。 多くの市民らは、政府の怠慢と腐敗が爆発の原因として、同国指導層を非難。10日まで3日連続でデモが起こり、警官隊との衝突も発生している。 デモ参加者たちはベイルートの路上で花火を投げるなどした（10日） 映像には、国会への道路に設置された障害物の付近にデモ参加者らが集まり、治安部隊が催涙ガスを放っている様子が映し出されている。 爆発は、ベイルートの港湾地区の倉庫に長年にわたって危険な状況で保管されていた硝酸アンモニウムが直接の原因となった。 首相の演説 今年1月に首相に就任したディアブ首相は、この日のテレビ演説で自らを改革者として描き、政府は「この国を救うためのロードマップ作成に多大な努力をした」と主張。根強い抵抗で妨害されたと訴えた。 ディアブ氏は、レバノンにおける腐敗の広がりは「国そのものより大きい」と説明。「非常に分厚く、とげだらけの壁が変革を妨げている。既得権益を守り、改革に抵抗するため、汚い手法を使う連中が、その壁を強化している」と主張した。 「この連中は私たちが脅威だと承知している。この政府が成功すれば、長年レバノンを窒息させてきた支配層に本当の変化をもたらすと、分かっているのだ」 「私たちは今日、今回の大惨事を招いた責任者の追及と、真の変革を求める国民の意思に従う」 「ガラスが粉々、床には血が流れ……」 レバノン･ベイルートの大規模爆発 これからどうなる 内閣総辞職を受け、国会は新しい首相を決める。ただ、現在の反政府デモの理由にもなっている複雑な派閥政治のため、新首相は簡単には決まらないだろうと、BBCのトム・ベイトマン中東特派員は言う。 同国では、異なる宗教グループの指導者らが権力を分け合っている。さらに、1975～1990年の内戦の終結後、多数の軍閥が政界に進出。現在も政治、経済、社会の広範囲で影響力をもっている。 今回のデモ参加者らは、こうした仕組みがレバノンの腐敗の原因だと訴えている。 警察の機動隊は反政府デモの参加者に向けて武器を使用した 経済危機がさらに悪化 レバノン当局は、今回の爆発による損失は30億ドル（約3200億円）以上と推定。同国経済への打撃は約150億ドルになるだろうとしている。 同国では爆発前から、経済危機による貧困や飢えが問題となっていた。 政府への不満も以前から高まっていた。 昨年後半には、メッセージアプリ・ワッツアップの利用に課税しようとしたことをきっかけに、経済的混乱や腐敗に抗議する大規模なデモが発生。当時の内閣は総辞職した。 デモ参加者らと警官隊が衝突した（10日） 新型コロナウイルスの流行でデモは下火となったが、経済危機は悪化し続けた。 今回の爆発を受け、すでに何人もの閣僚が辞任を表明している。 国民の政治不信は根深く、ディアブ政権の退陣で国民の怒りが鎮まるとは限らない。昨年の反政府デモは内閣を総辞職に追い込んだが、その際も今回と同様の腐敗批判が繰り広げられていた。 （英語記事 Lebanon cabinet resigns as anger over blast mounts）", "text_zh": "哈桑·迪亚卜总理 米歇尔·奥恩总统要求现任阁员在新内阁组成之前继续留任履职。 爆炸目前已确认造成220人死亡，另有110人下落不明。贝鲁特省长马尔万·阿布德向Al-Marsad在线新闻透露了上述消息。 阿布德还向电视台Al-Jadeed表示，失踪者中包括多名外国劳工和卡车司机。 ＜相关报道＞ 爆炸造成的破坏波及现场周围半径数公里的范围。20多万市民或失去住所，或住在没有窗户和门的房屋中。 许多市民指责该国领导层，认为政府的怠慢与腐败是爆炸的原因。截至10日，示威已连续进行3天，还发生了与警察部队的冲突。 示威参加者在贝鲁特街头投掷烟花等（10日） 影像显示，示威参加者聚集在通往国会道路上设置的障碍物附近，治安部队施放催泪瓦斯。 爆炸的直接原因是长年以危险状态保管在贝鲁特港区仓库中的硝酸铵。 总理的演说 今年1月就任总理的迪亚卜在当天的电视演说中将自己描绘成改革者，声称政府“为制定拯救这个国家的路线图付出了巨大努力”，并控诉遭到顽固抵抗的阻挠。 迪亚卜解释说，腐败在黎巴嫩的蔓延“比国家本身还要庞大”。他声称：“一道非常厚重、布满荆棘的墙阻碍着变革。为守护既得利益、抵制改革而使用肮脏手段的那伙人，正在加固这堵墙。” “这伙人清楚我们是威胁。他们明白，如果本届政府成功，将给长年令黎巴嫩窒息的统治阶层带来真正的变化。” “我们今天遵从国民的意愿：追究招致这场大灾难的责任人，并寻求真正的变革。” “玻璃粉碎，地板上流着血……” 黎巴嫩贝鲁特大规模爆炸 今后将会如何 内阁总辞后，国会将决定新总理。不过，BBC中东特派记者汤姆·贝特曼指出，由于复杂的派系政治——这也是当前反政府示威的原因之一——新总理恐怕不会轻易产生。 在该国，不同宗教群体的领导人分享权力。此外，1975年至1990年的内战结束后，众多军阀进入政界，至今仍在政治、经济、社会的广泛领域拥有影响力。 此次示威的参加者控诉，正是这种体制造成了黎巴嫩的腐败。 警察防暴部队向反政府示威的参加者使用了武器 经济危机进一步恶化 黎巴嫩当局估计，此次爆炸造成的损失超过30亿美元（约3200亿日元），并认为对该国经济的打击将达到约150亿美元。 该国在爆炸前就已面临经济危机导致的贫困和饥饿问题。 对政府的不满此前也在不断高涨。 去年下半年，以试图对通讯应用WhatsApp的使用征税为导火索，爆发了抗议经济混乱和腐败的大规模示威。当时的内阁总辞。 示威参加者与警察部队发生冲突（10日） 因新型冠状病毒的流行，示威一度趋于平息，但经济危机持续恶化。 受此次爆炸影响，已有多名阁员表示辞职。 国民对政治的不信任根深蒂固，迪亚卜政府的下台未必能平息国民的怒火。去年的反政府示威曾迫使内阁总辞，当时也同样上演了与此次类似的腐败批判。 （英文报道 Lebanon cabinet resigns as anger over blast mounts）", "reference_summary": "レバノンのハサン・ディアブ首相は10日夕、国民向けのテレビ演説で内閣の総辞職を発表した。首都ベイルートの港で4日に発生した大規模爆発をめぐり国民の政府への怒りが膨らむ中、自らの改革が妨害されていたと主張した。", "ref_zh": "黎巴嫩总理哈桑·迪亚卜10日傍晚在面向国民的电视演说中宣布内阁总辞。围绕首都贝鲁特港口4日发生的大规模爆炸，国民对政府的愤怒不断高涨，他在此背景下主张自己的改革一直遭到阻挠。", "summaries": [{"summary_id": "53732134_2cd93f53", "summary": "ハサン・ディアブ首相は10日夜、ベイルート爆発を受けた反政府デモが続く中、内閣の続投を表明し「改革を完遂する」と決意を示した。", "zh": "哈桑·迪亚卜总理10日夜间，在贝鲁特爆炸引发的反政府示威持续之际，表明内阁将继续执政，并展示了“将改革进行到底”的决心。"}, {"summary_id": "53732134_632d0cac", "summary": "ハサン・ディアブ首相は10日夜、4日にベイルートで発生した大規模爆発を受けた反政府デモが続く中で、内閣の総辞職を発表した。", "zh": "哈桑·迪亚卜总理10日夜间，在4日贝鲁特发生大规模爆炸后反政府示威持续之际，宣布内阁总辞。"}, {"summary_id": "53732134_cb3c4754", "summary": "ハサン・ディアブ首相 ミシェル・アウン大統領は、新たな内閣が組まれるまで職務にとどまるよう現閣僚に求めた。爆発ではこれまでに死者220人が確認され、さらに110人が行方不明となっている。ベイルートのマルワン・アブド県知事が、アルマルサド・オンラインニュースに語った。", "zh": "哈桑·迪亚卜总理 米歇尔·奥恩总统要求现任阁员在新内阁组成之前继续留任履职。爆炸目前已确认造成220人死亡，另有110人下落不明。贝鲁特省长马尔万·阿布德向Al-Marsad在线新闻透露了上述消息。"}, {"summary_id": "53732134_e705b192", "summary": "レバノンのハサン・ディアブ首相は10日夕、国民向けのテレビ演説で内閣の総辞職を発表した。首都ベイルートの港で4日に発生した大規模爆発をめぐり国民の政府への怒りが膨らむ中、自らの改革が妨害されていたと主張した。", "zh": "黎巴嫩总理哈桑·迪亚卜10日傍晚在面向国民的电视演说中宣布内阁总辞。围绕首都贝鲁特港口4日发生的大规模爆炸，国民对政府的愤怒不断高涨，他在此背景下主张自己的改革一直遭到阻挠。"}, {"summary_id": "53732134_f51d084f", "summary": "レバノンのハサン・ディアブ首相は10日夕、国民向けのテレビ演説で内閣の総辞職を発表した。首都ベイルートの港で4日に", "zh": "黎巴嫩总理哈桑·迪亚卜10日傍晚在面向国民的电视演说中宣布内阁总辞。围绕首都贝鲁特港口4日"}]}, {"article_id": "41396293", "url": "https://www.bbc.com/japanese/41396293", "title": "日本の安倍首相、解散・総選挙を表明 「国難突破」と", "title_zh": "日本安倍首相宣布解散众议院、举行大选 称为“突破国难”", "text": "安倍首相への支持率は一時の低迷から回復している 安倍首相への支持率は今年夏に記録的な低水準を付けた後、回復傾向にある。その一方で、野党勢力はもっぱら混乱状態にある。 投票日は正式に発表されていないものの、日本国内のメディアは来月22日になると伝えている。 安倍首相に対しては、個人的な交友関係のために便宜を図ったのではないかとの疑惑をめぐり、批判が集まっていた。しかし、北朝鮮が核・ミサイル実験を活発化させ緊張が高まるなか、支持率が大幅に上昇した。 安倍首相は25日の会見で、一部の教育無償化や介護人材の処遇改善などの「人づくり革命」のため2兆円規模の政策を策定すると発表し、新たな政策は日本の未来を開くためだと語った。 一方で、財政健全化の取り組みも継続すると表明。消費税率の引き上げによって得られた財源の一部を財政赤字の解消や公的債務削減に充てると述べた。 なぜ解散・総選挙？ アナリストらは、安倍首相が任期満了前の解散を決断した背景には、支持率の回復や野党の混乱があると指摘する。 相次ぐスキャンダルと不人気の政策のため、安倍首相の支持率は今年7月に30％を切ったが、9月には50％以上に回復した。 安倍首相は25日の記者会見で疑惑をあらためて否定し、衆院解散は追求をそらすためではないと語った。 首相は、日本国憲法で自国軍隊を正式に認めることを求め、日本が第2次世界大戦後に掲げてきた平和主義の下での防衛政策の変更を目指している。その方針に対しては、賛否両論がある。 戦後に制定された憲法の下、日本の軍事活動は厳しく制限されている 安倍氏に対抗するのは？ 安倍首相の北朝鮮に対する強硬姿勢は同氏への支持率回復に貢献している。そのほか、首相が率いる与党・自由民主党は、国内の社会政策にも力を入れて選挙戦を展開する見通し。 主な野党勢力の民進党では、今年7月に代表の辞任表明という騒動が起き、現在の支持率は10％以下と低迷している。 しかし、元自民党議員の小池百合子東京都知事が25日に国政新党の立ち上げを発表。安倍首相にとって新たな脅威になっている。 現在の世論調査結果が10月の投票にも反映されれば、安倍首相は政権を維持できる見通しだ。しかし、連立相手の公明党の議席を合わせても、首相が目指す憲法改正に必要な3分の2以上の議席確保は、難しいかもしれない。 総選挙後も安倍首相が政権を維持できれば、同首相の任期は戦後最も長くなる可能性がある。 （英語記事 Japan's PM Shinzo Abe calls snap election）", "text_zh": "对安倍首相的支持率已从一度的低迷中回升 对安倍首相的支持率在今年夏天创下历史性低位后，正呈回升趋势。与此同时，在野党势力则完全处于混乱状态。 虽然投票日尚未正式公布，但日本国内媒体报道称将定于下月22日。 围绕安倍首相是否曾为私人交情提供便利的疑云，批评声一度不断。然而，在朝鲜频繁进行核与导弹试验、紧张局势升级之际，其支持率大幅上升。 安倍首相在25日的记者会上宣布，将为部分教育免费化和改善护理人才待遇等“育人革命”制定规模达2万亿日元的政策，并表示新政策是为了开创日本的未来。 另一方面，他表明将继续推进财政健全化工作，并称将把上调消费税率所获财源的一部分用于消除财政赤字和削减公共债务。 为何解散众议院、举行大选？ 分析人士指出，安倍首相决定在任期届满前解散众议院，背景在于支持率的回升和在野党的混乱。 由于接连不断的丑闻和不受欢迎的政策，安倍首相的支持率今年7月曾跌破30%，但9月已回升至50%以上。 安倍首相在25日的记者会上再次否认相关疑云，并表示解散众议院并非为了转移追究。 首相寻求在日本国宪法中正式承认本国军队，力图改变日本自第二次世界大战后一直奉行的和平主义之下的防卫政策。对于这一方针，赞成与反对的声音并存。 在战后制定的宪法之下，日本的军事活动受到严格限制 与安倍对阵的是谁？ 安倍首相对朝鲜的强硬姿态为其支持率的回升作出了贡献。此外，首相领导的执政党自由民主党预计还将在国内社会政策上发力开展选战。 主要在野党势力民进党今年7月发生党代表宣布辞职的风波，目前支持率低迷，不足10%。 但曾任自民党议员的东京都知事小池百合子25日宣布成立国政新党，成为安倍首相面临的新威胁。 如果目前的民调结果也能反映到10月的投票中，安倍首相有望维持政权。但即便加上联合执政伙伴公明党的议席，要确保首相所寻求的修改宪法所需的三分之二以上议席，恐怕仍有困难。 如果大选后安倍首相仍能维持政权，其任期有可能成为战后最长。 （英文报道 Japan's PM Shinzo Abe calls snap election）", "reference_summary": "日本の安倍晋三首相は25日、今週召集される臨時国会冒頭での衆議院の解散・総選挙を表明した。記者会見した安倍首相は、北朝鮮からの脅威が高まるなかで「国難突破」のため国民の政権負託をあらためて問うと語った。", "ref_zh": "日本首相安倍晋三25日表明，将在本周召集的临时国会伊始解散众议院、举行大选。安倍首相在记者会上表示，在来自朝鲜的威胁不断升高之际，为“突破国难”，将再次问询国民对政权的托付。", "summaries": [{"summary_id": "41396293_0c954428", "summary": "日本の安倍晋三首相は25日、今秋の衆議院解散・総選挙は行わず任期満了までの残り期間に注力する方針を表明した。記者会見した安倍首相は、北朝鮮情勢の緊迫化を受け政権の安定性を維持する必要があると強調した。", "zh": "日本首相安倍晋三25日表明方针称，今年秋天不举行众议院解散和大选，将专注于任期届满前的剩余时间。安倍首相在记者会上强调，鉴于朝鲜局势趋于紧张，有必要维持政权的稳定性。"}, {"summary_id": "41396293_54b8e9a4", "summary": "日本の安倍晋三首相は25日、今週召集される臨時国会冒頭での衆議院の解散・総選挙を表明した。記者会見した安倍首相は、北朝鮮からの脅威が高まるなかで「国難突破」のため国民の政権負託をあらためて問うと語った。", "zh": "日本首相安倍晋三25日表明，将在本周召集的临时国会伊始解散众议院、举行大选。安倍首相在记者会上表示，在来自朝鲜的威胁不断升高之际，为“突破国难”，将再次问询国民对政权的托付。"}, {"summary_id": "41396293_964415be", "summary": "記者会見した安倍首相は、北朝鮮からの脅威が高まるなかで「国難突破」のため国民の政権負託をあらためて問うと語った。日本の安倍晋三首相は25日、今週召集される臨時国会冒頭での衆議院の解散・総選挙を表明した。", "zh": "安倍首相在记者会上表示，在来自朝鲜的威胁不断升高之际，为“突破国难”，将再次问询国民对政权的托付。日本首相安倍晋三25日表明，将在本周召集的临时国会伊始解散众议院、举行大选。"}, {"summary_id": "41396293_a3eb7364", "summary": "日本の安倍晋三首相は25日、今週召集される臨時国会冒頭での衆議院解散と総選挙の実施を表明した。記者会見した安倍首相は、北朝鮮情勢による「国難突破」のため改めて国民の審判を仰ぐと説明した。夏に低迷していた支持率が回復する一方で野党が混乱しているタイミングでの解散となる。", "zh": "日本首相安倍晋三25日表明，将在本周召集的临时国会伊始解散众议院并举行大选。安倍首相在记者会上解释称，为因应朝鲜局势、“突破国难”，将再次接受国民的审判。此次解散正值夏天曾一度低迷的支持率回升、而在野党陷入混乱之时。"}, {"summary_id": "41396293_d942de59", "summary": "安倍首相への支持率は一時の低迷から回復している 安倍首相への支持率は今年夏に記録的な低水準を付けた後、回復傾向にある。その一方で、野党勢力はもっぱら混乱状態にある。投票日は正式に発表されていないものの、日本国内のメディアは来月22日になると伝えている。", "zh": "对安倍首相的支持率已从一度的低迷中回升 对安倍首相的支持率在今年夏天创下历史性低位后，正呈回升趋势。与此同时，在野党势力则完全处于混乱状态。虽然投票日尚未正式公布，但日本国内媒体报道称将定于下月22日。"}]}, {"article_id": "53174534", "url": "https://www.bbc.com/japanese/53174534", "title": "ジョギングの黒人男性射殺、3人を殺人罪で起訴 米ジョージア", "title_zh": "慢跑黑人男子遭枪杀案，3人被以谋杀罪起诉 美国佐治亚州", "text": "ジョギング中に射殺されたアフマド・アーベリーさん 悪意のある重罪謀殺の罪などで起訴されたのは、トラヴィス・マクマイケル被告と父親のグレゴリー・マクマイケル被告、ウィリアム・ブライアン被告の3人。 ジョイエット・ホームズ検事は、「アフマドさんとアフマドさんの家族、コミュニティーにとってまた一歩、正義を追求で前進した。大きな一歩だ」と述べた。 ＜関連記事＞ アーベリーさんの母ワンダ・クーパー＝ジョーンズさんは米BBC番組ナイトリー・ニュースで、「現時点では正しい方向に向かっていると信じている」と述べた。 「今回の起訴は私たちに戦う力を与えてくれる。これは戦いの第一歩にすぎない。我々には長い道のりが残っている」 左からウィリアム・ブライアン被告、グレゴリー・マクマイケル被告と息子のトラヴィス・マクマイケル被告 マクマイケル親子の弁護団は判決を急がないよう警告していると、AP通信は報じている。 一方で、携帯電話で事件を撮影していたブライアン被告の弁護人は、同被告は単なる目撃者に過ぎないと主張している。 アメリカ各地では、別の黒人男性ジョージ･フロイドさんが白人警官に首を圧迫されて死亡した事件をめぐり、人種差別に対する大規模な抗議デモが続いている。 アーベリーさんに何があったのか アーベリーさん（当時25）と被告の争いが始まる直前、拳銃と散弾銃を所持したマクマイケル親子はピックアップトラックに乗って、ジョージア州サティーラ・ショアーズでアーベリーさんを追いかけた。 「黒人のアメリカ人として恐ろしい」 警官による黒人男性の暴行死で若者たち グレゴリー被告は警察に対し、地元で発生した一連の強盗事件の容疑者にアーベリーさんが似ていると思ったと述べた。 5月5日、ブライアン被告が当時撮影した36秒の動画がオンライン上に流出。アメリカ全土で激しい怒りの声が上がり、3人が殺人容疑で逮捕されることとなった。ブライアン被告はアーベリー氏の後ろを車で走行しながら動画を撮影していた。 動画では、並木道をジョギングするアーベリー氏を、車に乗ったマクマイケル親子が待ち伏せしているように見える。 その後、トラヴィス被告とアーベリーさんが取っ組み合いを始め、アーベリーさんは地面に倒れた。 3人はアーベリーさんが殺害されてから2カ月以上もの間、訴追されずにいた。州警察は動画が拡散されたことを受け、捜査を開始した。 （英語記事 Three men indicted over death of black jogger）", "text_zh": "慢跑时遭枪杀的艾哈迈德·阿贝里 被以恶意重罪谋杀等罪名起诉的，是特拉维斯·麦克迈克尔被告及其父亲格雷戈里·麦克迈克尔被告、威廉·布莱恩被告3人。 检察官乔耶特·霍姆斯表示：“对艾哈迈德、艾哈迈德的家人和社区而言，在追求正义方面又前进了一步。这是一大步。” ＜相关报道＞ 阿贝里的母亲万达·库珀-琼斯在美国BBC节目《夜间新闻》中表示：“现阶段我相信事情正朝着正确的方向发展。” “这次起诉给了我们战斗的力量。这只不过是战斗的第一步。我们还有很长的路要走。” 从左起为威廉·布莱恩被告、格雷戈里·麦克迈克尔被告及其儿子特拉维斯·麦克迈克尔被告 据美联社报道，麦克迈克尔父子的辩护律师团警告不要急于作出裁决。 另一方面，用手机拍摄了事件经过的布莱恩被告的辩护律师则主张，该被告只不过是一名目击者。 在美国各地，围绕另一名黑人男子乔治·弗洛伊德遭白人警察压迫颈部致死的事件，针对种族歧视的大规模抗议示威仍在持续。 阿贝里遭遇了什么 就在阿贝里（时年25岁）与被告发生争执之前，持有手枪和霰弹枪的麦克迈克尔父子乘坐皮卡车，在佐治亚州萨蒂拉海岸追赶阿贝里。 “身为美国黑人，感到恐惧” 因警察暴行致黑人男子死亡，年轻人们 格雷戈里被告对警方表示，他认为阿贝里与当地发生的一系列抢劫案的嫌疑人相像。 5月5日，布莱恩被告当时拍摄的36秒视频在网上流出。美国全境掀起强烈的愤怒声浪，3人因涉嫌谋杀被逮捕。布莱恩被告当时驾车行驶在阿贝里身后拍摄了视频。 在视频中，可以看到乘车的麦克迈克尔父子似乎在伏击沿林荫道慢跑的阿贝里。 随后，特拉维斯被告与阿贝里扭打起来，阿贝里倒在了地上。 在阿贝里遇害后长达两个多月的时间里，3人一直未被追诉。州警察在视频扩散后启动了调查。 （英文报道 Three men indicted over death of black jogger）", "reference_summary": "米ジョージア州で今年2月、黒人男性アフマド・アーベリーさんがジョギング中に射殺された事件で、同州グリン郡の大陪審は24日、白人の男3人を殺人罪などで起訴した。", "ref_zh": "就美国佐治亚州今年2月黑人男子艾哈迈德·阿贝里在慢跑时遭枪杀的事件，该州格林县大陪审团24日以谋杀罪等罪名起诉了3名白人男子。", "summaries": [{"summary_id": "53174534_3c6e0621", "summary": "米ジョージア州で今年2月、黒人男性アフマド・アーベリーさんがジョギング中に射殺された事件で、同州グリン郡の大陪審は24日、白人の男3人を殺人罪などで起訴した。", "zh": "就美国佐治亚州今年2月黑人男子艾哈迈德·阿贝里在慢跑时遭枪杀的事件，该州格林县大陪审团24日以谋杀罪等罪名起诉了3名白人男子。"}, {"summary_id": "53174534_48335d13", "summary": "米ジョージア州で今年2月に黒人男性アフマド・アーベリーさんがジョギング中に射殺された事件で、同州グリン郡の大陪審は24日、白人男性3人に対する起訴を見送る決定を下した。検察は証拠不十分との説明を行い、アーベリーさんの家族は失望を表明した。", "zh": "就美国佐治亚州今年2月黑人男子艾哈迈德·阿贝里在慢跑时遭枪杀的事件，该州格林县大陪审团24日作出了不予起诉3名白人男子的决定。检察方以证据不足作出说明，阿贝里的家人表示失望。"}, {"summary_id": "53174534_81348040", "summary": "米ジョージア州で今年2月に黒人男性アフマド・アーベリーさんがジョギング中に射殺された事件で、同州グリン郡の大陪審は24日、白人男性3人を殺人罪などで起訴した。マクマイケル親子は地元の強盗容疑者に類似していたとしてアーベリー氏を追跡したと説明している。事件は当時撮影された動画の流出後に広く知られ、人種差別への抗議行動が全米で続いている。", "zh": "就美国佐治亚州今年2月黑人男子艾哈迈德·阿贝里在慢跑时遭枪杀的事件，该州格林县大陪审团24日以谋杀罪等罪名起诉了3名白人男子。麦克迈克尔父子解释称，因阿贝里与当地抢劫案嫌疑人相像而对其进行了追赶。事件在当时拍摄的视频流出后广为人知，针对种族歧视的抗议行动正在全美持续。"}, {"summary_id": "53174534_cc932087", "summary": "ジョギング中に射殺されたアフマド・アーベリーさん 悪意のある重罪謀殺の罪などで起訴されたのは、トラヴィス・マクマイケル被告と父親のグレゴリー・マクマイケル被告、ウィリアム・ブライアン被告の3人。ジョイエット・ホームズ検事は、「アフマドさんとアフマドさんの家族、コミュニティーにとってまた一歩、正義を追求で前進した。大きな一歩だ」と述べた。", "zh": "慢跑时遭枪杀的艾哈迈德·阿贝里 被以恶意重罪谋杀等罪名起诉的，是特拉维斯·麦克迈克尔被告及其父亲格雷戈里·麦克迈克尔被告、威廉·布莱恩被告3人。检察官乔耶特·霍姆斯表示：“对艾哈迈德、艾哈迈德的家人和社区而言，在追求正义方面又前进了一步。这是一大步。”"}, {"summary_id": "53174534_cff3d43b", "summary": "これまでにアルツハイマー型認知症と診断されていた人の中には、実は新たに発見された種類の認知症だった人が多く含まれていると、国際研究チームが発表した。", "zh": "国际研究团队发表称，在此前被诊断为阿尔茨海默型认知症的人当中，其实有很多人患的是新发现的一种认知症。"}]}, {"article_id": "35278497", "url": "https://www.bbc.com/japanese/35278497", "title": "大みそかの独ケルン駅集団暴行・窃盗、被害は500件以上に", "title_zh": "除夕德国科隆车站集体施暴与盗窃案，受害案件超过500起", "text": "大みそかのケルン駅で起きた集団暴行事件に対する警察の対応が批判されている。写真は、事件に抗議する人を制止する警察（9日） 調べによると、犯人は約1000人。ケルン中央駅に集合してから少人数のグループに分かれて女性を取り囲んで襲い、所持品を奪ったと言う。 マース法相は10日付のビルト紙に、事件は計画的なものと確信していると言明。「これほどの大人数が集まって一斉に事件を起こしたのなら、何らかの計画性はあったはずだ。これが偶発的なもので、事前の準備がなかったとは信じられない」と述べた。 メルケル首相は昨年、難民・移民受け入れに門戸開放の方針を表明し、年間で110万人を受け入れた。事件を受けて、政府のこの方針に対する批判が強まっている。 首相は9日、犯罪を犯す難民希望者の国外退去手続きを簡易化すると発表したが、同日にはケルンで大規模な移民受け入れ反対集会が開かれ、暴徒化した一部の人に機動隊が水砲を使用する場面もあった。 「20人くらいに囲まれて触られて」 大みそかのケルン駅で何が 大みそかの暴行・窃盗 独ケルンで女性ら抗議 10日のケルンではイスラム教徒たちが街頭で大みそかの事件を非難。右のプラカードには「イスラム教徒は性差別に抗議する」とある。 9日のケルンでは移民受け入れ反対の大規模な抗議行動が行われた ケルンの事件が起きる以前からメルケル首相の「門戸開放」政策は与党内で批判されていた 大みそかの事件の被害者たちは、ケルン中央駅周辺で暴行や窃盗事件が相次いでも、警察はほとんど対応しなかったと批判している。 大みそかの夜にはほかにもハンブルクやシュトゥットガルトでも同様の事件があったと言われている。「ベルト」紙によると、北部ビーレフェルトでは数百人の男がナイトクラブに押し入ろうとしたという。 調べによると、女性数人が性的暴行の被害を訴えている。 8日にはケルンのボルフガング・アルベルス警察長官が、事件に関する情報を伏せていたとして職務停止処分を受けた。アルベルス氏は特に、容疑者の経歴について情報を明らかにしなかったと批判されている。 （英語記事 Cologne attacks: New Year's Eve crime cases top 500）", "text_zh": "警方对除夕发生在科隆车站的集体施暴事件的应对正受到批评。图为制止抗议该事件民众的警察（9日） 据调查，作案者约有1000人。据称，他们在科隆中央车站集合后分成小股人群，围住女性施暴，并抢走了随身物品。 马斯司法部长在10日的《图片报》上明确表示，确信事件是有计划的。他说：“如果如此众多的人聚集起来同时作案，就必然存在某种计划性。我无法相信这是偶发事件、事前没有任何准备。” 默克尔总理去年表明了对接收难民和移民敞开门户的方针，一年间接收了110万人。事件发生后，针对政府这一方针的批评正在加强。 总理9日宣布将简化对犯罪的寻求庇护者的驱逐出境程序，但同日科隆举行了大规模的反对接收移民集会，还出现了防暴警察对部分暴徒化人群使用水炮的场面。 “被大约20人围住摸身” 除夕的科隆车站发生了什么 除夕的施暴与盗窃 德国科隆女性等人抗议 10日的科隆，穆斯林们在街头谴责除夕的事件。右侧的标语牌上写着“穆斯林抗议性别歧视”。 9日的科隆举行了反对接收移民的大规模抗议行动 早在科隆事件发生之前，默克尔总理的“敞开门户”政策就已在执政党内部受到批评 除夕事件的受害者们批评称，尽管科隆中央车站周边施暴和盗窃事件接连发生，警方却几乎没有应对。 据说除夕夜汉堡和斯图加特等地也发生了类似事件。据《贝尔特》报报道，在北部的比勒费尔德，数百名男子曾试图闯入一家夜总会。 据调查，数名女性已就遭受性暴力提出控诉。 8日，科隆警察局长沃尔夫冈·阿尔贝斯因隐瞒与事件有关的信息而受到停职处分。阿尔贝斯尤其因未公开有关嫌疑人背景经历的信息而受到批评。 （英文报道 Cologne attacks: New Year's Eve crime cases top 500）", "reference_summary": "大みそかのドイツ・ケルン中央駅で年越しの祝賀に紛れて起きた集団暴行事件について、ケルン警察は10日、被害件数は516件に上ると数を上方修正した。このうち4割は性的暴行事件で、容疑者の大半は北アフリカからの難民希望者や不法移民だという。警察は9日の時点では被害は379件だと発表していた。", "ref_zh": "关于除夕在德国科隆中央车站趁跨年庆祝之机发生的集体施暴事件，科隆警方10日将受害案件数上调至516起。其中四成为性暴力案件，据称嫌疑人大多是来自北非的寻求庇护者和非法移民。警方在9日时曾公布受害案件为379起。", "summaries": [{"summary_id": "35278497_1fd162f1", "summary": "ドイツ・ケルン中央駅で大みそかに起きた集団暴行・窃盗事件について、警察は10日、被害件数を当初報告より少ない約100件にまで下方修正したと発表した。", "zh": "关于除夕在德国科隆中央车站发生的集体施暴与盗窃事件，警方10日宣布，已将受害案件数下调至比最初报告更少的约100起。"}, {"summary_id": "35278497_5a694519", "summary": "大みそかのドイツ・ケルン中央駅で年越しの祝賀に紛れて起きた集団暴行事件について、ケルン警察は10日、被害件数は516件に上ると数を上方修正した。このうち4割は性的暴行事件で、容疑者の大半は北アフリカからの難民希望者や不法移民だという。警察は9日の時点では被害は379件だと発表していた。", "zh": "关于除夕在德国科隆中央车站趁跨年庆祝之机发生的集体施暴事件，科隆警方10日将受害案件数上调至516起。其中四成为性暴力案件，据称嫌疑人大多是来自北非的寻求庇护者和非法移民。警方在9日时曾公布受害案件为379起。"}, {"summary_id": "35278497_af8a0e59", "summary": "ドイツ・ケルン中央駅で大みそかに起きた集団暴行・窃盗事件について、警察は10日、被害件数を516件に上方修正し、うち約4割が性的暴行だと発表した。", "zh": "关于除夕在德国科隆中央车站发生的集体施暴与盗窃事件，警方10日宣布将受害案件数上调至516起，其中约四成为性暴力案件。"}, {"summary_id": "35278497_e17137ac", "summary": "大みそかのケルン駅で起きた集団暴行事件に対する警察の対応が批判されている。写真は、事件に抗議する人を制止する警察（9日） 調べによると、犯人は約1000人。ケルン中央駅に集合してから少人数のグループに分かれて女性を取り囲んで襲い、所持品を奪ったと言う。", "zh": "警方对除夕发生在科隆车站的集体施暴事件的应对正受到批评。图为制止抗议该事件民众的警察（9日） 据调查，作案者约有1000人。据称，他们在科隆中央车站集合后分成小股人群，围住女性施暴，并抢走了随身物品。"}, {"summary_id": "35278497_f64d7d4c", "summary": "大みそかのドイツ・ケルン中央駅で年越しの祝賀に紛れて起きた集団暴行事件について、ケルン警察は10日、被害件数は516件に上ると数を上方修正した。このうち4割", "zh": "关于除夕在德国科隆中央车站趁跨年庆祝之机发生的集体施暴事件，科隆警方10日将受害案件数上调至516起。其中四成"}]}, {"article_id": "54083932", "url": "https://www.bbc.com/japanese/54083932", "title": "誕生日に28年間贈られ続けたウイスキー、価値が550万円超に", "title_zh": "连续28年生日获赠的威士忌，价值超过550万日元", "text": "マシュー・ロブソンさんのマッカラン18年物のコレクション。28年間にわたって誕生日に父親から贈られてきた イギリス南西部トーントンのマシュー・ロブソンさん。1992年に生まれてから誕生日が来るごとに、父ピートさんからシングルモルトウイスキーのマッカランを1本贈られてきた。 現在までのウイスキー計28本の購入にピートさんが支払ったのは、総額5000ポンド（約68万円）ほど。 なかなかの費用だが、このコレクションの価値は現在、4万ポンド（約550万円）以上に膨らんでいるとみられている。 マシュー・ロブソンさん（右）と父ピートさん マシューさんは、少年にとってウイスキーは、おそらく最高の誕生日プレゼントとは言えなかったと思うと振り返る。 それでも、「絶対に開けるなという厳しい指示」を守ったおかげで、一財産になったと話す。 「誕生日プレゼントは毎年これだった。酒を飲むにはちょっと早すぎたから、何だかおかしなプレゼントだなと思っていた」 「ただ、絶対に開けたらだめだと強く言われていた。できる限りがんばった結果、全部そのままの状態だ」 マシューさんは父ピートさんから決してボトルを開けないよう言われていたという スコッチウイスキーの本場スコットランドのミルナソート出身の父ピートさんによると、最初に1974年製のウイスキーを買ったのは、「赤ちゃんが生まれたのを祝う」ためだったという。 「毎年1本ずつ買い足していって、18歳の誕生日には18年物のウイスキーが18本になるというのは面白いと思ったんです」 「誕生日プレゼントはこれだけというわけではありませんでした。ちょっと変わったプレゼントという軽い気持ちでしたが、ここまで続いたのは、多少運が良かったおかげでもあります」 マシューさんのマッカラン・コレクションにはすでに多くのバイヤーが関心を示しているという その後、マッカランはコレクターにとって価値あるウイスキーになった。マシューさんのコレクションは、ウイスキーブローカーのマーク・リトラーさんが販売を担当する予定。 リトラーさんは、「完璧なコレクションだ」と話す。 「マッカランの価値はここ5年から10年で急激に上がった」ため、「これだけ年代幅があるのは、このコレクションの大きなセールスポイントだ」という。 リトラーさんによると、「すでに多くの引き合い」があり、多くはニューヨークとアジアのバイヤーからだという。 （英語記事 Son sells 28 years of birthday whisky to buy house）", "text_zh": "马修·罗布森的麦卡伦18年威士忌收藏。28年来每逢生日由父亲赠送 英国西南部汤顿的马修·罗布森，自1992年出生以来，每逢生日都会从父亲皮特那里获赠一瓶单一麦芽威士忌麦卡伦。 迄今为止，皮特为购买共计28瓶威士忌支付了总额约5000英镑（约合68万日元）。 这是一笔不小的花费，但据估计，这套收藏目前的价值已膨胀至4万英镑（约合550万日元）以上。 马修·罗布森（右）与父亲皮特 马修回顾道，他觉得对一个少年来说，威士忌恐怕算不上最好的生日礼物。 尽管如此，他说，多亏遵守了“绝对不许打开这一严格指示”，这才变成了一笔财产。 “每年的生日礼物都是这个。因为当时喝酒还有点太早，我曾觉得这真是个有点奇怪的礼物。” “只是，我被严厉叮嘱绝对不能打开。我尽了最大努力，结果所有的酒都保持着原封不动的状态。” 据说马修一直被父亲皮特叮嘱决不能打开酒瓶 来自苏格兰威士忌之乡苏格兰米尔纳索特的父亲皮特表示，最初购买1974年产的威士忌，是为了“庆祝婴儿的诞生”。 “我觉得每年添购一瓶，到18岁生日时正好有18瓶18年的威士忌，这很有意思。” “生日礼物并不是只有这一样。当初只是抱着送一份别致礼物的轻松心情，能一直坚持到现在，也多少沾了些好运气的光。” 据说已有众多买家对马修的麦卡伦收藏表示了兴趣 此后，麦卡伦成为对收藏家而言颇具价值的威士忌。马修的收藏将由威士忌经纪人马克·利特勒负责销售。 利特勒表示：“这是一套完美的收藏。” 他表示，由于“麦卡伦的价值在最近5到10年里急剧上升”，因此“拥有如此大的年代跨度，是这套收藏的一大卖点”。 据利特勒介绍，“已经收到许多问询”，其中多数来自纽约和亚洲的买家。 （英文报道 Son sells 28 years of birthday whisky to buy house）", "reference_summary": "赤ちゃんのころから誕生日を迎えるたび、18年物のスコッチウイスキーを父親からプレゼントされ続けてきたイギリス人男性（28）が、そのコレクションを売却しようとしている。高値での取引が見込まれており、男性は初の住宅購入の頭金に充てる予定だ。", "ref_zh": "一名自婴儿时期起每逢生日都从父亲那里获赠18年苏格兰威士忌的英国男子（28岁），正打算出售这套收藏。预计将以高价成交，男子计划将所得用作首次购房的首付款。", "summaries": [{"summary_id": "54083932_011d6de7", "summary": "英国のマシュー・ロブソンさん（28）は、生まれてから28年間、毎年父親からシングルモルトウイスキー「マッカラン18年物」を贈られ続けてきた。父親が総額約5000ポンドで購入したコレクション28本の現在の価値は4万ポンド（約550万円）以上とみられている。マシューさんは「絶対に開けるな」との父の指示を守り、売却代金は初めての住宅購入の頭金に充てる予定だ。", "zh": "英国的马修·罗布森（28岁）自出生以来的28年间，每年都从父亲那里获赠单一麦芽威士忌“麦卡伦18年”。父亲以总额约5000英镑购入的28瓶收藏，目前价值据估计已超过4万英镑（约合550万日元）。马修遵守了父亲“绝对不许打开”的指示，出售所得将用作首次购房的首付款。"}, {"summary_id": "54083932_2ea5d08c", "summary": "マシュー・ロブソンさんのマッカラン18年物のコレクション。28年間にわたって誕生日に父親から贈られてきた イギリス南西部トーントンのマシュー・ロブソンさん。1992年に生まれてから誕生日が来るごとに、父ピートさんからシングルモルトウイスキーのマッカランを1本贈られてきた。", "zh": "马修·罗布森的麦卡伦18年威士忌收藏。28年来每逢生日由父亲赠送 英国西南部汤顿的马修·罗布森，自1992年出生以来，每逢生日都会从父亲皮特那里获赠一瓶单一麦芽威士忌麦卡伦。"}, {"summary_id": "54083932_438d80a5", "summary": "英国のマシュー・ロブソンさん（28）は、生まれてから28年間父親から贈られ続けてきたシングルモルトウイスキー「マッカラン18年物」のコレクションを、購入価格総額5000ポンドのまま売却する予定だ。バイヤーからの引き合いは少なく、思ったような収益は見込めないという。", "zh": "英国的马修·罗布森（28岁）计划将自出生以来28年间父亲持续赠送的单一麦芽威士忌“麦卡伦18年”收藏，按购入价格总额5000英镑原价出售。据称来自买家的问询很少，预计无法获得理想的收益。"}, {"summary_id": "54083932_91d615a7", "summary": "高値での取引が見込まれており、男性は初の住宅購入の頭金に充てる予定だ。赤ちゃんのころから誕生日を迎えるたび、18年物のスコッチウイスキーを父親からプレゼントされ続けてきたイギリス人男性（28）が、そのコレクションを売却しようとしている。", "zh": "预计将以高价成交，男子计划将所得用作首次购房的首付款。一名自婴儿时期起每逢生日都从父亲那里获赠18年苏格兰威士忌的英国男子（28岁），正打算出售这套收藏。"}, {"summary_id": "54083932_9e7163bb", "summary": "赤ちゃんのころから誕生日を迎えるたび、18年物のスコッチウイスキーを父親からプレゼントされ続けてきたイギリス人男性（28）が、そのコレクションを売却しようとしている。高値での取引が見込まれており、男性は初の住宅購入の頭金に充てる予定だ。", "zh": "一名自婴儿时期起每逢生日都从父亲那里获赠18年苏格兰威士忌的英国男子（28岁），正打算出售这套收藏。预计将以高价成交，男子计划将所得用作首次购房的首付款。"}]}, {"article_id": "37712268", "url": "https://www.bbc.com/japanese/37712268", "title": "イラクのクルド人部隊、モスルに「大攻勢」", "title_zh": "伊拉克库尔德部队对摩苏尔发动“大攻势”", "text": "モスル近くの村に砲撃するイラク軍 クルド人自治政府の治安部隊ペシュメルガは、自分たちは3つの前線で戦っていると明らかにし、「ISIL（ISの別称）の行動をさらに制限するため、近隣の村からISを掃討し戦略的な地域を掌握することが目的」だと説明した。 ペシュメルガに同行しているBBCのオルラ・ゲリン記者は、「20の村奪還」が目的だとツイートした。 BBCのオルラ・ゲリン記者が「クルド・ペシュメルガ部隊がモスル付近のIS拠点へ進攻開始。20の村奪還が目的」とツイート これに先立ち、米軍第101空挺師団のギャリー・ボレスキー司令官は「モスルを出ていく様子が見える。指導者たちがモスルを出た様子だ」と発言。ただし、モスルを脱出した人物や行先は特定していない。ボレスキー少将は、ISと戦う米軍主導の有志連合の地上部隊を指揮している。 ISのアブ・バクル・アル・バグダディ指導者の居場所は不明。モスルにいるという情報もあるが、すでに脱出したという情報もある。 モスルにはまだIS戦闘員5000人が残っているとみられている。 モスルへ進軍するイラク軍とクルド人部隊の位置（19日現在） BBCの中東アナリスト、アラン・ジョンストン記者は、モスルを出た戦闘員は単に前線に向かっただけかもしれないと指摘。ISに忠誠を誓う戦闘員は市内に残り、最後まで戦うはずだと記者は見解を示している。 米軍のボレスキー少将は、市内で最後まで戦う大半は、外国から来たIS戦闘員だろうとみている。 黒煙が立ち上るカイヤラ地区でライフルを掲げるイラク兵。カイヤラはモスルから約30キロ南。 国際慈善団体「セーブ・ザ・チルドレン」によると、過去10日の間に戦闘地域から5000人が国境を越えてシリア領内の難民キャンプに避難。さらに1000人が国境で待機しているという。 モスルの南部、東部、北部で、難民キャンプが急きょ設置されている。国連は、今後少なくとも20万人が避難するだろうとみている。 最大150万人の市民がモスル市内にいるとされる。ISが市民の脱出を阻止しており、生活必需品が底をつきかけているという情報もある。 この衛星画像ではモスルに至る道路でタイヤが燃える様子が見える モスルはイラク第2の都市で、2014年6月からISに支配されていた。イラク政府軍などによる奪還作戦は17日に始まったが、ISは随所で激しく抗戦している模様。ISが「人間の盾」や化学兵器を使う危険性も指摘されている。 （英語記事 Mosul battle: Kurds launch 'large-scale' offensive）", "text_zh": "向摩苏尔附近村庄炮击的伊拉克军队 库尔德自治政府治安部队佩什梅尔加表明，他们正在三条战线上作战，并解释称：“目的是为进一步限制ISIL（IS的别称）的行动，把IS从邻近村庄扫荡出去，掌控战略性地区。” 随佩什梅尔加同行的BBC记者奥尔拉·盖林在推特上发文称，目的是“夺回20座村庄”。 BBC记者奥尔拉·盖林发推称“库尔德佩什梅尔加部队开始向摩苏尔附近的IS据点进攻。目的是夺回20座村庄” 在此之前，美军第101空降师司令加里·沃莱斯基发言称：“可以看到撤离摩苏尔的迹象。看样子领导人们已经离开了摩苏尔。”不过，他并未确定逃离摩苏尔的人物及其去向。沃莱斯基少将指挥着与IS作战的美军主导的有志联盟的地面部队。 IS领导人阿布·贝克尔·巴格达迪的下落不明。有消息称他在摩苏尔，也有消息称他已经逃离。 据信摩苏尔仍有5000名IS武装人员。 向摩苏尔进军的伊拉克军队与库尔德部队的位置（截至19日） BBC中东分析员艾伦·约翰斯顿记者指出，离开摩苏尔的武装人员或许只是前往了前线。这位记者的看法是，宣誓效忠IS的武装人员会留在市内，战斗到最后。 美军沃莱斯基少将认为，在市内战斗到最后的大部分人，恐怕是来自外国的IS武装人员。 在黑烟升腾的盖亚拉地区高举步枪的伊拉克士兵。盖亚拉位于摩苏尔以南约30公里。 据国际慈善团体“救助儿童会”介绍，过去10天里已有5000人从战斗地区越过国境，逃往叙利亚境内的难民营避难。据称还有1000人正在国境处等候。 在摩苏尔的南部、东部和北部，难民营正被紧急设置。联合国预计，今后至少将有20万人避难。 据称摩苏尔市内最多有150万市民。IS正在阻止市民逃离，也有消息称生活必需品即将见底。 在这张卫星图像中，可以看到通往摩苏尔的道路上轮胎燃烧的情景 摩苏尔是伊拉克第二大城市，自2014年6月起一直被IS控制。伊拉克政府军等发起的夺还作战于17日开始，但IS似乎正在各处激烈抵抗。还有人指出IS使用“人体盾牌”和化学武器的危险性。 （英文报道 Mosul battle: Kurds launch 'large-scale' offensive）", "reference_summary": "イラク北部の主要都市モスルから過激派勢力のいわゆる「イスラム国」（IS）を掃討する作戦に参加しているクルド人部隊は、モスルの東と北から大攻勢を開始したと明らかにした。この間、イラク軍は南からモスルに向かっている。", "ref_zh": "参加从伊拉克北部主要城市摩苏尔扫荡极端主义势力所谓“伊斯兰国”（IS）作战的库尔德部队表明，已从摩苏尔的东面和北面发动大攻势。与此同时，伊拉克军队正从南面向摩苏尔挺进。", "summaries": [{"summary_id": "37712268_04ceca32", "summary": "イラク北部の主要都市モスルから過激派勢力のいわゆる「イスラム国」（IS）を掃討する作戦に参加しているクルド人部隊は、モスルの東と北から大攻勢を開始したと明らかにした。この間、イラク軍は南からモスルに向かっている。", "zh": "参加从伊拉克北部主要城市摩苏尔扫荡极端主义势力所谓“伊斯兰国”（IS）作战的库尔德部队表明，已从摩苏尔的东面和北面发动大攻势。与此同时，伊拉克军队正从南面向摩苏尔挺进。"}, {"summary_id": "37712268_684e05cd", "summary": "モスル近くの村に砲撃するイラク軍 クルド人自治政府の治安部隊ペシュメルガは、自分たちは3つの前線で戦っていると明らかにし、「ISIL（ISの別称）の行動をさらに制限するため、近隣の村からISを掃討し戦略的な地域を掌握することが目的」だと説明した。ペシュメルガに同行しているBBCのオルラ・ゲリン記者は、「20の村奪還」が目的だとツイートした。BBCのオルラ・ゲリン記者が「クルド・ペシュメルガ部隊がモスル付近のIS拠点へ進攻開始。", "zh": "向摩苏尔附近村庄炮击的伊拉克军队 库尔德自治政府治安部队佩什梅尔加表明，他们正在三条战线上作战，并解释称：“目的是为进一步限制ISIL（IS的别称）的行动，把IS从邻近村庄扫荡出去，掌控战略性地区。”随佩什梅尔加同行的BBC记者奥尔拉·盖林在推特上发文称，目的是“夺回20座村庄”。BBC记者奥尔拉·盖林发推称“库尔德佩什梅尔加部队开始向摩苏尔附近的IS据点进攻。"}, {"summary_id": "37712268_a5a160b4", "summary": "イラクのクルド人自治政府治安部隊ペシュメルガは、モスルの東と北からの攻勢を中止し、当面はIS支配地域への直接攻撃を見送る方針に転換したと発表した。市内にはまだIS戦闘員5000人が残り、最大150万人の市民が閉じ込められている。", "zh": "伊拉克库尔德自治政府治安部队佩什梅尔加宣布，已中止从摩苏尔东面和北面的攻势，转变方针，暂时搁置对IS控制地区的直接攻击。市内仍有5000名IS武装人员，最多有150万市民被困。"}, {"summary_id": "37712268_c6edc467", "summary": "イラクのクルド人自治政府治安部隊ペシュメルガは、過激派組織ISに占領されているモスルの東と北から「大攻勢」を開始したと明らかにした。作戦目的は周辺20の村からIS戦闘員を掃討し、戦略的な地域を掌握することだという。市内にはまだIS戦闘員5000人がおり、最大150万人の市民が閉じ込められているとみられている。", "zh": "伊拉克库尔德自治政府治安部队佩什梅尔加表明，已从被极端组织IS占领的摩苏尔的东面和北面发动“大攻势”。据称作战目的是从周边20座村庄扫荡IS武装人员，掌控战略性地区。据信市内仍有5000名IS武装人员，最多有150万市民被困。"}, {"summary_id": "37712268_dbc28b65", "summary": "昨年12月に発足したフィンランドのサンナ・マリン政権は5日、父親が取得できる育児休暇の期間を拡大し、母親と同じにする方針を発表した。父親が子供と接する時間を増やし、「幸福（ウェルビーイング）や男女共同参画を促進」するのが狙いという。", "zh": "去年12月成立的芬兰桑娜·马林政府5日宣布方针，将扩大父亲可休的育儿假期限，使之与母亲相同。据称其目的是增加父亲与孩子相处的时间，“促进幸福（well-being）和男女共同参与”。"}]}, {"article_id": "52000333", "url": "https://www.bbc.com/japanese/52000333", "title": "オーストラリア、クラブや映画館を閉鎖 新型ウイルス感染者が急増", "title_zh": "澳大利亚关闭俱乐部和电影院 新冠病毒感染者激增", "text": "ボンダイビーチには、政府による「社会的距離」を確保するガイドラインを軽視した人が大勢殺到した スーパーマーケットやガソリンスタンド、薬局、宅配サービスについては、引き続き営業は続けられるという。 モリソン首相は、「我が国の子供たちが、まるまる1年間教育を受ける機会を失うことは望んでいない」とし、学校を休校にしない方針だと述べた。しかし保護者が希望すれば、子供たちを自宅にとどまらせることは可能とした。 メルボルンのあるヴィクトリア州など複数の州は、学校を閉鎖したい考えを示している。 ＜関連記事＞ オーストラリアでは、新型ウイルスの感染者数が過去数日間で急増し、1315人に上った。これまでに、新型ウイルスによる感染症「COVID-19」で7人が死亡している。 シドニーのあるニューサウスウェールズ州は最も影響を受けており、533人の感染が確認されている。ヴィクトリア州では296人が、クイーンズランド州では259人が、それぞれ感染している。 「社会的距離」を順守せず、ビーチに人が殺到 オーストラリアでは、新型ウイルスの感染拡大を防ぐために、他人との距離を置いて「社会的距離」を保つよう求められている。 しかし、今回の措置の発表前日の21日、ボンダイビーチを含むシドニーの複数のビーチには、こうした指針を軽視した人たちが大勢詰め掛けた。 モリソン首相は、オーストラリア国民がガイドラインに従っていないため、連邦政府および州政府は今回の対応を取る決断をしたと述べた。 一方で、「我々は人々を自宅に閉じ込めるという封鎖措置は導入していない」と付け加えた。 「現時点では、そういった措置は検討されていない」 同国のブレンダン・マーフィー首席医務官は、新型ウイルスを制御するために、これまでとは「非常に異なる」生活を送り、外出を止める必要があることを、特に若者は自覚しなければならないと述べた。 オーストラリア国内でのそのほかの動きは次の通り。 景気刺激策の内容 モリソン首相は22日、660億豪ドル（約4兆1900億円）規模の、2度目の景気刺激策を発表した。これにより、同国政府とオーストラリア準備銀行（RBA）による景気刺激策の総額は1890億豪ドル（約11兆9800億円）となった。 モリソン氏は、新型ウイルス危機の影響を最も受けやすい事業や人々などに対し、経済支援を行うとしている。 景気刺激策には、資力調査や待機期間を免除し、求職者手当て受給者への給付金を2倍にすることや、中小企業への最大10万豪ドル（約634万円）の助成などが含まれる。 新型ウイルスの感染拡大の影響を受けた個人については、2019年から2020年の間、最大1万豪ドル（約63万3900円）を自らの年金から受け取れるようになる。翌年には、さらに1万豪ドルを受け取れる。 一方で、オーストラリアの複数航空会社や空港は、最大7億1500万豪ドル（約453億5490万円）の支援を受けることとなる。 モリソン氏は、この措置は今後6カ月分を穴埋めするものだと強調。「これは応急措置ではない。（中略）私が壇上に上がるのはこれが最後ではないだろう。さらなる刺激策や支援を行うだろう」と述べた。 シドニーのカフェ 社会的距離の確保に無気力なオーストラリア人 シドニーで取材するBBCのフランシス・マオ記者によると、差し迫った閉鎖措置が発表されてから数時間後、市内のバーやレストランでは、これからしばらく外食できなくなることを知らないであろう人々が、日曜の夜をすごしていたという。 同国ではこの1週間、数日ごとに感染者数が倍増しているが、オーストラリア人はこうした統計に注意を払っていない。その代わりに、在宅勤務の不便さや退屈さといった、日常生活における混乱がよく議論されるのだと、マオ記者は指摘する。米国や欧州での危機的状況に順応し、慎重に自主隔離している人も中にはいるが、他の人は「自宅待機せよ」といったメッセージに抵抗しているという。 大規模集会が禁止された数分後に、モリソン首相がのんきにラグビーの試合に出席すると述べたのは、わずか10日前のできごとだった。その後、モリソン氏は判断を覆した。当時、国内の感染者数は200人以下だったが、今では1300人を超えている。 アジア諸国の状況 シンガポールは短期滞在者の入国をすべて禁止すると発表した。シンガポールを経由することも禁止される。ヘルスケアや交通機関などの必要不可欠な事業に務めている就労ビザ保有者のみ、扶養家族と共に入国が許可される。 シンガポールでは21日、2人の死亡が確認された。同国での死者は初めて。 中国は新たに46人の感染を発表したが、そのうち45人は海外で感染したという。地元当局によると、国内で感染した1人は、以前海外から帰国した人と接点があったという。 韓国は22日、新たに98人が感染したと発表。同国での新たな感染者数は減少傾向にある。感染者数は合わせて8897人に上った。 予防について 感染拡大の防ぎ方について （英語記事 Australia announces nationwide shutdown）", "text_zh": "大批无视政府为确保“社交距离”而制定的指导方针的人涌向邦迪海滩 据称，超市、加油站、药店和快递服务将继续营业。 莫里森总理表示，“我们不希望我国的孩子失去整整一年接受教育的机会”，并称不打算让学校停课。不过，如果监护人希望，可以让孩子留在家中。 墨尔本所在的维多利亚州等多个州已表示希望关闭学校。 ＜相关报道＞ 在澳大利亚，新冠病毒感染人数在过去几天急剧增加，已达1315人。迄今为止，已有7人死于新冠病毒引发的传染病“COVID-19”。 悉尼所在的新南威尔士州受影响最为严重，已确认533人感染。维多利亚州有296人、昆士兰州有259人分别感染。 不遵守“社交距离”，人群涌向海滩 在澳大利亚，为防止新冠病毒的感染扩大，人们被要求与他人保持距离，维持“社交距离”。 然而，在此次措施宣布前一天的21日，包括邦迪海滩在内的悉尼多处海滩，涌入了大批无视这些指导方针的人。 莫里森总理表示，由于澳大利亚国民没有遵守指导方针，联邦政府和州政府决定采取此次应对措施。 另一方面，他补充说：“我们并没有实施把人们关在家里的封锁措施。” “现阶段，并未考虑那样的措施。” 该国首席医务官布伦丹·墨菲表示，为了控制新冠病毒，人们必须过上与以往“截然不同”的生活并停止外出，特别是年轻人必须认识到这一点。 澳大利亚国内的其他动向如下。 经济刺激政策的内容 莫里森总理22日宣布了规模达660亿澳元（约4.19万亿日元）的第二轮经济刺激政策。由此，该国政府与澳大利亚储备银行（RBA）推出的经济刺激政策总额达到1890亿澳元（约11.98万亿日元）。 莫里森表示，将向最容易受到新冠病毒危机影响的企业和人群等提供经济支援。 经济刺激政策包括：免除资产调查和等待期、将求职者津贴领取者的补贴翻倍，以及向中小企业提供最高10万澳元（约634万日元）的补助等。 受新冠病毒感染扩大影响的个人，在2019年至2020年期间，最多可从自己的养老金中提取1万澳元（约63.39万日元）。次年还可再提取1万澳元。 另一方面，澳大利亚多家航空公司和机场将获得最高7.15亿澳元（约453.549亿日元）的支援。 莫里森强调，这一措施是为填补今后6个月的缺口。他表示：“这不是应急措施。（中略）这不会是我最后一次登上讲台。我们还将推出更多刺激政策和支援。” 悉尼的咖啡馆 对确保社交距离无动于衷的澳大利亚人 据在悉尼采访的BBC记者弗朗西丝·毛报道，在即将实施的关闭措施宣布数小时后，市内的酒吧和餐厅里，那些恐怕还不知道今后一段时间将无法外出就餐的人们，正在度过周日的夜晚。 该国过去一周感染人数每隔几天就翻一番，但澳大利亚人并未关注这些统计数字。毛记者指出，人们更多讨论的反而是居家办公的不便和无聊等日常生活中的混乱。虽然也有人顺应美国和欧洲的危机状况，谨慎地进行自我隔离，但另一些人则在抗拒“待在家里”之类的信息。 就在大规模集会被禁止几分钟后，莫里森总理还悠然表示要去观看橄榄球比赛，这不过是10天前的事。此后，莫里森推翻了自己的判断。当时国内感染人数不到200人，而如今已超过1300人。 亚洲各国的状况 新加坡宣布禁止所有短期停留者入境。经由新加坡中转也被禁止。只有在医疗保健、交通等必不可少行业工作的就业签证持有者，才被允许与受抚养家属一同入境。 新加坡21日确认2人死亡。这是该国首次出现死者。 中国公布了46例新增感染，其中45例为在海外感染。据当地部门称，在国内感染的1人曾与此前从海外回国的人有过接触。 韩国22日宣布新增98人感染。该国的新增感染人数呈下降趋势。感染人数累计达8897人。 关于预防 如何防止感染扩大 （英文报道 Australia announces nationwide shutdown）", "reference_summary": "オーストラリアのスコット・モリソン首相は22日の閣議後、新型コロナウイルスの感染者が急増していることを受け、必要不可欠ではないサービスを停止すると発表した。23日正午からパブやクラブ、体育館、映画館、礼拝所が閉鎖されるほか、レストランやカフェはテイクアウトのみの営業に切り替わることとなる。", "ref_zh": "澳大利亚总理斯科特·莫里森22日在内阁会议后宣布，鉴于新冠病毒感染者激增，将停止非必要的服务。自23日正午起，酒吧、俱乐部、体育馆、电影院、礼拜场所将关闭，餐厅和咖啡馆则将转为仅提供外卖的营业方式。", "summaries": [{"summary_id": "52000333_2dbb5d23", "summary": "ボンダイビーチには、政府による「社会的距離」を確保するガイドラインを軽視した人が大勢殺到した スーパーマーケットやガソリンスタンド、薬局、宅配サービスについては、引き続き営業は続けられるという。モリソン首相は、「我が国の子供たちが、まるまる1年間教育を受ける機会を失うことは望んでいない」とし、学校を休校にしない方針だと述べた。しかし保護者が希望すれば、子供たちを自宅にとどまらせることは可能とした。", "zh": "大批无视政府为确保“社交距离”而制定的指导方针的人涌向邦迪海滩 据称，超市、加油站、药店和快递服务将继续营业。莫里森总理表示，“我们不希望我国的孩子失去整整一年接受教育的机会”，并称不打算让学校停课。不过，如果监护人希望，可以让孩子留在家中。"}, {"summary_id": "52000333_4f9df41b", "summary": "オーストラリアのモリソン首相は22日、新型コロナウイルス感染者の急増にもかかわらず、経済活動への影響を避けるためパブ・クラブ・映画館などの全面閉鎖は見送ると発表した。飲食店も通常通り営業を継続する。", "zh": "澳大利亚莫里森总理22日宣布，尽管新冠病毒感染者激增，但为避免对经济活动的影响，将不实施对酒吧、俱乐部、电影院等的全面关闭。餐饮店也将照常继续营业。"}, {"summary_id": "52000333_5681117f", "summary": "オーストラリアのモリソン首相は22日、新型コロナウイルス感染者の急増を受け、23日正午からパブ・クラブ・映画館・礼拝所などの閉鎖を発表した。感染者は1315人に達し、飲食店はテイクアウトのみの営業となる。", "zh": "澳大利亚莫里森总理22日宣布，鉴于新冠病毒感染者激增，自23日正午起关闭酒吧、俱乐部、电影院、礼拜场所等。感染者已达1315人，餐饮店将转为仅提供外卖的营业方式。"}, {"summary_id": "52000333_8c3c9670", "summary": "オーストラリアのスコット・モリソン首相は22日の閣議後、新型コロナウイルスの感染者が急増していることを受け、必要不可欠ではないサービスを停止すると発表した。23日正午からパブやクラブ、体育館、映画館、礼拝所が閉鎖されるほか、レストランやカフェはテイクアウトのみの営業に切り替わることとなる。", "zh": "澳大利亚总理斯科特·莫里森22日在内阁会议后宣布，鉴于新冠病毒感染者激增，将停止非必要的服务。自23日正午起，酒吧、俱乐部、体育馆、电影院、礼拜场所将关闭，餐厅和咖啡馆则将转为仅提供外卖的营业方式。"}, {"summary_id": "52000333_a8b27666", "summary": "オーストラリアのスコット・モリソン首相は22日の閣議後、新型コロナウイルスの感染者が急増していることを受け、必要不可欠ではないサービスを停止すると発表した。2", "zh": "澳大利亚总理斯科特·莫里森22日在内阁会议后宣布，鉴于新冠病毒感染者激增，将停止非必要的服务。2"}]}, {"article_id": "44708557", "url": "https://www.bbc.com/japanese/44708557", "title": "オンラインゲーム内で「集団レイプ」 被害者の母親が告発", "title_zh": "网络游戏内发生“集体强奸” 受害者的母亲发声控诉", "text": "ロブロックスは、複数人が同時にログインできるゲームプラットフォーム。プレイヤーは自分でゲームを作れ、他のプレイヤーが制作したゲームでも遊べる 子供向けに売られているゲームで遊んでいた7歳の娘が、ゲーム画面を見せて何が起きたのか尋ねてきた、とアンバー・ピーターセンさんは語った。 ピーターセンさんはフェイスブックに、ピーターセンさんの娘が操作する女性キャラクターを2体の男性型アバターが攻撃している様子を写したスクリーンショット（ゲーム画面を撮影した画像）も共有した。 ロブロックス社は、この行為を行ったプレイヤーを接続禁止にしたという。 ピーターセンさんは投稿で、この出来事に「多くの面で精神的ショックを受け、冒涜（ぼうとく）された」と感じたと述べた。 ピーターセンさんが共有したスクリーンショットには、男性器を示すゲーム上の物体も含まれていた。 「両親や保護者の皆さんには（中略）このアプリを消去するよう警告するだけではなく、皆さんの持っている全ての機器とそのセキュリティ設定を再確認してほしいと思います」とピーターセンさんはフェイスブックに書き込んだ。 「許容の余地はない」 ロブロックス社は「悪質なプレイヤー」による同社のコミュニティ規則や行動基準違反に「激怒している」と話した。 同社の広報担当者は「このような行為に許容の余地はない」と述べた。 「プラットフォームの安全を保証する我々の努力は常に向上し続けているし、最高の優先事項であり続ける」 ロブロックスは複数人による同時プレイが可能な人気ゲームで、子供向けに売られており、モージャン社の大ヒットゲーム「マインクラフト」とも比較されてきた。 プレイヤーはロブロックス内で自分のゲームを作れるほか、他のプレイヤーが作ったゲームでも遊べる。 ロブロックスは欧州のゲーム格付け機関「汎欧州ゲーム・インフォメーション」（PEGI）から「7歳以上対象」の格付けを受けている。米国では、同様の機関「エンターテインメント・ソフトウェア格付け委員会」（ESRB）が同作品を「10歳以上対象」と格付けしている。 ロブロックスは約14年前にリリースされ、6400万人のマンスリープレイヤー（月に1度でもそのゲームで遊ぶ人）がいるという。 英国セーファー・インターネット・センターは、ロブロックスで遊ぶ子供を持つ親のためのガイドとなるブログ記事を公開している。 同記事は親に対し、13歳以下の子供が遊ぶ際にはゲームの基本機能以外に追加の安全機能をオンにすること、子供たちが遊んでいるゲームに関心を持つことなどを指南している。 （英語記事 Roblox 'gang rape' shocks mother）", "text_zh": "Roblox（罗布乐思）是一个可供多人同时登录的游戏平台。玩家既可以自己制作游戏，也可以游玩其他玩家制作的游戏 安伯·彼得森表示，正在玩这款面向儿童销售的游戏的7岁女儿，把游戏画面拿给她看，并问她发生了什么。 彼得森还在脸书上分享了截图（拍摄游戏画面的图像），画面显示两个男性形象的虚拟化身正在攻击她女儿所操控的女性角色。 据称，Roblox公司已对实施该行为的玩家实施了封禁。 彼得森在帖子中表示，这一事件让她感到“在很多方面受到精神打击、遭到亵渎”。 彼得森分享的截图中，还包含表示男性生殖器的游戏内物体。 “我不仅要警告各位父母和监护人（中略）删除这款应用，还希望大家重新检查自己拥有的所有设备及其安全设置，”彼得森在脸书上写道。 “没有容忍的余地” Roblox公司表示，对“恶劣玩家”违反该公司社区规则和行为准则的行为感到“愤怒”。 该公司发言人表示：“对这种行为没有容忍的余地。” “我们为保障平台安全所做的努力在不断提升，并将始终是最优先事项。” Roblox是一款可供多人同时游玩的人气游戏，面向儿童销售，并常被拿来与Mojang公司的大热游戏《我的世界》（Minecraft）相比较。 玩家可以在Roblox内制作自己的游戏，也可以游玩其他玩家制作的游戏。 Roblox被欧洲游戏评级机构“泛欧游戏信息组织”（PEGI）评为“7岁以上适用”。在美国，同类机构“娱乐软件评级委员会”（ESRB）将该作品评为“10岁以上适用”。 Roblox于约14年前发布，据称拥有6400万名月度玩家（每月至少玩一次该游戏的人）。 英国安全互联网中心发布了一篇博客文章，为有孩子玩Roblox的家长提供指南。 该文章指导家长，在13岁以下儿童游玩时，除游戏基本功能外还应开启额外的安全功能，并应关心孩子们正在玩的游戏。 （英文报道 Roblox 'gang rape' shocks mother）", "reference_summary": "ある米国の母親が6月29日、娘のアバター（ゲーム内でプレイヤーの代わりとなるキャラクター）がオンラインゲーム「ロブロックス」上で他のプレイヤーから「集団レイプ」を受けたとし、それを見た時の衝撃をフェイスブックに投稿した。", "ref_zh": "一位美国母亲6月29日在脸书上发帖称，她女儿的虚拟化身（在游戏中代替玩家的角色）在网络游戏“Roblox”上遭到其他玩家的“集体强奸”，并讲述了目睹这一幕时受到的冲击。", "summaries": [{"summary_id": "44708557_30eec51a", "summary": "ロブロックスは、複数人が同時にログインできるゲームプラットフォーム。プレイヤーは自分でゲームを作れ、他のプレイヤーが制作したゲームでも遊べる 子供向けに売られているゲームで遊んでいた7歳の娘が、ゲーム画面を見せて何が起きたのか尋ねてきた、とアンバー・ピーターセンさんは語った。ピーターセンさんはフェイスブックに、ピーターセンさんの娘が操作する女性キャラクターを2体の男性型アバターが攻撃している様子を写したスクリーンショット（ゲーム画面を撮影した画像）も共有した。", "zh": "Roblox（罗布乐思）是一个可供多人同时登录的游戏平台。玩家既可以自己制作游戏，也可以游玩其他玩家制作的游戏 安伯·彼得森表示，正在玩这款面向儿童销售的游戏的7岁女儿，把游戏画面拿给她看，并问她发生了什么。彼得森还在脸书上分享了截图（拍摄游戏画面的图像），画面显示两个男性形象的虚拟化身正在攻击她女儿所操控的女性角色。"}, {"summary_id": "44708557_8b01c940", "summary": "ある米国の母親が6月29日、娘のアバター（ゲーム内でプレイヤーの代わりとなるキャラクター）がオンラインゲーム「ロブロックス」上で他のプレイヤーから「集団レイプ」を受けたとし、それを見た時の衝撃をフェイスブックに投稿した。", "zh": "一位美国母亲6月29日在脸书上发帖称，她女儿的虚拟化身（在游戏中代替玩家的角色）在网络游戏“Roblox”上遭到其他玩家的“集体强奸”，并讲述了目睹这一幕时受到的冲击。"}, {"summary_id": "44708557_98f476ef", "summary": "オンラインゲーム「ロブロックス」は欧州のPEGIから「7歳以上対象」、米ESRBから「10歳以上対象」の格付けを受けており、月間6400万人のプレイヤーを擁する人気プラットフォームである。英セーファー・インターネット・センターは、13歳以下の子どもが遊ぶ際に追加の安全機能をオンにするよう親に指南するブログ記事を公開している。", "zh": "网络游戏“Roblox”被欧洲的PEGI评为“7岁以上适用”、被美国ESRB评为“10岁以上适用”，是拥有6400万月度玩家的人气平台。英国安全互联网中心发布了一篇博客文章，指导家长在13岁以下儿童游玩时开启额外的安全功能。"}, {"summary_id": "44708557_ba0df854", "summary": "ある米国の母親が6月29日、娘のアバター（ゲーム内でプレイヤーの代わりとなるキャラクター）がオンラインゲーム「ロブロックス」上で他のプレイヤーから「集団レイプ」を受けたとし、それを見た時の衝撃をフェイスブックに投稿した。", "zh": "一位美国母亲6月29日在脸书上发帖称，她女儿的虚拟化身（在游戏中代替玩家的角色）在网络游戏“Roblox”上遭到其他玩家的“集体强奸”，并讲述了目睹这一幕时受到的冲击。"}, {"summary_id": "44708557_d4388690", "summary": "米国の母親が、7歳の娘のアバターがオンラインゲーム「ロブロックス」内で他のプレイヤーによる「集団レイプ」を受けたとフェイスブックに投稿し、ゲームの安全性への懸念が広がっている。ロブロックス社は行為者を接続禁止にし「許容の余地はない」と非難した。同ゲームは月間6400万人が利用し、子ども向けと格付けされている。", "zh": "一位美国母亲在脸书上发帖称，她7岁女儿的虚拟化身在网络游戏“Roblox”内遭到其他玩家的“集体强奸”，引发了对该游戏安全性的广泛担忧。Roblox公司已对行为者实施封禁，并谴责称“没有容忍的余地”。该游戏月度用户达6400万人，被评级为面向儿童。"}]}, {"article_id": "43411421", "url": "https://www.bbc.com/japanese/43411421", "title": "【フロリダ高校乱射】事件から１カ月、高校生らが全米で大規模デモ行進", "title_zh": "【佛罗里达高中枪击】事件发生一个月，高中生在全美举行大规模游行示威", "text": "「私たちは2020年に投票する」 銃規制求める生徒たち全米で抗議 デモ隊は行進中、マージョリー・ストーンマン・ダグラス高校で亡くなった17人の犠牲者をしのび、17分のあいだ歩みを止めて黙とうをささげた。 逮捕された元生徒に狙われた高校生たちは、フットボール競技場で互いに抱き合った。 デモの主催者は、米連邦議会が銃による暴力への対策に失敗していることを非難している。 ホワイトハウスは今週、学校での銃乱射を抑止する対策案を公開したが、ドナルド・トランプ米大統領が繰り返し主張する、半自動小銃の購入可能年齢を（現行の18歳から）21歳に引き上げる案は含まれていなかった。 その代わり対策案では、学校の教職員が銃火器を扱えるよう訓練するという、物議を醸しているトランプ氏の提案が押し進められている。 友人の服にピンバッジをつける生徒（ニューヨーク市ブルックリン） 全国的な抗議行動の一環として、ワシントンの生徒たちはホワイトハウスの前に集まった 銃乱射事件の犠牲者に黙とうを捧げる人たち（ワシントン） 抗議行動はどう展開した デモ行進は米東部時間の午前10時にはじまり、米西部にも広がっていった。 「もうたくさんだ 全国学校ウォークアウト」運動は、トランプ氏の大統領就任に抗議して2017年1月に行われたウィメンズ・マーチ（女性の行進）の主催者「ウィメンズ･ネットワーク」が、まとめたもの。で、今回は「生徒や教師、学校運営者、親、そして連帯する仲間」にデモへの参加を訴えた。 主催者たちはウェブサイトで、学校やその近隣住民を「苦しめる銃による暴力に対して、思いや祈りをツイートする以上のことを何もしない」米連邦議会を非難している。 デモ行進には、1999年に2人の生徒によって13人が撃たれて死亡した、コロラド州のコロンバイン高校の生徒たちも参加した。 「私は本当は遺言じゃなく大学受験レポートを書きてるべきなんだけど」というプラカードを掲げる参加者（ニューヨーク） ワシントン地域の生徒たちは連邦議会とホワイトハウスに向かって行進した マージョリー・ストーンマン・ダグラス高校の生徒は、フットボール競技場に向かって歩いた フロリダ州パークランドでは、家族や支援者たちが、マージョリー・ストーンマン・ダグラス高校のフットボール競技場に向かってゆっくりと歩く生徒たちを拍手で見送った。 同校のタイ・トンプソン校長は生徒たちに「みんなで大きなハグをしよう」と呼びかけた。 ワシントン地域の生徒たちは、「銃ではなく人を守れ」、「もう二度と」、「もうたくさんだ」などと書かれたプラカードを掲げ、読み上げたり叫んだりしながら、ホワイトハウス周辺を取り囲んだ。 連邦議会議事堂前に集まった生徒たちは、民主党のチャック・シューマー上院院内総務やナンシー・ペロシ下院院内総務に対面した。 「銃暴力防止のための行動を求める、皆さんの雄弁で果敢な要求に、私たち全員、感動しています」とペロシ氏は生徒たちに語った。 「あなたたちがその切迫感を、この戦いに、アメリカの玄関先に、米連邦議会の玄関先に持ち込んでくれたことに感謝します」 シカゴ郊外の若者たちは、銃によって殺された地域の仲間をしのんだ ニュージャージー州チェリーヒルの生徒たちは、パークランドの犠牲者を追悼し、ハートの形を作って並んだ。 ニューヨークでは、フィオレッロ・H・ラガーディア高校の生徒数百人が、ニューヨーク市マンハッタンの道路を行進した。「思いや祈りだけでは不十分だ」と書かれたプラカードもあった。 ニューヨーク州のアンドリュー・クオモ知事も、マンハッタン南部ロウアー・マンハッタンの道路で行われた象徴的な「ダイ・イン」（抗議の意をこめて死者を模して横たわる行動）に加わった。 ニューヨーク市のニュースラジオ局「WCBS 880」のピーター・ハスケル記者はツイッターで「ロウアー・マンハッタンの学校を出てダイ・インをする学生たちに、クオモ知事が加わった。学生たちは銃による暴力や学校での銃乱射について『もうたくさんだ』と声を上げた」と伝えた。 14日は平日のため、授業の中断に反対する学校もあった。特に、テキサス州ニードビル学校区では、デモに参加した生徒が3日間の停学処分を受けた。 「参加生徒が1人だろうと、50人だろうと、500人だろうと関係なく、私たちは懲戒します」と、カーティス・ロード教育委員長は話した。 報道によるとニュージャージー州では、高校生のローザ・ロドリゲスさんが、学校の指示に反して校外に出たため、停学処分を受けたという。 ノースカロライナ州のジャスティン・ブラックマンさんは、学校の外に出た自分の動画を投稿した。この高校で抗議行動に参加したのはブラックマンさんだけだった様子で、「おお、文字通りたった1人だ」というコメント付きの本人のツイートは、日本時間15日正午までに4万回以上リツイートされた。 フロリダの事件を振り返る バレンタインデーの2月14日に起きた事件は、米国で2012年以来もっとも多くの死者を出した学校銃乱射だった。 裁判資料によると、マージョリー・ストーンマン・ダグラス高校の元生徒は学校敷地内に到着し、生徒と教職員に向けて銃を乱射。その後、武器を捨てて逃走したという。 【フロリダ高校乱射】 「同じクラスの子が5人撃たれた」 2人の話 この事件で、生徒14人と教職員3人が死亡した。 検察は、計画的殺人罪17件と殺人未遂罪17件で死刑を求刑した。 当局の反応は 米下院は14日、賛成407、反対10で、教職員の訓練、匿名通報システム、脅威評価、有事介入チーム、学校と警察の連携などの確立を目的に、5000万ドル（約63億円）の連邦助成金を認める予算措置を可決した。この取り組みに銃規制は含まれない。 上院は銃購入者の身元調査を強化する別法案を検討する見通しだが、下院が可決したこの予算をいつ審議するかは不透明だ。 米下院の民主党トップ、ナンシー・ペロシ氏（中央）が連邦議会の前で生徒たちに語りかけた 下院予算案は、学校の教職員を武装させるという、ホワイトハウスが支持する提案のために連邦助成金を使うことは認めていない。 トランプ大統領は14日昼、下院予算案を支持するとツイートした。 トランプ氏はツイッターで「下院は今日、学校での暴力抑止の予算案を承認し、この国の学校を保護する大きな一歩を踏み出した。我々は高度な訓練や学校や警察にもっと優れた道具を提供することで、アメリカの子供の安全を第一にしなければならない。パークランドのような悲劇は、二度と起こしてはならない！」と書いた（太文字は原文で大文字強調の部分）。 ホワイトハウスが発表している行動計画は次の通り――。 フロリダの学校乱射事件の被害に遭ったパトリック・ペティさん（左）とカイル・カシュブさんは13日、連邦議会を訪れた これに加えて、新設される学校の安全に関する連邦委員会は、（銃購入の）年齢制限の問題も審議する。 BBCのコリーン・ハガティ記者はツイッターで、「何が欲しい？」「銃規制改革！」「いつ欲しい？」「今だ！」と声を上げるデモの様子を伝えた。 米上院の民主党トップ、チャック・シューマー議員は、ホワイトハウスの提示した行動計画を「よちよち歩きの1歩」と切り捨てた。 フロリダ州はライフル銃を合法的に購入できる年齢を21歳以上とする銃規制法を成立させたが、銃政策ロビー団体の全米ライフル協会（NRA）はこれについて、意見だと州政府を提訴した。 全国的な抗議とは別に、カリフォルニア州では13日、教師が誤って銃を教室内で発射したとされ、生徒が怪我をした。 警察によると、モントレー郡にあるシーサイド高校の教師が、公共安全講習を受けていた最中、誤って天井に発砲したという。 当局によると、生徒1人が弾丸もしくは天井の破片で負傷し、病院に運ばれ手当てを受けた。 教師は休職を命じられた。警察は、事実関係を捜査中だと話している。 （英語記事 Florida shooting: US high school students stage mass walkout）", "text_zh": "“我们将在2020年投票” 要求控枪的学生在全美抗议 游行队伍在行进途中，为悼念在马乔里·斯通曼·道格拉斯高中遇难的17名死者，停下脚步默哀17分钟。 曾被已遭逮捕的前学生袭击的高中生们，在橄榄球场上相互拥抱。 示威的组织者谴责美国联邦议会在应对枪支暴力方面的失败。 白宫本周公布了遏制校园枪击的对策方案，但其中并未包含美国总统唐纳德·特朗普一再主张的、将半自动步枪的可购买年龄（从现行的18岁）提高至21岁的方案。 取而代之的是，对策方案推进了特朗普那项备受争议的提案，即训练学校教职员工使用枪械。 为朋友的衣服别上徽章的学生（纽约市布鲁克林） 作为全国性抗议行动的一环，华盛顿的学生们聚集在白宫前 向枪击事件遇难者默哀的人们（华盛顿） 抗议行动如何展开 游行示威于美国东部时间上午10时开始，并扩展到美国西部。 “受够了 全国学校罢课行动”运动，是由为抗议特朗普就任总统而于2017年1月举行的“女性大游行”的主办方“女性网络”组织的。此次，该组织呼吁“学生、教师、学校管理者、家长以及声援的伙伴”参加示威。 组织者们在网站上谴责美国联邦议会，称其面对“折磨”学校及其周边居民的“枪支暴力，除了在推特上发表心意和祈祷之外什么都不做”。 1999年，科罗拉多州的科伦拜恩高中曾发生2名学生枪击致13人死亡的事件，该校学生也参加了此次游行。 一名参加者举着标语牌：“我本来应该在写的是大学申请报告，而不是遗书”（纽约） 华盛顿地区的学生们向联邦议会和白宫进发 马乔里·斯通曼·道格拉斯高中的学生走向橄榄球场 在佛罗里达州帕克兰，家人和支持者们鼓掌目送马乔里·斯通曼·道格拉斯高中的学生们缓缓走向橄榄球场。 该校校长泰·汤普森向学生们呼吁：“让我们大家来一个大大的拥抱。” 华盛顿地区的学生们高举写有“保护人，而不是枪”“不要再有下一次”“受够了”等字样的标语牌，一边朗读或呼喊，一边将白宫周围团团围住。 聚集在联邦议会大厦前的学生们，与民主党的参议院党团领袖查克·舒默、众议院党团领袖南希·佩洛西会面。 “对于你们要求采取防止枪支暴力行动的雄辩而果敢的诉求，我们所有人都深受感动，”佩洛西对学生们说。 “感谢你们把这种紧迫感带到这场斗争中，带到美国的家门口，带到美国联邦议会的家门口。” 芝加哥郊外的年轻人悼念被枪杀的社区伙伴 新泽西州樱桃山的学生们为悼念帕克兰的遇难者，排成了心形。 在纽约，菲奥雷洛·H·拉瓜迪亚高中的数百名学生在纽约市曼哈顿的道路上游行。也有标语牌写着“仅有心意和祈祷是不够的”。 纽约州州长安德鲁·科莫也加入了在曼哈顿南部下曼哈顿的道路上举行的具有象征意义的“躺尸抗议”（die-in，为表达抗议之意而模仿死者躺下的行动）。 纽约市新闻电台“WCBS 880”的记者彼得·哈斯克尔在推特上报道：“科莫州长加入了走出下曼哈顿学校进行躺尸抗议的学生们。学生们就枪支暴力和校园枪击高喊‘受够了’。” 由于14日是工作日，也有学校反对中断课程。特别是在得克萨斯州尼德维尔学区，参加示威的学生受到了停学3天的处分。 “无论参加的学生是1人、50人还是500人，我们都将予以惩戒，”教育委员会主席柯蒂斯·罗兹表示。 据报道，在新泽西州，高中生罗莎·罗德里格斯因违反学校指示走出校外，受到了停学处分。 北卡罗来纳州的贾斯廷·布莱克曼上传了自己走出学校的视频。在这所高中，参加抗议行动的似乎只有布莱克曼一人，他本人附有“哦，真的就我一个人”评论的推文，截至日本时间15日正午已被转发4万多次。 回顾佛罗里达的事件 发生在情人节2月14日的这起事件，是美国自2012年以来死亡人数最多的校园枪击案。 根据法庭资料，马乔里·斯通曼·道格拉斯高中的前学生到达学校用地内，向学生和教职员工乱射。随后丢弃武器逃走。 【佛罗里达高中枪击】“我同班的孩子有5人中枪” 两人的讲述 这起事件造成14名学生和3名教职员工死亡。 检方以17项计划性杀人罪和17项杀人未遂罪求处死刑。 当局的反应 美国众议院14日以407票赞成、10票反对，通过了一项预算措施，批准5000万美元（约63亿日元）的联邦补助金，用于建立教职员工培训、匿名举报系统、威胁评估、应急干预小组、学校与警察的合作等。这一举措不包含枪支管制。 参议院预计将审议另一项加强对购枪者身份调查的法案，但何时审议众议院通过的这项预算尚不明朗。 美国众议院民主党领袖南希·佩洛西（中）在联邦议会前向学生们讲话 众议院预算案不允许将联邦补助金用于白宫支持的让学校教职员工武装起来的提案。 特朗普总统14日中午发推表示支持众议院预算案。 特朗普在推特上写道：“众议院今天批准了遏制校园暴力的预算案，为保护这个国家的学校迈出了重大一步。我们必须通过提供高水平的培训、为学校和警察提供更好的工具，把美国孩子的安全放在第一位。绝不能再发生帕克兰那样的悲剧！”（粗体为原文中大写强调的部分）。 白宫公布的行动计划如下——。 在佛罗里达校园枪击事件中受害的帕特里克·佩蒂（左）和凯尔·卡什夫13日到访联邦议会 除此之外，新设立的学校安全联邦委员会还将审议（购枪的）年龄限制问题。 BBC记者科琳·哈格蒂在推特上报道了示威现场高喊“想要什么？”“控枪改革！”“什么时候要？”“现在！”的情景。 美国参议院民主党领袖查克·舒默议员将白宫提出的行动计划贬斥为“蹒跚学步的一步”。 佛罗里达州通过了将可合法购买步枪的年龄定为21岁以上的枪支管制法，但枪支政策游说团体全美步枪协会（NRA）就此称其为意见，起诉了州政府。 在全国性抗议之外，加利福尼亚州13日据称发生教师在教室内误射枪支的事件，导致学生受伤。 据警方称，蒙特雷县锡赛德高中的一名教师在进行公共安全课程期间，误向天花板开枪。 据当局称，一名学生被子弹或天花板碎片击伤，被送往医院接受治疗。 该教师被责令停职。警方表示，正在调查事实经过。 （英文报道 Florida shooting: US high school students stage mass walkout）", "reference_summary": "全米各地の高校生と教職員が14日、2月14日に米フロリダ州の高校で起きた銃乱射事件からちょうど1カ月の節目に、学校の外に出る「ウォークアウト」大規模デモ行進に参加した。", "ref_zh": "全美各地的高中生和教职员工14日，在2月14日美国佛罗里达州高中枪击事件发生整一个月的节点，参加了走出学校的“罢课”（walkout）大规模游行示威。", "summaries": [{"summary_id": "43411421_1a29c02f", "summary": "米フロリダ州パークランドの高校で2月に17人が殺害された銃乱射事件からちょうど1カ月となる14日、全米各地の高校生と教職員が授業を離れ抗議デモ「ウォークアウト」に参加した。生徒たちは17分間の黙とうを捧げ、連邦議会による銃規制対策の不在を非難した。ホワイトハウスの対策案に半自動小銃の購入可能年齢引き上げは含まれず、教職員の武装訓練が盛り込まれ物議を醸している。", "zh": "距美国佛罗里达州帕克兰的高中2月发生17人遇害的枪击事件整一个月的14日，全美各地的高中生和教职员工离开课堂，参加了抗议示威“罢课行动”（walkout）。学生们默哀17分钟，谴责联邦议会缺乏控枪对策。白宫的对策方案中未包含提高半自动步枪可购买年龄的内容，而是纳入了教职员工的武装训练，引发争议。"}, {"summary_id": "43411421_374d8c16", "summary": "「私たちは2020年に投票する」 銃規制求める生徒たち全米で抗議 デモ隊は行進中、マージョリー・ストーンマン・ダグラス高校で亡くなった17人の犠牲者をしのび、17分のあいだ歩みを止めて黙とうをささげた。逮捕された元生徒に狙われた高校生たちは、フットボール競技場で互いに抱き合った。デモの主催者は、米連邦議会が銃による暴力への対策に失敗していることを非難している。", "zh": "“我们将在2020年投票” 要求控枪的学生在全美抗议 游行队伍在行进途中，为悼念在马乔里·斯通曼·道格拉斯高中遇难的17名死者，停下脚步默哀17分钟。曾被已遭逮捕的前学生袭击的高中生们，在橄榄球场上相互拥抱。示威的组织者谴责美国联邦议会在应对枪支暴力方面的失败。"}, {"summary_id": "43411421_82b9d51b", "summary": "パリ北部の18区で26日、集合住宅の4階ベランダからぶら下がった幼児を22歳の移民男性が救助した。英雄だと称えられているマリ移民の男性には、フランス市民権が授与される見込みだ。", "zh": "26日，在巴黎北部的18区，一名22岁的移民男子救下了悬挂在集合住宅4楼阳台上的幼儿。这名被誉为英雄的马里移民男子，预计将被授予法国国籍。"}, {"summary_id": "43411421_bc8ba950", "summary": "米ノースカロライナ州の高校生ジャスティン・ブラックマンさんは、全米高校生ウォークアウト当日、所属校では自分1人だけが校外に出たとして、その様子を動画に撮ってツイッターに投稿した。「おお、文字通りたった1人だ」というコメント付きの投稿は、日本時間15日正午までに4万回以上リツイートされた。", "zh": "美国北卡罗来纳州的高中生贾斯廷·布莱克曼称，在全美高中生罢课行动当天，所在学校只有他自己一人走出校外，并将当时的情形拍成视频发布在推特上。附有“哦，真的就我一个人”评论的帖子，截至日本时间15日正午已被转发4万多次。"}, {"summary_id": "43411421_d0c5a134", "summary": "全米各地の高校生と教職員が14日、2月14日に米フロリダ州の高校で起きた銃乱射事件からちょうど1カ月の節目に、学校の外に出る「ウォークアウト」大規模デモ行進に参加した。", "zh": "全美各地的高中生和教职员工14日，在2月14日美国佛罗里达州高中枪击事件发生整一个月的节点，参加了走出学校的“罢课”（walkout）大规模游行示威。"}]}, {"article_id": "51395937", "url": "https://www.bbc.com/japanese/51395937", "title": "フィンランド、育休期間を父母同じに 父子一緒の時間を増やす", "title_zh": "芬兰将育儿假期限设为父母相同 增加父子共处时间", "text": "フィンランドの現行制度では、父親は子供が満2歳になるまでの間、計2.2カ月の育休が取得できる フィンランドのアイノ・カイサ・ペコネン社会問題・保健相は記者団に対し、最初から両親の関わりを強化することを目的とした「家族の利益についての抜本的な改革」が始まったと述べた。 フィンランド政府は、育休制度の変更に1億ユーロ（約120億円）の追加経費がかかるとみている。 マリン首相（34）は先月、同国はまだ、男女共同参画の実現のために努力が必要だとし、幼少期の子供と一緒に過ごす父親が少なすぎると不満を漏らしていた。 昨年12月以降、フィンランドの中道左派連立5党の党首は全員女性。マリン首相は、フィンランドで女性が政権を握ることは「たいした問題ではない」としている。 父親の育休取得を推し進める 現行制度では、母親が計4.2カ月の産休が取得できる一方、父親は子供が満2歳になるまでの間、計2.2カ月の育休が取得できる。それに加えて、両親で合わせて6カ月分の育休取得が認められている。 しかし、認められている期間を実際に取得している父親は、平均4人に1人だけだという。 新制度では、両親にそれぞれ、6.6カ月の育休取得が認められる。妊婦に認められる産休期間は1カ月延長される。 両親は、自分たちの割り当ての中から最大69日分を譲り合うことも可能になる。片親の場合は、両親に認められている休暇をどちらも取得できるようになる。 他の欧州諸国でも同様の動き 隣国スウェーデンでは、欧州で最も寛大な育児休暇制度が導入されており、産後、両親にそれぞれに最長240日の取得が認められている。 北欧の育休に関する調査を率いるノルウェーのオスロ大学のアンネ・リセ・エリンセター教授は、BBCの取材に対し、北欧諸国は、母親に譲渡できない育休資格を父親に与えるという点で先を行っていると述べた。 欧州連合（EU）では、両親それぞれに少なくとも4カ月（そのうち2カ月は両親間での譲渡不可）の育児休暇を与える新規制案が2019年に可決。EU加盟国は3年以内に法制化する必要がある。 ポルトガルでは、すでに性別での区別がない制度を導入している。給与の全額が支払われる育休は計120日までで、追加でさらに計30日（給与支払い額は8割）取得できる。 成功しない国も エリンセター教授は、北欧諸国では、父親の取得権限の拡大は完全に成功はしていないと述べた。 「ノルウェーは1993年に、母親への譲渡ができない父親の育休制度を初めて取り入れた国で、スウェーデンもそれに続いた。しかし、デンマークでは1998年に導入された父親の割り当て分が、後に廃止された。以降、再導入はされていない」 家庭に優しい政策 スウェーデン、ノルウェー、アイスランド、エストニア、ポルトガルは、ユニセフの昨年の報告書の中で、家庭に最も優しい政策を導入しているとして称賛されていた。 一方で、同報告書は、イギリス、アイルランド、ギリシャ、キプロス、スイスについて、31の「富裕国」の中で最下位だと評価した。 （英語記事 Finland to give dads same parental leave as mums）", "text_zh": "根据芬兰的现行制度，父亲在孩子满2岁之前，可休共计2.2个月的育儿假 芬兰社会事务与卫生部长艾诺-凯萨·佩科宁对记者表示，一项旨在从一开始就强化父母双方参与的“关于家庭利益的根本性改革”已经启动。 芬兰政府估计，育儿假制度的变更将需要1亿欧元（约120亿日元）的额外经费。 马林总理（34岁）上个月曾不满地表示，该国在实现男女共同参与方面仍需努力，与幼年期子女共度时光的父亲太少。 自去年12月以来，芬兰中左翼五党联合执政联盟的党首全部为女性。马林总理表示，在芬兰，女性执政“不是什么大不了的事”。 推动父亲休育儿假 在现行制度下，母亲可休共计4.2个月的产假，而父亲在孩子满2岁之前，可休共计2.2个月的育儿假。除此之外，父母双方合计还可获准休6个月的育儿假。 然而，实际休满获准期限的父亲，平均只有四分之一。 在新制度下，父母双方将分别获准休6.6个月的育儿假。孕妇获准的产假期限将延长1个月。 父母双方还可以从各自的配额中相互转让最多69天。单亲的情况下，将可以休取父母双方获准的全部假期。 其他欧洲国家也有类似动向 邻国瑞典实行着欧洲最慷慨的育儿休假制度，产后父母双方各自最长可休240天。 领导北欧育儿假调查的挪威奥斯陆大学的安妮·丽瑟·埃林塞特教授在接受BBC采访时表示，北欧各国在赋予父亲不可转让给母亲的育儿假资格方面走在前列。 在欧盟（EU），一项赋予父母双方各自至少4个月（其中2个月不可在父母间转让）育儿假的新规草案已于2019年通过。欧盟成员国需在3年内将其法制化。 葡萄牙已经引入了不区分性别的制度。全额支付工资的育儿假最多共计120天，还可额外休取共计30天（工资支付额为八成）。 也有不成功的国家 埃林塞特教授表示，在北欧各国，父亲休假权限的扩大并未完全成功。 “挪威是1993年首个引入不可转让给母亲的父亲育儿假制度的国家，瑞典紧随其后。但在丹麦，1998年引入的父亲配额后来被废除。此后再未重新引入。” 对家庭友好的政策 瑞典、挪威、冰岛、爱沙尼亚、葡萄牙在联合国儿童基金会（UNICEF）去年的报告中，作为引入了对家庭最友好政策的国家受到赞扬。 另一方面，该报告将英国、爱尔兰、希腊、塞浦路斯、瑞士评为31个“富裕国家”中的垫底。 （英文报道 Finland to give dads same parental leave as mums）", "reference_summary": "昨年12月に発足したフィンランドのサンナ・マリン政権は5日、父親が取得できる育児休暇の期間を拡大し、母親と同じにする方針を発表した。父親が子供と接する時間を増やし、「幸福（ウェルビーイング）や男女共同参画を促進」するのが狙いという。", "ref_zh": "去年12月成立的芬兰桑娜·马林政权5日宣布，将扩大父亲可休育儿假的期限，使之与母亲相同。据称，此举旨在增加父亲与孩子接触的时间，“促进幸福（well-being）和男女共同参与”。", "summaries": [{"summary_id": "51395937_47bdc118", "summary": "フィンランドの現行制度では、父親は子供が満2歳になるまでの間、計2.2カ月の育休が取得できる フィンランドのアイノ・カイサ・ペコネン社会問題・保健相は記者団に対し、最初から両親の関わりを強化することを目的とした「家族の利益についての抜本的な改革」が始まったと述べた。フィンランド政府は、育休制度の変更に1億ユーロ（約120億円）の追加経費がかかるとみている。マリン首相（34）は先月、同国はまだ、男女共同参画の実現のために努力が必要だとし、幼少期の子供と一緒に過ごす父親が少なすぎると不満を漏らしていた。", "zh": "根据芬兰的现行制度，父亲在孩子满2岁之前，可休共计2.2个月的育儿假 芬兰社会事务与卫生部长艾诺-凯萨·佩科宁对记者表示，一项旨在从一开始就强化父母双方参与的“关于家庭利益的根本性改革”已经启动。芬兰政府估计，育儿假制度的变更将需要1亿欧元（约120亿日元）的额外经费。马林总理（34岁）上个月曾不满地表示，该国在实现男女共同参与方面仍需努力，与幼年期子女共度时光的父亲太少。"}, {"summary_id": "51395937_6e674cea", "summary": "昨年12月に発足したフィンランドのサンナ・マリン政権は5日、父親が取得できる育児休暇の期間を拡大し、母親と同じにする方針を発表した。父親が子供と接する時間を増やし、「幸福（ウェルビーイング）や男女共同参画を促進」するのが狙いという。", "zh": "去年12月成立的芬兰桑娜·马林政权5日宣布，将扩大父亲可休育儿假的期限，使之与母亲相同。据称，此举旨在增加父亲与孩子接触的时间，“促进幸福（well-being）和男女共同参与”。"}, {"summary_id": "51395937_a52c97e0", "summary": "フィンランドの中道左派連立5党の党首は、昨年12月以降全員女性となっており、マリン首相（34）は「女性が政権を握ることはたいした問題ではない」と述べている。", "zh": "芬兰中左翼五党联合执政联盟的党首，自去年12月以来全部为女性，马林总理（34岁）表示“女性执政不是什么大不了的事”。"}, {"summary_id": "51395937_a797a32c", "summary": "フィンランド政府は5日、父親と母親の育児休暇期間を同じ6.6カ月に揃え、家庭での親の関わりを強化する制度改革を発表した。現行制度では父親の取得は平均4人に1人にとどまっていた。", "zh": "芬兰政府5日宣布了将父亲和母亲的育儿假期限统一为相同的6.6个月、强化父母在家庭中参与的制度改革。在现行制度下，实际休假的父亲平均只有四分之一。"}, {"summary_id": "51395937_e409196f", "summary": "昨年12月に発足したフィンランドのサンナ・マリン政権は5日、父親が取得できる育児休暇の期間を拡大し、母親と同じにする方針を発表", "zh": "去年12月成立的芬兰桑娜·马林政权5日宣布将扩大父亲可休育儿假的期限、使之与母亲相同的方针"}]}, {"article_id": "36285464", "url": "https://www.bbc.com/japanese/36285464", "title": "レム睡眠が記憶形成に重要な役割＝研究", "title_zh": "快速眼动睡眠对记忆形成起重要作用＝研究", "text": "ジョナサン・ウェブ科学担当記者、BBCニュース 人間はレム睡眠のほとんどの間、夢を見ている 研究結果は、脳が活動している浅い眠りのレム（REM）睡眠時が記憶に非常に重要な役割を果たしていることを、これれまでで最も明確に示している。研究結果は「サイエンス」誌に掲載された。 実験では、マウスを起こさないまま、脳の一部細胞の活動を停止させた。これをレム睡眠時に行うと、記憶力テストで記憶が定着していないという結果が出た。 人間では、レム睡眠時に夢を見る。しかし、レム睡眠が記憶の定着に重要なのかははっきりしていなかった。 最近の研究は、より深い睡眠のノンレム睡眠に注目したものが多かった。ノンレム睡眠時の脳細胞は、記憶を定着させたりその日の経験を再現するための活動を示す。 レム睡眠時には目が素早く動き、筋肉は弛緩しているが、脳が何をしているのかはよく分かっていない。しかし、レム睡眠はほかの動物にもある現象で、哺乳類だけでなく、鳥類やトカゲなどにも見られる。 特に哺乳類のレム睡眠の時間は非常に短いこともあり、レム睡眠の効果を調べるのは難しかった。 レム睡眠に入った人間や哺乳類をただ起こすだけでは、ストレスなどの問題で、記憶力テストはうまくいかなくなる。 マウスを使ってレム睡眠が記憶にどのような役割を果たしているのか実験した そのため、スイスのベルン大学の研究者らとの共同研究で、マギル大学のシルベイン・ウィリアムズ博士は、眠る脳に直接働きかけることにした。博士はBBCの取材に対し、「マウスのREM睡眠のみを邪魔する手法をとった」と話す。 博士らは、「光遺伝学」と呼ばれる仕組みを使用。マウスの脳に埋め込まれた極小の光ファイバーから光を照射するだけで、特定の脳細胞をコントロールできるようになった。 光の照射には、脳の「シータ振動」と呼ばれる周期的活動を劇的に減少させる効果がある。マウスがレム睡眠状態にある時に、これを行うと、大きな違いが生まれた。 ウィリアムズ博士は、「レム睡眠時のみ活動を邪魔すると、記憶の形成や定着がほぼ完全にできなくなる」と述べた。 例えば、全く見たことがない物体と、前日にも見た物体がある場合、通常のマウスは未知のものにだけ関心を示すが、レム睡眠時に脳の活動を邪魔されたマウスは2つとも詳しく調べようとした。 つまり、場合によってはレム睡眠が記憶の定着に非常に重要な役割を果たすというわけだ。ウィリアムズ博士は、このことから得た答えよりも多くの謎が増えたと話す。 そもそも、ノンレム睡眠が記憶の定着に関連しているのはすでに知られていた。となると、レム睡眠とノンレム睡眠の個別の役割はどう違うのか。 ウィリアムズ博士は、「現時点では2つの違いは分かっていないと思う」とした上で、「レム睡眠に非常に中心的な役割があるのは、大きな発見だ」と述べた。 その役割が何であれ、脳細胞が活動を同期化する振動が関係しているらしいと、今回の研究からうかがえる。この研究で妨害した振動は、1秒間に7回という広範囲で測定可能なリズムだった。 そのリズムを手掛かりに、痴呆などの記憶障害のある患者を調べることもできるかもしれないとウィリアムズ博士は指摘する。 「特にアルツハイマー病の患者で、脳の通常の活動がどう阻害されているのか、それが記憶障害に寄与しているのか、調べられると興味深い」 ウィリアムズ博士と同様に齧歯動物の記憶形成を研究するユニバーシティー・コレッジ・ロンドンの脳神経学者、ダニエル・ベンドー博士は、今回の研究が、レム睡眠を理解する上で「大きな一歩」になったと指摘する。同博士は、「何十年も取り組んでも結論が出ていないなかで、何か大きなことが起きている」と語った。 ベンドー博士は、スイスとカナダの共同研究チームはレム睡眠を妨害する巧みな方法を見つけたと評価した。 「非常に難しい実験で、レム睡眠におけるシータ振動が果たす役割の可能性に関するとても素晴らしい実証だ」 （英語記事 Dreaming brain rhythms lock in memories）", "text_zh": "乔纳森·韦布 科学报道记者，BBC新闻 人类在快速眼动睡眠的大部分时间里都在做梦 研究结果以迄今为止最明确的方式表明，大脑处于活动状态的浅睡眠——快速眼动（REM）睡眠，对记忆起着非常重要的作用。研究结果发表在《科学》（Science）杂志上。 实验中，研究人员在不唤醒小鼠的情况下，使其大脑部分细胞的活动停止。在快速眼动睡眠时进行这一操作后，记忆力测试的结果显示记忆没有得到巩固。 人类在快速眼动睡眠时会做梦。但快速眼动睡眠对记忆的巩固是否重要，此前并不清楚。 近年的研究大多关注的是属于更深层睡眠的非快速眼动睡眠。非快速眼动睡眠时的脑细胞会表现出为巩固记忆、重现当天经历而进行的活动。 快速眼动睡眠时，眼球快速转动，肌肉松弛，但大脑在做什么却不甚清楚。不过，快速眼动睡眠是其他动物也有的现象，不仅是哺乳类，在鸟类和蜥蜴等身上也能观察到。 尤其是哺乳类的快速眼动睡眠时间非常短，因此调查快速眼动睡眠的作用一直很困难。 如果只是把进入快速眼动睡眠的人或哺乳动物直接叫醒，会因压力等问题，导致记忆力测试无法顺利进行。 研究人员用小鼠实验，探究快速眼动睡眠对记忆起着怎样的作用 因此，在与瑞士伯尔尼大学研究人员的共同研究中，麦吉尔大学的西尔万·威廉姆斯博士决定直接作用于睡眠中的大脑。博士在接受BBC采访时说：“我们采用了只干扰小鼠REM睡眠的手法。” 博士等人使用了名为“光遗传学”的机制。只需从植入小鼠大脑的极小光纤照射光线，就能控制特定的脑细胞。 光的照射具有显著减少大脑中被称为“θ振荡”的周期性活动的效果。在小鼠处于快速眼动睡眠状态时进行这一操作，产生了巨大的差异。 威廉姆斯博士表示：“只在快速眼动睡眠时干扰其活动，记忆的形成和巩固就几乎完全无法实现。” 例如，面对一个从未见过的物体和一个前一天也见过的物体时，通常的小鼠只会对未知的物体表现出兴趣，而在快速眼动睡眠时大脑活动受到干扰的小鼠，则会把两个物体都仔细查看。 也就是说，视情况而定，快速眼动睡眠对记忆的巩固起着非常重要的作用。威廉姆斯博士表示，由此增加的谜团比得到的答案还要多。 本来，非快速眼动睡眠与记忆巩固相关已是已知的事实。那么，快速眼动睡眠和非快速眼动睡眠各自的作用有何不同？ 威廉姆斯博士表示“我认为现阶段还不清楚两者的区别”，并称“快速眼动睡眠具有非常核心的作用，这是一项重大发现”。 无论这一作用是什么，从此次研究可以看出，它似乎与使脑细胞活动同步化的振荡有关。此次研究中受到干扰的振荡，是一种每秒7次、可在大范围测得的节律。 威廉姆斯博士指出，以这种节律为线索，或许还能对痴呆等有记忆障碍的患者进行研究。 “特别是在阿尔茨海默病患者身上，大脑的正常活动是如何受到阻碍的，这是否是造成记忆障碍的原因之一，如果能加以研究将会非常有意思。” 与威廉姆斯博士同样研究啮齿动物记忆形成的伦敦大学学院脑神经学者丹尼尔·本多博士指出，此次研究成为了理解快速眼动睡眠的“一大步”。该博士表示：“在数十年的努力仍无定论的情况下，某种重大的事情正在发生。” 本多博士评价称，瑞士与加拿大的联合研究团队找到了干扰快速眼动睡眠的巧妙方法。 “这是非常困难的实验，是对快速眼动睡眠中θ振荡所可能发挥作用的非常出色的实证。” （英文报道 Dreaming brain rhythms lock in memories）", "reference_summary": "レム睡眠中の脳の活動を邪魔すると、前日に学んだ内容を覚ええられなくなることが、カナダ・マギル大学の教授らが行ったマウス実験で分かった。", "ref_zh": "干扰快速眼动睡眠中的大脑活动后，就会记不住前一天学习的内容——加拿大麦吉尔大学的教授等人进行的小鼠实验查明了这一点。", "summaries": [{"summary_id": "36285464_01d58baf", "summary": "マウス実験で、レム睡眠中の脳活動を光遺伝学により阻害すると記憶の形成と定着がほぼ完全に妨げられることが判明した。カナダ・マギル大学とスイス・ベルン大学の共同研究でサイエンス誌に発表された。レム睡眠に記憶形成の中心的役割があることを強く示す初の実証とされる。", "zh": "小鼠实验查明，通过光遗传学阻断快速眼动睡眠中的大脑活动，记忆的形成和巩固会几乎完全受到妨碍。这项加拿大麦吉尔大学与瑞士伯尔尼大学的共同研究发表在《科学》杂志上。这被认为是有力表明快速眼动睡眠在记忆形成中具有核心作用的首个实证。"}, {"summary_id": "36285464_0712fa34", "summary": "ジョナサン・ウェブ科学担当記者、BBCニュース 人間はレム睡眠のほとんどの間、夢を見ている 研究結果は、脳が活動している浅い眠りのレム（REM）睡眠時が記憶に非常に重要な役割を果たしていることを、これれまでで最も明確に示している。研究結果は「サイエンス」誌に掲載された。実験では、マウスを起こさないまま、脳の一部細胞の活動を停止させた。", "zh": "乔纳森·韦布 科学报道记者，BBC新闻 人类在快速眼动睡眠的大部分时间里都在做梦 研究结果以迄今为止最明确的方式表明，大脑处于活动状态的浅睡眠——快速眼动（REM）睡眠，对记忆起着非常重要的作用。研究结果发表在《科学》（Science）杂志上。实验中，研究人员在不唤醒小鼠的情况下，使其大脑部分细胞的活动停止。"}, {"summary_id": "36285464_17e4f012", "summary": "レム睡眠中の脳の活動を邪魔すると、前日に学んだ内容を覚ええられなくなることが、カナダ・マギル大学の教授らが行ったマウス実験で分かった。", "zh": "干扰快速眼动睡眠中的大脑活动后，就会记不住前一天学习的内容——加拿大麦吉尔大学的教授等人进行的小鼠实验查明了这一点。"}, {"summary_id": "36285464_8f59ee9a", "summary": "光遺伝学は、マウスの脳に埋め込まれた極小の光ファイバーから光を照射するだけで特定の脳細胞をコントロールできる比較的新しい技術で、科学研究への応用が期待されている。スイスのベルン大学とカナダのマギル大学の共同研究チームがこの技術を用い、科学誌サイエンスに論文を発表した。", "zh": "光遗传学是一种只需从植入小鼠大脑的极小光纤照射光线便可控制特定脑细胞的较新技术，有望应用于科学研究。瑞士伯尔尼大学与加拿大麦吉尔大学的联合研究团队使用这项技术，在科学杂志《科学》上发表了论文。"}, {"summary_id": "36285464_b97582b2", "summary": "レム睡眠中の脳の活動を邪魔すると、前日に学んだ内容を覚ええられなくなることが、カナダ・マギル大学の教授らが行ったマウス実験で分かった。", "zh": "干扰快速眼动睡眠中的大脑活动后，就会记不住前一天学习的内容——加拿大麦吉尔大学的教授等人进行的小鼠实验查明了这一点。"}]}, {"article_id": "40504740", "url": "https://www.bbc.com/japanese/40504740", "title": "ベトナムが南シナ海で石油掘削を開始 中国と領有権争う海域", "title_zh": "越南在南海开始钻探石油 与中国存在主权争议的海域", "text": "2014年には中国とベトナムの沿岸警備隊の船がにらみあう事態となった（2014年5月） 業界コンサルタントがBBCに語ったところによると、国際企業タリスマン・ベトナム社と契約した掘削船がベトナム南東部沖で掘削を行っているという。 先月、訪越していた中国の范長竜・中央軍事委員会副主席が日程を切り上げて出国したのも、これに関連している可能性がある。 中国は南シナ海のほぼ全域に対する領有権を主張しているが、ベトナムを含む近隣各国と一部の島々や岩礁の領有権をめぐって争っている。 シンガポールのコンサルタント会社モイスのイアン・クロス氏は、掘削船の「ディープシー・メトロ1」がベトナム沿岸から約400キロ離れた海域での掘削を、先月21日に開始したと語った。 極めて慎重を要する内容のため、掘削開始の事実が伏せられていた可能性がある。 南シナ海で領有権が争われている西沙（Paracel ）諸島や南沙諸島（Spratly ）、中国が建設した人工島（Mischief Reef）、中国が主張する領海（赤の線）と周辺国の排他的経済水域（EEZ）（青の線） ほかの石油業界関係者らはBBCに対し、タリスマン・ベトナムは過去3年にわたって掘削許可を求めていたものの、中国の反発を避けたい当局が許可していなかったと話した。 問題となっている海底の地点は、ベトナムが「ブロック136-03」と呼んでいるが、中国は別の名称「ワンアンベイ21」を使っており、それぞれ別の会社にリース権を与えている。中国は2014年に香港のブライトオイル社にリース権を与えた。ブライトオイルの役員のうち2人は中国共産党の幹部も務める。 タリスマン・ベトナムは当初、カナダのタリスマン所有だったが、タリスマンがスペインのレプソルに買収されたことを受けて、2015年からレプソル傘下となっている。 南沙諸島の島で警備するベトナム海軍の兵士（2011年6月） 范長竜・中央軍事委員会副主席は最近、レプソルが本拠地とするマドリッドを訪問している。中国当局がレプソルに抗議をしたのかどうかについてのBBCの取材に、同社はコメントしなかった。 2014年には、西沙（パラセル）諸島に近い南シナ海の別の海域で、ベトナムと中国双方の沿岸警備隊を含む船の間で衝突が起きている。 （英語記事 Vietnam drills for oil in South China Sea）", "text_zh": "2014年，中国与越南的海岸警卫队船只曾陷入对峙局面（2014年5月） 据行业顾问向BBC透露，与国际企业塔里斯曼越南公司（Talisman Vietnam）签约的钻井船正在越南东南部近海进行钻探。 上月，正在访问越南的中国中央军事委员会副主席范长龙提前结束日程离境，也可能与此有关。 中国主张对南海几乎全部海域拥有主权，但与包括越南在内的周边各国围绕部分岛屿和岩礁的主权存在争议。 新加坡咨询公司莫伊斯（Moyes）的伊恩·克罗斯表示，钻井船“深海地铁1号”（Deepsea Metro 1）于上月21日开始在距越南海岸约400公里的海域进行钻探。 由于内容极为敏感，开始钻探的事实此前可能一直被隐瞒。 南海主权存在争议的西沙（Paracel）群岛和南沙群岛（Spratly）、中国建造的人工岛（美济礁，Mischief Reef）、中国主张的领海（红线）与周边国家的专属经济区（EEZ）（蓝线） 其他石油业界相关人士向BBC表示，塔里斯曼越南公司过去3年一直在申请钻探许可，但希望避免中国反弹的当局一直没有批准。 存在争议的海底地点，越南称之为“136-03区块”，而中国使用另一名称“万安北21”，双方各自将租赁权授予了不同的公司。中国在2014年将租赁权授予了香港的光汇石油公司。光汇石油的董事中有两人还担任中国共产党的干部。 塔里斯曼越南公司最初为加拿大塔里斯曼公司所有，但由于塔里斯曼被西班牙雷普索尔公司（Repsol）收购，自2015年起归入雷普索尔旗下。 在南沙群岛岛屿上执勤警戒的越南海军士兵（2011年6月） 中央军事委员会副主席范长龙最近访问了雷普索尔总部所在地马德里。对于中国当局是否曾向雷普索尔提出抗议，该公司未对BBC的采访置评。 2014年，在靠近西沙（帕拉塞尔）群岛的南海另一海域，包括越中双方海岸警卫队在内的船只之间曾发生冲突。 （英文报道 Vietnam drills for oil in South China Sea）", "reference_summary": "ベトナムは中国と領有権を争う海域内で石油の掘削を開始した。石油業界関係者が明らかにした。", "ref_zh": "越南已在与中国存在主权争议的海域内开始钻探石油。石油业界相关人士透露了这一消息。", "summaries": [{"summary_id": "40504740_0a7f4dfb", "summary": "ベトナムは中国と領有権を争う海域内で石油の掘削を開始した。石油業界関係者が明らかにした。", "zh": "越南已在与中国存在主权争议的海域内开始钻探石油。石油业界相关人士透露了这一消息。"}, {"summary_id": "40504740_93d0066d", "summary": "南シナ海では中国とベトナムなど近隣各国が、西沙諸島や南沙諸島などを含む複数の島・岩礁をめぐり長年領有権争いを続けている。2014年には、西沙諸島付近の海域でベトナムと中国の沿岸警備隊を含む船の間で衝突が発生した。", "zh": "在南海，中国与越南等周边各国围绕包括西沙群岛和南沙群岛在内的多个岛屿和岩礁，长年持续着主权争端。2014年，在西沙群岛附近海域，包括越南与中国海岸警卫队在内的船只之间发生了冲突。"}, {"summary_id": "40504740_afa5b3f7", "summary": "2014年には中国とベトナムの沿岸警備隊の船がにらみあう事態となった（2014年5月） 業界コンサルタントがBBCに語ったところによると、国際企業タリスマン・ベトナム社と契約した掘削船がベトナム南東部沖で掘削を行っているという。先月、訪越していた中国の范長竜・中央軍事委員会副主席が日程を切り上げて出国したのも、これに関連している可能性がある。中国は南シナ海のほぼ全域に対する領有権を主張しているが、ベトナムを含む近隣各国と一部の島々や岩礁の領有権をめぐって争っている。", "zh": "2014年，中国与越南的海岸警卫队船只曾陷入对峙局面（2014年5月） 据行业顾问向BBC透露，与国际企业塔里斯曼越南公司签约的钻井船正在越南东南部近海进行钻探。上月，正在访问越南的中国中央军事委员会副主席范长龙提前结束日程离境，也可能与此有关。中国主张对南海几乎全部海域拥有主权，但与包括越南在内的周边各国围绕部分岛屿和岩礁的主权存在争议。"}, {"summary_id": "40504740_d912de2c", "summary": "シリア全土で30日午前零時（日本時間午前7時）に発効した政府軍と反政府勢力の停戦合意は、散発的な衝突のほかは終日ほぼ継続したもようだ。国連安全保障理事会は近く、停戦合意を支持する決議案（ロシア提出）について採決する見通し。", "zh": "在叙利亚全境于30日凌晨零时（日本时间上午7时）生效的政府军与反政府武装的停火协议，除零星冲突外，全天似乎基本得到维持。联合国安全理事会预计近期将就支持停火协议的决议草案（俄罗斯提出）进行表决。"}, {"summary_id": "40504740_f0e7e3f5", "summary": "ベトナムが中国と領有権を争う南シナ海の海域で石油掘削を開始したことが、業界関係者への取材で明らかになった。国際企業タリスマン・ベトナム社と契約した掘削船が、ベトナム南東部沖約400キロの海域で先月21日から作業を行っている。中国の范長竜・中央軍事委員会副主席がベトナム訪問中に日程を切り上げて出国したのも、この掘削問題と関連している可能性があると指摘されている。", "zh": "越南在与中国存在主权争议的南海海域开始钻探石油一事，经对业界相关人士的采访得以证实。与国际企业塔里斯曼越南公司签约的钻井船，自上月21日起在越南东南部近海约400公里的海域进行作业。有分析指出，中国中央军事委员会副主席范长龙在访问越南期间提前结束日程离境，也可能与此次钻探问题有关。"}]}, {"article_id": "features-and-analysis-46643494", "url": "https://www.bbc.com/japanese/features-and-analysis-46643494", "title": "厳しい親に、5分進んだ時計……「在外アジア人あるある」がフェイスブックで話題に", "title_zh": "严厉的父母、调快5分钟的时钟……“海外亚裔共同经历”在脸书上成为话题", "text": "フランシス・マオ、BBCニュース、シドニー 「Subtle Asian Traits」では、アジア人の親に関するネタがよく取り上げられる 「ママ、出かけてくる」という子どもの言葉に、アメリカやフランス、スペイン、イギリスの母親は「いってらっしゃい！」と返事をする。 しかしアジア人の母親の返事はこうだ。 「出かける？ どこに？ 誰と？ どうして？ 誰と帰るの？ いつ帰るの？ 毎日出かけてて、ここは家なのホテルなの？ いくらお金を使っているの？ 全くもう、ぜんぜん親と一緒にいてくれない。いつも出かけてばかり。私が死んだら初めて気づくのね」 ……身に覚えはないだろうか。 このフェイスブックのグループは今、海外に住むアジア人に文化的な一大現象を巻き起こしている。 特にアジアから他国に移住した第一世代の生活にまつわるネタやジョークが、このグループを一躍有名にし、9月の立ち上げから現在までに100万人近くが参加している。 グループには誰でも投稿できるが、同時に文化的アイデンティティーについての論争も巻き起こした。 「Subtle Asian Traits」を立ち上げたのは、豪メルボルンに住む中国系オーストラリア人の高校生9人だ。突然の成功に、9人は驚いている。 キャスリーン・シャオさん（18）はBBCに、「私たちはいつもアジア文化や外国で育つことについてジョークを飛ばしていて、それをシェアする場所が欲しかっただけ」と話した。 アン・グーさんは、グループの参加者が1000人を越えた時点でとても嬉しかったが、「今はもう手に負えない」と言う。 「Subtle Asian Traits」の創設者たちは、共感しやすく大勢を受け入れるグループを目指している 「Subtle Asian Traits」がアジアからの移住者コミュニティーへと成長したことについては、「このグループがこんなに大きくなるとも、真面目なものになるとも思っていなかった」とアンさんは話した。 最初のアイデアは、単に家での生活やアジア文化の「ちょっと変わったところ」、バブルティーに関するネタやジョークを共有したかったのだという（アジア発のこの人気ドリンクにまつわるジョークはたくさんある）。 他にはどんな「あるある」が？ 「Subtle Asian Traits」にはさまざまな話題が投稿されているが、アジア移民の子どもが体験するアジア文化に関するものが多い。 このグループの参加者のほとんどがアジアに住むアジア人ではなく、オーストラリアやアメリカ、カナダ、イギリス在住の若者なのはそのためだ。 シャオさんは、人気が出たのは「これまで特に話題にならなかった日常の小さな出来事」を浮き彫りにするからだと感じている。 投稿されるネタの多くは家事にまつわるものが多い。水道水を沸かして白湯を飲む習慣や、指を使って米を炊く水の分量を計ったりする習慣などだ。 「家にある全ての時計が5～10分進められていて、実際の時間が分からない」という投稿には数千人が同意した アジア人の家のパーティーに呼ばれると、ホテルのスリッパを出される――アジア人の家にスリッパはつきものだ 他には、西洋社会で育つアジア人としての経験にまつわるジョークが多い。グーさんによると、「時には、アジアと西洋、2つの文化の中でどのようにバランスをとるかという悩みに関するものもある」という。 たとえば「アジア人らしさが足りない」というネタには、2つの言語を使い分ける際の失敗や、中国語の宿題に苦労すること、家族のルールや伝統への反発などが挙げられる。 一方で、日常生活で経験するちょっとした人種差別や、「白人らしさが足りない」と思わせられる出来事などの投稿もある。 「どこ出身？」という質問に対し、自分の住んでいる場所と自分の出自、どちらを答えるべきかという葛藤は、グループの中でよく話題に上がるトピックだ ジョークのネタとして定番なのは「アジア人の親」だ。典型的に、慎重で厳しく、高圧的な人物として描写される。 私は中国系オーストラリア人だが、特に笑い転げてしまった投稿を紹介しよう。この投稿には「ある日、朝食を食べなかったと母親に言ったとき」というタイトルが付いている。 その後、母親から送られてきたというメッセージが下の写真だ。 「あなたが朝食を食べず、授業を2つ受けて、12時まで何も食べずに過ごしたと聞いて大変動揺しています。このせいで昨日はよく眠れませんでした。あなたみたいにしょっちゅう12時間以上お腹を空かせながら活発に動くのは、健康によくありません。ここ最近あったように、一生懸命働いてストレスを受けている時は特に。私の同僚の旦那さんはプリンストン大学を首席で卒業して、ウォール街で一流の投資家でした。でも悪い食生活のせいで胃を悪くして、糖尿になって、愛する仕事をやめなくてはなりませんでした。あなたにそうなって欲しくない。よい食生活はあなたの健康、人生、キャリアにとって不可欠です。もっと朝食に気を使ってほしい。この記事をご参考に」 この投稿には3万以上の「いいね」が付いた 特に「このせいで昨日はよく眠れませんでした」という一文などが、私自身の母親からのメッセージに異様なほどそっくりだった。 グーさんは、このグループは「共感しやすい」デザインを心がけている」と話す。中には、グループの管理人に感謝のメッセージを送ってくる参加者もいるという。 「ある女の子は、このグループで初めて自分が何かの一員だと思えたと言っていました」 シャオさんは、このグループを作ったことで、自分の経験がよくあることなのだと分かったと話す。 「外国で育つと、他の人に分かってもらえないんじゃないか、マイノリティーだと判を押されてしまうのではないか、そう思って言えないことがあります」 バランスを取る インターネット上で文化的アイデンティティーについての見識を提供する他のグループと同様、「Subtle Asian Traits」にも大変なことは色々ある。 開始当初は、投稿のほとんどが東アジアに関するもので、全てのアジア文化を内包していないと批判されることもあった。 それ以来、グループ運営者はもっと多様なコンテンツの取入れを重視していると、グーさんは言う。そしてグループのルールとして、参加者は「全てのアジア系人種を取り込む」よう奨励されている。 ちなみに、グループのルールは全部で5つだ。4は中国文化では不吉な数字とされているので。 シャオさんと友人たちは、自分たちを「Australian-born Chinese（オーストラリア生まれの中国人）」を略してABCと呼んでいる。 他にも、中国語で「虎」と形容される厳しい親に関する話題は、否定的なステレオタイプを強化するものだという批判もある。 掲示板サイト「Reddit」では、ユーザーの1人が、この手のジョークは内面化された人種差別で「自己嫌悪」と同じことだと指摘した。 グーさんは、いくつかのジョークがステレオタイプを悪用したものだと認める一方、ほとんどの投稿者は「だいたい自分たちの文化アイデンティティーを受け入れている」と擁護した。 「みんなバランスを分かっています」 また、参加者は投稿を通じて「幼少時代のネガティブな経験を面白く、ポジティブなものに変えることができる（中略）ユーモアを使ったいやしになる」と話した。 グーさんは、このグループが自分自身の文化に対する誇りを深めてくれたと話す。これは予想していなかった経験だという。 「そんなに恥ずかしがって自分の文化を隠したりしなくてもいい。このグループを通じてほかの人たちも、そういう自信が持てるようになってほしい」 （英語記事 The 'Asian traits' humour that became a phenomenon ）", "text_zh": "弗朗西丝·毛，BBC新闻，悉尼 在“Subtle Asian Traits”上，关于亚裔父母的段子经常被拿来讨论 当孩子说“妈妈，我出去一下”时，美国、法国、西班牙、英国的母亲会回答“路上小心，去吧！”。 但亚裔母亲的回答是这样的。 “出去？去哪儿？和谁？为什么？和谁一起回来？什么时候回来？天天往外跑，这里是家还是旅馆？你花了多少钱？真是的，一点都不肯陪陪父母。总是只顾着出门。等我死了你才会第一次察觉吧。” ……你是否觉得似曾相识？ 这个脸书小组如今正在海外亚裔中掀起一场文化大现象。 尤其是与从亚洲移居他国的第一代移民生活相关的段子和笑话，让这个小组一举成名，自9月创建以来至今已有近100万人加入。 任何人都可以在小组中发帖，但它同时也引发了关于文化认同的争论。 创建“Subtle Asian Traits”的，是住在澳大利亚墨尔本的9名华裔澳大利亚高中生。面对突如其来的成功，9人感到惊讶。 凯瑟琳·肖（18岁）对BBC说：“我们平时总是拿亚洲文化和在外国长大这件事开玩笑，只是想要一个分享这些的地方而已。” 安妮·顾说，当小组成员超过1000人时她非常高兴，但“现在已经忙不过来了”。 “Subtle Asian Traits”的创始人们希望打造一个易于引发共鸣、包容众人的小组 关于“Subtle Asian Traits”成长为亚洲移民社群一事，安妮说：“没想到这个小组会变得这么大，也没想到它会变成一个严肃的东西。” 据说最初的想法，只是想分享家庭生活、亚洲文化中“有点奇特的地方”，以及关于珍珠奶茶的段子和笑话（围绕这款源自亚洲的人气饮品的笑话有很多）。 还有哪些“共同经历”？ “Subtle Asian Traits”上发布着各种各样的话题，但其中很多与亚洲移民子女所体验的亚洲文化有关。 正因如此，这个小组的成员大多不是居住在亚洲的亚洲人，而是居住在澳大利亚、美国、加拿大、英国的年轻人。 肖认为，小组之所以受欢迎，是因为它凸
