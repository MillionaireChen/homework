川西岸のイスラエル入植地を国際法違反とみなさない方針を発表した。これを受けて国連安全保障理事会は緊急会合を開き、米国の立場を非難する決議を全会一致で採択した。ヨルダン川西岸には約140の入植地があり、約60万人が居住している。", "zh": "美国国务卿蓬佩奥宣布，不将约旦河西岸的以色列定居点视为违反国际法。对此，联合国安全理事会召开紧急会议，全票一致通过了谴责美国立场的决议。约旦河西岸约有140处定居点，约60万人居住其中。"}, {"summary_id": "50469832_9a5ac32c", "summary": "米国のポンペオ国務長官は、ヨルダン川西岸のイスラエル入植地を国際法違反とみなさない方針を発表した。従来の米国の立場からの転換で、イスラエルは歓迎、パレスチナ側は強く反発している。", "zh": "美国国务卿蓬佩奥宣布，不将约旦河西岸的以色列定居点视为违反国际法。这是对美国以往立场的转变，以色列表示欢迎，巴勒斯坦方面则强烈反弹。"}, {"summary_id": "50469832_d35cd9c2", "summary": "アメリカ政府は18日、パレスチナ自治区ヨルダン川西岸でイスラエル政府が建設してきた入植地について、国際法違反とみなさないと発表した。米政府にとって方針転換となる。", "zh": "美国政府18日宣布，对于以色列政府在巴勒斯坦自治区约旦河西岸修建的定居点，不将其视为违反国际法。这对美国政府而言是一次方针转变。"}]}, {"article_id": "38476572", "url": "https://www.bbc.com/japanese/38476572", "title": "シリア停戦合意、ほぼ持続 国連安保理は投票へ", "title_zh": "叙利亚停火协议基本维持 联合国安理会将进行表决", "text": "ダマスカス郊外ドゥーマで30日に砲撃があったと反政府勢力は主張している。写真は、反政府勢力が支配するドゥーマ(30日） ロシア作成の安保理決議案は、シリア全土に人道援助を速やかに届けるよう求めるほか、ロシアとトルコが仲介し来月カザフスタンで予定される和平協議を支持し、政府と反政府勢力の間の政治的交渉による紛争の終結を求めている。 シリアのアサド政権を支持するロシアはこれまで、アサド大統領退陣を前提とした紛争解決を求める米英仏による安保理決議案に対して、拒否権行使を繰り返してきた。 今回の停戦合意をロシアと共に仲介しているトルコは、アサド大統領退陣を支持してきた。 英国拠点の「シリア人権監視団」によると、30日午前零時に停戦合意が発効した後、北部ハマ県で政府軍と反政府勢力の衝突があった。首都ダマスカス近くのワディ・バラダでは、この地域を抑えてきた「ジャブハト・ファタハ・アル・シャム」（旧ヌスラ戦線）のイスラム聖戦主義者たちも空爆されたという。 しかしシリア軍はこれを否定し、反政府側が合意が守られていないという誤った印象を与えようとしていると批判した。 国連は29日、ワジ・バラダでの戦闘に懸念を表明。ダマスカス周辺住民約400万人に飲料水を供給する水源を、戦闘員たちが意図的に攻撃していると指摘した。 一方でトルコ軍関係者によると、北部アル・バブ周辺にある過激派勢力のいわゆる「イスラム国」（IS）の拠点をロシア空軍機が3回にわたり爆撃したと話した。アレッポ県に残るISの最後の拠点を奪還しようとするトルコ軍主導の作戦を、ロシアが支援するのはこれが初めてという。 シリア政府軍によると、ロシアとトルコが仲介した停戦合意に、ISと「関連組織」は停戦合意に含まれていない。しかし「ジャブハト・ファタハ・アル・シャム」が含まれているかどうかについては、情報が錯綜している。 「ジャブハト・ファタハ・アル・シャム」の広報担当は30日、今回の停戦合意下での政治的解決は「犯罪的独裁政権を複製」してしまうと批判し、今後もアサド大統領と闘い続けると表明。「ジャブハト・ファタハ・アル・シャム」の戦闘員たちは現在、イドリブ県を掌握する反政府同盟に参加している。 ＜解説＞新しいキングメーカー ――リーズ・ドゥセットBBC国際報道チーフ特派員 ロシアは空母発着の戦闘機でシリア国内の爆撃を重ねてきた 今回の停戦合意は、開始の準備が整う前に早くも発表された。参加した7勢力には、ロシアとシリアの両政府がかねてからテロリストと呼んできた「アフラル・アル・シャム」も含まれている。「アフラル・アル・シャム」は合意内容に一部「懸念がある」と話している。それは、彼らを支援するサウジアラビアやカタールの懸念と何か関係するのだろうか？ いずれにしろ、新しい米国大統領の登場に先駆けて、シリア和平の中心的当事者が座るテーブルの顔ぶれは刷新された。重要な外国政府は、ロシアなのだ。そして交渉テーブルの反対側にキングメーカーとして座る重要な当事者は、米国に代わりトルコになった。トルコには駆け引き材料があるし、何よりも米国が支援するシリアのクルド部隊を勢いを食い止めたいという動機もある。 アレッポを失い手痛い敗退を余儀なくされた反政府勢力の戦闘員の多くは、この戦闘停止を歓迎しているだろう。しかしトルコと同様、反政府勢力がアサド大統領の退陣を求めることには変わりない。その意向は、アサド氏本人の周辺はもちろん、今回の停戦でロシアやトルコ並みに大きな役割を果たしたイランの意向とも異なる。 しかしアサド大統領の処遇は、顔ぶれが刷新されたこの一大駆け引きの次回ラウンドに持ち越される。次回ラウンドとはもしかすると、ロシア勢力圏のカザフスタン・アスタナで行われる和平協議が、その場になるのかもしれない。 （英語記事 Syria conflict: UN to vote on Syria ceasefire deal）", "text_zh": "反政府武装声称，大马士革郊外的杜马30日遭到炮击。图为反政府武装控制的杜马（30日） 俄罗斯起草的安理会决议案，要求迅速向叙利亚全境运送人道主义援助，支持由俄罗斯和土耳其斡旋、定于下月在哈萨克斯坦举行的和平谈判，并要求通过政府与反政府武装之间的政治谈判结束冲突。 支持叙利亚阿萨德政权的俄罗斯，此前曾多次对美英法提出的、以阿萨德总统下台为前提寻求解决冲突的安理会决议案行使否决权。 与俄罗斯共同斡旋此次停火协议的土耳其，一直支持阿萨德总统下台。 据总部设在英国的“叙利亚人权观察组织”称，停火协议于30日零时生效后，北部哈马省发生了政府军与反政府武装的冲突。在首都大马士革附近的瓦迪巴拉达，控制该地区的“征服沙姆阵线”（原努斯拉阵线）的伊斯兰圣战主义者也遭到了空袭。 但叙利亚军方否认这一说法，批评反政府一方试图制造协议未被遵守的错误印象。 联合国29日对瓦迪巴拉达的战斗表示担忧，指出战斗人员正蓄意攻击向大马士革周边约400万居民供应饮用水的水源。 另一方面，据土耳其军方人士称，俄罗斯空军战机对北部阿勒巴卜周边的极端组织所谓“伊斯兰国”（IS）据点进行了3次轰炸。据称，这是俄罗斯首次支援土耳其军队主导的、旨在夺回IS在阿勒颇省最后据点的作战行动。 据叙利亚政府军称，在俄罗斯和土耳其斡旋的停火协议中，IS及其“相关组织”不包含在停火协议之内。但关于“征服沙姆阵线”是否包含在内，信息混乱。 “征服沙姆阵线”发言人30日批评称，在此次停火协议下的政治解决将“复制犯罪的独裁政权”，并表明今后将继续与阿萨德总统作战。“征服沙姆阵线”的战斗人员目前参加了掌控伊德利卜省的反政府联盟。 ＜解说＞新的造王者 ——BBC国际报道首席特派记者莉斯·杜塞特 俄罗斯一直用航母起降的战斗机在叙利亚境内反复实施轰炸 此次停火协议在开始的准备就绪之前，就早早地宣布了。参加的7支势力中，还包括俄罗斯和叙利亚两国政府一直以来称之为恐怖分子的“沙姆自由人组织”。“沙姆自由人组织”表示，对协议内容有部分“担忧”。这是否与支持他们的沙特阿拉伯和卡塔尔的担忧有什么关系呢？ 无论如何，在新任美国总统登场之前，围坐在叙利亚和平核心当事方谈判桌旁的面孔已经焕然一新。重要的外国政府，是俄罗斯。而作为造王者坐在谈判桌对面的重要当事方，则由美国换成了土耳其。土耳其手握讨价还价的筹码，更重要的是，它还有遏制美国支持的叙利亚库尔德部队势头的动机。 失去阿勒颇、被迫痛苦败退的反政府武装战斗人员中，许多人想必欢迎这次停火。但与土耳其一样，反政府武装要求阿萨德总统下台这一点没有改变。这一意向，不仅与阿萨德本人身边的意向不同，也与在此次停火中发挥了不亚于俄罗斯和土耳其的重大作用的伊朗的意向不同。 但阿萨德总统的处置问题，将被带入这场面孔焕然一新的大博弈的下一轮。下一轮，也许就是在俄罗斯势力范围内的哈萨克斯坦阿斯塔纳举行的和平谈判。 （英文报道 Syria conflict: UN to vote on Syria ceasefire deal）", "reference_summary": "シリア全土で30日午前零時（日本時間午前7時）に発効した政府軍と反政府勢力の停戦合意は、散発的な衝突のほかは終日ほぼ継続したもようだ。国連安全保障理事会は近く、停戦合意を支持する決議案（ロシア提出）について採決する見通し。", "ref_zh": "叙利亚全境于30日零时（日本时间上午7时）生效的政府军与反政府武装的停火协议，除零星冲突外，全天基本得以维持。联合国安全理事会预计将于近期就支持停火协议的决议案（俄罗斯提出）进行表决。", "summaries": [{"summary_id": "38476572_420b873d", "summary": "ロシアとトルコが仲介したシリア全土の停戦合意は30日に発効し、散発的な衝突を除きほぼ維持された。国連安保理は停戦を支持するロシア提出の決議案を近く採決する見通しである。合意にはISなどの過激派は含まれず、ジャブハト・ファタハ・アル・シャムの扱いは情報が錯綜している。", "zh": "由俄罗斯和土耳其斡旋的叙利亚全境停火协议于30日生效，除零星冲突外基本得以维持。联合国安理会预计将于近期表决俄罗斯提出的支持停火的决议案。协议不包括IS等极端组织，“征服沙姆阵线”的处理则信息混乱。"}, {"summary_id": "38476572_65056524", "summary": "ロシアとトルコが仲介したシリア全土の停戦合意は30日に発効し、散発的な衝突を除きほぼ維持された。国連事務総長は同日夜、初日の停戦継続を「歴史的進展」と評価する声明を発表した。合意にはISなどの過激派は含まれず、ジャブハト・ファタハ・アル・シャムの扱いについては情報が錯綜している。", "zh": "由俄罗斯和土耳其斡旋的叙利亚全境停火协议于30日生效，除零星冲突外基本得以维持。联合国秘书长当日晚间发表声明，评价停火首日得以持续是“历史性进展”。协议不包括IS等极端组织，关于“征服沙姆阵线”的处理则信息混乱。"}, {"summary_id": "38476572_7d88f5af", "summary": "ダマスカス郊外ドゥーマで30日に砲撃があったと反政府勢力は主張している。写真は、反政府勢力が支配するドゥーマ(30日） ロシア作成の安保理決議案は、シリア全土に人道援助を速やかに届けるよう求めるほか、ロシアとトルコが仲介し来月カザフスタンで予定される和平協議を支持し、政府と反政府勢力の間の政治的交渉による紛争の終結を求めている。シリアのアサド政権を支持するロシアはこれまで、アサド大統領退陣を前提とした紛争解決を求める米英仏による安保理決議案に対して、拒否権行使を繰り返してきた。", "zh": "反政府武装声称，大马士革郊外的杜马30日遭到炮击。图为反政府武装控制的杜马（30日） 俄罗斯起草的安理会决议案，要求迅速向叙利亚全境运送人道主义援助，支持由俄罗斯和土耳其斡旋、定于下月在哈萨克斯坦举行的和平谈判，并要求通过政府与反政府武装之间的政治谈判结束冲突。支持叙利亚阿萨德政权的俄罗斯，此前曾多次对美英法提出的、以阿萨德总统下台为前提寻求解决冲突的安理会决议案行使否决权。"}, {"summary_id": "38476572_d43bbf3d", "summary": "国連安全保障理事会は近く、停戦合意を支持する決議案（ロシア提出）について採決する見通し。シリア全土で30日午前零時（日本時間午前7時）に発効した政府軍と反政府勢力の停戦合意は、散発的な衝突のほかは終日ほぼ継続したもようだ。", "zh": "联合国安全理事会预计将于近期就支持停火协议的决议案（俄罗斯提出）进行表决。叙利亚全境于30日零时（日本时间上午7时）生效的政府军与反政府武装的停火协议，除零星冲突外，全天基本得以维持。"}, {"summary_id": "38476572_fa7ad300", "summary": "シリア全土で30日午前零時（日本時間午前7時）に発効した政府軍と反政府勢力の停戦合意は、散発的な衝突のほかは終日ほぼ継続したもようだ。国連安全保障理事会は近く、停戦合意を支持する決議案（ロシア提出）について採決する見通し。", "zh": "叙利亚全境于30日零时（日本时间上午7时）生效的政府军与反政府武装的停火协议，除零星冲突外，全天基本得以维持。联合国安全理事会预计将于近期就支持停火协议的决议案（俄罗斯提出）进行表决。"}]}, {"article_id": "48493511", "url": "https://www.bbc.com/japanese/48493511", "title": "天安門事件の鎮圧は「正しい」と中国国防相 30周年を前に異例の言及", "title_zh": "中国国防部长称镇压天安门事件“正确” 30周年前夕罕见提及", "text": "天安門事件から30年 中国が忘れた映像 魏氏はシンガポールで開かれた会合で、聴衆から天安門事件について質問を受けた。 中国の対応は不適切だったとする意見が今もあることに疑問を投げかけた魏氏は、「あの出来事は政治的な騒乱であり、中央政府は騒乱を収束するために対応した。正しい方針だ」と述べた。 そして、「この30年間で中国は大きく変わった」と主張。天安門事件に当時の政府があのように対応したからこそ、「中国は安定と発展を享受している」との考えを示した。 天安門への帰還 30年前の学生が振り返る 当時、何が起きた？ 1989年4月、100万人を超える学生や労働者たちが民主化を求め、北京の天安門広場を占拠。約1カ月半にわたって抗議デモを繰り広げた。 このデモは中国各他の都市や大学に拡大。共産党による独裁体制の打倒やインフレ対策、賃金の上昇、住宅事情の改善などを求めた。 1989年6月、北京・天安門広場に民主化を求める大勢の市民が集まった 自由や民主主義を要求して天安門広場に集まった学生たち 6月3日夜、天安門広場に軍の戦車と部隊が出動。4日朝にかけて、武器を持たないデモ参加者たちに向けて発砲し、多数を殺傷した。 当局は後日、発砲による死者はゼロだと説明した。 中国政府はこれまで、デモ参加者の死者数を明らかにしていない。だが、天安門事件の死者は数百～数千人に上ったと言われている。 ＜関連記事＞ ツイッターが謝罪 天安門事件をめぐっては、ツイッター社が中国に関する投稿をしたアカウントを多数閉鎖し、謝罪に追い込まれる事態となっている。 ツイッターのユーザーたちは、#TwitterMassacre（ツイッター虐殺）というハッシュタグがつけられた投稿をめぐり、多くのアカウントがブロックされたことを問題視。マーコ・ルビオ米上院議員（共和党）は、ツイッター社が中国政府の検閲機関になっていると批判した。 同社は公式アカウントで、「スパムなどの不正行為を含む、プラットフォームに対する操作」に関与しているアカウントへの対抗措置をとっていると説明。「私たちの通常の行為は時として、問題ないものを問題ありと判定したり、間違いを犯したりする」とツイートした。 （英語記事 China defends Tiananmen crackdown in rare comments）", "text_zh": "天安门事件30周年 中国遗忘的影像 魏氏在新加坡举行的会议上，被听众问及天安门事件。 对于至今仍有意见认为中国的应对不妥，魏氏提出质疑，并称：“那一事件是一场政治风波，中央政府为平息风波采取了应对。这是正确的方针。” 他还主张：“这30年来中国发生了巨大变化。”并表示，正因为当时的政府对天安门事件采取了那样的应对，“中国才享有稳定与发展”。 重返天安门 30年前的学生回顾往事 当时发生了什么？ 1989年4月，超过100万名学生和工人要求民主化，占据了北京的天安门广场，展开了长达约一个半月的抗议示威。 这场示威扩大到中国其他城市和大学。示威者要求推翻共产党的独裁体制、治理通货膨胀、提高工资、改善住房条件等。 1989年6月，大批要求民主化的市民聚集在北京天安门广场 为要求自由和民主而聚集在天安门广场的学生们 6月3日夜间，军队的坦克和部队开进天安门广场。直到4日清晨，军队向手无寸铁的示威参加者开枪，造成大量死伤。 当局事后解释称，没有人因开枪死亡。 中国政府至今没有公布示威参加者的死亡人数。但据称，天安门事件的死者达数百至数千人。 ＜相关报道＞ 推特道歉 围绕天安门事件，推特公司关闭了大量发布与中国有关内容的账号，陷入被迫道歉的境地。 推特用户们对围绕带有#TwitterMassacre（推特大屠杀）标签的发帖、许多账号遭到封锁一事提出质疑。美国共和党参议员马尔科·卢比奥批评推特公司正在沦为中国政府的审查机关。 该公司通过官方账号解释称，正在对参与“包括垃圾信息等不正当行为在内的针对平台的操纵”的账号采取应对措施。并发推称：“我们的常规做法有时会把没有问题的判定为有问题，或者犯下错误。” （英文报道 China defends Tiananmen crackdown in rare comments）", "reference_summary": "中国で起きた天安門事件から6月4日で30年を迎えるのを前に、同国の魏鳳和（ウェイ・フォンホー）国防相が2日、軍による民主化運動の鎮圧は「正しい」方針だったと、同事件について異例の言及をした。多数の死傷者を出した天安門事件は、中国ではタブーになっている。", "ref_zh": "中国发生的天安门事件将于6月4日迎来30周年。在此之前，该国国防部长魏凤和（Wei Fenghe）2日就该事件作出罕见表态，称军队镇压民主化运动是“正确”的方针。造成大量死伤者的天安门事件，在中国已成为禁忌。", "summaries": [{"summary_id": "48493511_28905ea8", "summary": "シリア全土で30日午前零時（日本時間午前7時）に発効した政府軍と反政府勢力の停戦合意は、散発的な衝突のほかは終日ほぼ継続したもようだ。国連安全保障理事会は近く、停戦合意を支持する決議案（ロシア提出）について採決する見通し。", "zh": "叙利亚全境于30日零时（日本时间上午7时）生效的政府军与反政府武装的停火协议，除零星冲突外，全天基本得以维持。联合国安全理事会预计将于近期就支持停火协议的决议案（俄罗斯提出）进行表决。"}, {"summary_id": "48493511_709039c3", "summary": "中国の魏鳳和国防相は2日、シンガポールで開かれた国際会合において、1989年の天安門事件における軍の鎮圧は「正しい」方針だったと発言した。米国務省は同日付で異例の公式声明を発表し、中国の人権状況への深刻な懸念を示した。6月の武力鎮圧では数百から数千人の死者が出たとされるが、中国政府は現在も公式な死者数を明らかにしていない。", "zh": "中国国防部长魏凤和2日在新加坡举行的国际会议上表示，1989年天安门事件中军队的镇压是“正确”的方针。美国国务院于同日发表罕见的官方声明，对中国的人权状况表示严重关切。据称6月的武力镇压造成数百至数千人死亡，但中国政府至今没有公布官方死亡人数。"}, {"summary_id": "48493511_7696c89d", "summary": "中国の魏鳳和国防相は2日、シンガポールで開かれた国際会合において、1989年の天安門事件における軍の鎮圧は「正しい」方針だったと発言した。天安門事件は中国国内ではタブーとされており、現職国防相が公式な場で擁護発言をするのは極めて異例である。6月の武力鎮圧では数百から数千人の死者が出たとされるが、中国政府は現在も公式な死者数を明らかにしていない。", "zh": "中国国防部长魏凤和2日在新加坡举行的国际会议上表示，1989年天安门事件中军队的镇压是“正确”的方针。天安门事件在中国国内被视为禁忌，现任国防部长在正式场合发表辩护言论极为罕见。据称6月的武力镇压造成数百至数千人死亡，但中国政府至今没有公布官方死亡人数。"}, {"summary_id": "48493511_abe69178", "summary": "天安門事件から30年 中国が忘れた映像 魏氏はシンガポールで開かれた会合で、聴衆から天安門事件について質問を受けた。中国の対応は不適切だったとする意見が今もあることに疑問を投げかけた魏氏は、「あの出来事は政治的な騒乱であり、中央政府は騒乱を収束するために対応した。正しい方針だ」と述べた。", "zh": "天安门事件30周年 中国遗忘的影像 魏氏在新加坡举行的会议上，被听众问及天安门事件。对于至今仍有意见认为中国的应对不妥，魏氏提出质疑，并称：“那一事件是一场政治风波，中央政府为平息风波采取了应对。这是正确的方针。”"}, {"summary_id": "48493511_b9b093a2", "summary": "中国で起きた天安門事件から6月4日で30年を迎えるのを前に、同国の魏鳳和（ウェイ・フォンホー）国防相が2日、軍による民主化運動の鎮圧は「正しい」方針だったと、同事件について異例の言及をした。多数の死傷者を出した天安門事件は、中国ではタブーになっている。", "zh": "中国发生的天安门事件将于6月4日迎来30周年。在此之前，该国国防部长魏凤和（Wei Fenghe）2日就该事件作出罕见表态，称军队镇压民主化运动是“正确”的方针。造成大量死伤者的天安门事件，在中国已成为禁忌。"}]}, {"article_id": "39776572", "url": "https://www.bbc.com/japanese/39776572", "title": "米人気コメディアン、息子が九死に一生を得たと", "title_zh": "美国人气喜剧演员称，儿子九死一生", "text": "今年2月のアカデミー賞授賞式を司会したジミー・キメルさん キメルさんは番組冒頭で、4月21日に息子のビリーがロサンゼルスの病院で産まれた時のことを説明。安産で生まれたものの、誕生から3時間後に紫色になりはじめたビリーちゃんの異常に看護師が気づき、調べたところ心臓疾患があると分かった。 症状は深刻で「無神論の人たちも僕たちのために祈ってくれた」とキメルさん。ビリーちゃんは生後3日で心臓手術を受けることになり、ロサンゼルス小児病院のスタッフの尽力のおかげで助かったという。 「手術から6日して家に着いて、すごい元気だ。今日はおむつを換えてくれる自分の母親におしっこをひっかけた」 声を詰まらせながら自分の経験を語った後にキメルさんは、ドナルド・トランプ大統領が国立衛生研究所の予算大幅削減を提案したものの、連邦議会がこれを受け入れずに予算を増額したことに言及し「ありがたい」と述べた。 さらに、「2014年の前は、うちの息子みたいに先天性の心臓疾患をもって生まれてきたら、既往症があるからと医療保険に入れない可能性がかなりあった。両親が医療保険に入っていなかったら、そもそも加入を断られる年齢になるまで生きられなかったかもしれない」と、オバマケアの重要性を強調した。 「自分の赤ちゃんが死にかけている時に、年収は関係ないはずだ」 「それは、共和党支持だろうが民主党支持だろうがそれ以外だろうが、それについては賛成できますよね？ ですよね？」 「これはフットボールじゃない。チームの問題じゃない。みんな同じチームなんです」 「自分の子供の命を助けるのに、その費用が払えるかどうかなんて、そんな選択を親にさせたらだめだ。そんなこと、あってはならない。この国では」 オバマケア策定に参加した米公的医療保険センターのアンディ・スレイビット元所長は「今晩のジミー・キメルのモノローグを見るよう何人かに言われた。全部見た方がいい。そして深呼吸してから、連邦議会に電話するように」とツイートした トランプ氏は選挙中から、オバマケアを「大惨事」と呼び、その廃止は目玉公約のひとつだった。 3月に成立させようとしたオバマケア改廃法案は民主党が全面的に反対したのに加え、共和党内の支持が足りずに廃案となったが、共和党は引き続き、制度廃止を目指している。 あらためてオバマケアとは？ 「患者保護および負担可能な医療法」というのが正式な名称（略称「負担可能医療法（ACA）」。すでに世界で最も高額になっている米国の医療費の高騰を抑制することが目的。 オバマケアの財政基盤は個人の保険加入義務。雇用主が加入する医療保険や政府の公的保険の対象にならない人は、政府運営のサイトを通じて保険に加入する必要がある。 2013年の国別医療費負担（国内総生産比） 助成金を提供するほか、若く健康な加入者を増やすことで、医療保険の保険料を引き下げようというのが制度の基本理念。50人以上を正規雇用する雇用主は、従業員に医療保険を提供することが義務付けられている。 オバマケア実施によって、2000万人の米国人が医療保険を受けられるようになった。 しかしオバマケア以前から問題だった保険料の高騰が懸念材料となっているほか、保険大手3社がオンラインの保険マーケットプレイスを撤退した。 また、全国民の保険加入を義務付け、未加入の場合には罰金として税負担を求めるという仕組みも、対象となるのは家賃や自動車ローン、学生ローンなどの支払いに追われる低・中所得の労働者世帯のため、オバマケアの不人気につながっている。 その一方でオバマケアは、キメルさんが指摘したように、保険会社が既往症を理由に保険加入を拒否することを禁止しているため、支持も強い。また若者は26歳まで、両親の保険プランに残ることができる。 また成立以前に共和党は、オバマケアで財政負担が膨れ上がると主張していたが、それも杞憂に終わった。 （英語記事 Jimmy Kimmel tells of newborn son's illness）", "text_zh": "主持今年2月奥斯卡颁奖典礼的吉米·坎摩尔 坎摩尔在节目开头，讲述了4月21日儿子比利在洛杉矶一家医院出生时的情形。虽然分娩顺利，但出生3小时后，护士注意到比利开始发紫的异常情况，经检查发现他患有心脏疾病。 病情严重，坎摩尔说“连无神论者也为我们祈祷了”。比利在出生3天后接受了心脏手术，多亏洛杉矶儿童医院工作人员的尽力，才得以获救。 “手术后6天回到家，现在特别精神。今天还把尿撒到了给他换尿布的我母亲身上” 坎摩尔哽咽着讲述了自己的经历之后提到，唐纳德·特朗普总统曾提议大幅削减国立卫生研究院的预算，但联邦议会没有接受，反而增加了预算，他对此表示“很感激”。 他还强调了奥巴马医改的重要性：“在2014年之前，如果像我儿子这样生来就患有先天性心脏疾病，很有可能因为有既往症而无法加入医疗保险。如果父母没有加入医疗保险，孩子也许根本活不到会被拒绝投保的年龄。” “在自己的宝宝命悬一线的时候，年收入不应该成为问题” “无论你支持共和党、支持民主党还是其他党派，这一点大家都能赞成吧？对吧？” “这不是橄榄球比赛。不是哪个队的问题。大家都是同一个队” “要救自己孩子的命，却让父母去选择付不付得起这笔费用，这样是不行的。这种事，不应该发生。在这个国家” 曾参与制定奥巴马医改的美国公共医疗保险中心前所长安迪·斯莱维特发推称：“好几个人叫我看今晚吉米·坎摩尔的开场独白。大家最好全部看一遍。然后深呼吸，给联邦议会打电话” 特朗普从竞选期间起就把奥巴马医改称为“大灾难”，废除该制度是其招牌竞选承诺之一。 他3月试图通过的奥巴马医改废除修改法案，除了遭到民主党全面反对之外，共和党内部支持也不足，最终成为废案，但共和党仍继续以废除该制度为目标。 再来重新看看，奥巴马医改是什么？ 其正式名称是“患者保护与平价医疗法”（简称“平价医疗法（ACA）”）。目的是抑制已成为全球最昂贵的美国医疗费用的飙升。 奥巴马医改的财政基础是个人的保险加入义务。不属于雇主所加入的医疗保险或政府公共保险对象的人，需要通过政府运营的网站加入保险。 2013年各国医疗费负担（占国内生产总值比） 该制度的基本理念是，除提供补助金外，通过增加年轻健康的参保者来降低医疗保险的保费。正式雇用50人以上的雇主，有义务向员工提供医疗保险。 通过实施奥巴马医改，2000万美国人得以获得医疗保险。 但是，奥巴马医改之前就已成为问题的保费飙升是令人担忧的因素，此外三大保险公司退出了在线保险市场。 另外，要求全体国民参保、未参保者须作为罚款承担税负的机制，由于其对象是忙于支付房租、汽车贷款、学生贷款等的中低收入劳动者家庭，也导致了奥巴马医改的不受欢迎。 而另一方面，正如坎摩尔所指出的那样，奥巴马医改禁止保险公司以既往症为由拒绝投保，因此也有很强的支持。此外，年轻人到26岁为止可以留在父母的保险计划中。 另外，在该法成立之前，共和党曾主张奥巴马医改会使财政负担膨胀，但这也以杞人忧天告终。 （英文报道 Jimmy Kimmel tells of newborn son's illness）", "reference_summary": "米トーク番組やアカデミー賞授賞式などの司会で人気のコメディアン、ジミー・キメルさんが1日夜放送の番組で、生まれたばかりの息子が先天性の心臓疾患で死にかけたと涙ながらに語り、オバマケア（医療保険改革）の重要性を訴えた。", "ref_zh": "凭借主持美国脱口秀节目及奥斯卡颁奖典礼等而广受欢迎的喜剧演员吉米·坎摩尔，在1日晚播出的节目中含泪讲述刚出生的儿子因先天性心脏疾病险些丧命，并呼吁奥巴马医改（医疗保险改革）的重要性。", "summaries": [{"summary_id": "39776572_0c5e76b4", "summary": "米コメディアンのジミー・キメル氏は、生後間もない息子が先天性心臓疾患で緊急手術を受け一命を取り留めたと涙ながらに番組で語り、オバマケアの意義を訴えた。", "zh": "美国喜剧演员吉米·坎摩尔在节目中含泪讲述，出生不久的儿子因先天性心脏疾病接受紧急手术、保住一命，并呼吁奥巴马医改的意义。"}, {"summary_id": "39776572_5c0bde1d", "summary": "米トーク番組やアカデミー賞授賞式などの司会で人気のコメディアン、ジミー・キメルさんが1日夜放送の番組で、生まれたばかりの息子が先天性の心臓疾患で死にかけたと涙ながらに語り、オバマケア（医療保険改革）の重要性を訴えた。", "zh": "凭借主持美国脱口秀节目及奥斯卡颁奖典礼等而广受欢迎的喜剧演员吉米·坎摩尔，在1日晚播出的节目中含泪讲述刚出生的儿子因先天性心脏疾病险些丧命，并呼吁奥巴马医改（医疗保险改革）的重要性。"}, {"summary_id": "39776572_7682c3a7", "summary": "米トーク番組やアカデミー賞授賞式などの司会で人気のコメディアン、ジミー・キメルさんが1日夜放送の番組で、生まれたばかり", "zh": "凭借主持美国脱口秀节目及奥斯卡颁奖典礼等而广受欢迎的喜剧演员吉米·坎摩尔，在1日晚播出的节目中，刚出生"}, {"summary_id": "39776572_9264a945", "summary": "今年2月のアカデミー賞授賞式を司会したジミー・キメルさん キメルさんは番組冒頭で、4月21日に息子のビリーがロサンゼルスの病院で産まれた時のことを説明。安産で生まれたものの、誕生から3時間後に紫色になりはじめたビリーちゃんの異常に看護師が気づき、調べたところ心臓疾患があると分かった。症状は深刻で「無神論の人たちも僕たちのために祈ってくれた」とキメルさん。", "zh": "主持今年2月奥斯卡颁奖典礼的吉米·坎摩尔 坎摩尔在节目开头，讲述了4月21日儿子比利在洛杉矶一家医院出生时的情形。虽然分娩顺利，但出生3小时后，护士注意到比利开始发紫的异常情况，经检查发现他患有心脏疾病。病情严重，坎摩尔说“连无神论者也为我们祈祷了”。"}, {"summary_id": "39776572_dff757fb", "summary": "米コメディアンのジミー・キメル氏は、生後1週間を過ぎた息子が先天性心臓疾患で緊急手術を受け一命を取り留めたと涙ながらに番組で語り、オバマケアの意義を訴えた。大統領のトランプ氏はキメル氏の訴えを受け、同制度の撤廃計画を再検討する意向を示したと伝えられている。", "zh": "美国喜剧演员吉米·坎摩尔在节目中含泪讲述，出生一周多的儿子因先天性心脏疾病接受紧急手术、保住一命，并呼吁奥巴马医改的意义。据报道，特朗普总统接受坎摩尔的呼吁，表示有意重新考虑废除该制度的计划。"}]}, {"article_id": "53274336", "url": "https://www.bbc.com/japanese/53274336", "title": "韓国のトライアスロン選手が自殺、コーチらが長年暴力か", "title_zh": "韩国铁人三项选手自杀 疑长年遭教练等人暴力对待", "text": "韓国女子トライアスロンのチェ・スクヒョン選手 報道によると、スクヒョン選手は暴行についてスポーツ当局に訴えたものの、無視されていたという。 スクヒョン選手は高校生だった2015年に、トライアスロンの韓国代表に選ばれた。 「歯を食いしばれ」 スクヒョン選手の両親は、同選手がコーチらから叩かれたり、暴言やハラスメントを受けたりしていたと訴えている。 こうした主張を裏付けるような複数の音声テープを、YTNテレビが公開した。 ある音声テープでは、男性が「おまえ！ ここへ来い。歯を食いしばれ」と言った後に平手打ちする音が確認できる。 ＜関連記事＞ 「死んだ方がまし」 スクヒョン選手は日記に「毎日涙を流した」、繰り返し「犬のように殴られて」「死んだ方がまし」などと書いていたと報じられている。 AFP通信によると、スクヒョン選手は今年4月、韓国のスポーツ競技団体を統括する大韓体育会（KSOC）に対し、暴行被害について申し立てた。 聨合通信は知人の話として、スクヒョン選手は「多くの公的機関に助けを求めたが、みんな彼女の訴えを無視した」と伝えている。 KSOCは訴えを無視したことを否定。声明の中で、4月初旬の告発の後に女性調査員を任命していたと説明したと、AFPは報じている。 「暴力や性的暴行を防止し、選手の人権を守るために努力してきたにも関わらず、このような出来事が再び起きたのは非常に遺憾だ」 韓国トライアスロン連盟は声明で、虐待の加害者と疑われる複数の人物に対策をとることを約束したと、香港の英字紙サウスチャイナ・モーニングポストは伝えている。 ほかの競技でも 韓国スポーツ界ではここ数年間、多数の女性スポーツ選手が虐待被害を告発している。 昨年には複数の選手がコーチらから身体的虐待や性的虐待を受けたと名乗り出たことを受け、韓国で過去最大規模の性的虐待調査が開始された。 複数の女性スケーターは、コーチから性的虐待を受けていたが、事実が隠蔽されていたと明かした。 「キスされて、体を触られた」 韓国スケート界の性的暴行スキャンダル 2018年には元テニス選手のキム・ウニ氏が、10歳のころからコーチから性的暴行を受けていたと告白した。このコーチはその後、強姦致傷罪で禁錮10年が言い渡された。 ほかにも、元柔道選手が高校のコーチから4年もの間、繰り返しレイプされていたと告発した。 警察庁では性犯罪被害の相談電話窓口として、全国共通番号「#8103」を導入しています。内閣府男女共同参画局でも性暴力被害者に必要な情報を提供しています。また現在、各都道府県に「ワンストップ支援センター」が設置されています。 （英語記事 South Korea triathlete kills herself 'after abuse'）", "text_zh": "韩国女子铁人三项选手崔淑贤 据报道，崔淑贤选手曾就遭受暴力一事向体育当局提出申诉，但遭到无视。 崔淑贤选手在2015年还是高中生时，就入选了铁人三项韩国国家队。 “咬紧牙关” 崔淑贤选手的父母控诉称，该选手曾遭到教练等人殴打、辱骂和骚扰。 YTN电视台公开了多段可以佐证这些主张的录音。 在一段录音中，可以听到一名男子说“你！过来。咬紧牙关”之后扇耳光的声音。 ＜相关报道＞ “不如死了算了” 据报道，崔淑贤选手在日记中写道“每天都在流泪”，并反复写下“像狗一样被打”“不如死了算了”等内容。 据法新社报道，崔淑贤选手今年4月向统管韩国体育竞技团体的大韩体育会（KSOC）就遭受暴力一事提出了申诉。 韩联社援引熟人的话报道称，崔淑贤选手“曾向许多公共机构求助，但大家都无视了她的申诉”。 KSOC否认曾无视申诉。据法新社报道，该会在声明中解释称，在4月初的检举之后已任命了女性调查员。 “尽管我们一直努力防止暴力和性暴力、保护选手的人权，但再次发生这样的事件，非常遗憾” 据香港英文报纸《南华早报》报道，韩国铁人三项联盟在声明中承诺，将对涉嫌施虐的多名人员采取措施。 其他项目也有 近几年来，韩国体育界有多名女性运动员检举遭受虐待。 去年，在多名选手站出来表示曾遭教练等人身体虐待和性虐待之后，韩国启动了历来最大规模的性虐待调查。 多名女子滑冰选手透露，她们曾遭教练性虐待，但事实被掩盖。 “被亲吻，被摸了身体” 韩国滑冰界的性暴力丑闻 2018年，前网球选手金恩姬坦言，自己从10岁起就遭到教练性侵。这名教练之后被以强奸致伤罪判处10年监禁。 此外，还有前柔道选手检举称，曾遭高中教练反复强奸长达4年之久。 警察厅设有性犯罪受害咨询电话窗口，全国统一号码为“#8103”。内阁府男女共同参画局也为性暴力受害者提供必要的信息。此外，目前各都道府县均设有“一站式支援中心”。 （英文报道 South Korea triathlete kills herself 'after abuse'）", "reference_summary": "コーチらから長年暴行を受けていたと訴えていた韓国の女子トライアスロン選手のチェ・スクヒョン氏（22）が先月、自殺していたことが明らかになった。複数メディアが報じた。", "ref_zh": "曾控诉长年遭教练等人暴力对待的韩国女子铁人三项选手崔淑贤（22岁）上月自杀身亡一事已被曝光。多家媒体报道了此事。", "summaries": [{"summary_id": "53274336_27788032", "summary": "コーチらから長年暴行を受けていたと訴えていた韓国の女子トライアスロン選手チェ・スクヒョン氏（22）が先月自殺していたことが明らかになった。大韓体育会は事件を受けて4人のコーチを即刻解任し、文在寅大統領もスポーツ界の改革を約束する声明を発表した。韓国スポーツ界では近年、複数の競技で女性選手による虐待被害の告発が相次いでいる。", "zh": "曾控诉长年遭教练等人暴力对待的韩国女子铁人三项选手崔淑贤（22岁）上月自杀身亡一事已被曝光。大韩体育会在事件发生后立即解雇了4名教练，文在寅总统也发表声明承诺改革体育界。韩国体育界近年来在多个项目中接连有女性选手检举遭受虐待。"}, {"summary_id": "53274336_624e6dab", "summary": "コーチらから長年暴行を受けていたと訴えていた韓国の女子トライアスロン選手のチェ・スクヒョン氏（22）が先月、自殺していたことが明らかになった。複数メディアが報じた。", "zh": "曾控诉长年遭教练等人暴力对待的韩国女子铁人三项选手崔淑贤（22岁）上月自杀身亡一事已被曝光。多家媒体报道了此事。"}, {"summary_id": "53274336_a9156728", "summary": "コーチらから長年暴行を受けていたと訴えていた韓国の女子トライアスロン選手チェ・スクヒョン氏（22）が先月自殺していたことが明らかになった。同選手は大韓体育会などに被害を訴えていたが対応されず、暴行を示唆する音声テープも公開されている。韓国スポーツ界では近年、複数の競技で女性選手による虐待被害の告発が相次いでいる。", "zh": "曾控诉长年遭教练等人暴力对待的韩国女子铁人三项选手崔淑贤（22岁）上月自杀身亡一事已被曝光。该选手曾向大韩体育会等机构申诉受害情况但未获处理，暗示施暴的录音也已被公开。韩国体育界近年来在多个项目中接连有女性选手检举遭受虐待。"}, {"summary_id": "53274336_be2a4e06", "summary": "複数メディアが報じた。コーチらから長年暴行を受けていたと訴えていた韓国の女子トライアスロン選手のチェ・スクヒョン氏（22）が先月、自殺していたことが明らかになった。", "zh": "多家媒体报道了此事。曾控诉长年遭教练等人暴力对待的韩国女子铁人三项选手崔淑贤（22岁）上月自杀身亡一事已被曝光。"}, {"summary_id": "53274336_cbcf19e0", "summary": "韓国女子トライアスロンのチェ・スクヒョン選手 報道によると、スクヒョン選手は暴行についてスポーツ当局に訴えたものの、無視されていたという。スクヒョン選手は高校生だった2015年に、トライアスロンの韓国代表に選ばれた。「歯を食いしばれ」 スクヒョン選手の両親は、同選手がコーチらから叩かれたり、暴言やハラスメントを受けたりしていたと訴えている。", "zh": "韩国女子铁人三项选手崔淑贤 据报道，崔淑贤选手曾就遭受暴力一事向体育当局提出申诉，但遭到无视。崔淑贤选手在2015年还是高中生时，就入选了铁人三项韩国国家队。“咬紧牙关” 崔淑贤选手的父母控诉称，该选手曾遭到教练等人殴打、辱骂和骚扰。"}]}, {"article_id": "55155049", "url": "https://www.bbc.com/japanese/55155049", "title": "【米大統領選2020】 バー司法長官、大規模な不正は「確認できていない」", "title_zh": "【2020年美国大选】 司法部长巴尔:大规模舞弊“尚未得到确认”", "text": "ウィリアム・バー司法長官 トランプ氏に特に近い側近の1人とみられているバー氏は、米AP通信の取材で、投票機が細工されてジョー・バイデン次期大統領の得票が増えたというトランプ氏側の主張に言及。「大掛かりな不正があった、選挙結果をねじ曲げるように機器が仕組まれていた、といった主張が出ている」と述べた。 そのうえで、司法省と国土安全保障省が調べたが、「これまでのところ、そうした主張を証明するものは何も見つかっていない」、「選挙結果を変えるほどの規模の不正は、現在まで確認できていない」と話した。 司法省報道官はこの後、捜査が終了したわけはなく、「具体的で信憑性（しんぴょうせい）のある不正の疑いはできる限り素早く追及する」とコメントした。 バー長官の発言は、大統領選での敗北を受け入れていないトランプ氏にとって、大きな打撃となるとみられる。 BBCのアンソニー・ザーカー北米担当記者は、司法省が不正の証拠を発見しなかったことは意外ではないものの、「注目に値するのは、バー氏が沈黙を守り、不正の証拠などが提示されないというそのこと自体に語らせるのではなく、自ら公に発言することを選んだことだ」と解説した。 ＜関連記事＞ 「司法制度を利用する傾向」 トランプ氏と陣営は、大統領選でバイデン氏が勝者となった複数の州で裁判を起こしているが、各州では現在、バイデン氏勝利の認定が進んでいる。 バー氏は先月、連邦検察官らに対し、大統領選における不正行為に関する「信用できる訴え」について、大統領選の結果が認定される前に調べるよう命じていた。 バー氏は今回のAP通信の取材で、「すべてを解決する手段として刑事司法制度を利用する傾向が強まっているが、司法省が介入して『捜査』するようなことを、国民は好ましく思っていない」と述べた。 また、ロバート・ムラー米特別検察官が指揮した、2016年米大統領選におけるロシア政府とトランプ陣営による妨害疑惑の捜査について、その経緯の捜査を継続するため担当のベテラン検察官を指名したと述べた。 トランプ陣営は反発 バー氏の発言を受け、トランプ陣営のルディ・ジュリアーニ弁護士とジェナ・エリス弁護士は共同声明を発表。「司法長官には最大の敬意を表するが、彼は実質的な不正行為や大掛かりな不正の証拠について知識もなければ捜査もしないまま、意見を述べたと思われる」とした。 一方、議会上院のチャック・シューマー民主党院内総務は、バー氏について、「次にクビにされるのはおそらく彼だろう」と話した。 トランプ氏はバー氏の発言が報じられた後、大統領選で不正があったとする主張を、証拠を示さずにあらためてツイッターに数回投稿した。 他の高官も不正を否定 大統領選で不正はなかったと述べた政府高官は、バー氏のほかにもいる。 米国土安全保障省のサイバーセキュリティー・インフラセキュリティー庁（CISA）のクリス・クレブス長官は先月、大統領選は「アメリカ史上最も信頼できるものだった」と述べ、更迭された。 クレブス氏をめぐっては、トランプ氏の弁護士ジョー・ディジェノヴァ氏が先月30日、「選挙がうまくいったと考える人は全員」ばか者だとしたうえで、「彼は四つ裂きにされるべきだ。夜明けに連れ出されて撃たれるべきだ」などと暴力行為を呼びかけ、非難された。 ジョージア州の選管幹部で共和党員のゲイブリエル・スターリング氏は1日、選挙で不正があったとするトランプ氏の主張が原因となって起きた暴力行為については、究極的にトランプ氏が責任を負うことになると主張した。 【米大統領選2020】 「このままでは人が死ぬ」 ジョージア州選管幹部が警告 トランプ氏のインタビュー トランプ氏は29日、大統領選後初めてのテレビインタビューに応じ、あらゆる法廷闘争を継続すると述べた。 トランプ氏は米FOXニュースの番組で、「私の気持ちは6カ月後も変わっていないだろう」、「ものすごい不正があった」と電話で語った。 また、特別検察官を指名して、大統領選の不正疑惑を捜査させる案も明らかにした。ただし、特別検察官による捜査はバー司法長官の承認が必要となる。 （英語記事 Top US lawyer refutes Trump election fraud claims）", "text_zh": "威廉·巴尔司法部长 被视为与特朗普特别亲近的核心幕僚之一的巴尔,在接受美国美联社采访时,提及了特朗普方面所称投票机被做了手脚、使下任总统乔·拜登得票增加的主张。他表示:“有人提出了诸如存在大规模舞弊、机器被设计成扭曲选举结果之类的主张。” 在此基础上,他表示,司法部和国土安全部进行了调查,但“到目前为止,没有发现任何能证明这些主张的东西”、“足以改变选举结果的规模的舞弊,至今尚未得到确认”。 司法部发言人随后评论称,调查并没有结束,“对具体且可信的舞弊嫌疑,将尽可能迅速地追查”。 巴尔部长的这番发言,对于不接受总统选举失败的特朗普而言,预计将构成重大打击。 BBC北美事务记者安东尼·泽彻解读称,司法部没有发现舞弊证据并不令人意外,但“值得注意的是,巴尔选择了亲自公开发言,而不是保持沉默、让‘舞弊证据等未被提出’这一事实本身来说话”。 <相关报道> “利用司法制度的倾向” 特朗普及其阵营在总统选举中拜登获胜的多个州提起诉讼,但目前各州正在推进对拜登获胜的认证。 巴尔上个月曾命令联邦检察官们,就总统选举中舞弊行为的“可信指控”,在总统选举结果获得认证之前进行调查。 巴尔在此次接受美联社采访时表示:“把刑事司法制度当作解决一切问题的手段的倾向正在增强,但司法部介入进行‘调查’这种事,国民并不乐见。” 此外,关于由美国特别检察官罗伯特·穆勒指挥的、针对2016年美国总统选举中俄罗斯政府与特朗普阵营妨碍嫌疑的调查,他表示,为继续调查其来龙去脉,已指名一位负责此事的资深检察官。 特朗普阵营表示反弹 针对巴尔的发言,特朗普阵营的鲁迪·朱利安尼律师和珍娜·埃利斯律师发表联合声明,称“我们对司法部长致以最大的敬意,但他似乎是在对实质性舞弊行为及大规模舞弊的证据既无了解也未调查的情况下发表了意见”。 另一方面,国会参议院民主党领袖查克·舒默谈及巴尔时表示:“下一个被解雇的恐怕就是他了。” 特朗普在巴尔的发言被报道后,再次在推特上数次发帖,声称总统选举中存在舞弊,但没有出示证据。 其他高官也否认存在舞弊 表示总统选举中不存在舞弊的政府高官,除巴尔之外还有其他人。 美国国土安全部网络安全与基础设施安全局(CISA)局长克里斯·克雷布斯上个月表示,此次总统选举是“美国历史上最可信的”,随后被免职。 围绕克雷布斯,特朗普的律师乔·迪杰诺瓦上月30日称“所有认为选举顺利进行的人”都是蠢货,并称“他应该被五马分尸。应该在黎明时被拖出去枪毙”等,因呼吁暴力行为而受到谴责。 佐治亚州选举管理部门官员、共和党人加布里埃尔·斯特林1日主张,对于因特朗普声称选举存在舞弊的主张而引发的暴力行为,最终将由特朗普承担责任。 【2020年美国大选】 “再这样下去会死人的” 佐治亚州选管官员发出警告 特朗普的采访 特朗普29日接受了总统选举后的首次电视采访,表示将继续进行一切法庭斗争。 特朗普在美国福克斯新闻的节目中通过电话表示:“6个月后我的想法也不会改变”、“存在惊人的舞弊”。 此外,他还透露了指名特别检察官、让其调查总统选举舞弊嫌疑的方案。不过,特别检察官进行调查需要司法部长巴尔的批准。 (英文报道 Top US lawyer refutes Trump election fraud claims)", "reference_summary": "アメリカのウィリアム・バー司法長官は1日、大統領選で大掛かりな不正があったとするドナルド・トランプ大統領の主張について、裏付ける証拠を司法省は発見できていないと述べた。", "ref_zh": "美国司法部长威廉·巴尔1日表示,关于唐纳德·特朗普总统所称总统选举中存在大规模舞弊的主张,司法部尚未发现能够佐证的证据。", "summaries": [{"summary_id": "55155049_0166e910", "summary": "アメリカのウィリアム・バー司法長官は1日、大統領選で大掛かりな不正があったとするドナルド・トランプ大統領の主張について、裏付ける証拠を司法省は発見できていないと述べた。", "zh": "美国司法部长威廉·巴尔1日表示,关于唐纳德·特朗普总统所称总统选举中存在大规模舞弊的主张,司法部尚未发现能够佐证的证据。"}, {"summary_id": "55155049_2d012498", "summary": "ウィリアム・バー司法長官 トランプ氏に特に近い側近の1人とみられているバー氏は、米AP通信の取材で、投票機が細工されてジョー・バイデン次期大統領の得票が増えたというトランプ氏側の主張に言及。「大掛かりな不正があった、選挙結果をねじ曲げるように機器が仕組まれていた、といった主張が出ている」と述べた。そのうえで、司法省と国土安全保障省が調べたが、「これまでのところ、そうした主張を証明するものは何も見つかっていない」、「選挙結果を変えるほどの規模の不正は、現在まで確認できていない」と話した。", "zh": "威廉·巴尔司法部长 被视为与特朗普特别亲近的核心幕僚之一的巴尔,在接受美国美联社采访时,提及了特朗普方面所称投票机被做了手脚、使下任总统乔·拜登得票增加的主张。他表示:“有人提出了诸如存在大规模舞弊、机器被设计成扭曲选举结果之类的主张。”在此基础上,他表示,司法部和国土安全部进行了调查,但“到目前为止,没有发现任何能证明这些主张的东西”、“足以改变选举结果的规模的舞弊,至今尚未得到确认”。"}, {"summary_id": "55155049_9be24c04", "summary": "米国のウィリアム・バー司法長官は1日、AP通信の取材に対し、大統領選で大規模な不正があったとするトランプ大統領の主張について、これを裏付ける証拠は司法省として発見できていないと述べた。大統領に近い側近とみられていたバー氏の発言は、選挙結果を受け入れていないトランプ氏にとって大きな打撃となるとみられる。トランプ陣営の弁護士は反発する声明を発表する一方、民主党のシューマー上院院内総務は「次にクビにされるのは彼だろう」と予測した。", "zh": "美国司法部长威廉·巴尔1日在接受美联社采访时表示,关于特朗普总统所称总统选举中存在大规模舞弊的主张,司法部未能发现佐证这一主张的证据。被视为与总统亲近的核心幕僚的巴尔的这番发言,对于不接受选举结果的特朗普而言,预计将构成重大打击。特朗普阵营的律师发表了表示反弹的声明,而民主党的舒默参议院党团领袖则预测称“下一个被解雇的将是他”。"}, {"summary_id": "55155049_a6c5b888", "summary": "米国のウィリアム・バー司法長官は1日、記者会見で大統領選における大規模な不正の証拠は発見できていないと述べた。バー氏はさらに、これまでの追加捜査で選挙結果を左右しない規模の個別不正は確認されていると説明した。トランプ陣営の弁護士は反発する声明を発表し、シューマー民主党院内総務は「次にクビにされるのは彼だろう」と予測した。", "zh": "美国司法部长威廉·巴尔1日在记者会上表示,尚未发现总统选举中存在大规模舞弊的证据。巴尔还进一步说明称,在迄今为止的追加调查中,已确认存在不至于左右选举结果的规模的个别舞弊。特朗普阵营的律师发表了表示反弹的声明,舒默民主党党团领袖则预测称“下一个被解雇的将是他”。"}, {"summary_id": "55155049_bbe6c482", "summary": "米紙ニューヨーク・タイムズの社主は29日、ドナルド・トランプ米大統領と会談した際、報道記者を「国民の敵」と呼ぶべきでないと伝えたことを明らかにした。メディアに対する「暴力につながる」と警告したという。", "zh": "美国报纸《纽约时报》的发行人29日透露,在与美国总统唐纳德·特朗普会谈时,曾向其表示不应把新闻记者称为“国民之敌”。据称,他警告说这会导致针对媒体的“暴力”。"}]}, {"article_id": "45583472", "url": "https://www.bbc.com/japanese/45583472", "title": "実はヨーグルト製品には砂糖がいっぱい（オーガニックでも） コーラよりも", "title_zh": "其实酸奶产品含有大量砂糖(即使是有机产品) 比可乐还多", "text": "ニック・トリグル健康担当編集委員 英国のスーパーマーケットで売られている900点近いヨーグルト製品を調査した結果、ヨーグルトには砂糖が豊富に含まれているという結論となった。 英リーズ大学主導の調査によると、砂糖の含有量が特に高いものの中には、オーガニック・ヨーグルトも含まれていた。100グラムあたりの糖分が、コーラ飲料より多いものもあった。 低糖と呼べるのは、ナチュラル・ヨーグルトとギリシャ・ヨーグルトだけだった。 論文は、英医師学会誌「BMJオープン」に掲載された。英政府の保健当局は現在、消費者の砂糖摂取を減らすよう食品メーカーに働きかけており、この調査は政府の取り組みが始まって間もなく開始された。 英イングランド公衆衛生局（PHE）は、ヨーグルト製品についても改善を求めている。 最も砂糖が多かったのは予想通り、ヨーグルト・デザートという分類の製品で、100グラム当たりの砂糖量は平均16.4グラムだった。 この分類には、チョコレート・ムースやカスタード・プリンなど、ヨーグルトが含まれていない食品も入っていた。 次に砂糖が多かったのはオーガニック・ヨーグルトで、一般的なもので100グラム当たり13.1グラムだった。 子ども向けヨーグルトには多くの場合、100グラム当たり角砂糖2個分以上に当たる10.8グラムの砂糖が含まれていた。 比較すると、一般的なコーラ飲料には100グラムあたり、9グラムの砂糖が含まれる。 英国の国民医療保険制度、国民保健サービス（NHS）が推奨する1日当たりの砂糖の摂取量は、4〜6歳の子どもで19グラム（角砂糖5個）以下、7〜10歳は1日24グラム以下としている。 低糖と分類されるには、100グラム当たり5グラム以下でなくてはならない。 今回調べたヨーグルトのうち、この基準値を下回ったのはわずか9％しかなかった。 今回の実地調査は2016年末に実施された。それ以降、ヨーグルトによる砂糖摂取を減らす取り組みが前進している。 今年5月に発表された報告書によると、政府が働きかけた取り組みの1年目でヨーグルト製品に含まれる砂糖は6％減っていた。目標値の5％減を達成した品目は、ヨーグルトのみだった。 PHEの主任栄養士アリソン・テッドストーン博士はこの成果について、「前向きな対応」が実施された証拠だと評価する。 調査を主導したバーナデット・ムーア博士は、「削減分を考慮に入れたとしても、ほとんどのヨーグルトがまだ糖分が低いとは言えない」と指摘している。 「ヨーグルトにどれだけ砂糖が入っているかを知ったら、親も含めみんなが驚くと思う。ナチュラル・ヨーグルトを買って、自分で果物を混ぜるのをお勧めする」 ヨーグルトに入っている砂糖の量は（100グラムあたり） デザート・ヨーグルト―16.4グラム オーガニック・ヨーグルト―13.1グラム 味付きヨーグルト―12グラム フルーツ・ヨーグルト―11.9グラム 子ども向けヨーグルト―10.8グラム 乳製品以外のヨーグルト―9.2グラム ヨーグルト飲料―9.1グラム ナチュラル・ヨーグルトとギリシャ・ヨーグルト―5グラム （英語記事 Yoghurts (even organic ones) 'full of sugar'）", "text_zh": "尼克·特里格尔健康事务编辑 对英国超市销售的近900种酸奶产品进行调查的结果,得出了酸奶中含有大量砂糖的结论。 由英国利兹大学主导的调查显示,砂糖含量特别高的产品中,也包括有机酸奶。有些产品每100克的糖分比可乐饮料还多。 能称得上低糖的,只有天然酸奶和希腊酸奶。 论文发表在英国医师学会杂志《BMJ开放》(BMJ Open)上。英国政府卫生部门目前正在敦促食品厂商减少消费者的砂糖摄入,这项调查是在政府的举措启动后不久开始的。 英格兰公共卫生局(PHE)也要求对酸奶产品加以改善。 砂糖最多的正如预料,是归类为“酸奶甜点”的产品,每100克的砂糖量平均为16.4克。 这一分类中,还包括巧克力慕斯、蛋奶布丁等不含酸奶的食品。 其次砂糖较多的是有机酸奶,一般产品每100克含13.1克。 儿童酸奶在多数情况下,每100克含有相当于2块以上方糖的10.8克砂糖。 相比之下,一般的可乐饮料每100克含有9克砂糖。 英国的国民医疗保险制度——国民保健署(NHS)建议的每日砂糖摄入量,4至6岁儿童为19克(5块方糖)以下,7至10岁为每日24克以下。 要被归类为低糖,每100克必须在5克以下。 此次调查的酸奶中,低于这一基准值的仅有9%。 此次实地调查于2016年底实施。此后,减少经由酸奶摄入砂糖的举措取得了进展。 根据今年5月发表的报告,在政府推动的举措的第一年,酸奶产品所含的砂糖减少了6%。达成5%削减目标的品类,只有酸奶。 PHE首席营养师艾莉森·泰德斯通博士评价这一成果称,这是实施了“积极应对”的证据。 主导调查的伯纳黛特·穆尔博士指出:“即使把削减的部分考虑在内,大多数酸奶的糖分仍不能说低。” “如果知道酸奶里加了多少砂糖,我想包括家长在内,大家都会吃惊。我建议购买天然酸奶,自己加入水果混合。” 酸奶中所含砂糖的量(每100克) 甜点酸奶——16.4克 有机酸奶——13.1克 调味酸奶——12克 水果酸奶——11.9克 儿童酸奶——10.8克 非乳制品酸奶——9.2克 酸奶饮料——9.1克 天然酸奶和希腊酸奶——5克 (英文报道 Yoghurts (even organic ones) 'full of sugar')", "reference_summary": "ヨーグルトというと健康的な食べ物と思われがちだが、実は多くの場合、砂糖が豊富に含まれている。そのため消費者は、健康的なものを食べていると勘違いしない方がいい、と科学者は警告している。", "ref_zh": "说到酸奶,人们往往认为是健康食品,但实际上多数情况下含有大量砂糖。因此科学家警告称,消费者最好不要误以为自己吃的是健康食品。", "summaries": [{"summary_id": "45583472_014b86bd", "summary": "ニック・トリグル健康担当編集委員 英国のスーパーマーケットで売られている900点近いヨーグルト製品を調査した結果、ヨーグルトには砂糖が豊富に含まれているという結論となった。英リーズ大学主導の調査によると、砂糖の含有量が特に高いものの中には、オーガニック・ヨーグルトも含まれていた。100グラムあたりの糖分が、コーラ飲料より多いものもあった。", "zh": "尼克·特里格尔健康事务编辑 对英国超市销售的近900种酸奶产品进行调查的结果,得出了酸奶中含有大量砂糖的结论。由英国利兹大学主导的调查显示,砂糖含量特别高的产品中,也包括有机酸奶。有些产品每100克的糖分比可乐饮料还多。"}, {"summary_id": "45583472_86972732", "summary": "英国のスーパーで販売されているヨーグルト製品の多くに砂糖が豊富に含まれていることが判明した。コーラ飲料より糖分が多いものもあり、国民保健サービス（NHS）は来年から全てのヨーグルト製品へのカロリー警告ラベル表示を義務付ける方針を発表した。", "zh": "英国超市销售的许多酸奶产品被发现含有大量砂糖。有些产品糖分比可乐饮料还多,国民保健署(NHS)公布了自明年起对所有酸奶产品强制标注卡路里警告标签的方针。"}, {"summary_id": "45583472_a1f7946d", "summary": "英国のスーパーで販売されているヨーグルト製品の多くに砂糖が豊富に含まれていることが判明した。コーラ飲料より糖分が多いものもあり、オーガニックや子ども向け製品も例外ではない。", "zh": "英国超市销售的许多酸奶产品被发现含有大量砂糖。有些产品糖分比可乐饮料还多,有机产品和儿童产品也不例外。"}, {"summary_id": "45583472_a66a29cb", "summary": "ヨーグルトというと健康的な食べ物と思われがちだが、実は多くの場合、砂糖が豊富に含まれている。そのため消費者は、健康的なものを食べていると勘違いしない方がいい、と科学者は警告している。", "zh": "说到酸奶,人们往往认为是健康食品,但实际上多数情况下含有大量砂糖。因此科学家警告称,消费者最好不要误以为自己吃的是健康食品。"}, {"summary_id": "45583472_ca389798", "summary": "ヨーグルトというと健康的な食べ物と思われがちだが、実は多くの場合、砂糖が豊富に含まれている。そのため", "zh": "说到酸奶,人们往往认为是健康食品,但实际上多数情况下含有大量砂糖。因此"}]}, {"article_id": "features-and-analysis-46478194", "url": "https://www.bbc.com/japanese/features-and-analysis-46478194", "title": "いじめた罰だ、学校まで歩きなさい――父親のしつけビデオで議論", "title_zh": "这是欺负人的惩罚,自己走路去学校——父亲的管教视频引发争论", "text": "父親によると、娘がバスで他の生徒をいじめたと叱られたのはこれで2回目だった カーステンさん（10）は、いじめ行為を学校にとがめられ、2回目だったためスクールバスの利用を3日間禁止された。そこで父親のマット・コックスさんは、生きる上で何が大切なのかを娘に教えることにした。 寒い日の朝、コックスさんは学校までの道のりの一部を娘に歩かせた。自分は後ろから車で付いて行った。 地元テレビのWTVGニュースによると、合計8キロの距離は、カーステンさんがスクールバスの利用を禁止された3日間の間、数回に分けて歩ききった。 コックスさんは3日、初日のビデオをフェイスブックに投稿。以来1700万回以上再生され、数万件のコメントを集めている。 コックスさんはビデオと共に、「生きる上での教訓だ！！ 最新情報：しっかり学んだ！ 手足はぜんぶ無事で元気で健康。それにいじめについて、考えを改めたみたいだし、当たり前と思っていたちょっとしたものを感謝するようになったようだ」と書き、「自分の子供に責任を取らせる」、「いじめをやめろ」のハッシュタグも付けた。 大勢が拡散したこのビデオでは、バックパックを背負い学用品を持ったコックスさんの娘が、道路沿いを歩いている。外気温は2度だ。 コックスさんは権利やいじめについて語りながら、車で後ろから続いている。 「いじめは許されない」、「いじめは我が家で食い止める。そのための自分なりの、ささやかな方法」だとコックスさんはビデオで話している。 コックスさんはさらに、車やバスで毎朝学校に連れて行ってもらうのは当然の権利だと、多くの子供が考えていると指摘。 「私のやることに賛成しない親御さんは多いでしょう。それは構わない」 「自分の娘に教えるため、そして娘にいじめをやめさせるため、私は自分が正しいと思うことをしているまでだ」 コックスさんは5日にフェイスブックを更新し、自分の教えを娘がしっかりと受け止めてくれたと書いた。カーステンさんはこの日に、8キロの最後の部分を歩き終えたという。 カーステンさんはWTVGに対し、自分もいじめられたことがあり、今回のことで人に優しくすることを覚えたと話した。 ＜関連記事＞ コックスさんのビデオには約6万3000件以上のコメントがついた。その多くは肯定的で、いじめる側の子供の親も、いじめられる子供の親も、コックスさんのしつけに感謝している。 「うちの自閉症の孫は、近所の子供たちからいじめられている。その祖父として拍手します！ 何もしない親が多すぎる」というコメントがあった。 「自分の子供が許されない真似をしたら、親が自分の時間を割いて、自分で自分の子供に責任を取らせるべきだ。そういう親がもっといたらいいのに」と書く人もいた。 その一方で、「おしおきされている姿をフェイスブックに投稿して屈辱を与えるなんて。皮肉だ」と、これは父親が娘をいじめているに等しいのではないかという意見もあった。 さらに、「ちょっと待って。あなたの娘が他の子をいじめたの？ 娘の説明を最後まで聞いた？ この子は自分がいじめられてて、それに反応したから学校に見つかっちゃったの？ 公の場で恥をかかせるのがおしおきだというなら、娘の態度が悪くなるのも仕方ないのでは？」と書く人もいた。 心理学研究者で若者のいじめに詳しい、米フロリダ大学のドロシー・エスペラージ教授はBBCに対し、いじめる子供の親には、我が子の非を認めない人の方がずっと多いと話した。 「なのである意味、娘の行動を認めて受け入れているこの父親は、正しく反応している」 自分が何かすればそのせいで自分がいやな目に遭うと分かっていると、子供はあまり悪いことはしないものだと教授は言う。ただし、寒い中を歩かせる以外の方法の方が望ましいとも話す。 「ビデオにコメントを残した多くの人と同様、私もこのいじめについて原因をもっと知りたいと思う」 エスペラージ教授は、「いじめとその影響について、対話は継続しなくてはならない」と説明する。 「このたぐいの罰は一過性のもので、いじめを助長している学校やスクールバスのありかたそのものに向き合っていない」 コックスさんは地元メディアのニュース5クリーヴランドに対し、ビデオそのものやビデオに付いたコメントをカーステンさんやほかの子供2人に見せたと話した。 「悲しい内容の書き込みを子供たちと一緒に読んだ。とても共感していたようだ」 コックスさんはさらに、多くの親が「自分の子供の責任を認め、子供に責任をとらせるようになる」ことを願っていると加えた。 BBC読者の意見 BBCでは、コックスさんのしつけ方法をどう思うか、読者に意見を求めた。寄せられた意見は以下のとおり――。 （英語記事 Ohio dad makes girl walk miles to school for bullying on bus）", "text_zh": "据父亲说,女儿因在巴士上欺负其他学生而受到训斥,这已经是第二次了 卡斯滕(10岁)因欺凌行为受到学校责备,由于是第二次,被禁止乘坐校车3天。于是,父亲马特·考克斯决定教给女儿:在人生中什么才是重要的。 在一个寒冷的早晨,考克斯让女儿步行了去学校路程的一部分。他自己则开车跟在后面。 据当地电视台WTVG新闻报道,在卡斯滕被禁止乘坐校车的3天里,她分几次走完了总计8公里的路程。 考克斯3日在脸书上发布了第一天的视频。此后,视频已被播放超过1700万次,收到数万条评论。 考克斯在发布视频的同时写道:“这是人生的教训!! 最新消息:她学得很扎实! 手脚全都无恙,健康有活力。而且关于欺凌,她似乎改变了想法,也开始感谢那些原本以为理所当然的小事了。”他还加上了“让自己的孩子承担责任”、“停止欺凌”的话题标签。 在这段被大量转发的视频中,考克斯的女儿背着背包、拿着学习用品,沿着道路行走。室外气温是2度。 考克斯一边谈论权利和欺凌的问题,一边开车跟在后面。 “欺凌是不被允许的”、“欺凌要在我们家被制止。这是我为此采取的、属于我自己的小小方法”,考克斯在视频中这样说。 考克斯还指出,许多孩子认为,每天早上由汽车或巴士送去学校是理所当然的权利。 “不赞成我做法的家长想必很多。那没有关系。” “为了教育自己的女儿,也为了让女儿停止欺凌,我只是在做自己认为正确的事。” 考克斯5日更新了脸书,写道女儿切实领会了自己的教诲。据称,卡斯滕在这一天走完了8公里的最后一段。 卡斯滕对WTVG表示,自己也曾被人欺负过,通过这次的事学会了善待他人。 <相关报道> 考克斯的视频收到了约6.3万条以上的评论。其中许多是肯定性的,无论是欺凌一方孩子的家长,还是被欺凌孩子的家长,都对考克斯的管教表示感谢。 有评论写道:“我家患自闭症的孙子正被附近的孩子们欺负。作为他的祖父,我为你鼓掌! 什么都不做的家长太多了。” 也有人写道:“如果自己的孩子做了不可原谅的事,家长就应该拿出自己的时间,亲自让自己的孩子承担责任。要是有更多这样的家长就好了。” 而另一方面,也有意见认为这等同于父亲在欺负女儿:“把受罚的样子发到脸书上让她蒙羞,真是讽刺。” 还有人写道:“等一下。你的女儿欺负了别的孩子? 你把女儿的解释听完了吗? 会不会是这孩子自己被欺负了,因为做出反应才被学校发现的? 如果说当众羞辱就是惩罚,那女儿态度变坏也是没办法的吧?” 心理学研究者、熟悉青少年欺凌问题的美国佛罗里达大学多萝西·埃斯佩拉格教授对BBC表示,在欺凌方孩子的家长中,不承认自己孩子过错的人要多得多。 “所以从某种意义上说,承认并接受女儿行为的这位父亲,做出了正确的反应。” 教授说,孩子如果知道自己做了什么就会因此遭遇不愉快的后果,就不太会做坏事。不过她也表示,比起让孩子在寒冷中走路,其他方法更为可取。 “和许多在视频下留言的人一样,我也想更多地了解这起欺凌的原因。” 埃斯佩拉格教授解释说:“关于欺凌及其影响的对话,必须持续下去。” “这类惩罚只是一时性的,并没有直面助长欺凌的学校和校车本身的现状。” 考克斯对当地媒体“新闻5克利夫兰”表示,他把视频本身以及视频下的评论给卡斯滕和另外两个孩子看了。 “我和孩子们一起读了内容悲伤的留言。他们似乎非常感同身受。” 考克斯还补充说,希望有更多的家长“承认自己孩子的责任,并让孩子承担责任”。 BBC读者的意见 BBC就如何看待考克斯的管教方法征求了读者意见。收到的意见如下——。 (英文报道 Ohio dad makes girl walk miles to school for bullying on bus)", "reference_summary": "米オハイオ州スワントンの父親が、いじめの罰として10歳の娘を学校まで、合計8キロを数回に分けて歩かせた。父親がビデオを投稿したのを機に、このしつけ方法の是非が議論になっている。", "ref_zh": "美国俄亥俄州斯旺顿的一位父亲,作为对欺凌的惩罚,让10岁的女儿分几次走完总计8公里的上学路。以父亲发布视频为契机,这种管教方法的是非引发了争论。", "summaries": [{"summary_id": "features-and-analysis-46478194_381886c7", "summary": "米オハイオ州スワントンの父親が、いじめの罰として10歳の娘を学校まで、合計8キロを数回に分けて歩かせた。父親がビデオを投稿したのを機に、このしつけ方法の是非が議論になっている。", "zh": "美国俄亥俄州斯旺顿的一位父亲,作为对欺凌的惩罚,让10岁的女儿分几次走完总计8公里的上学路。以父亲发布视频为契机,这种管教方法的是非引发了争论。"}, {"summary_id": "features-and-analysis-46478194_67a2365c", "summary": "父親によると、娘がバスで他の生徒をいじめたと叱られたのはこれで2回目だった カーステンさん（10）は、いじめ行為を学校にとがめられ、2回目だったためスクールバスの利用を3日間禁止された。そこで父親のマット・コックスさんは、生きる上で何が大切なのかを娘に教えることにした。寒い日の朝、コックスさんは学校までの道のりの一部を娘に歩かせた。", "zh": "据父亲说,女儿因在巴士上欺负其他学生而受到训斥,这已经是第二次了 卡斯滕(10岁)因欺凌行为受到学校责备,由于是第二次,被禁止乘坐校车3天。于是,父亲马特·考克斯决定教给女儿:在人生中什么才是重要的。在一个寒冷的早晨,考克斯让女儿步行了去学校路程的一部分。"}, {"summary_id": "features-and-analysis-46478194_83f0bbbb", "summary": "父親がビデオを投稿したのを機に、このしつけ方法の是非が議論になっている。米オハイオ州スワントンの父親が、いじめの罰として10歳の娘を学校まで、合計8キロを数回に分けて歩かせた。", "zh": "以父亲发布视频为契机,这种管教方法的是非引发了争论。美国俄亥俄州斯旺顿的一位父亲,作为对欺凌的惩罚,让10岁的女儿分几次走完总计8公里的上学路。"}, {"summary_id": "features-and-analysis-46478194_d84463e5", "summary": "米オハイオ州の父親が、スクールバスで他の生徒をいじめたとして10歳の娘に学校まで約8キロを歩かせ、その様子を収めた動画をフェイスブックに投稿した。動画は1700万回以上再生され、しつけ方法として賛否が分かれる議論を呼んでいる。娘は自分もいじめられた経験があると語り、人に優しくすることを学んだと話した。", "zh": "美国俄亥俄州的一位父亲,以10岁的女儿在校车上欺负了其他学生为由,让她步行约8公里去学校,并把拍下这一情形的视频发布到了脸书上。视频被播放超过1700万次,作为管教方法引发了褒贬不一的争论。女儿表示自己也有被欺负的经历,称学会了善待他人。"}, {"summary_id": "features-and-analysis-46478194_fc95363c", "summary": "米オハイオ州の父親が、スクールバスで他の生徒をいじめたとして10歳の娘に学校まで約8キロを歩かせ、その様子を収めた動画をフェイスブックに投稿した。父親は後にテレビ番組に出演し、娘の学校側からもこのしつけ方法を称賛されたと語った。動画は1700万回以上再生され、親のしつけ方法として賛否が分かれる議論を呼んでいる。", "zh": "美国俄亥俄州的一位父亲,以10岁的女儿在校车上欺负了其他学生为由,让她步行约8公里去学校,并把拍下这一情形的视频发布到了脸书上。父亲后来出演电视节目,称女儿学校方面也对这种管教方法表示了赞赏。视频被播放超过1700万次,作为家长的管教方法引发了褒贬不一的争论。"}]}, {"article_id": "35647760", "url": "https://www.bbc.com/japanese/35647760", "title": "オバマ氏、グアンタナモ収容所の閉鎖計画を発表", "title_zh": "奥巴马宣布关闭关塔那摩收容所的计划", "text": "グアンタナモ収容所の閉鎖はオバマ大統領の目標のひとつだった 大統領は、いまだにグアンタナモに残るテロ容疑者91人を、それぞれの本国もしくは米国内の施設に移転したい考え。しかし連邦議会は、テロ容疑者を米本土で収容することに強い抵抗を示しており、政府提案を阻止する可能性が強い。 ホワイトハウスの計画の要点は次の通り――。 ・収容者91人のうち、特定の35人を外国に移送 ・残る収容者について、収容継続が必要か判断するため定期的に見直しを行う ・残る収容者の取り扱いについて、法的措置を活用し続ける ・外国に移送しない収容者を米国内の施設に移送するため、連邦議会と協力する グアンタナモは米国の安全保障を損なう＝オバマ氏 2002年以来780人を収容してきたグアンタナモ収容所の年間維持費は、4億4500万ドル（約500億円）に上るが、米政府は閉鎖によって、年間1億8000万ドル（約202億円）の経費が節約できるとしている。 大統領は報道陣を前に、収容所が米国の安全保障を損なうものだとの考えを示した。さらに、就任直後から収容所閉鎖を目標として掲げてきたオバマ氏は、来年1月に自分が退任後、この問題を後任の大統領に任せるべきでないという考えを示した。 「施設を使い続けるのは、我々の価値観と異なる。世界におけるこの国の立場を損なう。我々は法の支配の高い規範を尊重する国だが、（グアンタナモは）その経歴の汚点だとみられている」 「この国の歴史の章をひとつ閉じるための動きだ。この国が前進するにあたって指針となるべきことを、私たちは9・11以降学んできた。その学びを反映する動きとなる」と大統領は述べた。 しかし大統領選に共和党から出馬しているマーコ・ルビオ上院議員（フロリダ州選出）は、収容者は「文字通り、敵性戦闘員」であり、米国本土に入れるべきではないと痛烈に批判。自分ならば拘束したテロリストはただちにグアンタナモへ送り「何を知っているのか調べる」と述べた。 グアンタナモ収容所はキューバ南東部にある米海軍基地の敷地内にある。2001年9月11日の同時多発テロの後、米国攻撃を意図するテロ容疑者を収容するため、ブッシュ政権が開設した。 収容所については複数の人権団体や活動家が、収容者が起訴もされず審理を受けることもなく長期間拘束されている状況は、人権侵害にあたると批判を繰り返してきた。 ホワイトハウスは収容者名簿の公表を控えているが、米紙ニューヨーク・タイムズは独自の名簿を公表している。 オバマ氏の閉鎖計画は、米国内のどの施設に収容者を移送するのか明示していない。しかし国防総省はこれまで13カ所の施設を検討。コロラド、サウスカロライナ、キャンザス各州の計7カ所にある刑務所のほか、6カ所の米軍基地が候補に挙げられているという。 （英語記事 Guantanamo Bay: Obama in prison closure push）", "text_zh": "关闭关塔那摩收容所是奥巴马总统的目标之一 总统希望把至今仍留在关塔那摩的91名恐怖活动嫌疑人,移送到各自的本国或美国国内的设施。但联邦议会对在美国本土收容恐怖活动嫌疑人表现出强烈抵制,很有可能阻止政府提案。 白宫计划的要点如下——。 ・将91名被收容者中特定的35人移送至外国 ・对其余被收容者定期进行复查,以判断是否有必要继续收容 ・就其余被收容者的处理,继续运用法律措施 ・为把不移送外国的被收容者移送至美国国内的设施,与联邦议会合作 关塔那摩损害美国的安全保障=奥巴马 自2002年以来收容过780人的关塔那摩收容所,每年的维持费用高达4.45亿美元(约500亿日元),而美国政府称,通过关闭每年可节约1.8亿美元(约202亿日元)的经费。 总统在报道人员面前表示,收容所是损害美国安全保障的东西。此外,自就任后不久便把关闭收容所作为目标的奥巴马还表示,明年1月自己卸任后,不应把这一问题交给继任总统。 “继续使用这一设施,与我们的价值观不符。它损害这个国家在世界上的地位。我们是尊重法治这一高标准的国家,但(关塔那摩)被视为这份履历上的污点。” “这是为了合上这个国家历史中一个篇章的行动。这个国家在前进时应当以什么为指针,我们在9·11之后已经学到。这将是反映这些经验的行动。”总统这样说。 但代表共和党竞选总统的马尔科·鲁比奥参议员(佛罗里达州选出)痛烈批评称,被收容者“不折不扣是敌方战斗人员”,不应让他们进入美国本土。他表示,如果是自己,会把拘押的恐怖分子立即送往关塔那摩,“查明他们知道些什么”。 关塔那摩收容所位于古巴东南部美国海军基地的用地内。2001年9月11日的连环恐怖袭击之后,为收容企图袭击美国的恐怖活动嫌疑人,由布什政府开设。 关于这一收容所,多个人权团体和活动人士一再批评称,被收容者既未被起诉、也未经审理而遭长期拘押的状况,构成侵犯人权。 白宫没有公布被收容者名单,但美国报纸《纽约时报》公布了自行整理的名单。 奥巴马的关闭计划没有明示将把被收容者移送到美国国内的哪处设施。但国防部此前研究了13处设施。据称,除科罗拉多、南卡罗来纳、堪萨斯各州共计7处的监狱外,还有6处美军基地被列为候选。 (英文报道 Guantanamo Bay: Obama in prison closure push)", "reference_summary": "オバマ米大統領は23日、キューバにあるグアンタナモ米海軍基地の収容所を閉鎖する計画を、議会に提出したと発表した。オバマ大統領は就任から間もなく、グアンタナモ収容所を閉鎖する方針を表明していた。", "ref_zh": "美国总统奥巴马23日宣布,已向议会提交关闭位于古巴的关塔那摩美国海军基地收容所的计划。奥巴马总统在就任后不久,就曾表明关闭关塔那摩收容所的方针。", "summaries": [{"summary_id": "35647760_06a21c1e", "summary": "オバマ米大統領は23日、キューバにあるグアンタナモ米海軍基地の収容所を閉鎖する計画を連邦議会に提出したと発表した。国防総省は計画の一環として、フロリダ州マイアミの連邦刑務所を主要な移送先として正式指名した。オバマ氏は収容所が米国の安全保障と価値観を損なっているとし、任期満了前の解決を目指すと述べた。", "zh": "美国总统奥巴马23日宣布,已向联邦议会提交关闭位于古巴的关塔那摩美国海军基地收容所的计划。作为计划的一部分,国防部正式指定了佛罗里达州迈阿密的联邦监狱作为主要移送地点。奥巴马表示,收容所正在损害美国的安全保障和价值观,力争在任期届满前解决。"}, {"summary_id": "35647760_1ab002c6", "summary": "オバマ米大統領は23日、キューバにあるグアンタナモ米海軍基地の収容所を閉鎖する計画を連邦議会に提出したと発表した。残る91人のテロ容疑者を本国または米国内施設に移送する案だが、米本土での収容には議会が強く抵抗しており、阻止される可能性が強い。オバマ氏は収容所が米国の安全保障と価値観を損なっているとし、任期満了前の解決を目指すと述べた。", "zh": "美国总统奥巴马23日宣布,已向联邦议会提交关闭位于古巴的关塔那摩美国海军基地收容所的计划。方案是将剩余的91名恐怖活动嫌疑人移送至本国或美国国内设施,但议会对在美国本土收容强烈抵制,计划很有可能被阻止。奥巴马表示,收容所正在损害美国的安全保障和价值观,力争在任期届满前解决。"}, {"summary_id": "35647760_cfdbf473", "summary": "米ニューヨーク市で新型コロナウイルスとの戦いの最前線にいた医師が、自ら命を絶った。", "zh": "曾在美国纽约市站在抗击新型冠状病毒最前线的一名医生,自行结束了生命。"}, {"summary_id": "35647760_e08b3652", "summary": "オバマ米大統領は23日、キューバにあるグアンタナモ米海軍基地の収容所を閉鎖する計画を、議会に提出したと発表した。オバマ大統領は就任から間もなく、グアンタナモ収容所を閉鎖する方針を表明していた。", "zh": "美国总统奥巴马23日宣布,已向议会提交关闭位于古巴的关塔那摩美国海军基地收容所的计划。奥巴马总统在就任后不久,就曾表明关闭关塔那摩收容所的方针。"}, {"summary_id": "35647760_e293a04b", "summary": "グアンタナモ収容所の閉鎖はオバマ大統領の目標のひとつだった 大統領は、いまだにグアンタナモに残るテロ容疑者91人を、それぞれの本国もしくは米国内の施設に移転したい考え。しかし連邦議会は、テロ容疑者を米本土で収容することに強い抵抗を示しており、政府提案を阻止する可能性が強い。ホワイトハウスの計画の要点は次の通り――。", "zh": "关闭关塔那摩收容所是奥巴马总统的目标之一 总统希望把至今仍留在关塔那摩的91名恐怖活动嫌疑人,移送到各自的本国或美国国内的设施。但联邦议会对在美国本土收容恐怖活动嫌疑人表现出强烈抵制,很有可能阻止政府提案。白宫计划的要点如下——。"}]}, {"article_id": "46669858", "url": "https://www.bbc.com/japanese/46669858", "title": "インドネシア津波で人気バンド流される 生存メンバーが涙の報告", "title_zh": "印尼海啸中人气乐队被冲走 幸存成员含泪报告", "text": "津波が襲った当時、インドネシアの人気ロックバンド「セヴンティーン」はビーチで演奏していた。（左から）メンバーのアンディさん、リーフィアンさん、バニさん、ヘルマンさん インドネシアでは現在、大津波の警報が全くなかったことについて、大勢が振り返り、コメントしている。事前に察知する余裕がまったくないまま、大津波に襲われる悲劇を、このバンドが如実に象徴してしまっている。 津波が流れ込んでくる前には、テントのテーブルの周りに聴衆約200人が集まり、バンドの音楽にじっと聞き入っていた。しかし、大波の1つがテントを襲うと、歌声は叫び声へと変わった。現場の映像には、大勢が驚くほどの速度で流されていく様子が映っている。 ベーシスト、ギタリスト、マネージャーのバンドメンバー3人が死亡した。スタッフ1人も津波の犠牲になった。ドラマーは現在も行方不明のままだ。 バンドメンバーで生存が確認されているのは今のところ、リード・ボーカルのリーフィアン・ファジャルシャーさんのみだ。リーフィアンさんは自分のインスタグラムアカウントに、最新状況について感情をこめて投稿している。 ファジャルシャーさんは22日にインスタグラムへ投稿した動画で、「僕たちは（ベーシストの）バニと（マネージャーの）オキ・ウィジャヤを失った」と涙ながらに語った。 「私の妻ディランと（ギタリストの）ヘルマン、（ドラマーの）アンディ、（スタッフの）ウジャンがすぐに発見されるよう、どうか祈ってください」 1日後の23日、リーフィアンさんはインスタグラムに、新たな画像を投稿した。最新状況を伝えるもので、ヘルマンさんとウジャンさんの遺体が見つかったという内容だった。 リーフィアンさんは画像の説明文に「ヘルマンとウジャンよ、安らかに」、「アンディ、早く戻ってくれ。私1人だけが生き残っているんだ（中略）兄弟、お願いだ」と書いた。 リーフィアンさんの妻ディラン・サハラさんもまだ見つかっていない。 インスタグラムへの24日の投稿で、リーフィアンさんはディランさんについて「今日はあなたの誕生日だ。（会えることを）祈りたい」と語った。「早く戻ってくれ、ダーリン」。 ザックさんというスタッフの恐ろしい経験についても、大勢がコメントした。ザックさんは、インスタグラムの動画投稿機能「ストーリーズ」で、自分が水中でもがいていた様子を説明。波に流されたステージにしがみついて生き延びたという。 ジャワ島中部ジョグジャカルタ出身のセヴンティーンはインドネシアロック界で有名なバンドで、人気曲も多い。インドネシアの別の有名バンド、コタックでヴォーカルを担当するタントリさんなど、インドネシア音楽界の有名人からも、津波の犠牲となったバンドメンバーや関係者を追悼する声が上がった。 津波のあった22日夜、セヴンティーンはジャワ島西部タンジュンレスンのビーチで演奏していた。バンドはインドネシア国有電力会社（PLN）に雇われ、同社の忘年会で従業員とその家族約200人を前に演奏中だった。リーフィアンさんによると、津波が来たのはバンドが2曲を演奏したところだったという。 PLNは記者会見で、従業員や家族あわせて29人が死亡し、13人が行方不明になっていると発表した。 セヴンティーンはロイター通信への声明で、「海の間近に作ったステージを水が流し去った」と語った。 22日夜の津波で、スマトラ島とジャワ島の湾岸都市で少なくとも281人が死亡。1016人が負傷した。 噴火したアナククラカタウ島は、スマトラ島とジャワ島の間にあるスンダ海峡に位置する 火山島アナククラカタウの噴火により発生した地滑りが、津波を引き起こしたと考えられている。アナククラカタウ島は23日にも噴火しており、新たな津波が起こる恐れも出ている。 （英語記事 Indonesia tsunami: Rock band Seventeen swept away by waves）", "text_zh": "海啸袭来的当时,印度尼西亚人气摇滚乐队“Seventeen”正在海滩上演奏。(从左起)成员安迪、里芬、巴尼、赫尔曼 在印度尼西亚,目前许多人正在回顾并评论此次大海啸完全没有警报一事。在完全没有余地事先察觉的情况下遭大海啸袭击的悲剧,被这支乐队如实地象征了出来。 在海啸涌入之前,约200名听众聚集在帐篷的桌子周围,静静聆听着乐队的音乐。然而,当一个大浪袭击帐篷时,歌声变成了尖叫声。现场的影像中,拍到了众人以惊人的速度被冲走的情形。 贝斯手、吉他手、经纪人这3名乐队成员死亡。1名工作人员也成了海啸的牺牲者。鼓手目前仍然下落不明。 乐队成员中目前确认幸存的,只有主唱里芬·法贾尔沙一人。里芬在自己的Instagram账号上,饱含感情地发布着最新情况。 法贾尔沙在22日发布到Instagram的视频中含泪表示:“我们失去了(贝斯手)巴尼和(经纪人)奥基·维贾亚。” “请大家祈祷,愿我的妻子迪兰,以及(吉他手)赫尔曼、(鼓手)安迪、(工作人员)乌姜能尽快被找到。” 一天后的23日,里芬在Instagram上发布了新的图片。这是传达最新情况的内容:赫尔曼和乌姜的遗体已被找到。 里芬在图片的说明文字中写道:“赫尔曼、乌姜,安息吧”、“安迪,快回来。只有我一个人活了下来(中略)兄弟,求你了”。 里芬的妻子迪兰·萨哈拉也仍未被找到。 在24日发布到Instagram的帖子中,里芬谈到迪兰说:“今天是你的生日。我想祈祷(能见到你)。”“快回来吧,亲爱的。” 许多人还就一位名叫扎克的工作人员的可怕经历发表了评论。扎克通过Instagram的视频发布功能“快拍”(Stories),讲述了自己在水中挣扎的情形。据说他靠抓住被海浪冲走的舞台而得以幸存。 出身于爪哇岛中部日惹的Seventeen,是印度尼西亚摇滚界的知名乐队,拥有许多人气歌曲。印度尼西亚另一支知名乐队Kotak的主唱坦特里等印度尼西亚音乐界的名人,也纷纷发声,悼念在海啸中牺牲的乐队成员及相关人员。 发生海啸的22日晚,Seventeen正在爪哇岛西部丹绒勒松的海滩上演奏。乐队受印度尼西亚国有电力公司(PLN)雇用,正在该公司的忘年会上,面向约200名员工及其家属进行演奏。据里芬说,海啸袭来时,乐队刚演奏完两首曲子。 PLN在记者会上宣布,员工和家属合计29人死亡,13人下落不明。 Seventeen在致路透社的声明中表示:“建在紧邻大海之处的舞台被水冲走了。” 在22日晚的海啸中,苏门答腊岛和爪哇岛的湾岸城市至少281人死亡,1016人受伤。 喷发的喀拉喀托之子岛位于苏门答腊岛与爪哇岛之间的巽他海峡 火山岛喀拉喀托之子喷发引发的山体滑坡,被认为引起了此次海啸。喀拉喀托之子岛23日再次喷发,出现了发生新海啸的隐患。 (英文报道 Indonesia tsunami: Rock band Seventeen swept away by waves)", "reference_summary": "インドネシアで22日発生した津波のため、これまでに少なくとも死者281人、負傷者1016人が確認されている ほか、行方不明者も出ている。インドネシアの人気ロックバンド「セヴンティーン」はこの日、ジャワ島西部タンジュンレスンのビーチに建てたテント内でライブ演奏中だった。津波がテントを襲うと、バンドメンバーは流されてしまった。", "ref_zh": "印度尼西亚22日发生的海啸,截至目前已确认至少281人死亡、1016人受伤 此外,还有人下落不明。印度尼西亚人气摇滚乐队“Seventeen”当天正在爪哇岛西部丹绒勒松海滩上搭建的帐篷内进行现场演奏。海啸袭击帐篷后,乐队成员被冲走了。", "summaries": [{"summary_id": "46669858_040576b7", "summary": "22日夜にインドネシアで発生した津波で、ジャワ島西部のビーチで演奏中だった人気ロックバンド「セヴンティーン」のメンバー3人とスタッフ1人が死亡し、ドラマーは依然行方不明となっている。", "zh": "在22日夜间印度尼西亚发生的海啸中,正在爪哇岛西部海滩上演奏的人气摇滚乐队“Seventeen”的3名成员和1名工作人员死亡,鼓手依然下落不明。"}, {"summary_id": "46669858_592c0e2f", "summary": "22日夜にインドネシアで発生した津波で、ジャワ島西部のビーチで演奏中だった人気ロックバンド「セヴンティーン」のメンバー5人全員が死亡した。インドネシア政府は国家非常事態を宣言し、軍主導の大規模救援活動を開始している。", "zh": "在22日夜间印度尼西亚发生的海啸中,正在爪哇岛西部海滩上演奏的人气摇滚乐队“Seventeen”的全部5名成员死亡。印度尼西亚政府宣布国家进入紧急状态,已开始由军方主导的大规模救援行动。"}, {"summary_id": "46669858_5fcda3e1", "summary": "インドネシアで22日発生した津波のため、これまでに少なくとも死者281人、負傷者1016人が確認されている ほか、行方不明者も出ている。インドネシアの人気ロックバンド「セヴンティ", "zh": "印度尼西亚22日发生的海啸,截至目前已确认至少281人死亡、1016人受伤 此外,还有人下落不明。印度尼西亚的人气摇滚乐队“Seventee"}, {"summary_id": "46669858_c2275577", "summary": "津波が襲った当時、インドネシアの人気ロックバンド「セヴンティーン」はビーチで演奏していた。（左から）メンバーのアンディさん、リーフィアンさん、バニさん、ヘルマンさん インドネシアでは現在、大津波の警報が全くなかったことについて、大勢が振り返り、コメントしている。事前に察知する余裕がまったくないまま、大津波に襲われる悲劇を、このバンドが如実に象徴してしまっている。", "zh": "海啸袭来的当时,印度尼西亚人气摇滚乐队“Seventeen”正在海滩上演奏。(从左起)成员安迪、里芬、巴尼、赫尔曼 在印度尼西亚,目前许多人正在回顾并评论此次大海啸完全没有警报一事。在完全没有余地事先察觉的情况下遭大海啸袭击的悲剧,被这支乐队如实地象征了出来。"}, {"summary_id": "46669858_d3c56cc2", "summary": "インドネシアで22日発生した津波のため、これまでに少なくとも死者281人、負傷者1016人が確認されている ほか、行方不明者も出ている。インドネシアの人気ロックバンド「セヴンティーン」はこの日、ジャワ島西部タンジュンレスンのビーチに建てたテント内でライブ演奏中だった。津波がテントを襲うと、バンドメンバーは流されてしまった。", "zh": "印度尼西亚22日发生的海啸,截至目前已确认至少281人死亡、1016人受伤 此外,还有人下落不明。印度尼西亚人气摇滚乐队“Seventeen”当天正在爪哇岛西部丹绒勒松海滩上搭建的帐篷内进行现场演奏。海啸袭击帐篷后,乐队成员被冲走了。"}]}, {"article_id": "46601033", "url": "https://www.bbc.com/japanese/46601033", "title": "ホームレスの人たちにクリスマス・ステイを……予約断るホテルと受けるホテル", "title_zh": "让无家可归者过圣诞住宿……拒绝预订的酒店与接纳的酒店", "text": "プロジェクトに参加する28人のホームレスの人は当初、市内のロイヤル・ホテルに泊まる予定だったが、ホテル側が宿泊を拒否し、批判を浴びた。 その後、ダブルツリー・ヒルトンがクリスマス・ディナー付きでホームレスを受け入れると申し出た。主催者のカール・シンプソンさんは「奇跡はあり得る」と話している。 一方のロイヤル・ホテルは、昨年のこの企画ではアイビス・ホテルの客室に破損があったという報告を受けて、受け入れを拒否したと話した。 企画の主催団体「Raise the Roof Hull Homeless Project（ハルのホームレスに屋根を）」は、この疑惑は「うそ」だと批判。アイビス・ホテルも否定している。 シンプソンさんはBBCの取材に対し、グループは当初、計1092ポンド（約15万5000円）でツインルーム14室を予約し、昨年のアイビス・ホテルでの成功を生かしたいと考えていたと話した。 ロイヤル・ホテルは当初、予約を受け付けたし、シンプソンさんは予約する際に、泊まるのはホームレスの人たちだと特に隠し立てしなかったという。 「フロントの人に、泊まるのはホームレスの人たちだと話した。それについては問題ないようだった」 ロイヤル・ホテルの広報担当者は、「かつてこのプロジェクトで働いていた人物」から予約を受けないよう警告されたと説明した。 シンプソン氏は昨年のクリスマスイブとクリスマス、28人のホームレスのためにホテルの宿泊を手配した 「去年この慈善活動に参加した女性から電話を受けた」と、広報担当者は話した。「このグループが昨年アイビス・ホテルで大変な問題を起こしたため、予約を受けないほうがいいと言われた」 「昨年の問題というのは部屋をめちゃくちゃにしたり、火事、備品の盗難、器物損壊などだった」 「当ホテルはクリスマス期間中、たくさんの家族連れやツアー客を受け入れているため、この期間にこの予約を受けると被害につながると感じた」 広報担当者は、ホテル側は条件付きなら予約を復活させることもできると付け加えた。 一方、アイビス・ホテルはBBCに対し、昨年被害があったとは認識していないと話した。 アイビス・ホテルは声明で、「我々は確かに昨年のクリスマスに2泊、この慈善団体の予約でホームレスのグループを喜んでお迎えしました。主催者はこの企画は成功だったと感じています。このお客様方が火事や盗難といった深刻な問題を起こしたといわれていますが、我々はそう認識していません」と述べている。 昨年にこの企画でアイビス・ホテルに宿泊した男性はBBCの取材に、「最高のクリスマス・プレゼントだった。たった1日でも道端で眠らずにすんだのはとても安心できた」と語った。 「奇跡は実は起きる」 ハルのホームレスの人々は、クリスマスを屋根の下で過ごせることを楽しみにしている シンプソン氏は15日夕、フェイスブックでロイヤル・ホテルが予約を取り消したことを明らかにした。 この投稿は1500人以上の人々にシェアされ、「Raise the Roof Homeless Project」には9000ポンド以上の寄付金が集まった。 プロジェクトは17日の声明で、ダブルツリー・ヒルトンが28人分の2日間の宿泊と朝食、クリスマスディナーを無料で提供すると連絡してきたことを発表した。また、ロイヤル・ホテルが予約の復活を提案してきたが、これを拒否したことも明らかにした。 「予想外の、素晴らしい額を寄付していただいた。ホームレス支援にどう使うのがベストか、来年になってから会議で決めたいと思う」 （筆者：ヴィクトリア・パーク、UGC&ソーシャルニュース） （英語記事 Hotel steps in to give rooms to homeless）", "text_zh": "参加该项目的28名无家可归者原定入住市内的皇家酒店，但酒店方面拒绝其入住，招致批评。 此后，希尔顿逸林酒店提出愿意接纳无家可归者，并提供圣诞晚餐。主办者卡尔·辛普森表示：“奇迹是可能发生的”。 另一方面，皇家酒店表示，其拒绝接纳是因为收到报告称，在去年的这一企划中，宜必思酒店的客房曾遭到损坏。 企划主办团体“Raise the Roof Hull Homeless Project（为赫尔的无家可归者撑起屋顶）”批评这一指控是“谎言”。宜必思酒店也予以否认。 辛普森在接受BBC采访时表示，该团体最初以总计1092英镑（约合15.5万日元）预订了14间双床房，希望延续去年在宜必思酒店取得的成功。 据称，皇家酒店起初接受了预订，辛普森在预订时也并未刻意隐瞒入住者是无家可归者。 “我告诉前台的人，入住的是无家可归的人。对方对此似乎没有意见。” 皇家酒店的发言人解释说，酒店收到“曾在这个项目工作过的人士”的警告，让他们不要接受这一预订。 辛普森在去年的平安夜和圣诞节，为28名无家可归者安排了酒店住宿。 “我们接到了一位去年参加过这项慈善活动的女性打来的电话，”发言人说。“对方说这个团体去年在宜必思酒店惹出了很大的麻烦，所以最好不要接受预订。” “所谓去年的问题，包括把房间弄得一团糟、火灾、备品失窃、器物损坏等。” “本酒店在圣诞期间接待大量家庭游客和旅行团客人，因此我们觉得在这一期间接受这一预订会导致损失。” 发言人补充说，如果附加条件，酒店方面也可以恢复预订。 另一方面，宜必思酒店向BBC表示，并不认为去年发生过损失。 宜必思酒店在声明中表示：“我们确实在去年圣诞节通过这家慈善团体的预订，愉快地接待了无家可归者团体入住两晚。主办方认为这次企划是成功的。虽然有人说这些客人造成了火灾、盗窃等严重问题，但我们并不这样认为。” 去年通过这一企划入住宜必思酒店的一名男性在接受BBC采访时说：“这是最棒的圣诞礼物。哪怕只有一天不用睡在路边，也让人感到非常安心。” “奇迹真的会发生” 赫尔的无家可归者们期待着能在屋檐下度过圣诞节 辛普森15日傍晚在脸书上公开了皇家酒店取消预订的消息。 这一帖子被1500多人分享，“Raise the Roof Homeless Project”收到了9000多英镑的捐款。 该项目在17日的声明中宣布，希尔顿逸林酒店联系他们，表示将免费提供28人两天的住宿、早餐和圣诞晚餐。声明还透露，皇家酒店曾提议恢复预订，但被拒绝了。 “我们收到了出乎意料的、了不起数额的捐款。至于如何使用才最有利于帮助无家可归者，我们打算等到明年开会决定。” （作者：维多利亚·帕克，UGC与社交新闻） （英文报道 Hotel steps in to give rooms to homeless）", "reference_summary": "イングランド北東部の街ハルで持ち上がった、クリスマスにホームレスの人々をホテルに招待しようという企画が物議をかもしている。", "ref_zh": "在英格兰东北部城市赫尔发起的一项圣诞节邀请无家可归者入住酒店的企划，引发了争议。", "summaries": [{"summary_id": "46601033_0845c743", "summary": "イングランド北東部の街ハルで持ち上がった、クリスマスにホームレスの人々をホテルに招待しようという企画が物議をかもしている。", "zh": "在英格兰东北部城市赫尔发起的一项圣诞节邀请无家可归者入住酒店的企划，引发了争议。"}, {"summary_id": "46601033_9dc8f17b", "summary": "イングランド北東部の街ハルで持ち上がった、クリスマスにホームレスの人々をホテルに招待しようという企画が物議をかもしている。", "zh": "在英格兰东北部城市赫尔发起的一项圣诞节邀请无家可归者入住酒店的企划，引发了争议。"}, {"summary_id": "46601033_bbab625f", "summary": "英国ハルでクリスマスにホームレスを無料で宿泊させる企画をめぐり、ロイヤル・ホテルが予約を拒否して批判を浴びた。市議会は同ホテルに対し事業ライセンスの一時停止処分を下した。ヒルトン系列のダブルツリー・ヒルトンが28人分2日間の宿泊とディナーを無料で提供すると申し出た。", "zh": "围绕英国赫尔一项圣诞节让无家可归者免费住宿的企划，皇家酒店拒绝预订，招致批评。市议会对该酒店作出了暂停营业执照的处分。希尔顿系列的希尔顿逸林酒店提出免费提供28人两天的住宿和晚餐。"}, {"summary_id": "46601033_e8bfdc85", "summary": "英国ハルでクリスマスにホームレスを無料で宿泊させる企画をめぐり、当初予約を受け付けたロイヤル・ホテルが後に拒否し批判を浴びた。代わりにダブルツリー・ヒルトンが28人分2日間の宿泊と食事を無料で提供すると申し出て、企画は存続することとなった。事件をきっかけに慈善団体には9000ポンド以上の寄付が集まった。", "zh": "围绕英国赫尔一项圣诞节让无家可归者免费住宿的企划，最初接受了预订的皇家酒店后来予以拒绝，招致批评。作为替代，希尔顿逸林酒店提出免费提供28人两天的住宿和餐食，企划得以延续。以这一事件为契机，慈善团体收到了9000多英镑的捐款。"}, {"summary_id": "46601033_f36934a6", "summary": "プロジェクトに参加する28人のホームレスの人は当初、市内のロイヤル・ホテルに泊まる予定だったが、ホテル側が宿泊を拒否し、批判を浴びた。その後、ダブルツリー・ヒルトンがクリスマス・ディナー付きでホームレスを受け入れると申し出た。主催者のカール・シンプソンさんは「奇跡はあり得る」と話している。", "zh": "参加该项目的28名无家可归者原定入住市内的皇家酒店，但酒店方面拒绝其入住，招致批评。此后，希尔顿逸林酒店提出愿意接纳无家可归者，并提供圣诞晚餐。主办者卡尔·辛普森表示：“奇迹是可能发生的”。"}]}, {"article_id": "43284438", "url": "https://www.bbc.com/japanese/43284438", "title": "「シェイプ・オブ・ウォーター」米アカデミー賞4部門受賞 作品賞と監督賞", "title_zh": "《水形物语》获美国奥斯卡奖4个奖项 最佳影片奖和最佳导演奖", "text": "「シェイプ・オブ・ウォーター」の受賞を喜ぶギレルモ・デル・トロ監督（中央）や出演者たち 登壇した受賞者やプレゼンターの大勢が、女性や少数民族、性的少数者などあらゆる人の包摂と権利実現の重要性を繰り返し強調した。「スリー・ビルボード」で主演女優賞を獲得したフランセス・マクドーマンド氏は受賞スピーチで、女性の候補者全員に立つよう促し、自分たちには「語りたい物語」や「資金が必要な企画」があると、女性が作り手となる作品の重要性を訴えた。 英国からは、「Darkest Hour」（邦題「ウィンストン・チャーチル ヒトラーから世界を救った男」）のギャリー・オールドマン氏が、チャーチル英首相役で主演男優賞を獲得。初受賞のオールドマン氏は受賞スピーチで大勢に感謝した上で、98歳になる母親の愛と応援に感謝し、「やかんを火にかけて。オスカーを連れて帰るから」と語りかけた。 様々な少数者差別の横行する冷戦下の米国を舞台に、発話障害のある清掃係の女性と、水中で生きる捕らわれの生き物との恋愛を描いた「シェイプ・オブ・ウォーター」は、作品賞と監督賞のほか、美術賞と音楽賞を獲得した。 マクドーマンド氏は他の女性候補たちに起立を促し、「私たちには語りたい物語がある」とスピーチした 昨年の授賞式で作品賞を間違って発表する羽目になったウォーレン・ベイティ、フェイ・ダナウェイ両氏が今年も出演し、作品賞を発表した。「シェイプ・オブ・ウォーター」のほか「スリー・ビルボード」や、リベラルの隠れた人種差別を痛烈に風刺した「ゲット・アウト」も有力視されていた。 デル・トロ監督は、ベイティ氏が手にした封筒の中身を手にして確かに自分の作品が受賞したのだと確認し、会場の笑いを誘った。受賞スピーチでは、「私は移民です」と切り出し、「私たちの芸術とこの業界がやることで最も素晴らしいのは、砂に引かれた線を消すことです。線をもっと深く刻めと世界に言われるときこそ、私たちは引き続き線を消していくべきです」と述べた。 主演女優賞に名前が呼ばれ大歓声を浴びたマクドーマンド氏は、いったん手にしたオスカー像を床に置き、会場の女性候補たちに立ち上がるよう促した。その上で、会場の映画製作会社幹部に「皆さん、まわりを見回して。私たちには語りたい物語があって、資金が必要な企画があるのだから。今晩の色々なパーティーで私たちにその話をするのでなく、数日後に私たちをオフィスに招いてください。それか、私たちのオフィスに来てください。どちらでもそちらの都合のいい方で。その時に、いくらでもお話しますから」と呼びかけた。 昨年秋に発覚した大物プロデューサー、ハービー・ワインスティーン氏による長年の性的加害行動疑惑を機に、ハリウッドは少数者の権利実現をめぐり揺れてきた。その中で注目の主演女優賞を得たマクドーマンド氏は、「今晩言い残したい単語は2つ、inclusion rider です」（キャストやスタッフの多様性確保を条件とする付帯的な契約条項）と言明した。 舞台裏でマクドーマンド氏は、「inclusion rider」（包摂条項）で俳優は、作品のキャストとスタッフの人種・性別などの構成を少なくとも50％は多様なものにするよう契約の上で要求することができると説明した。 「私たちはもう後戻りしない」とマクドーマンド氏は言い、「女性がトレンド入りしてるっていうその発想がそのものが。いいえ、トレンドじゃない。アフリカ系米国人がトレンド入り？ いいえ、トレンドじゃない。今から変わります。そこに包摂条項が関わってくることになると思う」と強調した。 左から、「スリー・ビルボード」で助演男優賞のサム・ロックウェル氏、同映画で主演女優賞のマクドーマンド氏、「I, Tonya」で助演女優賞のアリソン・ジャニー氏、「ウィンストンチャーチル」で主演男優賞のオールドマン氏 自分も主演女優賞候補だったメリル・ストリープ氏（左）がマクドーマンド氏の受賞を喜んだ オールドマン氏は母親に「やかんをかけて。オスカーを連れて帰るよ」と呼びかけた マクドーマンド氏は「スリー・ビルボード」で、強姦され殺害された娘の事件を捜査しない警察と対立する母親を演じた。1997年の「ファーゴ」に続いて2度目のオスカー主演女優賞となった。 主演女優賞を発表したジェニファー・ローレンス氏は、「ハリウッドで新しい日が始まります。私たち全員の前に、新しい色々な挑戦が待ち受けています。けれども私たちは先人を決して忘れません。私の世代や未来の世代に向けて、道を切り開いた人たちを」と述べた。 授賞式では、性的暴力被害への連帯を示す「#MeToo（私も）」運動や、映画界における性的加害行動撲滅運動「Time's Up（もう時間切れ）」をアシュリー・ジャド、アナベラ・シオーラ、サルマ・ハイエク各氏が紹介する箇所もあった。3人とも、ワインスティーン氏非難に名乗りを上げている。 「新しい声や今までと違う声、自分たちの声がまとまって強力な大合唱になり、ついに『Time's up』と告げている。私たちが目にしてきた変化は、その大合唱が原動力となっている」とジャドさんは話した。 授賞式を司会した人気トークショー司会者のジミー・キメル氏は冒頭で、「ハービー（・ワインスティーン氏）に起きてることや、あちこちで起きてることは、もうずっと遅すぎたくらいだ」と切り出し、「不品行をこれ以上、なかったことにはできない。世界に見られているんだ」と述べた。 映画界における性的加害行動撲滅運動「Time's Up」を紹介する（左から）アシュリー・ジャド、アナベラ・シオーラ、サルマ・ハイエク各氏 「ゲット・アウト」のジョーダン・ピール監督（右）の受賞を祝う主演のダニエル・カルーヤ氏 作品賞や監督賞、主演男優賞候補だった「ゲット・アウト」は、脚本を書いたジョーダン・ピール監督が、脚本賞に選ばれた。アフリカ系の候補が同賞を受賞するのは初めてで、ピール監督はハリウッドにとって「ルネッサンス（再生）」の時だと称えた。 「全ジャンルの最高の映画がどれも、仲間の黒人監督によって生み出されているようで、その動きの始まりに立ち会えて誇らしい」とピール監督は述べた。 女性監督作品で注目された「レディ・バード」や、スティーブン・スピルバーグ監督の「The Post 」（邦題「ペンタゴン・ペーパーズ」）は受賞を逃した。 助演女優賞は、人気テレビドラマ「The West Wing」（邦題「ザ・ホワイトハウス」）で知られるアリソン・ジャニー氏が、フィギュアスケートのナンシー・ケリガン選手襲撃で有罪となったトーニャ・ハーディング選手を描く「I, Tonya」で受賞。助演男優賞は、「スリー・ビルボード」で人種差別を重ねる警官を演じた、サム・ロックウェル氏が受賞した。 「眺めのいい部屋」、「ハワーズ・エンド」、「日の名残り」など数々の映画で知られるジェイムズ・アイボリー監督は、「君の名前で僕を呼んで」で脚色賞を受賞した。89歳のアイボリー氏は過去昨年長の受賞者で、1929年5月の第1回授賞式より早い1928年6月生まれ。 米プロバスケットボールNBAのスター選手だったコービー・ブライアント氏は、短編アニメ「Dear Basketball」で受賞した。 撮影賞に14回ノミネートされたロジャー・ディーキンス氏は、「ブレードランナー2049」でついに初受賞を果たした。 （英語記事 Oscars 2018: The Shape of Water and Frances McDormand rule）", "text_zh": "为《水形物语》获奖而欢欣的吉列尔莫·德尔·托罗导演（中央）及演员们 登台的众多获奖者和颁奖嘉宾反复强调了实现女性、少数族裔、性少数群体等所有人的包容与权利的重要性。凭借《三块广告牌》获得最佳女主角奖的弗朗西丝·麦克多蒙德在获奖感言中，呼吁全体女性入围者起立，并称她们有“想讲述的故事”和“需要资金的企划”，诉说了由女性担任创作者的作品的重要性。 来自英国的加里·奥德曼凭借在《Darkest Hour》（日文片名《温斯顿·丘吉尔 从希特勒手中拯救世界的男人》）中饰演英国首相丘吉尔一角，获得最佳男主角奖。首次获奖的奥德曼在获奖感言中向众人致谢之后，感谢了98岁母亲的爱与支持，并对她说：“把水壶烧上吧。我要把奥斯卡带回家了。” 以各种针对少数群体的歧视横行的冷战时期美国为舞台、描绘一名有言语障碍的清洁女工与一只被囚禁的水中生物之间恋爱的《水形物语》，除最佳影片奖和最佳导演奖外，还获得了艺术指导奖和配乐奖。 麦克多蒙德呼吁其他女性入围者起立，并在致辞中说“我们有想讲述的故事” 在去年颁奖礼上误报最佳影片奖的沃伦·比蒂和费·唐纳薇两人今年再次登台，颁发了最佳影片奖。除《水形物语》外，《三块广告牌》以及辛辣讽刺自由派隐性种族歧视的《逃出绝命镇》也曾被看好。 德尔·托罗导演拿过比蒂手中信封里的内容，确认获奖的确实是自己的作品，引来全场笑声。他在获奖感言中以“我是移民”开场，表示：“我们的艺术和这个行业所做的最了不起的事，就是抹去画在沙上的线。当世界要求我们把线刻得更深时，我们更应该继续把线抹去。” 被念到最佳女主角奖的名字、赢得热烈欢呼的麦克多蒙德，把刚拿到手的奥斯卡小金人放在地上，呼吁会场里的女性入围者们站起来。随后，她向在场的电影制作公司高管们喊话：“各位，请环顾四周。因为我们有想讲述的故事，有需要资金的企划。请不要在今晚的各种派对上跟我们谈这些，而是过几天把我们请到办公室。或者，到我们的办公室来。哪边方便就哪边。到时候，我们可以跟你们谈多久都行。” 以去年秋天曝光的大牌制片人哈维·韦恩斯坦多年性加害行为疑云为契机，好莱坞围绕少数群体权利的实现一直动荡不安。在此之中获得备受瞩目的最佳女主角奖的麦克多蒙德明确表示：“今晚我想留下的词有两个，inclusion rider”（以确保演职人员多样性为条件的附加合同条款）。 在后台，麦克多蒙德解释说，通过“inclusion rider”（包容条款），演员可以在合同上要求作品的演员和工作人员在种族、性别等构成上至少有50%的多样性。 “我们再也不会走回头路了，”麦克多蒙德说，“‘女性正在成为潮流’这种想法本身就……不，这不是潮流。非裔美国人成为潮流？不，这不是潮流。从现在开始就会改变。我认为包容条款将会参与其中。” 左起：凭《三块广告牌》获最佳男配角奖的萨姆·洛克威尔、凭同片获最佳女主角奖的麦克多蒙德、凭《I, Tonya》获最佳女配角奖的艾莉森·珍妮、凭《温斯顿·丘吉尔》获最佳男主角奖的奥德曼 同为最佳女主角奖候选人的梅丽尔·斯特里普（左）为麦克多蒙德的获奖感到高兴 奥德曼对母亲喊话：“把水壶烧上。我要把奥斯卡带回家了” 麦克多蒙德在《三块广告牌》中饰演一位与不调查女儿被强奸杀害一案的警方对立的母亲。继1997年的《冰血暴》之后，这是她第二次获得奥斯卡最佳女主角奖。 颁发最佳女主角奖的詹妮弗·劳伦斯表示：“好莱坞新的一天开始了。各种新的挑战正等在我们所有人面前。但我们绝不会忘记先行者们。那些为我的世代和未来世代开辟道路的人们。” 颁奖礼上还有阿什莉·贾德、安娜贝拉·莎拉、萨尔玛·海耶克三人介绍声援性暴力受害者的“#MeToo（我也是）”运动，以及电影界杜绝性加害行为的“Time's Up（时间到了）”运动的环节。三人都公开站出来谴责了韦恩斯坦。 “新的声音、与以往不同的声音、我们自己的声音汇聚成强大的大合唱，终于宣告‘Time's up’。我们所目睹的变化，正是以这大合唱为原动力，”贾德说。 主持颁奖礼的人气脱口秀主持人吉米·基梅尔在开场时说：“发生在哈维（·韦恩斯坦）身上的事，以及各处正在发生的事，早就该发生了，甚至已经太迟了。”“不端行为再也不能被当作没发生过。全世界都在看着。” 介绍电影界杜绝性加害行为运动“Time's Up”的（左起）阿什莉·贾德、安娜贝拉·莎拉、萨尔玛·海耶克 为《逃出绝命镇》乔丹·皮尔导演（右）的获奖庆祝的主演丹尼尔·卡卢亚 曾入围最佳影片奖、最佳导演奖和最佳男主角奖的《逃出绝命镇》，由撰写剧本的乔丹·皮尔导演获得了最佳原创剧本奖。非裔候选人获得该奖尚属首次，皮尔导演称这是好莱坞的“文艺复兴（重生）”时刻。 “各个类型的最佳电影似乎都出自黑人导演同伴之手，能在这一运动的开端在场，我感到自豪，”皮尔导演说。 因是女性导演作品而备受关注的《伯德小姐》，以及史蒂文·斯皮尔伯格导演的《The Post》（日文片名《五角大楼文件》）与奖项无缘。 最佳女配角奖由因人气电视剧《The West Wing》（日文片名《白宫群英》）而知名的艾莉森·珍妮，凭描绘因袭击花样滑冰选手南希·克里根而被判有罪的托尼娅·哈丁选手的《I, Tonya》获得。最佳男配角奖由在《三块广告牌》中饰演屡屡进行种族歧视的警察的萨姆·洛克威尔获得。 以《看得见风景的房间》《霍华德庄园》《长日将尽》等众多电影闻名的詹姆斯·艾沃里导演，凭《请以你的名字呼唤我》获得最佳改编剧本奖。89岁的艾沃里是历来最年长的获奖者，出生于1928年6月，早于1929年5月举行的第一届颁奖礼。 曾是美国职业篮球NBA明星球员的科比·布莱恩特凭短篇动画《Dear Basketball》获奖。 曾14次入围最佳摄影奖的罗杰·迪金斯，凭《银翼杀手2049》终于首次获奖。 （英文报道 Oscars 2018: The Shape of Water and Frances McDormand rule）", "reference_summary": "米映画芸術科学アカデミーは4日、ロサンゼルスで第90回アカデミー賞授賞式を開いた。最多13部門で候補になっていたギレルモ・デル・トロ監督のファンタジーロマンス「シェイプ・オブ・ウォーター」が、作品賞と監督賞を含む4部門で受賞した。", "ref_zh": "美国电影艺术与科学学院4日在洛杉矶举行了第90届奥斯卡颁奖典礼。获得最多13项提名的吉列尔莫·德尔·托罗导演的奇幻爱情片《水形物语》，获得包括最佳影片奖和最佳导演奖在内的4个奖项。", "summaries": [{"summary_id": "43284438_3421991d", "summary": "「シェイプ・オブ・ウォーター」の受賞を喜ぶギレルモ・デル・トロ監督（中央）や出演者たち 登壇した受賞者やプレゼンターの大勢が、女性や少数民族、性的少数者などあらゆる人の包摂と権利実現の重要性を繰り返し強調した。「スリー・ビルボード」で主演女優賞を獲得したフランセス・マクドーマンド氏は受賞スピーチで、女性の候補者全員に立つよう促し、自分たちには「語りたい物語」や「資金が必要な企画」があると、女性が作り手となる作品の重要性を訴えた。英国からは、「Darkest Hour」（邦題「ウィンストン・チャーチル ヒトラーから世界を救った男」）のギャリー・オールドマン氏が、チャーチル英首相役で主演男優賞を獲得。", "zh": "为《水形物语》获奖而欢欣的吉列尔莫·德尔·托罗导演（中央）及演员们 登台的众多获奖者和颁奖嘉宾反复强调了实现女性、少数族裔、性少数群体等所有人的包容与权利的重要性。凭借《三块广告牌》获得最佳女主角奖的弗朗西丝·麦克多蒙德在获奖感言中，呼吁全体女性入围者起立，并称她们有“想讲述的故事”和“需要资金的企划”，诉说了由女性担任创作者的作品的重要性。来自英国的加里·奥德曼凭借在《Darkest Hour》（日文片名《温斯顿·丘吉尔 从希特勒手中拯救世界的男人》）中饰演英国首相丘吉尔一角，获得最佳男主角奖。"}, {"summary_id": "43284438_4ebb7ef8", "summary": "米映画芸術科学アカデミーは4日、ロサンゼルスで第90回アカデミー賞授賞式を開いた。最多13部門で候補になっていたギレルモ・デル・トロ監督のファンタジーロマンス「シェイプ・オブ・ウォーター」が、作品賞と監督賞を含む4部門で受賞した。", "zh": "美国电影艺术与科学学院4日在洛杉矶举行了第90届奥斯卡颁奖典礼。获得最多13项提名的吉列尔莫·德尔·托罗导演的奇幻爱情片《水形物语》，获得包括最佳影片奖和最佳导演奖在内的4个奖项。"}, {"summary_id": "43284438_60078c2b", "summary": "ギレルモ・デル・トロ監督のファンタジー「シェイプ・オブ・ウォーター」が4日の米アカデミー賞授賞式で作品賞と監督賞を含む4部門を受賞した。「スリー・ビルボード」のフランセス・マクドーマンド氏が主演女優賞、「ウィンストン・チャーチル」のギャリー・オールドマン氏が主演男優賞を獲得した。受賞者やプレゼンターは、女性や少数民族の包摂や「#MeToo」運動への連帯を繰り返し強調した。", "zh": "吉列尔莫·德尔·托罗导演的奇幻片《水形物语》在4日的美国奥斯卡颁奖典礼上，获得包括最佳影片奖和最佳导演奖在内的4个奖项。《三块广告牌》的弗朗西丝·麦克多蒙德获得最佳女主角奖，《温斯顿·丘吉尔》的加里·奥德曼获得最佳男主角奖。获奖者和颁奖嘉宾反复强调了对女性和少数族裔的包容，以及对“#MeToo”运动的声援。"}, {"summary_id": "43284438_ab76c193", "summary": "ヨーグルトというと健康的な食べ物と思われがちだが、実は多くの場合、砂糖が豊富に含まれている。そのため消費者は、健康的なものを食べていると勘違いしない方がいい、と科学者は警告している。", "zh": "说到酸奶，人们往往认为它是健康食品，但实际上多数情况下富含砂糖。因此科学家警告说，消费者最好不要误以为自己吃的是健康的东西。"}, {"summary_id": "43284438_b42ea322", "summary": "ギレルモ・デル・トロ監督のファンタジー「シェイプ・オブ・ウォーター」が4日の米アカデミー賞授賞式で作品賞と監督賞を含む5部門を受賞した。「スリー・ビルボード」のフランセス・マクドーマンド氏が主演女優賞、「ウィンストン・チャーチル」のギャリー・オールドマン氏が主演男優賞を獲得した。アカデミー協会はこの年、受賞者の性別・人種構成を多様化する新ポリシーを正式発表した。", "zh": "吉列尔莫·德尔·托罗导演的奇幻片《水形物语》在4日的美国奥斯卡颁奖典礼上，获得包括最佳影片奖和最佳导演奖在内的5个奖项。《三块广告牌》的弗朗西丝·麦克多蒙德获得最佳女主角奖，《温斯顿·丘吉尔》的加里·奥德曼获得最佳男主角奖。学院这一年正式发布了使获奖者性别、种族构成多样化的新政策。"}]}, {"article_id": "36881141", "url": "https://www.bbc.com/japanese/36881141", "title": "車を降りた女性をトラが殺害 北京のサファリパーク", "title_zh": "老虎咬死下车女性 北京的野生动物园", "text": "中国中央電視台が放送した現場映像より CCTVが放送した現場映像には、1人の女性が車を降りたところでトラに襲われ、引きずられていく様子が映っている。さらに、もう1人の女性が助けようと車を降りると、別のトラに襲われて死亡した。 一部報道によると、最初の女性が車を降りたのは、車内での口論が原因だったという。 車内にはさらに男性が1人いた。この人も女性たちを助けようとしたが、無事だった。 「八達嶺野生動物世界」では来園者が、自家用車で自由に園内を移動できるが、施設側は野生動物が放し飼いにされている区域では車から降りないように注意を促している。 現場映像では、動物管理官たちが車両でただちに駆け付けたが、死亡した女性を助けることはできなかった。 北京市延慶区の担当者によると、負傷した女性は手当てを受けている。 「八達嶺野生動物世界」は休園しているが、関係者はコメントせず、休園理由は豪雨の予報だと説明している。 （英語記事 Tigers maul two women at Beijing wildlife park）", "text_zh": "中国中央电视台播出的现场画面 CCTV播出的现场画面显示，一名女性刚下车便遭老虎袭击并被拖走。随后，另一名女性下车试图营救，遭另一只老虎袭击身亡。 据部分报道，最初那名女性下车的原因是车内发生了口角。 车内还有一名男性。此人也曾试图营救两名女性，但自己平安无事。 在“八达岭野生动物世界”，游客可以驾驶自家车辆在园内自由移动，但园方提醒游客在野生动物散养区域不要下车。 现场画面显示，动物管理员们随即驾车赶到，但未能救回身亡的女性。 据北京市延庆区有关负责人称，受伤的女性正在接受治疗。 “八达岭野生动物世界”目前闭园，但相关人士不予置评，并解释称闭园原因是暴雨预报。 （英文报道 Tigers maul two women at Beijing wildlife park）", "reference_summary": "中国中央電視台（CCTV）によると、北京のサファリパークで女性2人が車を降りたところ、複数のトラが1人を殺害し、1人を負傷させた。", "ref_zh": "据中国中央电视台（CCTV）报道，在北京一家野生动物园，两名女性下车后，多只老虎咬死一人、咬伤一人。", "summaries": [{"summary_id": "36881141_08f52631", "summary": "北京のサファリパーク「八達嶺野生動物世界」で、車を降りた女性がトラに襲われ死亡し、助けに入ったもう1人の女性も負傷した。最初の女性が降車したのは車内での口論が原因との報道もある。", "zh": "在北京的野生动物园“八达岭野生动物世界”，一名下车的女性遭老虎袭击身亡，前去营救的另一名女性也受了伤。也有报道称，最初那名女性下车是因为车内发生了口角。"}, {"summary_id": "36881141_298ec463", "summary": "北京のサファリパーク「八達嶺野生動物世界」で、車を降りた女性がトラに襲われ死亡し、助けに入ったもう1人の女性も負傷した。事件を受けて北京市当局は同パークの運営ライセンスを剥奪し、市内の類似施設3カ所にも営業停止命令を発出した。", "zh": "在北京的野生动物园“八达岭野生动物世界”，一名下车的女性遭老虎袭击身亡，前去营救的另一名女性也受了伤。事件发生后，北京市当局吊销了该园的运营执照，并对市内3家类似设施发出了停业命令。"}, {"summary_id": "36881141_86804cfb", "summary": "中国中央電視台（CCTV）によると、北京のサファリパークで女性2人が車", "zh": "据中国中央电视台（CCTV）报道，在北京一家野生动物园，两名女性从车"}, {"summary_id": "36881141_cb3ff5bf", "summary": "中国中央電視台が放送した現場映像より CCTVが放送した現場映像には、1人の女性が車を降りたところでトラに襲われ、引きずられていく様子が映っている。さらに、もう1人の女性が助けようと車を降りると、別のトラに襲われて死亡した。一部報道によると、最初の女性が車を降りたのは、車内での口論が原因だったという。", "zh": "中国中央电视台播出的现场画面 CCTV播出的现场画面显示，一名女性刚下车便遭老虎袭击并被拖走。随后，另一名女性下车试图营救，遭另一只老虎袭击身亡。据部分报道，最初那名女性下车的原因是车内发生了口角。"}, {"summary_id": "36881141_e92770b8", "summary": "中国中央電視台（CCTV）によると、北京のサファリパークで女性2人が車を降りたところ、複数のトラが1人を殺害し、1人を負傷させた。", "zh": "据中国中央电视台（CCTV）报道，在北京一家野生动物园，两名女性下车后，多只老虎咬死一人、咬伤一人。"}]}, {"article_id": "48116477", "url": "https://www.bbc.com/japanese/48116477", "title": "アルツハイマー患者、実は別の種類の認知症か＝国際研究", "title_zh": "阿尔茨海默病患者，或实为另一种类型的痴呆症——国际研究", "text": "ミシェル・ロバーツ、BBCニュースオンライン、保健編集長 ある専門家は、近年で最も重要な認知症に絡む発見だと話している。研究は医学誌「ブレイン」に発表された。 LATE（Limbic-predominant age-related TDP-43 encephalopathy、大脳辺縁系優位型老年期TDP-43脳症）と呼ばれるこの症状は、アルツハイマー型認知症と似ているが、異なる病気だという。 新たな認知症が特定されたことで、これまで認知症の治療方法が確立してこなかった理由が明らかになるかもしれない。 認知症とは？ 認知症は単一の病気ではなく、記憶や思考が損なわれるなどの症状をまとめた呼び方だ。 さまざまな種類の認知症があるが、中でもアルツハイマー型認知症が最も患者の数が多いとされ、広く研究されている。 しかし今回の研究では、アルツハイマー型と診断された患者の最大で3分の1が、実はLATEである可能性があるとしている。また、アルツハイマー型とLATEは併発することもあるという。 研究は、認知症患者の死後解剖の結果を基にしている。それによると、LATEは80歳以上が罹患するもので、この年齢グループでは5人に1人の割合で症状が確認された。 調査チームはこのことから、公衆衛生におけるLATEの影響は大きいと指摘した。 アルツハイマー型と違い、LATEはより緩やかに記憶が失われていくとみられている。 ＜関連記事＞ 治療法は確立されるか 現在、認知症を特定する単一の診断方法は確立されていない。場合によっては、死後に発覚することもある。 LATEはTDP-43と呼ばれるたんぱく質に由来する。一方、アルツハイマー型はアミロイドとタウというたんぱく質と関連がある。 科学者は認知症の治療法を確立しようとしているが、認知症にはさまざまな種類や原因があるため、実現は困難だ。 アルツハイマー型の原因とされるたんぱく質を脳内から減らす薬の実験は、失敗に終わった。 効果的な治療法が見つからない中、認知症治療薬の開発競争から降りる製薬会社も出ている。 こうした中で研究チームは、LATEをより深く研究することで、新たな治療法が見つかるかもしれないと話した。 研究論文では、LATEへの認知向上や、さらなる研究へのガイダンスが示された。 研究を主導した米ケンタッキー大学のピート・ネルソン博士は、「LATEはずっと存在していた。我々が初めて特定しただけだ」と話した。 「アルツハイマー型は誰もが知っている認知症だが、認知症にはさまざまな種類があり、LATEはその中でも最も症例が多い。これからLATEについての研究を初め、治療法を最適化・開発するのはとてもワクワクする」 一方で、「これからやるべきことは多い。今回の発見はゴールではなくスタートに過ぎない」と述べ、「これまでアルツハイマー型と言われていた人の多くが、実はそうではなかったと分かるだろう」と指摘した。 他の専門家の意見は？ ユニヴァーシティー・コレッジ・ロンドンのロバート・ハワード教授は、「この論文はここ5年で認知症について発表されたもので最も重要かもしれない」と語った。 「アルツハイマー型に有効だといわれていた試験薬はLATEには効果がない。これは今後の試験で、被験者に重要な選択をもたらすだろう」 エディンバラ大学の認知症専門家、タラ・スパイアーズ＝ジョーンズ教授は、「認知症の症状はさまざまな病気が原因で起こることがわかっており、どの原因がどんな認知症を引き起こすのかを知ることが、治療法の開発には不可欠だ。そういった意味で、この研究は重要だ」と述べた。 英アルツハイマー・ソサエティーのジェイムズ・ピケット博士は、この研究は「より精度の高い診断と、パーソナライズされた認知症治療への最初の一歩だ」と語った。 一方でアルツハイマー・リサーチのキャロル・ルートレッジ博士は、LATEの症状を病院で医師が診断することはまだできないと指摘している。 （英語記事 New type of dementia identified）", "text_zh": "米歇尔·罗伯茨，BBC新闻网站，健康主编 一位专家表示，这是近年来与痴呆症相关的最重要的发现。研究发表在医学期刊《大脑》（Brain）上。 这种被称为LATE（Limbic-predominant age-related TDP-43 encephalopathy，大脑边缘系统为主的老年性TDP-43脑病）的病症，与阿尔茨海默型痴呆症相似，但据称是一种不同的疾病。 新型痴呆症得到确定，或许能解释为什么此前一直未能确立痴呆症的治疗方法。 什么是痴呆症？ 痴呆症并不是单一的疾病，而是对记忆和思维受损等症状的统称。 痴呆症有多种类型，其中阿尔茨海默型痴呆症被认为患者人数最多，也得到了广泛研究。 但此次研究指出，被诊断为阿尔茨海默型的患者中，最多可能有三分之一实际上是LATE。此外，阿尔茨海默型与LATE也可能并发。 研究以痴呆症患者的死后解剖结果为基础。结果显示，LATE是80岁以上人群罹患的疾病，在这一年龄组中，每5人中就有1人被确认有该症状。 调查团队据此指出，LATE对公共卫生的影响很大。 与阿尔茨海默型不同，LATE的记忆丧失据认为更为缓慢。 ＜相关报道＞ 治疗方法能否确立 目前，尚未确立能确定痴呆症的单一诊断方法。有些情况下，甚至要在死后才能发现。 LATE源于一种名为TDP-43的蛋白质。而阿尔茨海默型则与淀粉样蛋白和tau这两种蛋白质相关。 科学家们正试图确立痴呆症的治疗方法，但由于痴呆症的种类和原因多种多样，实现起来十分困难。 减少脑内被认为是阿尔茨海默型病因的蛋白质的药物试验，以失败告终。 在找不到有效治疗方法的情况下，一些制药公司退出了痴呆症治疗药物的研发竞争。 在此背景下，研究团队表示，通过更深入地研究LATE，也许能找到新的治疗方法。 研究论文中提出了对LATE认知的提高，以及对进一步研究的指导。 主导这项研究的美国肯塔基大学的皮特·纳尔逊博士说：“LATE一直都存在。只是我们第一次确定了它。” “阿尔茨海默型是人人皆知的痴呆症，但痴呆症有各种类型，LATE是其中病例最多的。从现在开始对LATE展开研究、优化和开发治疗方法，令人非常兴奋。” 另一方面，他表示“接下来要做的事情还很多。这次的发现不是终点，只是起点”，并指出“我们将会发现，许多此前被称为阿尔茨海默型的人，其实并不是”。 其他专家怎么看？ 伦敦大学学院的罗伯特·霍华德教授说：“这篇论文也许是近5年来发表的关于痴呆症的最重要的论文。” “据称对阿尔茨海默型有效的试验药物，对LATE没有效果。这将在今后的试验中给受试者带来重要的选择。” 爱丁堡大学的痴呆症专家塔拉·斯派尔斯-琼斯教授表示：“我们已经知道，痴呆症的症状可能由各种疾病引起，而了解何种病因引起何种痴呆症，对治疗方法的开发不可或缺。从这个意义上说，这项研究很重要。” 英国阿尔茨海默病协会的詹姆斯·皮克特博士称，这项研究是“迈向更高精度的诊断和个性化痴呆症治疗的第一步”。 另一方面，阿尔茨海默病研究机构（Alzheimer's Research）的卡罗尔·鲁特利奇博士指出，医生目前还无法在医院诊断LATE的症状。 （英文报道 New type of dementia identified）", "reference_summary": "これまでにアルツハイマー型認知症と診断されていた人の中には、実は新たに発見された種類の認知症だった人が多く含まれていると、国際研究チームが発表した。", "ref_zh": "国际研究团队发表报告称，此前被诊断为阿尔茨海默型痴呆症的人当中，有许多实际上患的是新发现的一种痴呆症。", "summaries": [{"summary_id": "48116477_291f4b8f", "summary": "ミシェル・ロバーツ、BBCニュースオンライン、保健編集長 ある専門家は、近年で最も重要な認知症に絡む発見だと話している。研究は医学誌「ブレイン」に発表された。LATE（Limbic-predominant age-related TDP-43 encephalopathy、大脳辺縁系優位型老年期TDP-43脳症）と呼ばれるこの症状は、アルツハイマー型認知症と似ているが、異なる病気だという。", "zh": "米歇尔·罗伯茨，BBC新闻网站，健康主编 一位专家表示，这是近年来与痴呆症相关的最重要的发现。研究发表在医学期刊《大脑》（Brain）上。这种被称为LATE（Limbic-predominant age-related TDP-43 encephalopathy，大脑边缘系统为主的老年性TDP-43脑病）的病症，与阿尔茨海默型痴呆症相似，但据称是一种不同的疾病。"}, {"summary_id": "48116477_4d229e3c", "summary": "これまでにアルツハイマー型認知症と診断されていた人の中には、実は新たに発見された種類の認知症だった人が多く含まれていると、国際研究チームが発表した。", "zh": "国际研究团队发表报告称，此前被诊断为阿尔茨海默型痴呆症的人当中，有许多实际上患的是新发现的一种痴呆症。"}, {"summary_id": "48116477_833a6901", "summary": "アルツハイマー型認知症と診断された患者の最大3分の1が、実は新しく特定された別種の認知症「LATE」だった可能性があると国際研究チームが発表した。LATEはTDP-43というタンパク質に由来し、80歳以上で発症する別の病気とされる。発見は認知症治療法の開発が進んでこなかった理由を明らかにする可能性があるが、臨床での診断方法はまだ確立されていない。", "zh": "国际研究团队发表报告称，被诊断为阿尔茨海默型痴呆症的患者中，最多有三分之一可能实际上患的是新确定的另一种痴呆症“LATE”。LATE源于一种名为TDP-43的蛋白质，被认为是80岁以上人群发病的另一种疾病。这一发现或能揭示痴呆症治疗方法的开发一直没有进展的原因，但临床上的诊断方法尚未确立。"}, {"summary_id": "48116477_b3855ba6", "summary": "これまでにアルツハイマー型認知症と診断されていた人の中には、実は新たに発見された種類の認知症だった人が多く含まれていると、国際研究チームが発表した。", "zh": "国际研究团队发表报告称，此前被诊断为阿尔茨海默型痴呆症的人当中，有许多实际上患的是新发现的一种痴呆症。"}, {"summary_id": "48116477_f5fe4b35", "summary": "アルツハイマー型認知症と診断された患者の最大3分の1が、実は別種の認知症「LATE」だった可能性があると国際研究チームが発表した。LATEはTDP-43というタンパク質に由来し、現在は特効薬の臨床試験が第3相に入っている。英アルツハイマー・ソサエティーは、より精度の高い診断への最初の一歩だと評価した。", "zh": "国际研究团队发表报告称，被诊断为阿尔茨海默型痴呆症的患者中，最多有三分之一可能实际上患的是另一种痴呆症“LATE”。LATE源于一种名为TDP-43的蛋白质，目前特效药的临床试验已进入第三期。英国阿尔茨海默病协会评价称，这是迈向更高精度诊断的第一步。"}]}, {"article_id": "45392795", "url": "https://www.bbc.com/japanese/45392795", "title": "ブラジルの国立博物館で火災 設立200年", "title_zh": "巴西国立博物馆发生火灾 设立200年", "text": "国立博物館は、ブラジルや他の国々の歴史に関する品々を所蔵している 博物館には2000万点以上のコレクションが所蔵されており、消防隊が建物の消火に当たっている。 この火事でけが人が出ているかは不明だ。 同博物館は、かつてポルトガル王室の住居として使用され、今年6月に200周年を祝ったばかりだった。 ブラジルのテレビで放映された映像には、火が建物全体に広がった様子が映し出されていた。博物館の閉館後に出火したと考えられている。 ジャーナリストのジャスティン・フリーナー氏は、「ブラジル国立博物館が完全に火に包まれた。1818年に設立された同博物館は、ミイラや隕石、昆虫や化石を含む2000万点以上の品々を所蔵している。歴史が燃え盛るのを見るのは悲しい」とツイートした。 出火の原因は明らかになっていない。 ブラジルのミシェル・テメル大統領は、「全ブラジル国民にとって悲しい日」だったとツイート。「我が国の歴史の価値は、建物の損害から計り知ることはできない」と加えた。 Footage shows the huge scale of the blaze 現地TVグロボの取材に対し、博物館のディレクターは「文化的悲劇だ」と話した。 ブラジル国立博物館のウェブサイトによると、同博物館はブラジルや他の国々の歴史に関する品々を所蔵している。 所蔵品にはエジプトの遺物や、自然史のコレクションには重要な価値のある恐竜の骨や、アメリカ大陸で発掘された最古のものとなる、12000年前の女性の頭蓋骨が含まれている。 博物館の従業員からはかねて、予算の削減や建物の老朽化を懸念する声が上がっていた。 （英語記事 Fire ravages 200-year-old Brazil museum）", "text_zh": "国立博物馆收藏着与巴西及其他国家历史相关的物品 博物馆内收藏有2000多万件藏品，消防队正在对建筑进行灭火。 这场火灾是否造成人员受伤尚不清楚。 该博物馆曾被用作葡萄牙王室的住所，今年6月刚刚庆祝了建馆200周年。 巴西电视台播出的画面显示，大火蔓延至整座建筑。据信火灾发生在博物馆闭馆之后。 记者贾斯汀·弗里纳在推特上写道：“巴西国立博物馆完全被大火吞没。这座1818年设立的博物馆收藏着包括木乃伊、陨石、昆虫和化石在内的2000多万件物品。眼看着历史熊熊燃烧，令人悲伤。” 起火原因尚未查明。 巴西总统米歇尔·特梅尔发推称，这是“对全体巴西国民来说悲伤的一天”，并补充说：“我国历史的价值，是无法用建筑物的损失来衡量的。” Footage shows the huge scale of the blaze 在接受当地电视台环球电视台（TV Globo）采访时，博物馆馆长表示，这是“一场文化悲剧”。 据巴西国立博物馆的网站介绍，该博物馆收藏着与巴西及其他国家历史相关的物品。 藏品中包括埃及的文物，自然史藏品中包括具有重要价值的恐龙骨骼，以及在美洲大陆出土的最古老的、距今12000年前的女性头盖骨。 博物馆员工此前就一直有声音对预算削减和建筑老化表示担忧。 （英文报道 Fire ravages 200-year-old Brazil museum）", "reference_summary": "ブラジル・リオデジャネイロにある同国最古の科学機関、ブラジル国立博物館で2日、大規模な火災が発生した。", "ref_zh": "位于巴西里约热内卢的该国最古老的科学机构——巴西国立博物馆2日发生大规模火灾。", "summaries": [{"summary_id": "45392795_321915ee", "summary": "ブラジル・リオデジャネイロにある同国最古の科学機関、ブラジル国立博物館で2日、大規模な火災が発生した。警察当局は出火原因を放火と断定し、容疑者2人をすでに拘束したと発表した。200年前に設立された同博物館は2000万点以上を所蔵し、エジプトの遺物や恐竜の骨などが含まれていた。", "zh": "位于巴西里约热内卢的该国最古老的科学机构——巴西国立博物馆2日发生大规模火灾。警方当局已将起火原因认定为纵火，并宣布已拘留2名嫌疑人。这座200年前设立的博物馆收藏有2000多万件藏品，其中包括埃及的文物和恐龙骨骼等。"}, {"summary_id": "45392795_35096e70", "summary": "米配車サービス大手ウーバーのダラ・コスロシャヒ最高経営責任者（CEO）は26日、利益減少の可能性があるとしても、自動車配車事業への注力を弱めて電動キックボードと自転車事業に重点を置く計画だと明かした。 英経済紙フィナンシャル・タイムズのインタビュー に答えた。", "zh": "美国网约车巨头优步的达拉·科斯罗萨西首席执行官（CEO）26日透露，即便有利润减少的可能，也计划减弱对汽车网约车业务的投入，把重点放在电动滑板车和自行车业务上。他在接受英国经济报纸《金融时报》采访时作出上述表态。"}, {"summary_id": "45392795_74c007a5", "summary": "ブラジル・リオデジャネイロにある同国最古の科学機関、ブラジル国立博物館で2日、大規模な火災が発生した。200年前に設立され2000万点以上を所蔵する同博物館は閉館後に出火し、消防隊が消火に当たったが建物全体が火に包まれた。博物館関係者は「文化的悲劇だ」と述べ、テメル大統領も「全ブラジル国民にとって悲しい日」だと追悼の意を示した。", "zh": "位于巴西里约热内卢的该国最古老的科学机构——巴西国立博物馆2日发生大规模火灾。这座设立于200年前、收藏2000多万件藏品的博物馆在闭馆后起火，消防队进行了灭火，但整座建筑被大火吞没。博物馆有关人士称这是“一场文化悲剧”，特梅尔总统也表示这是“对全体巴西国民来说悲伤的一天”，以示哀悼。"}, {"summary_id": "45392795_7b0e7ddf", "summary": "国立博物館は、ブラジルや他の国々の歴史に関する品々を所蔵している 博物館には2000万点以上のコレクションが所蔵されており、消防隊が建物の消火に当たっている。この火事でけが人が出ているかは不明だ。同博物館は、かつてポルトガル王室の住居として使用され、今年6月に200周年を祝ったばかりだった。", "zh": "国立博物馆收藏着与巴西及其他国家历史相关的物品 博物馆内收藏有2000多万件藏品，消防队正在对建筑进行灭火。这场火灾是否造成人员受伤尚不清楚。该博物馆曾被用作葡萄牙王室的住所，今年6月刚刚庆祝了建馆200周年。"}, {"summary_id": "45392795_a027bba1", "summary": "ブラジル・リオデジャネイロにある同国最古の科学機関、ブラジル国立博物館で2日、大規模な火災が発生した。", "zh": "位于巴西里约热内卢的该国最古老的科学机构——巴西国立博物馆2日发生大规模火灾。"}]}, {"article_id": "45001963", "url": "https://www.bbc.com/japanese/45001963", "title": "記者を「国民の敵」と呼ぶべきでない NYタイムズ社主、トランプ氏に", "title_zh": "不应称记者为“人民公敌” 《纽约时报》发行人向特朗普进言", "text": "トランプ大統領はサルツバーガー氏と「とても良い」会談を行ったと話した トランプ大統領は29日、ツイッターで「ニューヨーク・タイムズの社主A.G.サルツバーガーとホワイトハウスでとても良い、興味深い会談をした。メディアが載せる大量の偽ニュースや、偽ニュースが『国民の敵』という表現に形を変えたことについて長い間話し込んだ。残念だ！」と書いた。 トランプ氏は、自分自身が「国民の敵」というフレーズを繰り返し使っていることには触れなかった。その後のツイートでは、メディアがその報道を通じて国民の命を危険にさらしていると非難した。 大統領のツイートを受けて、ニューヨーク・タイムズは「会合について大統領の説明の仕方に答える」として声明を発表した。それによると、ホワイトハウスに招待されて今月20日にサルツバーガー社主が大統領を訪問し、非公式に会談した。大統領が報道に敵対的な言動を繰り返していることを「深く憂慮」していると、本人に直接伝えるため、会談に応じることにしたという。 ニューヨーク・タイムズの説明によると、サルツバーガー氏は会談でトランプ氏に、「偽ニュース」という表現は「事実に反し有害」だが、それよりも「ジャーナリストに『国民の敵』とレッテルを貼っていることの方がはるかに問題だ」と伝えたという。 「こうした言葉遣いは火種になり得る。ジャーナリストを今まで以上に脅かし、暴力につながると警告した」とサルツバーガー社主は声明で説明した。 社主はさらに、こうした懸念は他国では特に大きく、他の独裁政権がトランプ氏の物言いをジャーナリスト弾圧に利用していると大統領に伝えたという。 「命を危険にさらし、米国の民主主義の理想を破壊し、発言の自由と報道の自由という米国の特に偉大な輸出品を損なっていると警告した」と社主は説明した。 ニューヨーク・タイムズは、自社の報道内容への批判をやめるよう大統領に要請したわけではないと説明した サルツバーガー氏はトランプ大統領に、ニューヨーク・タイムズの報道内容の批判をやめるよう求めたわけではなく、「ジャーナリズム全般への攻撃を考え直して」ほしいと求めたのだと書いている。 サルツバーガー氏の声明発表後、トランプ大統領は内容に反応するかのようなツイートをした。「トランプ錯乱症候群で頭がおかしくなっているメディアが、政府内部の話し合いを明らかにすれば、ジャーナリストだけでなく、本当にたくさんの命を危険にさらすことになる！ とても非愛国的だ！ 報道の自由は、報道する責任も伴う」と非難した。 続くツイートでは、「（政府の）前向きな成果のことさえ、悪いニュースとして書く」と批判している。 トランプ大統領による「国民の敵」ツイート 2017年2月、トランプ大統領は「偽ニュースメディア（失敗しているニューヨーク・タイムズやNBC、ABC、CNN、CBS）は僕の敵ではなく、米国民の敵だ！」とツイートした。その後の会合でもこのフレーズを使ったと報じられている。 違法移民の子どもを親から引き離す政策が物議をかもした今年6月にもツイッターで、「なぜFBIは偽ニュースのメディアにたくさん情報を流しているんだ。FBIはそんなことするべきではないし、国民の敵の偽ニュースのことだ、話をいいようにねじ曲げる。やつらに真実は関係ないんだ！」と、「国民の敵」という言葉を使った。 7月初めにロシアのウラジーミル・プーチン大統領との会談を批判された際にも、「実際、ほとんどのニュースメディアは国民の敵だ」、「ロシアとの首脳会談は大成功だった。そう言わないのは、本当の国民の敵、偽ニュースメディアだけだ（後略）」とツイートした。 ＜解説＞新しい「普通」――アンソニー・ザーカーBBC北米記者 トランプ大統領が初めて報道機関を「国民の敵」と呼んだとき、大きな怒りが噴出した。共和党のジェフ・フレイク上院議員（アリゾナ州選出）はホワイトハウスが報道の自由を攻撃した「前例のない」発言だと呼んだ。 しかしトランプ氏がこのフレーズを二度、三度と使ううちに、肩をすくめる人さえ減っていった。許しがたいものだったはずの行動や意見を新しい「普通」にしてしまうという、この大統領特有の能力だ。 だが、このフレーズがニュースのトップを飾らなくなっても、ジャーナリストは今でも言われるたびに意識している。数週間前に起きたメリーランド州の新聞社襲撃は、欧米で確立している「安全な」民主主義においても、報道という職業の危険性を浮き彫りにした。 サルツバーガー氏は9日前、この点を明らかにするためにトランプ氏と秘密の会談を行った。 しかし、そのメッセージは受け取ってもらえなかったようだ。29日のツイートでトランプ大統領は、自分がメディアを「米国民の敵」と表現するのはメディア自身の責任だと示唆した。 トランプ大統領にとっては、こうした表現の問題は（もし実際に問題だとするなら）、正すべきは自分ではなくメディアの方だということになる。 （英語記事 NYT urges Trump to end 'enemy' rhetoric）", "text_zh": "特朗普总统表示与苏兹伯格进行了“非常好”的会谈 特朗普总统29日在推特上写道:“与《纽约时报》发行人A.G.苏兹伯格在白宫进行了非常好、非常有趣的会谈。我们长时间深入讨论了媒体刊登的大量假新闻,以及假新闻演变为‘人民公敌’这一表述的问题。遗憾!” 特朗普没有提及他本人反复使用“人民公敌”这一措辞的事实。在随后的推文中,他指责媒体通过其报道将国民的生命置于危险之中。 针对总统的推文,《纽约时报》以“就总统对会晤的描述方式作出回应”为由发表了声明。据声明称,苏兹伯格发行人应白宫邀请,于本月20日拜访总统,进行了非正式会谈。他之所以决定应邀会谈,是为了当面向总统本人传达,对总统屡次对报道采取敌对言行“深感忧虑”。 据《纽约时报》介绍,苏兹伯格在会谈中向特朗普表示,“假新闻”这一表述虽然“有违事实且有害”,但相比之下,“给新闻记者贴上‘人民公敌’标签的做法问题要严重得多”。 “这种措辞可能成为火种。我警告说,这会使记者受到比以往更大的威胁,并会导致暴力。”苏兹伯格发行人在声明中解释道。 发行人还向总统表示,这种担忧在其他国家尤为严重,其他独裁政权正在利用特朗普的言论来打压新闻记者。 “我警告说,这正在危及生命,破坏美国的民主理想,损害言论自由和新闻自由这一美国格外伟大的输出品。”发行人解释说。 《纽约时报》解释称,并非要求总统停止批评该报的报道内容 苏兹伯格写道,他并不是要求特朗普总统停止批评《纽约时报》的报道内容,而是要求他“重新考虑对整个新闻业的攻击”。 苏兹伯格的声明发表后,特朗普总统发布了似乎在回应其内容的推文。他指责称:“因特朗普错乱综合征而失去理智的媒体,如果泄露政府内部的商讨内容,那么陷入危险的就不仅是记者,而是真的会有非常多的生命!非常不爱国!新闻自由也伴随着报道的责任。” 在接下来的推文中,他批评道:“就连(政府的)积极成果,他们也写成坏消息。” 特朗普总统的“人民公敌”推文 2017年2月,特朗普总统发推称:“假新闻媒体(失败的《纽约时报》以及NBC、ABC、CNN、CBS)不是我的敌人,而是美国人民的敌人!”据报道,他在之后的会议上也使用了这一措辞。 在将非法移民子女与父母分离的政策引发争议的今年6月,他也在推特上使用了“人民公敌”一词:“为什么FBI向假新闻媒体泄露这么多信息?FBI不应该这样做,而且说的可是人民公敌的假新闻,他们会把事情歪曲得对自己有利。对他们来说真相无关紧要!” 7月初,当他与俄罗斯总统弗拉基米尔·普京的会谈受到批评时,他也发推称:“实际上,大多数新闻媒体都是人民公敌”,“与俄罗斯的首脑会谈非常成功。不这么说的,只有真正的人民公敌——假新闻媒体(后略)”。 <解说>新的“常态”——安东尼·泽克BBC北美记者 特朗普总统第一次称新闻机构为“人民公敌”时,舆论爆发了巨大的愤怒。共和党参议员杰夫·弗莱克(亚利桑那州选出)称这是白宫攻击新闻自由的“史无前例”的言论。 然而,随着特朗普第二次、第三次使用这一措辞,连耸耸肩表示不屑的人都越来越少了。这就是这位总统特有的能力——把本应不可饶恕的行为和观点变成新的“常态”。 但是,即使这一措辞不再占据新闻头条,记者们每次听到时仍然会有所触动。数周前发生的马里兰州报社袭击事件凸显出,即使在欧美已经确立的“安全的”民主国家,新闻这一职业也充满危险。 苏兹伯格9天前与特朗普举行秘密会谈,正是为了阐明这一点。 然而,这一信息似乎并没有被接受。在29日的推文中,特朗普总统暗示,他把媒体描述为“美国人民的敌人”,责任在于媒体自身。 对特朗普总统而言,这种表述的问题(如果这真的算是问题的话),应该纠正的不是他自己,而是媒体一方。 (英语报道 NYT urges Trump to end 'enemy' rhetoric)", "reference_summary": "米紙ニューヨーク・タイムズの社主は29日、ドナルド・トランプ米大統領と会談した際、報道記者を「国民の敵」と呼ぶべきでないと伝えたことを明らかにした。メディアに対する「暴力につながる」と警告したという。", "ref_zh": "美国报纸《纽约时报》发行人29日透露,在与美国总统唐纳德·特朗普会谈时,曾向其表示不应将新闻记者称为“人民公敌”。据称他警告说,这会“导致”针对媒体的“暴力”。", "summaries": [{"summary_id": "45001963_18f10be4", "summary": "米紙ニューヨーク・タイムズの社主は29日、ドナルド・トランプ米大統領と会談した際、報道記者を「国民の敵」と呼ぶ", "zh": "美国报纸《纽约时报》发行人29日透露,在与美国总统唐纳德·特朗普会谈时,将新闻记者称为“人民公敌”"}, {"summary_id": "45001963_58e21cc6", "summary": "米紙ニューヨーク・タイムズのサルツバーガー社主は、記者を「国民の敵」と呼ぶトランプ大統領の言動が暴力を招くと会談で直接警告したと明らかにし、大統領と対立的な応酬となった。", "zh": "美国报纸《纽约时报》的苏兹伯格发行人透露,他在会谈中直接警告称,特朗普总统称记者为“人民公敌”的言行会招致暴力,并与总统形成了对立性的交锋。"}, {"summary_id": "45001963_a542985b", "summary": "米紙ニューヨーク・タイムズの社主は29日、ドナルド・トランプ米大統領と会談した際、報道記者を「国民の敵」と呼ぶべきでないと伝えたことを明らかにした。メディアに対する「暴力につながる」と警告したという。", "zh": "美国报纸《纽约时报》发行人29日透露,在与美国总统唐纳德·特朗普会谈时,曾向其表示不应将新闻记者称为“人民公敌”。据称他警告说,这会“导致”针对媒体的“暴力”。"}, {"summary_id": "45001963_ae50d79f", "summary": "トランプ大統領はサルツバーガー氏と「とても良い」会談を行ったと話した トランプ大統領は29日、ツイッターで「ニューヨーク・タイムズの社主A.G.サルツバーガーとホワイトハウスでとても良い、興味深い会談をした。メディアが載せる大量の偽ニュースや、偽ニュースが『国民の敵』という表現に形を変えたことについて長い間話し込んだ。残念だ！」と書いた。", "zh": "特朗普总统表示与苏兹伯格进行了“非常好”的会谈 特朗普总统29日在推特上写道:“与《纽约时报》发行人A.G.苏兹伯格在白宫进行了非常好、非常有趣的会谈。我们长时间深入讨论了媒体刊登的大量假新闻,以及假新闻演变为‘人民公敌’这一表述的问题。遗憾!”"}, {"summary_id": "45001963_d8eb76f4", "summary": "米紙ニューヨーク・タイムズのサルツバーガー社主は、記者を「国民の敵」と呼ぶトランプ大統領の言動が暴力を招くと会談で警告した。同社主は会談の中で大統領に対し公式謝罪を要求しており、拒否された場合には法的措置も辞さないと表明した。", "zh": "美国报纸《纽约时报》的苏兹伯格发行人在会谈中警告称,特朗普总统称记者为“人民公敌”的言行会招致暴力。该发行人还在会谈中要求总统作出正式道歉,并表明如遭拒绝将不惜采取法律措施。"}]}, {"article_id": "50285251", "url": "https://www.bbc.com/japanese/50285251", "title": "インド・デリー大気汚染、「耐えられないレベル」 外出自粛求める", "title_zh": "印度德里空气污染达“难以忍受的水平” 呼吁民众减少外出", "text": "デモ参加者のポスターには「呼吸させて、デリーの空気を毒さないで」と書かれている デリー首都圏のアルヴィンド・ケジリワル首相は、「大気汚染が耐えられない水準まで達した」と警告した。 各地で大気中の微小粒子状物質PM2.5の濃度が急上昇し、呼吸器疾患を引き起こす恐れのある「有害」レベルに達しているという。 デリーの大気汚染、どれほど深刻？ 車のナンバーで通行制限 3日には大気汚染によって視界が悪くなったため、航空便30便以上が欠航となった。 汚染を軽減するため、自動車の通行を制限する規制が発動された。4日から15日まで、ナンバープレートの末尾の数字が偶数か奇数かによって、日替わりで通行が認められるという。 また、デリーの学校は5日まで休校となったほか、建築工事も中止されている。 汚染を軽減するため、自動車の運転を制限する規制が発動した デリーのサティエンダル・ジャイン保健相は住民に対し、「午前中や夜遅い時間には屋外での運動を避ける」よう呼びかけている。 さらに、マスクの着用や汚染地域に立ち入らないこと、建物の扉や窓を閉め切ることなどを指示している。 大気汚染の原因は？ インドではこの時期、焼き畑や麦の収穫後のわら焼きが行われており、高い大気汚染レベルの主な原因となっている。 また、1週間前に行われたヒンドゥー教の祭典「ディワリ」の花火でも、二酸化炭素（CO2）や二酸化窒素（NO2）、二酸化硫黄（SO2）といった人体に有害な物質が排出されたという。 デリーの警察官もマスクを着けて職務に当たっている これらに自動車の排気ガスや、工事現場や工場からの排出ガスが加わり、スモッグになっている。 雨が降ればこうした有害物質は大気中から除去されていくが、予報では7日まで雨は見込めないという。 汚染物質は検出できない水準 有害物質を表す微小粒子状物質PM2.5の濃度は現在、同じく大気汚染が問題となっている中国・北京の7倍に達している。 インドの国家保健局の職員はツイッターで、デリーの大気汚染度測定器では最大値の999が多く検出されており、正確な汚染度は検出できないと警告。「これは災害だ」と話した。 1日には公共衛生非常事態が宣言され、各地の学校で計500万枚のマスクが配られた。ケジリワル首相は、デリーの現状を「ガス室」のようだと話している。 世界保健機関（WHO）によると、心筋梗塞や肺がん、心臓疾患による死亡例の3分の1が大気汚染によるものだという。 「大気汚染には、喫煙と同程度の影響を体におよぼす」とWHOは説明している。 住民の反応は？ BBCのジル・マクギヴァリング東南アジア編集長によると、インドの政治家は互いに責任をなすりつけあっている状態だという。 こうした中、3日にはデリーの若者が解決策を求める抗議活動を行った。 デモ行進に参加したジャイヴィプラさんは、「大気汚染がひどいのは明らかだ。スモッグで目の前が見えないのは実際、とても怖い」と話した。 「大気と経済、どっちが先に悪化するのか」と書かれたポスターを掲げるデモ参加者 ジャイヴィプラさんは、長期的で持続可能な大気汚染対策が必要だと訴える。 「私たちは自分たちの未来や健康も心配だが、大気汚染の被害を一番こうむっているお年寄りと子どもたちのために戦っている」 一方で気軽な大気汚染対策を紹介して、ソーシャルメディアで物議を呼んでいる政治家もいる。 ハルシュ・ヴァルダン保健・家族福祉相は、ニンジンを食べることで「夜盲症」や「大気汚染による健康被害」を避けられるとツイート。 プラカシュ・ジャベデカル環境・森林・気候変動相は、「才気あふれたテーマ曲」のリンクと共に、「一日を音楽を聞くことで始めよう」と呼びかけた。 これに対しあるツイッター利用者は、「音楽を聞いているから大気汚染の苦境に耳を塞いでいるのか？」と返信している。 （英語記事 India air pollution at 'unbearable levels'）", "text_zh": "示威参加者的海报上写着“让我们呼吸,不要毒害德里的空气” 德里首都区首席部长阿尔温德·凯杰里瓦尔警告称,“空气污染已达到难以忍受的水平”。 据称,各地大气中细颗粒物PM2.5的浓度急剧上升,已达到可能引发呼吸系统疾病的“有害”水平。 德里的空气污染,究竟有多严重? 按车牌号限行 3日,由于空气污染导致能见度下降,30多个航班被取消。 为减轻污染,当局启动了限制汽车通行的规定。据称从4日到15日,将根据车牌尾号是偶数还是奇数,按日轮换准许通行。 此外,德里的学校停课至5日,建筑工程也已中止。 为减轻污染,限制汽车驾驶的规定已经启动 德里卫生部长萨滕德尔·贾因呼吁居民“避免在上午和深夜时段进行户外运动”。 他还指示居民佩戴口罩、不要进入污染地区、紧闭建筑物的门窗等。 空气污染的原因是什么? 在印度,这一时期正在进行烧荒以及麦收后的秸秆焚烧,这是空气污染水平居高不下的主要原因。 此外,一周前举行的印度教节日“排灯节”(Diwali)的烟花,也排放了二氧化碳(CO2)、二氧化氮(NO2)、二氧化硫(SO2)等对人体有害的物质。 德里的警察也戴着口罩执勤 再加上汽车尾气以及工地和工厂排放的废气,形成了雾霾。 如果下雨,这些有害物质会从大气中被清除,但据预报,7日之前不会有降雨。 污染物达到无法检测的水平 目前,代表有害物质的细颗粒物PM2.5的浓度,已达到同样存在空气污染问题的中国北京的7倍。 印度国家卫生部门的职员在推特上警告称,德里的空气污染度测量仪多次检测出最大值999,无法测出准确的污染程度。他表示“这是一场灾难”。 1日,当局宣布进入公共卫生紧急状态,并在各地学校共发放了500万只口罩。凯杰里瓦尔首席部长表示,德里的现状如同“毒气室”。 据世界卫生组织(WHO)称,心肌梗塞、肺癌、心脏疾病死亡病例中的三分之一是由空气污染造成的。 WHO解释说,“空气污染对身体造成的影响与吸烟程度相当”。 居民的反应如何? 据BBC东南亚编辑主任吉尔·麦吉弗林称,印度的政治家们正处于互相推卸责任的状态。 在这种情况下,3日,德里的年轻人举行了要求拿出解决方案的抗议活动。 参加示威游行的贾伊维普拉说:“空气污染严重是显而易见的。因雾霾而看不见眼前的东西,实在非常可怕。” 高举写有“大气和经济,哪个先恶化”海报的示威参加者 贾伊维普拉呼吁,需要长期且可持续的空气污染对策。 “我们也担心自己的未来和健康,但我们是在为受空气污染之害最深的老人和孩子们而战。” 另一方面,也有政治家因介绍轻率的空气污染对策而在社交媒体上引发争议。 卫生与家庭福利部长哈什·瓦尔丹发推称,吃胡萝卜可以避免“夜盲症”和“空气污染造成的健康损害”。 环境、森林与气候变化部长普拉卡什·贾瓦德卡尔则附上“才华横溢的主题曲”的链接,呼吁“用听音乐开始一天”。 对此,一名推特用户回复道:“是因为在听音乐,所以才对空气污染的困境充耳不闻吗?” (英语报道 India air pollution at 'unbearable levels')", "reference_summary": "インド北部で大気汚染が悪化している。デリー首都圏の当局は、市民に外出の自粛を要請し、車両の通行制限に乗り出した。", "ref_zh": "印度北部的空气污染正在恶化。德里首都区当局要求市民减少外出,并着手实施车辆通行限制。", "summaries": [{"summary_id": "50285251_20443446", "summary": "デリー首都圏の当局は、市民に外出の自粛を要請し、車両の通行制限に乗り出した。インド北部で大気汚染が悪化している。", "zh": "德里首都区当局要求市民减少外出,并着手实施车辆通行限制。印度北部的空气污染正在恶化。"}, {"summary_id": "50285251_38ea6fd2", "summary": "デモ参加者のポスターには「呼吸させて、デリーの空気を毒さないで」と書かれている デリー首都圏のアルヴィンド・ケジリワル首相は、「大気汚染が耐えられない水準まで達した」と警告した。各地で大気中の微小粒子状物質PM2.5の濃度が急上昇し、呼吸器疾患を引き起こす恐れのある「有害」レベルに達しているという。デリーの大気汚染、どれほど深刻？ 車のナンバーで通行制限 3日には大気汚染によって視界が悪くなったため、航空便30便以上が欠航となった。", "zh": "示威参加者的海报上写着“让我们呼吸,不要毒害德里的空气” 德里首都区首席部长阿尔温德·凯杰里瓦尔警告称,“空气污染已达到难以忍受的水平”。据称,各地大气中细颗粒物PM2.5的浓度急剧上升,已达到可能引发呼吸系统疾病的“有害”水平。德里的空气污染,究竟有多严重? 按车牌号限行 3日,由于空气污染导致能见度下降,30多个航班被取消。"}, {"summary_id": "50285251_3c0e057d", "summary": "インド・デリー首都圏で大気汚染が「耐えられない水準」まで悪化し、当局は外出の自粛を呼びかけた。現地の病院では呼吸器疾患の救急搬送が前年同期比で3倍に増加し医療体制が逼迫しているという。車両の通行制限、学校の休校、建設工事の中止などの措置が取られた。", "zh": "印度德里首都区的空气污染恶化至“难以忍受的水平”,当局呼吁民众减少外出。据称,当地医院因呼吸系统疾病而进行的急救转运比去年同期增加了3倍,医疗体系正面临吃紧。当局已采取车辆通行限制、学校停课、中止建筑工程等措施。"}, {"summary_id": "50285251_d5d3d3b5", "summary": "インド北部で大気汚染が悪化している。デリー首都圏の当局は、市民に外出の自粛を要請し、車両の通行制限に乗り出した。", "zh": "印度北部的空气污染正在恶化。德里首都区当局要求市民减少外出,并着手实施车辆通行限制。"}, {"summary_id": "50285251_f372dd94", "summary": "インド・デリー首都圏で大気汚染が「耐えられない水準」まで悪化し、当局は外出の自粛を呼びかけた。微小粒子状物質PM2.5の濃度は北京の7倍に達し、車両の通行制限や学校の休校、建設工事の中止などの緊急措置が取られている。この時期の焼き畑やディワリの花火、自動車排気ガスなどが主因とされる。", "zh": "印度德里首都区的空气污染恶化至“难以忍受的水平”,当局呼吁民众减少外出。细颗粒物PM2.5的浓度达到北京的7倍,当局正在采取车辆通行限制、学校停课、中止建筑工程等紧急措施。这一时期的烧荒、排灯节的烟花以及汽车尾气等被认为是主要原因。"}]}, {"article_id": "39932207", "url": "https://www.bbc.com/japanese/39932207", "title": "人種差別的なぬいぐるみと苦情の巡査、逆に調査対象に", "title_zh": "投诉种族歧视性毛绒玩偶的巡警,反而成为调查对象", "text": "ダニー・ショウ内政担当記者、BBCニュース 巡査は、ロンドン中心部のベルグレービア警察署で、警官のシャツを来た黒いサルのぬいぐるみを見つけたと話した。 警察署長たちはこの件について調査すると約束したものの、後に、話をでっち上げたとしてこの巡査本人が逆に調査されることになった。 巡査は後に、不正行為に関する聴聞会で疑念を晴らすことができた。その後、警察に対する訴訟を起こした巡査は損害賠償を受け取っている。 今回の件の詳細が明るみに出る前には、テムズバレー警察の警官が、黒人の同僚警官のデスクにサルの人形を置くという別の出来事があった。 テムズバレー警察の件に関して 不正行為委員会は4月、アンドリュー・モトウ巡査部長について、人種差別主義者ではないがサルの人形は侮辱的だと気づくべきだったと結論付けた。 ぬいぐるみが置かれ…… ロンドン警視庁が関わった出来事は2013年9月、インド出身の巡査がベルグレービア警察署の事件管理課の事務所で巨大なサルのぬいぐるみを見かけたと主張して始まった。 黒いぬいぐるみには、「夜勤ERO」（EROは証拠審査官）と書かれた名札の付いた警察官のシャツが着せられていたと、巡査は話した。 当時、証拠審査官の1人は黒人の警察官だった。 巡査は、ぬいぐるみの使用が人種差別主義的で、きちんと経緯を調べられていなかったかったと懸念していた。 そこで、職員がロンドン警視庁の警視総監（当時はバーナード・ホーガン・ハウ卿）に問題を相談できる「長官のフォーラム」として知られる署内ウェブサイトでのライブ・チャットで、巡査はこの問題を相談した。 巡査は、「その説明がもし本当ならば受け入れがたい」との返信をオンライン上で受信し、「すぐに」調査すると伝えられたという。 しかし1カ月後、「虚偽かつ扇動的な可能性のあるコメント」を投稿した 疑いで、巡査自身が調査対象となった。 巡査は、自身の行動が、「公正さと誠実さ」および「不名誉な振る舞い」に関する「プロとしての行動基準に違反 し、証明されれば巡査自身の解雇につながる可能性がある主張だ」と言われた。 最終的には、2015年6月、内部での懲戒手続きが長引いた後、巡査は重大な不正行為に関する聴聞会に出席。「証拠不十分で閉廷」と判断が下され、巡査への疑念が晴らされた。 金銭的な解決 ロンドン警視庁職員組合の代表で、一連の手続きで巡査を支援したポール・ターピン氏は、「重大な不正行為についての聴聞会にこの問題が付託された時は驚いたが、聴聞会で証拠不十分とされた時には驚かなかった」と話した。 ターピン氏は、この申し立てがあそこまで大ごとにされるべき ではなかったとの考えを示した。「何か問題が起きたら、可能な限り早い機会に、最も低い適切なレベルで対処されるべきだ」。 ロンドン警視庁は、聴聞会の後、今回の件の扱いについて「内部審査」が行われたと話した。 サルの人形に関する元々の申し立ては、「署内で調査され、可能な限り進展した」と説明。しかし調査では、警察署内にサルのぬいぐるみを置いた人物を特定できなかった。 インド系の巡査はロンドン警視庁に対し、人種差別を受け不当に扱われたとして、労働裁判所で法的措置を開始していた。なお、本人の希望によりBBCでは巡査の名前を公表していない。 しかし本格的な審理が始まる前に警察側が和解を申し出、損害賠償の支払に同意した。 合意内容の詳細は機密だが、補償額は35000ポンド前後（約510万円）と考えられている。 巡査はコメントを拒否しており、合意内容の詳細はBBCに一切明かしていない。 ロンドン警視庁は、2016年3月に裁判所 で「司法調停の後」に和解に達したと認めている。 「時代遅れの文化」 ロンドン警視庁で専門的な技術や意識を担当するリチャード・マーティン副警視監は、職員からの差別やいじめ、ハラスメントに関する苦情の対処方法を改善するため 、警察側が「かなりの投資」をしており、新たな「内部通報」制度も導入したと話した。 マーティン副警視監は、「苦情を申し立てれば不当な扱いを受けるかもしれないという恐怖を人は抱くもの、というのは我々は随分前から認識している。その恐怖が理にかなっているか否かは別にして」と述べた。 「これまで容認されたことは決してないし、これからも、不当な扱いは決して容赦せず、調査を行い、もし不当な扱いがあれば深刻な影響を及ぼすということを、引き続き警視庁職員に極めて明確に伝えていく」 しかし、ロンドン警視庁黒人警察官協会ジャネット・ヒルズ会長は、黒いサルのおもちゃの使用や、アジア系巡査の扱いから察するに、残る道のりはまだ長いと話した。 ヒルズ会長は、「サル」の事件は「信じられず」、「受け入れがたい」と言い、「そうした文化を未だに守っている警察内の時代遅れの人たちを排除しようと今も努力している」と述べた。 「単なるぬいぐるみではなく、『これが私が考えるあなた』と伝えるために使われたぬいぐるみなのだ」 ヒルズ会長は、「それは人種差別的な行為だ」と指摘。そのようなことをした人たちがそれでも「逃れられる」と思ったため続けられた、と付け加えた。 （英語記事 Officer accused of misconduct after making racist toy complaint）", "text_zh": "内政事务记者丹尼·肖,BBC新闻 这名巡警称,他在伦敦市中心的贝尔格莱维亚警察局发现了一只穿着警察衬衫的黑色猴子毛绒玩偶。 警察局长们虽然承诺就此事进行调查,但后来,这名巡警本人却被指编造了这一说法,反而遭到调查。 这名巡警后来在有关不当行为的听证会上洗清了嫌疑。之后,他对警方提起诉讼,并获得了损害赔偿。 在此事详情曝光之前,还发生过另一起事件:泰晤士河谷警察局的警察在黑人同事警官的办公桌上放置了猴子玩偶。 关于泰晤士河谷警察局的这起事件,不当行为委员会4月就安德鲁·莫托巡佐作出结论称,他虽然不是种族主义者,但本应意识到猴子玩偶具有侮辱性。 毛绒玩偶被摆放之后…… 伦敦警察厅所涉及的这起事件始于2013年9月,一名印度出身的巡警声称,在贝尔格莱维亚警察局案件管理科的办公室里看到了一只巨大的猴子毛绒玩偶。 巡警称,这只黑色毛绒玩偶穿着警察衬衫,衬衫上挂着写有“夜班ERO”(ERO即证据审查官)的名牌。 当时,证据审查官中有一人是黑人警官。 巡警担心,这只毛绒玩偶的使用带有种族主义色彩,而且事件经过没有得到妥善调查。 于是,巡警在被称为“总监论坛”的局内网站的在线聊天中反映了这一问题——在该论坛上,职员可以向伦敦警察厅总监(时任总监为伯纳德·霍根-豪爵士)咨询问题。 巡警称,他在线上收到了“如果这一描述属实,则难以接受”的回复,并被告知将“立即”进行调查。 然而1个月后,巡警本人却因涉嫌发布“虚假且可能具有煽动性的言论”而成为调查对象。 巡警被告知,他的行为“违反了有关‘公正与诚实’以及‘不名誉行为’的职业行为准则,如果得到证实,这一指控可能导致巡警本人被解雇”。 最终,在内部惩戒程序旷日持久之后,巡警于2015年6月出席了有关严重不当行为的听证会。听证会作出“证据不足,予以终结”的判断,巡警的嫌疑得以洗清。 金钱和解 在一系列程序中支援这名巡警的伦敦警察厅职员工会代表保罗·特平表示:“当这一问题被提交到严重不当行为听证会时,我很吃惊;但当听证会认定证据不足时,我并不吃惊。” 特平认为,这一申诉本不该被闹到那种地步。“一旦出现问题,就应该在尽可能早的时机、以最低的适当层级加以处理。” 伦敦警察厅表示,听证会后,已就此事的处理方式进行了“内部审查”。 警察厅解释称,关于猴子玩偶的最初申诉“已在局内进行调查,并已尽可能推进”。但调查未能查明在警察局内放置猴子毛绒玩偶的人。 这名印度裔巡警以遭受种族歧视和不当对待为由,在劳动法庭对伦敦警察厅启动了法律程序。另外,应本人要求,BBC未公开这名巡警的姓名。 但在正式审理开始之前,警方提出和解,并同意支付损害赔偿。 协议内容的详情属于机密,但赔偿金额据信约为35000英镑(约510万日元)。 巡警拒绝置评,也未向BBC透露任何协议内容的详情。 伦敦警察厅承认,2016年3月在法院“经过司法调解后”达成了和解。 “过时的文化” 负责专业技术与意识的伦敦警察厅副助理总监理查德·马丁表示,为改善对职员提出的有关歧视、欺凌、骚扰的投诉的处理方式,警方进行了“相当大的投入”,并引入了新的“内部举报”制度。 马丁副助理总监表示:“人们会怀有一种恐惧,担心一旦提出投诉,自己可能反遭不当对待——这一点我们很早以前就已经认识到了。且不论这种恐惧是否合理。” “这种情况从来不曾被容许,今后我们也将继续向警察厅职员极其明确地传达:对不当对待决不姑息,将开展调查,如果确有不当对待,将产生严重后果。” 然而,伦敦警察厅黑人警察协会会长珍妮特·希尔斯表示,从黑色猴子玩具的使用以及对这名亚裔巡警的对待来看,要走的路还很长。 希尔斯会长称,“猴子”事件“令人难以置信”、“不可接受”,并表示“我们如今仍在努力清除警察内部至今固守那种文化的过时的人”。 “这不是单纯的毛绒玩偶,而是被用来传达‘这就是我眼中的你’的毛绒玩偶。” 希尔斯会长指出,“那是种族歧视行为”。她补充说,做出这种事的人之所以能继续下去,是因为他们认为即便如此也能“逃脱追究”。 (英语报道 Officer accused of misconduct after making racist toy complaint)", "reference_summary": "職場での「人種差別的な」サルのぬいぐるみについて懸念を提起したアジア系の巡査が、重大な不正行為があったとして逆に調査されていたことが、BBCニュースの取材でこのほど明らかになった。", "ref_zh": "一名就职场中“种族歧视性”猴子毛绒玩偶提出担忧的亚裔巡警,反而被以存在严重不当行为为由遭到调查——BBC新闻的采访日前揭露了这一事实。", "summaries": [{"summary_id": "39932207_01ab73ee", "summary": "ダニー・ショウ内政担当記者、BBCニュース 巡査は、ロンドン中心部のベルグレービア警察署で、警官のシャツを来た黒いサルのぬいぐるみを見つけたと話した。警察署長たちはこの件について調査すると約束したものの、後に、話をでっち上げたとしてこの巡査本人が逆に調査されることになった。巡査は後に、不正行為に関する聴聞会で疑念を晴らすことができた。", "zh": "内政事务记者丹尼·肖,BBC新闻 这名巡警称,他在伦敦市中心的贝尔格莱维亚警察局发现了一只穿着警察衬衫的黑色猴子毛绒玩偶。警察局长们虽然承诺就此事进行调查,但后来,这名巡警本人却被指编造了这一说法,反而遭到调查。这名巡警后来在有关不当行为的听证会上洗清了嫌疑。"}, {"summary_id": "39932207_24c86782", "summary": "子供が目指す将来の職業について、途上国の子供は英国男子よりも、高等教育を経た専門職を希望していることが、最近の国際的な調査で分かった。", "zh": "关于孩子们志向中的未来职业,最近一项国际调查显示,发展中国家的孩子比英国男孩更希望从事需经过高等教育的专业性职业。"}, {"summary_id": "39932207_26b95c4d", "summary": "ロンドン警視庁で、職場に置かれた人種差別的なサルのぬいぐるみについて懸念を提起したインド系の巡査が、逆に「虚偽の可能性がある」投稿として自ら調査対象とされていたことが明らかになった。巡査は内部聴聞会で疑念を晴らし、警察を相手取った訴訟で約35,000ポンドの損害賠償を得て和解した。警視庁側は苦情対応を改善したとするが、黒人警察官協会は「時代遅れの文化」がなお残っていると指摘している。", "zh": "在伦敦警察厅,一名就职场中摆放的种族歧视性猴子毛绒玩偶提出担忧的印度裔巡警,反而因发布“可能虚假”的言论而自己成为调查对象,此事已经曝光。这名巡警在内部听证会上洗清了嫌疑,并在起诉警方的诉讼中获得约35,000英镑的损害赔偿,达成和解。警察厅方面称已改善投诉处理方式,但黑人警察协会指出,“过时的文化”依然存在。"}, {"summary_id": "39932207_c5be3217", "summary": "職場での「人種差別的な」サルのぬいぐるみについて懸念を提起したアジア系の巡査が、重大な不正行為があったとして逆に調査されていたことが、BBCニュースの取材でこのほど明らかになった。", "zh": "一名就职场中“种族歧视性”猴子毛绒玩偶提出担忧的亚裔巡警,反而被以存在严重不当行为为由遭到调查——BBC新闻的采访日前揭露了这一事实。"}, {"summary_id": "39932207_de47b954", "summary": "ロンドン警視庁で、職場の人種差別的なサルのぬいぐるみについて懸念を提起したインド系の巡査が、逆に調査対象とされていたことが明らかになった。同警視庁はその後、ぬいぐるみを置いた人物として職員2人を特定し、懲戒解雇処分を下した。巡査は内部聴聞会で疑念を晴らし、損害賠償約35,000ポンドで和解した。", "zh": "在伦敦警察厅,一名就职场中种族歧视性猴子毛绒玩偶提出担忧的印度裔巡警,反而成为调查对象,此事已经曝光。该警察厅随后查明放置玩偶的是两名职员,并对其作出了纪律解雇处分。这名巡警在内部听证会上洗清了嫌疑,以约35,000英镑的损害赔偿达成和解。"}]}, {"article_id": "44026917", "url": "https://www.bbc.com/japanese/44026917", "title": "エールフランス航空の存続は「五分五分」＝仏経済相 賃上げスト続く", "title_zh": "法国航空能否存续“五五开”=法国经济部长 要求加薪的罢工持续", "text": "労使交渉決裂で辞任に追い込まれたジャンマルク・ジャナイヤック会長兼CEO ストは7日で14日目に突入している。 フランスのニュース番組BFMに出演したル・メール氏は、「私は不当な賃上げを要求している客室乗務員や地上勤務社員、パイロット全員に責任ある行動を求める」と発言した。 その上で、「エールフランスが存続できるかは五分五分だ」と述べた一方、フランス政府は同社の負債のバックネット役にはならないとしている。 エールフランスKLMは、200
