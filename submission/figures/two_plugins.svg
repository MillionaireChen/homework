<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620"><defs><marker id="arrow-4A76D4" markerWidth="10" markerHeight="10" refX="8.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8.5,3 z" fill="#4A76D4"/></marker><marker id="arrow-D98C3F" markerWidth="10" markerHeight="10" refX="8.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8.5,3 z" fill="#D98C3F"/></marker></defs><rect width="1180" height="620" fill="#FFFFFF"/><path d="M 520,160 L 320,204" fill="none" stroke="#4A76D4" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-4A76D4)"/><path d="M 660,160 L 860,204" fill="none" stroke="#D98C3F" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-D98C3F)"/><text x="590" y="48.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#1A2233" text-anchor="middle">One design, two plugins</text><text x="590" y="76.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A6C7D" text-anchor="middle">Built for two hosts, run over all 250 pairs, neither seeing the other's output.</text><rect x="440" y="106" width="300" height="54" rx="8" fill="#FFFFFF" stroke="#1A2233" stroke-width="1.3" fill-opacity="1"/><text x="590" y="137.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A2233" text-anchor="middle">one design</text><rect x="120" y="204" width="400" height="104" rx="8" fill="#E8F0FE" stroke="#4A76D4" stroke-width="1.3" fill-opacity="1"/><text x="320" y="249.28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1A2233" text-anchor="middle">PLUGIN A — Claude Code</text><text x="320" y="270.72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1A2233" text-anchor="middle">85 terminal · 165 scored</text><rect x="660" y="204" width="400" height="104" rx="8" fill="#FDF0E6" stroke="#D98C3F" stroke-width="1.3" fill-opacity="1"/><text x="860" y="249.28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1A2233" text-anchor="middle">PLUGIN B — Codex</text><text x="860" y="270.72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1A2233" text-anchor="middle">82 terminal · 168 scored</text><rect x="120" y="352" width="940" height="132" rx="8" fill="#E9F6EC" stroke="#4C9A5E" stroke-width="1.3" fill-opacity="1"/><text x="146" y="383" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#4C9A5E" text-anchor="start">cross-validation</text><rect x="150" y="400" width="208" height="70" rx="8" fill="#FFFFFF" stroke="#4C9A5E" stroke-width="1.3" fill-opacity="1"/><text x="254" y="460.96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1A2233" text-anchor="middle">same routing</text><text x="254" y="426" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A2233" text-anchor="middle">90.0%</text><rect x="378" y="400" width="208" height="70" rx="8" fill="#FFFFFF" stroke="#4C9A5E" stroke-width="1.3" fill-opacity="1"/><text x="482" y="460.96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1A2233" text-anchor="middle">same category when both stop</text><text x="482" y="426" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A2233" text-anchor="middle">100%</text><rect x="606" y="400" width="208" height="70" rx="8" fill="#FFFFFF" stroke="#4C9A5E" stroke-width="1.3" fill-opacity="1"/><text x="710" y="460.96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1A2233" text-anchor="middle">score correlation</text><text x="710" y="426" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A2233" text-anchor="middle">0.897</text><rect x="834" y="400" width="208" height="70" rx="8" fill="#FFFFFF" stroke="#4C9A5E" stroke-width="1.3" fill-opacity="1"/><text x="938" y="460.96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1A2233" text-anchor="middle">mean difference of 100</text><text x="938" y="426" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A2233" text-anchor="middle">7.25</text><text x="590" y="526.54" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1A2233" text-anchor="middle">The 25 disagreements do not overlap: A stops 14 factual reversals B cannot see,</text><text x="590" y="543.96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1A2233" text-anchor="middle">B stops 11 truncations A scores as a penalty instead.</text></svg>
