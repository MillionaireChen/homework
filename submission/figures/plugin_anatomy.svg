<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600"><defs><marker id="arrow-4A76D4" markerWidth="10" markerHeight="10" refX="8.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8.5,3 z" fill="#4A76D4"/></marker><marker id="arrow-4C9A5E" markerWidth="10" markerHeight="10" refX="8.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8.5,3 z" fill="#4C9A5E"/></marker><marker id="arrow-D98C3F" markerWidth="10" markerHeight="10" refX="8.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8.5,3 z" fill="#D98C3F"/></marker></defs><rect width="1180" height="600" fill="#FFFFFF"/><path d="M 590,166 L 590,200" fill="none" stroke="#4A76D4" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-4A76D4)"/><path d="M 500,268 L 325,316" fill="none" stroke="#4C9A5E" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-4C9A5E)"/><path d="M 680,268 L 855,316" fill="none" stroke="#D98C3F" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-D98C3F)"/><text x="590" y="48.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#1A2233" text-anchor="middle">The evaluator ships as a plugin</text><text x="590" y="76.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A6C7D" text-anchor="middle">One install, one command. The plugin runs its own scripts and spawns its own agents.</text><rect x="400" y="106" width="380" height="60" rx="8" fill="#E8F0FE" stroke="#4A76D4" stroke-width="1.3" fill-opacity="1"/><text x="590" y="140.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A2233" text-anchor="middle">/evaluate-summaries</text><rect x="350" y="200" width="480" height="68" rx="8" fill="#FDF0E6" stroke="#D98C3F" stroke-width="1.3" fill-opacity="1"/><text x="590" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1A2233" text-anchor="middle">skill: evaluate-summary-quality</text><rect x="90" y="316" width="470" height="190" rx="8" fill="#E9F6EC" stroke="#4C9A5E" stroke-width="1.3" fill-opacity="1"/><text x="116" y="347" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#4C9A5E" text-anchor="start">scripts — deterministic</text><text x="116" y="385.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1A2233" text-anchor="start">hard_gate.py</text><text x="116" y="417.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1A2233" text-anchor="start">embedding_gate.py</text><text x="116" y="449.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1A2233" text-anchor="start">validate_result.py</text><text x="116" y="481.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1A2233" text-anchor="start">rank_results.py</text><rect x="620" y="316" width="470" height="190" rx="8" fill="#FDF0E6" stroke="#D98C3F" stroke-width="1.3" fill-opacity="1"/><text x="646" y="347" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#D98C3F" text-anchor="start">agents — one job each</text><text x="646" y="385.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1A2233" text-anchor="start">grounding-gate</text><text x="646" y="417.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1A2233" text-anchor="start">scorer</text><text x="646" y="449.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1A2233" text-anchor="start">reviewer</text><text x="646" y="481.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1A2233" text-anchor="start">reporter</text><text x="590" y="543.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="italic" fill="#5A6C7D" text-anchor="middle">Each agent runs in a fresh context: the reviewer never inherits the scorer's reasoning.</text></svg>
