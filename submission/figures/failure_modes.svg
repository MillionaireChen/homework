<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="762" viewBox="0 0 1200 762"><defs><marker id="a-4A76D4" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4A76D4"/></marker><marker id="a-D98C3F" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#D98C3F"/></marker><marker id="a-4C9A5E" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4C9A5E"/></marker><marker id="a-C0392B" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#C0392B"/></marker><marker id="a-7B61A8" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7B61A8"/></marker><marker id="a-5A6C7D" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#5A6C7D"/></marker><marker id="a-333333" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333333"/></marker></defs><rect width="1200" height="762" fill="#FFFFFF"/><text x="600" y="32" font-family="Helvetica Neue" font-size="19" font-weight="bold" fill="#1A2233" text-anchor="middle" >What the data contains, and which detector each failure needs</text><text x="600" y="53" font-family="Helvetica Neue" font-size="10.5" font-weight="normal" fill="#5A6C7D" text-anchor="middle" >Found by reading all 250 candidates against their articles. Counts are what the corpus holds, established offline by exact comparison.</text><rect x="48" y="72" width="356" height="320" rx="5" fill="#E8F0FE" stroke="#4A76D4" stroke-width="1.3"/><text x="226.0" y="94" font-family="Helvetica Neue" font-size="11.5" font-weight="bold" fill="#4A76D4" text-anchor="middle" >CHEAP AND CERTAIN</text><text x="226.0" y="110" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#4A76D4" text-anchor="middle" >a string test proves it</text><rect x="420" y="72" width="356" height="320" rx="5" fill="#FDF0E6" stroke="#D98C3F" stroke-width="1.3"/><text x="598.0" y="94" font-family="Helvetica Neue" font-size="11.5" font-weight="bold" fill="#D98C3F" text-anchor="middle" >CHEAP AND DIRECTIONAL</text><text x="598.0" y="110" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#D98C3F" text-anchor="middle" >an embedding hints, never decides</text><rect x="792" y="72" width="360" height="320" rx="5" fill="#FBE3E3" stroke="#C0392B" stroke-width="1.3"/><text x="972.0" y="94" font-family="Helvetica Neue" font-size="11.5" font-weight="bold" fill="#C0392B" text-anchor="middle" >EXPENSIVE AND NECESSARY</text><text x="972.0" y="110" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#C0392B" text-anchor="middle" >only reading the article decides</text><rect x="64" y="124" width="324" height="104" rx="3" fill="#FFFFFF" stroke="#4A76D4" stroke-width="1.3"/><text x="76" y="144" font-family="Helvetica Neue" font-size="10.5" font-weight="bold" fill="#1A2233" text-anchor="start" >Verbatim copy of the article</text><text x="76" y="161" font-family="Helvetica Neue" font-size="11" font-weight="bold" fill="#4A76D4" text-anchor="start" >51 in corpus</text><text x="76" y="179.0" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >The candidate is the article's own opening block,</text><text x="76" y="191.5" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >caption and byline included. One even reproduces</text><text x="76" y="204.0" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >a typo from the source.</text><text x="76" y="216.5" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >Detector: normalized containment + shingle coverage</text><rect x="64" y="244" width="324" height="104" rx="3" fill="#FFFFFF" stroke="#4A76D4" stroke-width="1.3"/><text x="76" y="264" font-family="Helvetica Neue" font-size="10.5" font-weight="bold" fill="#1A2233" text-anchor="start" >Truncated fragment</text><text x="76" y="281" font-family="Helvetica Neue" font-size="11" font-weight="bold" fill="#4A76D4" text-anchor="start" >17 in corpus</text><text x="76" y="299.0" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >A reference summary cut mid-sentence. Two kinds:</text><text x="76" y="311.5" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >· amputated mid-token — visibly broken</text><text x="76" y="324.0" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >· noun-final (taigen-dome) — reads as headline register</text><text x="76" y="336.5" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >Detector: final character + unclosed delimiter</text><text x="64" y="368" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#5A6C7D" text-anchor="start" >Over three sentences — 0 here, kept for production traffic.</text><rect x="436" y="124" width="324" height="224" rx="3" fill="#FFFFFF" stroke="#D98C3F" stroke-width="1.3"/><text x="448" y="144" font-family="Helvetica Neue" font-size="10.5" font-weight="bold" fill="#1A2233" text-anchor="start" >Wrong article entirely</text><text x="448" y="161" font-family="Helvetica Neue" font-size="11" font-weight="bold" fill="#D98C3F" text-anchor="start" >16 in corpus</text><text x="448" y="179.0" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >Each is another article's reference summary filed</text><text x="448" y="191.5" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >under this one. No shared actor, place or event.</text><text x="448" y="204.0" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" ></text><text x="448" y="216.5" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >Embedding separation, measured offline:</text><text x="448" y="229.0" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >   matched      0.71 - 0.87   mean 0.80</text><text x="448" y="241.5" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >   mismatched   0.16 - 0.40   mean 0.27</text><text x="448" y="254.0" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >   gap 0.31, reproduced on two disjoint samples</text><text x="448" y="266.5" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" ></text><text x="448" y="279.0" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >The embedding NOMINATES, a reviewer confirms:</text><text x="448" y="291.5" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >19 nominated, 16 confirmed, 3 correctly released.</text><text x="436" y="368" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#8A4B00" text-anchor="start" >Similarity cannot grade quality — a copy, a hallucination</text><text x="436" y="380" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#8A4B00" text-anchor="start" >and a reversal all stay highly similar to their article.</text><rect x="808" y="124" width="328" height="104" rx="3" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.3"/><text x="820" y="144" font-family="Helvetica Neue" font-size="10.5" font-weight="bold" fill="#1A2233" text-anchor="start" >Factual reversal</text><text x="820" y="162.0" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >Asserts the opposite of the central event:</text><text x="820" y="174.5" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >closure announced -&gt; called off · settled -&gt; refused</text><text x="820" y="187.0" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >Fluent, on topic, right length, not copied.</text><text x="820" y="199.5" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >Detector: grounding-gate agent + reviewer</text><rect x="808" y="244" width="328" height="132" rx="3" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.3"/><text x="820" y="264" font-family="Helvetica Neue" font-size="10.5" font-weight="bold" fill="#1A2233" text-anchor="start" >Fabricated content</text><text x="820" y="282.0" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >An invented event, quotation or figure — almost</text><text x="820" y="294.5" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >always ATTACHED to a correct main event, which</text><text x="820" y="307.0" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >makes it the hardest category to adjudicate.</text><text x="820" y="328" font-family="Helvetica Neue" font-size="10.5" font-weight="bold" fill="#1A2233" text-anchor="start" >Entity and number substitution</text><text x="820" y="344.0" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >Mashhad -&gt; Tabriz · 52 -&gt; 72 arrests · Russia -&gt; Iran</text><text x="820" y="356.5" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#1A2233" text-anchor="start" >Detector: atomic claim checks with cited spans</text><text x="48" y="418" font-family="Helvetica Neue" font-size="13" font-weight="bold" fill="#7B241C" text-anchor="start" >THE LINE THAT DECIDES SEVERITY — centrality, not conspicuousness</text><rect x="48" y="430" width="540" height="158" rx="4" fill="#FBE3E3" stroke="#C0392B" stroke-width="1.3"/><text x="60" y="450" font-family="Helvetica Neue" font-size="10.5" font-weight="bold" fill="#7B241C" text-anchor="start" >CENTRAL DEFECT → terminal, score 0</text><text x="60" y="468" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#7B241C" text-anchor="start" >the main event is negated, the outcome inverted, or the</text><text x="60" y="481" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#7B241C" text-anchor="start" >invented text DISPLACES what the article says.</text><text x="60" y="494" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#7B241C" text-anchor="start" ></text><text x="60" y="507" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#7B241C" text-anchor="start" >Worked example — 41875333_aa36a21a</text><text x="60" y="520" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#7B241C" text-anchor="start" >Headline: "the US stresses its resolve". Body: "no dictator should</text><text x="60" y="533" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#7B241C" text-anchor="start" >underestimate US resolve". The candidate instead quotes "the US is</text><text x="60" y="546" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#7B241C" text-anchor="start" >no longer the world's policeman" — absent, and opposite. Terminal.</text><text x="60" y="559" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#7B241C" text-anchor="start" >A sibling that compressed the real sentence scored 95.</text><rect x="608" y="430" width="544" height="158" rx="4" fill="#FFF6EC" stroke="#D98C3F" stroke-width="1.3"/><text x="620" y="450" font-family="Helvetica Neue" font-size="10.5" font-weight="bold" fill="#8A4B00" text-anchor="start" >PERIPHERAL DEFECT → stays in scoring, heavy faithfulness penalty</text><text x="620" y="468" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#8A4B00" text-anchor="start" >a wrong secondary entity or figure, or one invented claim</text><text x="620" y="481" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#8A4B00" text-anchor="start" >standing BESIDE a correctly stated central event.</text><text x="620" y="494" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#8A4B00" text-anchor="start" ></text><text x="620" y="507" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#8A4B00" text-anchor="start" >Worked example — 50469832_8a6e1840</text><text x="620" y="520" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#8A4B00" text-anchor="start" >Sentence 1 states the real policy shift correctly. Sentence 2</text><text x="620" y="533" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#8A4B00" text-anchor="start" >invents an emergency UN Security Council session and a</text><text x="620" y="546" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#8A4B00" text-anchor="start" >unanimous condemnation, chained on with "in response to this".</text><text x="620" y="559" font-family="Helvetica Neue" font-size="8.8" font-weight="normal" fill="#8A4B00" text-anchor="start" >Not terminal: faithfulness 12 of 50, total 50, MIXED.</text><text x="48" y="606" font-family="Helvetica Neue" font-size="10" font-weight="bold" fill="#5A6C7D" text-anchor="start" >Deletion test — remove the defective sentence: if the summary still stands, the defect is peripheral.</text><text x="48" y="638" font-family="Helvetica Neue" font-size="12" font-weight="bold" fill="#1F5B2E" text-anchor="start" >WHAT THE RUN SHOWED ABOUT THIS LINE</text><rect x="48" y="650" width="1104" height="92" rx="4" fill="#E9F6EC" stroke="#4C9A5E" stroke-width="1.3"/><text x="60" y="670" font-family="Helvetica Neue" font-size="9" font-weight="normal" fill="#1F5B2E" text-anchor="start" >All 8 FABRICATED_CONTENT proposals from the gate were released at grounding review. The scorer's claim audit then re-proposed 4 of them —</text><text x="60" y="684" font-family="Helvetica Neue" font-size="9" font-weight="normal" fill="#1F5B2E" text-anchor="start" >every one a candidate the gate layer had let go — and 1 was confirmed terminal. Reversal and off-topic behaved oppositely: 13 and 16 proposals, 100% confirmed.</text><text x="60" y="698" font-family="Helvetica Neue" font-size="9" font-weight="normal" fill="#1F5B2E" text-anchor="start" ></text><text x="60" y="712" font-family="Helvetica Neue" font-size="9" font-weight="normal" fill="#1F5B2E" text-anchor="start" >Reading: reversal and off-topic are central by construction. Fabrication usually is not, so the gate-level fabrication rubric is tuned conservatively</text><text x="60" y="726" font-family="Helvetica Neue" font-size="9" font-weight="normal" fill="#1F5B2E" text-anchor="start" >and the claim-level backstop is what actually catches the central cases.</text></svg>