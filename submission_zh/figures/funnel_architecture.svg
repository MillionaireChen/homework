<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="872" viewBox="0 0 1200 872"><defs><marker id="a-4A76D4" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4A76D4"/></marker><marker id="a-D98C3F" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#D98C3F"/></marker><marker id="a-4C9A5E" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4C9A5E"/></marker><marker id="a-C0392B" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#C0392B"/></marker><marker id="a-7B61A8" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7B61A8"/></marker><marker id="a-5A6C7D" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#5A6C7D"/></marker><marker id="a-333333" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333333"/></marker></defs><rect width="1200" height="872" fill="#FFFFFF"/><text x="600" y="32" font-family="Helvetica Neue" font-size="20" font-weight="bold" fill="#1A2233" text-anchor="middle" >Reference-free summary quality funnel</text><text x="600" y="54" font-family="Helvetica Neue" font-size="10.5" font-weight="normal" fill="#5A6C7D" text-anchor="middle" >Input is one (article, candidate summary) pair. No reference summary at any runtime stage. Nothing terminates without an independent reviewer confirming it.</text><rect x="30" y="72" width="1140" height="150" rx="5" fill="#E8F0FE" stroke="#4A76D4" stroke-width="1.3"/><text x="44" y="91" font-family="Helvetica Neue" font-size="12" font-weight="bold" fill="#4A76D4" text-anchor="start" >LAYER 1 — PHYSICAL HARD CONSTRAINTS   deterministic, no model</text><rect x="30" y="234" width="1140" height="252" rx="5" fill="#FDF0E6" stroke="#D98C3F" stroke-width="1.3"/><text x="44" y="253" font-family="Helvetica Neue" font-size="12" font-weight="bold" fill="#D98C3F" text-anchor="start" >LAYER 2 — SEMANTIC HARD CONSTRAINT   agent judgment, still terminal</text><rect x="30" y="502" width="1140" height="238" rx="5" fill="#E9F6EC" stroke="#4C9A5E" stroke-width="1.3"/><text x="44" y="521" font-family="Helvetica Neue" font-size="12" font-weight="bold" fill="#4C9A5E" text-anchor="start" >LAYER 3 — SOFT SCORING   graded quality, survivors only</text><rect x="30" y="752" width="1140" height="106" rx="5" fill="#F0EDF7" stroke="#7B61A8" stroke-width="1.3"/><text x="44" y="771" font-family="Helvetica Neue" font-size="12" font-weight="bold" fill="#7B61A8" text-anchor="start" >OUTPUT   validation, ranking, reporting</text><rect x="48" y="96" width="148" height="62" rx="3" fill="#FFFFFF" stroke="#333333" stroke-width="1.3"/><text x="58" y="116" font-family="Helvetica Neue" font-size="10.5" font-weight="bold" fill="#1A2233" text-anchor="start" >INPUT</text><text x="58" y="131" font-family="Helvetica Neue" font-size="10.5" font-weight="bold" fill="#1A2233" text-anchor="start" >(article, candidate)</text><text x="58" y="146" font-family="Helvetica Neue" font-size="10.5" font-weight="bold" fill="#1A2233" text-anchor="start" >250 pairs = 50 x 5</text><rect x="232" y="92" width="316" height="70" rx="3" fill="#FFFFFF" stroke="#4A76D4" stroke-width="1.3"/><text x="244" y="110.0" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >hard_gate.py — string tests only</text><text x="244" y="123.5" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >empty · over 3 sentences · continuous copy</text><text x="244" y="137.0" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >trailing comma · unclosed delimiter</text><text x="244" y="152" font-family="Helvetica Neue" font-size="9" font-weight="normal" fill="#5A6C7D" text-anchor="start" >proposes, never decides</text><rect x="586" y="96" width="196" height="62" rx="3" fill="#FFF8E1" stroke="#C8A415" stroke-width="1.3"/><text x="598" y="116" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >summary-reviewer</text><text x="598" y="130" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >terminal pass</text><text x="598" y="144" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >re-derives the evidence itself</text><rect x="822" y="92" width="326" height="70" rx="3" fill="#FBE3E3" stroke="#C0392B" stroke-width="1.3"/><text x="834" y="110" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#7B241C" text-anchor="start" >TERMINAL</text><text x="834" y="124" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#7B241C" text-anchor="start" >VERBATIM_SOURCE_COPY  tier 1</text><text x="834" y="138" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#7B241C" text-anchor="start" >OBVIOUS_TRUNCATION  tier 2</text><text x="834" y="152" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#7B241C" text-anchor="start" >OVER_SENTENCE_LIMIT  tier 3</text><text x="48" y="208" font-family="Helvetica Neue" font-size="9" font-weight="normal" fill="#5A6C7D" text-anchor="start" >Ordinary entity, number or quotation overlap is not copying. A particle ending is suspicion, not proof. A REJECT sends the candidate onward.</text><rect x="48" y="262" width="318" height="86" rx="3" fill="#FFFFFF" stroke="#5A6C7D" stroke-width="1.3" stroke-dasharray="5,3"/><text x="60" y="280" font-family="Helvetica Neue" font-size="9" font-weight="normal" fill="#5A6C7D" text-anchor="start" >embedding_gate.py — optional hint</text><text x="60" y="293" font-family="Helvetica Neue" font-size="9" font-weight="normal" fill="#5A6C7D" text-anchor="start" >qwen3-embedding:0.6b</text><text x="60" y="306" font-family="Helvetica Neue" font-size="9" font-weight="normal" fill="#5A6C7D" text-anchor="start" >candidate vs its OWN article only</text><text x="60" y="319" font-family="Helvetica Neue" font-size="9" font-weight="normal" fill="#5A6C7D" text-anchor="start" >no cross-article rank, no margin</text><text x="60" y="338" font-family="Helvetica Neue" font-size="9.5" font-weight="bold" fill="#5A6C7D" text-anchor="start" >NEVER TERMINAL</text><rect x="400" y="262" width="428" height="86" rx="3" fill="#FFFFFF" stroke="#D98C3F" stroke-width="1.3"/><text x="412" y="280.0" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >summary-grounding-gate  (agent)</text><text x="412" y="293.5" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >one question: is the candidate grounded in its article?</text><text x="412" y="307.0" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >OFF_TOPIC · FACTUAL_REVERSAL · FABRICATED_CONTENT</text><text x="412" y="320.5" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >never sees the anchor, the rubric, or another article</text><text x="412" y="334.0" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >never produces a score</text><rect x="862" y="262" width="286" height="58" rx="3" fill="#FFF8E1" stroke="#C8A415" stroke-width="1.3"/><text x="874" y="282" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >summary-reviewer — grounding pass</text><text x="874" y="296" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >reproduces both cited spans itself</text><rect x="862" y="352" width="286" height="72" rx="3" fill="#FBE3E3" stroke="#C0392B" stroke-width="1.3"/><text x="874" y="372" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#7B241C" text-anchor="start" >TERMINAL  tier 0</text><text x="874" y="386" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#7B241C" text-anchor="start" >OFF_TOPIC</text><text x="874" y="400" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#7B241C" text-anchor="start" >FACTUAL_REVERSAL</text><text x="874" y="414" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#7B241C" text-anchor="start" >FABRICATED_CONTENT</text><rect x="48" y="358" width="780" height="92" rx="3" fill="#FFF3E0" stroke="#D98C3F" stroke-width="1.3" stroke-dasharray="5,3"/><text x="60" y="376" font-family="Helvetica Neue" font-size="11" font-weight="bold" fill="#8A4B00" text-anchor="start" >THE CENTRALITY BOUNDARY</text><text x="60" y="393.0" font-family="Helvetica Neue" font-size="9" font-weight="normal" fill="#8A4B00" text-anchor="start" >Terminal only when the defect is CENTRAL: main event negated,</text><text x="60" y="405.5" font-family="Helvetica Neue" font-size="9" font-weight="normal" fill="#8A4B00" text-anchor="start" >outcome inverted, or the core claim invented.</text><text x="60" y="418.0" font-family="Helvetica Neue" font-size="9" font-weight="normal" fill="#8A4B00" text-anchor="start" >A wrong peripheral figure, a wrong secondary entity, or one added</text><text x="60" y="430.5" font-family="Helvetica Neue" font-size="9" font-weight="normal" fill="#8A4B00" text-anchor="start" >unsupported detail stays GROUNDED and costs faithfulness points.</text><text x="60" y="443.0" font-family="Helvetica Neue" font-size="9" font-weight="normal" fill="#8A4B00" text-anchor="start" >Deletion test: remove the bad sentence — does the summary still stand?</text><text x="48" y="464" font-family="Helvetica Neue" font-size="9" font-weight="normal" fill="#5A6C7D" text-anchor="start" >Why a separate agent: the most dangerous candidate is fluent, on topic, correct length, not copied — and asserts the opposite of the</text><text x="48" y="476" font-family="Helvetica Neue" font-size="9" font-weight="normal" fill="#5A6C7D" text-anchor="start" >article. String rules cannot see it, and embedding similarity stays HIGH precisely because the subject matter is right.</text><rect x="48" y="530" width="352" height="76" rx="3" fill="#FFFFFF" stroke="#4C9A5E" stroke-width="1.3"/><text x="60" y="548.0" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >anchor pass  (article only)</text><text x="60" y="561.5" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >main_event + key_facts + anchor_summary</text><text x="60" y="575.0" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >one per article, cached, generated BEFORE candidates</text><text x="60" y="588.5" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >a coverage aid, never ground truth</text><rect x="434" y="530" width="394" height="76" rx="3" fill="#FFFFFF" stroke="#4C9A5E" stroke-width="1.3"/><text x="446" y="548.0" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >summary-scorer</text><text x="446" y="561.5" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >atomic claim checks with cited source spans</text><text x="446" y="575.0" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >SUPPORTED · CONTRADICTED · NOT_IN_SOURCE</text><text x="446" y="588.5" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >faithfulness 50 | coverage 30 | coherence 15 | conciseness 5</text><rect x="862" y="530" width="286" height="76" rx="3" fill="#FFF8E1" stroke="#C8A415" stroke-width="1.3"/><text x="874" y="548" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >summary-reviewer</text><text x="874" y="562" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >soft-score pass</text><text x="874" y="576" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >rechecks every claim,</text><text x="874" y="590" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >arithmetic and label band</text><rect x="48" y="624" width="690" height="76" rx="3" fill="#FFF8E1" stroke="#C8A415" stroke-width="1.3" stroke-dasharray="5,3"/><text x="60" y="642" font-family="Helvetica Neue" font-size="11" font-weight="bold" fill="#7A5C00" text-anchor="start" >SEMANTIC BACKSTOP</text><text x="60" y="659" font-family="Helvetica Neue" font-size="9" font-weight="normal" fill="#7A5C00" text-anchor="start" >A claim-by-claim audit exposes what the gate missed.</text><text x="60" y="672" font-family="Helvetica Neue" font-size="9" font-weight="normal" fill="#7A5C00" text-anchor="start" >The Scorer may PROPOSE a semantic terminal; the Reviewer may ESCALATE.</text><text x="60" y="685" font-family="Helvetica Neue" font-size="9" font-weight="normal" fill="#7A5C00" text-anchor="start" >This run: fired 4 times, all on candidates the gate layer had released, 1 confirmed.</text><rect x="772" y="624" width="376" height="76" rx="3" fill="#E9F6EC" stroke="#4C9A5E" stroke-width="1.3"/><text x="784" y="648" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1F5B2E" text-anchor="start" >EXCELLENT 90-100  ·  GOOD 75-89  ·  FINE 65-74</text><text x="784" y="668" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1F5B2E" text-anchor="start" >MIXED 50-64  ·  POOR 0-49</text><text x="48" y="722" font-family="Helvetica Neue" font-size="9" font-weight="normal" fill="#5A6C7D" text-anchor="start" >REVISE — one Scorer revision, then reviewed again. Unresolved disagreement is preserved as LOW_CONFIDENCE, never silently averaged.</text><rect x="48" y="780" width="262" height="60" rx="3" fill="#FFFFFF" stroke="#7B61A8" stroke-width="1.3"/><text x="60" y="799" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >validate_result.py</text><text x="60" y="812" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >schema · ranges</text><text x="60" y="825" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >dimension sums · trace</text><rect x="333" y="780" width="262" height="60" rx="3" fill="#FFFFFF" stroke="#7B61A8" stroke-width="1.3"/><text x="345" y="799" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >rank_results.py</text><text x="345" y="812" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >within-article order:</text><text x="345" y="825" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >terminal tiers, then score</text><rect x="618" y="780" width="262" height="60" rx="3" fill="#FFFFFF" stroke="#7B61A8" stroke-width="1.3"/><text x="630" y="799" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >make_report_charts.py</text><text x="630" y="812" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >deterministic stats</text><text x="630" y="825" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >and charts</text><rect x="903" y="780" width="262" height="60" rx="3" fill="#FFFFFF" stroke="#7B61A8" stroke-width="1.3"/><text x="915" y="799" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >summary-reporter</text><text x="915" y="812" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >writes the conclusion only,</text><text x="915" y="825" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >never invents a number</text><line x1="196" y1="127" x2="228" y2="127" stroke="#333333" stroke-width="1.6" marker-end="url(#a-333333)"/><line x1="548" y1="127" x2="582" y2="127" stroke="#333333" stroke-width="1.6" marker-end="url(#a-333333)"/><text x="802" y="84" font-family="Helvetica Neue" font-size="8.5" font-weight="normal" fill="#C0392B" text-anchor="middle" >APPROVE</text><line x1="782" y1="127" x2="818" y2="127" stroke="#C0392B" stroke-width="1.6" marker-end="url(#a-C0392B)"/><path d="M684,158 L684,186 L560,186 L560,258" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#a-333333)"/><text x="692" y="178" font-family="Helvetica Neue" font-size="8.5" font-weight="normal" fill="#5A6C7D" text-anchor="start" >REJECT / passed</text><line x1="366" y1="300" x2="396" y2="300" stroke="#5A6C7D" stroke-width="1.6" marker-end="url(#a-5A6C7D)" stroke-dasharray="4,3"/><text x="381" y="293" font-family="Helvetica Neue" font-size="8" font-weight="normal" fill="#5A6C7D" text-anchor="middle" >hint</text><line x1="828" y1="296" x2="858" y2="296" stroke="#D98C3F" stroke-width="1.6" marker-end="url(#a-D98C3F)"/><line x1="1005" y1="320" x2="1005" y2="348" stroke="#C0392B" stroke-width="1.6" marker-end="url(#a-C0392B)"/><text x="1013" y="340" font-family="Helvetica Neue" font-size="8.5" font-weight="normal" fill="#C0392B" text-anchor="start" >APPROVE</text><path d="M862,291 L842,291 L842,494 L224,494 L224,526" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#a-333333)"/><text x="560" y="489" font-family="Helvetica Neue" font-size="8.5" font-weight="normal" fill="#5A6C7D" text-anchor="start" >GROUNDED / REJECT</text><line x1="400" y1="568" x2="430" y2="568" stroke="#4C9A5E" stroke-width="1.6" marker-end="url(#a-4C9A5E)"/><line x1="828" y1="568" x2="858" y2="568" stroke="#4C9A5E" stroke-width="1.6" marker-end="url(#a-4C9A5E)"/><path d="M1148,552 L1176,552 L1176,402 L1152,402" fill="none" stroke="#C0392B" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#a-C0392B)"/><text x="1170" y="478" font-family="Helvetica Neue" font-size="8" font-weight="normal" fill="#C0392B" text-anchor="end" >ESCALATE</text><path d="M1005,606 L1005,738 L179,738 L179,776" fill="none" stroke="#4C9A5E" stroke-width="1.5" marker-end="url(#a-4C9A5E)"/><line x1="310" y1="810" x2="333" y2="810" stroke="#7B61A8" stroke-width="1.6" marker-end="url(#a-7B61A8)"/><line x1="595" y1="810" x2="618" y2="810" stroke="#7B61A8" stroke-width="1.6" marker-end="url(#a-7B61A8)"/><line x1="880" y1="810" x2="903" y2="810" stroke="#7B61A8" stroke-width="1.6" marker-end="url(#a-7B61A8)"/></svg>