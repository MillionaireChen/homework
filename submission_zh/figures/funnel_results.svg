<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><defs><marker id="a-4A76D4" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4A76D4"/></marker><marker id="a-D98C3F" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#D98C3F"/></marker><marker id="a-4C9A5E" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4C9A5E"/></marker><marker id="a-C0392B" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#C0392B"/></marker><marker id="a-7B61A8" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7B61A8"/></marker><marker id="a-5A6C7D" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#5A6C7D"/></marker><marker id="a-333333" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333333"/></marker></defs><rect width="1200" height="780" fill="#FFFFFF"/><text x="600" y="32" font-family="Helvetica Neue" font-size="19" font-weight="bold" fill="#1A2233" text-anchor="middle" >Funnel outcomes on the same 250 pairs — two independent implementations</text><text x="600" y="53" font-family="Helvetica Neue" font-size="10.5" font-weight="normal" fill="#5A6C7D" text-anchor="middle" >50 articles x 5 candidates. Neither used a reference summary at runtime; neither saw the other's output.</text><text x="48" y="88" font-family="Helvetica Neue" font-size="12" font-weight="bold" fill="#4A76D4" text-anchor="start" >IMPLEMENTATION A — Claude plugin  (two hard-constraint layers, grounding-gate agent)</text><rect x="48" y="100" width="520" height="38" rx="3" fill="#E8F0FE" stroke="#4A76D4" stroke-width="1.3"/><text x="62" y="124" font-family="Helvetica Neue" font-size="11" font-weight="bold" fill="#1A2233" text-anchor="start" >INPUT</text><text x="554" y="124" font-family="Helvetica Neue" font-size="13" font-weight="bold" fill="#4A76D4" text-anchor="end" >250</text><rect x="84" y="144" width="448" height="38" rx="3" fill="#E8F0FE" stroke="#4A76D4" stroke-width="1.3"/><text x="98" y="168" font-family="Helvetica Neue" font-size="11" font-weight="normal" fill="#1A2233" text-anchor="start" >passed string gates</text><text x="518" y="168" font-family="Helvetica Neue" font-size="13" font-weight="bold" fill="#4A76D4" text-anchor="end" >199</text><rect x="120" y="188" width="376" height="38" rx="3" fill="#E8F0FE" stroke="#4A76D4" stroke-width="1.3"/><text x="134" y="212" font-family="Helvetica Neue" font-size="11" font-weight="normal" fill="#1A2233" text-anchor="start" >passed grounding gate</text><text x="482" y="212" font-family="Helvetica Neue" font-size="13" font-weight="bold" fill="#4A76D4" text-anchor="end" >170</text><rect x="158" y="232" width="300" height="38" rx="3" fill="#E8F0FE" stroke="#4A76D4" stroke-width="1.3"/><text x="172" y="256" font-family="Helvetica Neue" font-size="11" font-weight="bold" fill="#1A2233" text-anchor="start" >SOFT-SCORED</text><text x="444" y="256" font-family="Helvetica Neue" font-size="13" font-weight="bold" fill="#4A76D4" text-anchor="end" >165</text><rect x="600" y="146" width="300" height="34" rx="3" fill="#FBE3E3" stroke="#C0392B" stroke-width="1.3"/><text x="612" y="160" font-family="Helvetica Neue" font-size="9" font-weight="bold" fill="#7B241C" text-anchor="start" >- 51 terminal</text><text x="612" y="173" font-family="Helvetica Neue" font-size="8.5" font-weight="normal" fill="#7B241C" text-anchor="start" >50 verbatim copy · 1 truncation</text><line x1="604" y1="163" x2="596" y2="163" stroke="#C0392B" stroke-width="1.6" marker-end="url(#a-C0392B)"/><rect x="600" y="190" width="300" height="34" rx="3" fill="#FBE3E3" stroke="#C0392B" stroke-width="1.3"/><text x="612" y="204" font-family="Helvetica Neue" font-size="9" font-weight="bold" fill="#7B241C" text-anchor="start" >- 29 terminal</text><text x="612" y="217" font-family="Helvetica Neue" font-size="8.5" font-weight="normal" fill="#7B241C" text-anchor="start" >16 off-topic · 13 factual reversal</text><line x1="640" y1="207" x2="596" y2="207" stroke="#C0392B" stroke-width="1.6" marker-end="url(#a-C0392B)"/><rect x="600" y="234" width="300" height="34" rx="3" fill="#FBE3E3" stroke="#C0392B" stroke-width="1.3"/><text x="612" y="248" font-family="Helvetica Neue" font-size="9" font-weight="bold" fill="#7B241C" text-anchor="start" >- 5 terminal  (reviewer backstop)</text><text x="612" y="261" font-family="Helvetica Neue" font-size="8.5" font-weight="normal" fill="#7B241C" text-anchor="start" >4 truncation stubs · 1 fabricated</text><line x1="678" y1="251" x2="596" y2="251" stroke="#C0392B" stroke-width="1.6" marker-end="url(#a-C0392B)"/><text x="930" y="118" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#4A76D4" text-anchor="start" >scores 35-98, median 79</text><text x="930" y="134" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#4A76D4" text-anchor="start" >EXC 28 · GOOD 66 · FINE 34 · MIXED 25 · POOR 12</text><text x="48" y="300" font-family="Helvetica Neue" font-size="12" font-weight="bold" fill="#D98C3F" text-anchor="start" >IMPLEMENTATION B — Codex plugin  (deterministic gates + relevance review, no grounding-gate agent)</text><rect x="48" y="312" width="520" height="38" rx="3" fill="#FDF0E6" stroke="#D98C3F" stroke-width="1.3"/><text x="62" y="336" font-family="Helvetica Neue" font-size="11" font-weight="bold" fill="#1A2233" text-anchor="start" >INPUT</text><text x="554" y="336" font-family="Helvetica Neue" font-size="13" font-weight="bold" fill="#D98C3F" text-anchor="end" >250</text><rect x="84" y="356" width="448" height="38" rx="3" fill="#FDF0E6" stroke="#D98C3F" stroke-width="1.3"/><text x="98" y="380" font-family="Helvetica Neue" font-size="11" font-weight="normal" fill="#1A2233" text-anchor="start" >passed deterministic gates</text><text x="518" y="380" font-family="Helvetica Neue" font-size="13" font-weight="bold" fill="#D98C3F" text-anchor="end" >197</text><rect x="120" y="400" width="376" height="38" rx="3" fill="#FDF0E6" stroke="#D98C3F" stroke-width="1.3"/><text x="134" y="424" font-family="Helvetica Neue" font-size="11" font-weight="normal" fill="#1A2233" text-anchor="start" >passed relevance review</text><text x="482" y="424" font-family="Helvetica Neue" font-size="13" font-weight="bold" fill="#D98C3F" text-anchor="end" >181</text><rect x="158" y="444" width="300" height="38" rx="3" fill="#FDF0E6" stroke="#D98C3F" stroke-width="1.3"/><text x="172" y="468" font-family="Helvetica Neue" font-size="11" font-weight="bold" fill="#1A2233" text-anchor="start" >SOFT-SCORED</text><text x="444" y="468" font-family="Helvetica Neue" font-size="13" font-weight="bold" fill="#D98C3F" text-anchor="end" >168</text><rect x="600" y="358" width="300" height="34" rx="3" fill="#FBE3E3" stroke="#C0392B" stroke-width="1.3"/><text x="612" y="372" font-family="Helvetica Neue" font-size="9" font-weight="bold" fill="#7B241C" text-anchor="start" >- 66 terminal in total</text><text x="612" y="385" font-family="Helvetica Neue" font-size="8.5" font-weight="normal" fill="#7B241C" text-anchor="start" >50 verbatim copy · 16 truncation</text><line x1="604" y1="375" x2="596" y2="375" stroke="#C0392B" stroke-width="1.6" marker-end="url(#a-C0392B)"/><rect x="600" y="402" width="300" height="34" rx="3" fill="#FBE3E3" stroke="#C0392B" stroke-width="1.3"/><text x="612" y="416" font-family="Helvetica Neue" font-size="9" font-weight="bold" fill="#7B241C" text-anchor="start" >- 16 terminal</text><text x="612" y="429" font-family="Helvetica Neue" font-size="8.5" font-weight="normal" fill="#7B241C" text-anchor="start" >16 off-topic  (19 suspects, 3 released)</text><line x1="640" y1="419" x2="596" y2="419" stroke="#C0392B" stroke-width="1.6" marker-end="url(#a-C0392B)"/><rect x="600" y="446" width="300" height="34" rx="3" fill="#FBE3E3" stroke="#C0392B" stroke-width="1.3"/><text x="612" y="460" font-family="Helvetica Neue" font-size="9" font-weight="bold" fill="#7B241C" text-anchor="start" >13 hard failures recovered</text><text x="612" y="473" font-family="Helvetica Neue" font-size="8.5" font-weight="normal" fill="#7B241C" text-anchor="start" >downstream by review</text><line x1="678" y1="463" x2="596" y2="463" stroke="#C0392B" stroke-width="1.6" marker-end="url(#a-C0392B)"/><text x="930" y="330" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#D98C3F" text-anchor="start" >scores 32-100, median 85</text><text x="930" y="346" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#D98C3F" text-anchor="start" >EXC 65 · GOOD 49 · MIXED 42 · POOR 12  (no FINE tier)</text><text x="48" y="520" font-family="Helvetica Neue" font-size="13" font-weight="bold" fill="#1F5B2E" text-anchor="start" >CROSS-VALIDATION — the two implementations against each other</text><rect x="48" y="534" width="262" height="84" rx="4" fill="#E9F6EC" stroke="#4C9A5E" stroke-width="1.3"/><text x="60" y="552" font-family="Helvetica Neue" font-size="9" font-weight="bold" fill="#1F5B2E" text-anchor="start" >ROUTING AGREEMENT</text><text x="60" y="574" font-family="Helvetica Neue" font-size="15" font-weight="bold" fill="#1F5B2E" text-anchor="start" >90.0%</text><text x="60" y="592" font-family="Helvetica Neue" font-size="8.5" font-weight="normal" fill="#1F5B2E" text-anchor="start" >225 of 250 routed the same way</text><text x="60" y="604" font-family="Helvetica Neue" font-size="8.5" font-weight="normal" fill="#1F5B2E" text-anchor="start" >71 both terminal · 154 both scored</text><rect x="330" y="534" width="262" height="84" rx="4" fill="#E9F6EC" stroke="#4C9A5E" stroke-width="1.3"/><text x="342" y="552" font-family="Helvetica Neue" font-size="9" font-weight="bold" fill="#1F5B2E" text-anchor="start" >TERMINAL CATEGORY</text><text x="342" y="574" font-family="Helvetica Neue" font-size="15" font-weight="bold" fill="#1F5B2E" text-anchor="start" >71 / 71 = 100%</text><text x="342" y="592" font-family="Helvetica Neue" font-size="8.5" font-weight="normal" fill="#1F5B2E" text-anchor="start" >where both terminated, both chose</text><text x="342" y="604" font-family="Helvetica Neue" font-size="8.5" font-weight="normal" fill="#1F5B2E" text-anchor="start" >the same category. Zero mismatches.</text><rect x="612" y="534" width="262" height="84" rx="4" fill="#E9F6EC" stroke="#4C9A5E" stroke-width="1.3"/><text x="624" y="552" font-family="Helvetica Neue" font-size="9" font-weight="bold" fill="#1F5B2E" text-anchor="start" >SCORE AGREEMENT</text><text x="624" y="574" font-family="Helvetica Neue" font-size="15" font-weight="bold" fill="#1F5B2E" text-anchor="start" >Spearman 0.897</text><text x="624" y="592" font-family="Helvetica Neue" font-size="8.5" font-weight="normal" fill="#1F5B2E" text-anchor="start" >on the 154 pairs both scored</text><text x="624" y="604" font-family="Helvetica Neue" font-size="8.5" font-weight="normal" fill="#1F5B2E" text-anchor="start" >mean absolute difference 7.2 of 100</text><rect x="894" y="534" width="262" height="84" rx="4" fill="#E9F6EC" stroke="#4C9A5E" stroke-width="1.3"/><text x="906" y="552" font-family="Helvetica Neue" font-size="9" font-weight="bold" fill="#1F5B2E" text-anchor="start" >WITHIN-ARTICLE ORDER</text><text x="906" y="574" font-family="Helvetica Neue" font-size="15" font-weight="bold" fill="#1F5B2E" text-anchor="start" >0 inversions / 50</text><text x="906" y="592" font-family="Helvetica Neue" font-size="8.5" font-weight="normal" fill="#1F5B2E" text-anchor="start" >no planted bad summary ranked</text><text x="906" y="604" font-family="Helvetica Neue" font-size="8.5" font-weight="normal" fill="#1F5B2E" text-anchor="start" >above a reference-grade one</text><text x="48" y="648" font-family="Helvetica Neue" font-size="12" font-weight="bold" fill="#7B241C" text-anchor="start" >ALL 25 DISAGREEMENTS ATTRIBUTE TO ONE RULE DIFFERENCE — and the two sets do not overlap</text><rect x="48" y="660" width="540" height="76" rx="4" fill="#EEF3FF" stroke="#4A76D4" stroke-width="1.3"/><text x="60" y="680" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >14 terminal in A only — 13 factual reversal, 1 fabricated content</text><text x="60" y="695" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >weak label: 14 / 14 are GENERATED candidates</text><text x="60" y="710" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >B has no grounding-gate agent and cannot reach this class. B scored them 60-94.</text><rect x="608" y="660" width="544" height="76" rx="4" fill="#FFF6EC" stroke="#D98C3F" stroke-width="1.3"/><text x="620" y="680" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >11 terminal in B only — all obvious truncation</text><text x="620" y="695" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >weak label: 11 / 11 are REF_TRUNCATED fragments</text><text x="620" y="710" font-family="Helvetica Neue" font-size="9.5" font-weight="normal" fill="#1A2233" text-anchor="start" >A makes truncation a scaled penalty and scored them 39-70 instead of zero.</text><text x="48" y="758" font-family="Helvetica Neue" font-size="10" font-weight="normal" fill="#5A6C7D" text-anchor="start" >Reading: the implementations never disagree about WHICH candidates are defective, only about SEVERITY, and each disagreement set maps onto exactly one documented rule choice.</text></svg>